name: Phase 2 Territorial Work Access V2

on:
  push:
    branches:
      - phase2-territorial-work-access-v2
    paths:
      - 'src/phase2_territorial_work_access_v2.py'
      - 'scripts/phase2_build_territorial_work_access_v2.py'
      - 'tests/test_phase2_territorial_work_access_v2.py'
      - 'docs/PHASE2_TERRITORIAL_WORK_ACCESS_V2.md'
      - '.github/workflows/phase2-territorial-work-access-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-territorial-work-access-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile Territorial Work Access V2
        run: |
          python -m py_compile src/phase2_territorial_work_access_v2.py
          python -m py_compile scripts/phase2_build_territorial_work_access_v2.py

      - name: Run Territorial Work Access V2 tests
        run: python -m pytest -q tests/test_phase2_territorial_work_access_v2.py

      - name: Materialise Territorial Work Access V2
        run: >-
          python scripts/phase2_build_territorial_work_access_v2.py
          --od-by-origin outputs/phase2/od_2021_destinations_by_origin.csv
          --od-validation outputs/phase2/od_2021_demand_profile_validation.json
          --access outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz
          --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json
          --profile-output outputs/phase2/territorial_work_access_v2/municipal_work_demand_profile_v2.csv
          --scenario-output outputs/phase2/territorial_work_access_v2/scenario_worker_home_access_v2.csv.gz
          --validation outputs/phase2/territorial_work_access_v2/territorial_work_access_v2_validation.json

      - name: Validate Territorial Work Access V2 contract
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          root=Path('outputs/phase2/territorial_work_access_v2')
          v=json.loads((root/'territorial_work_access_v2_validation.json').read_text())
          assert v['status']=='PASS_TERRITORIAL_WORK_HOME_ACCESS_V2_BUILD'
          assert v['contract']=='PHASE2_TERRITORIAL_WORK_HOME_ACCESS_V2'
          assert v['scenario_count']==100000
          assert v['origin_municipality_count']==5
          assert v['resident_workers']==8754.0
          assert v['self_workers']==1315.0
          assert v['other_core_workers']==1055.0
          assert v['core_local_workers']==2370.0
          assert v['s8_direct_workers']==1882.0
          assert v['other_external_workers']==4502.0
          assert v['population_proportional_sensitivity_is_observed'] is False
          assert v['category_sensitivity_estimates_additive'] is True
          for field in ('destination_endpoint_access_evaluated','worker_spatial_allocation_observed','route_choice_inferred','passenger_demand_assigned_to_routes','full_trip_addressability_claimed','full_gjt_calculated','topology_ranked','service_policy_selected'):
              assert v[field] is False
          with (root/'municipal_work_demand_profile_v2.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==5
          assert sum(int(r['resident_workers']) for r in rows)==8754
          assert {r['origin_name']:int(r['resident_workers']) for r in rows}=={
              'Brivio':1662,'Calco':2173,'Olgiate Molgora':2287,'Santa Maria Hoè':836,'La Valletta Brianza':1796
          }
          with gzip.open(root/'scenario_worker_home_access_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f)
              n=0
              for row in reader:
                  n+=1
                  for threshold in (5,8,10):
                      p=f'public_{threshold}min'
                      assert row[f'{p}_worker_home_access_observed_lower_bound']=='0.000000000'
                      assert float(row[f'{p}_worker_home_access_model_capacity_upper_bound']) >= float(row[f'{p}_worker_home_access_population_proportional_sensitivity']) - 1e-7
                  assert row['worker_spatial_allocation_observed']=='false'
                  assert row['population_proportional_sensitivity_is_observed']=='false'
                  assert row['destination_endpoint_access_evaluated']=='false'
                  assert row['route_choice_inferred']=='false'
                  assert row['passenger_demand_assigned_to_routes']=='false'
                  assert row['full_trip_addressability_claimed']=='false'
                  assert row['topology_ranked']=='false'
              assert n==100000
          print(json.dumps({
              'workers':v['resident_workers'],
              'core_local':v['core_local_workers'],
              's8_direct':v['s8_direct_workers'],
              'other_external':v['other_external_workers'],
              'threshold_summary':v['threshold_summary'],
          },indent=2))
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          rm -rf /tmp/territorial-work-access-v2
          mkdir -p /tmp/territorial-work-access-v2
          python scripts/phase2_build_territorial_work_access_v2.py \
            --od-by-origin outputs/phase2/od_2021_destinations_by_origin.csv \
            --od-validation outputs/phase2/od_2021_demand_profile_validation.json \
            --access outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz \
            --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json \
            --profile-output /tmp/territorial-work-access-v2/profile.csv \
            --scenario-output /tmp/territorial-work-access-v2/scenarios.csv.gz \
            --validation /tmp/territorial-work-access-v2/validation.json
          cmp outputs/phase2/territorial_work_access_v2/municipal_work_demand_profile_v2.csv /tmp/territorial-work-access-v2/profile.csv
          cmp outputs/phase2/territorial_work_access_v2/scenario_worker_home_access_v2.csv.gz /tmp/territorial-work-access-v2/scenarios.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/phase2/territorial_work_access_v2/territorial_work_access_v2_validation.json').read_text())
          b=json.loads(Path('/tmp/territorial-work-access-v2/validation.json').read_text())
          for p in (a,b):
              p['lineage']['profile_output']=None
              p['lineage']['scenario_output']=None
          assert a==b
          PY

      - name: Guard epistemic separation
        run: |
          FILES="src/phase2_territorial_work_access_v2.py scripts/phase2_build_territorial_work_access_v2.py"
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -n -E 'population_proportional_sensitivity_is_observed[^f]*true|worker_spatial_allocation_observed[^f]*true|destination_endpoint_access_evaluated[^f]*true|route_choice_inferred[^f]*true|passenger_demand_assigned_to_routes[^f]*true|full_trip_addressability_claimed[^f]*true|full_gjt_calculated[^f]*true|topology_ranked[^f]*true|service_policy_selected[^f]*true' $FILES
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check origin/phase2-pre-gjt-screening-v2...HEAD

      - name: Persist audited Territorial Work Access V2
        run: |
          git config user.name "phase2-territorial-work-access-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/territorial_work_access_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist audited Territorial Work Access V2 [skip ci]"
            git push origin HEAD:phase2-territorial-work-access-v2
          fi

      - name: Upload Territorial Work Access V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-territorial-work-access-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/territorial_work_access_v2
