name: RT031 municipal access frontier V4
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_municipal_access_frontier_v4.py
      - scripts/phase2_build_rt031_municipal_access_frontier_v4.py
      - tests/test_phase2_rt031_municipal_access_frontier_v4.py
      - .github/workflows/phase2-rt031-municipal-access-frontier-v4.yml
permissions:
  contents: read
  actions: read
jobs:
  municipal-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest tests/test_phase2_rt031_municipal_access_frontier_v4.py -q
      - name: Acquire pinned one-line candidates and walking substrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/candidates /tmp/walk
          gh api repos/${{ github.repository }}/actions/artifacts/10414420652/zip > /tmp/candidates.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9991182904/zip > /tmp/walk.zip
          echo '0621c06a04bdccffefa60bd17dbe07bf9dbb0056b41929e86c57fdb6fcb28892  /tmp/candidates.zip' | sha256sum -c
          echo 'e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28  /tmp/walk.zip' | sha256sum -c
          unzip -q /tmp/candidates.zip -d /tmp/candidates
          unzip -q /tmp/walk.zip -d /tmp/walk
          echo '69b847a22b60aeb50f65d7f56c7950e33a98a83a5275ce1a672a187a5a6b965b  /tmp/candidates/rt031_single_line_candidates_v3.csv.gz' | sha256sum -c
          walk=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv | head -1)
          echo "a47bbce413d056db185180173ab2f05dce0463cb626a2c81f4aff64de91b50c1  $walk" | sha256sum -c
      - name: Build exact municipal-axis frontier twice
        run: |
          walk=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv | head -1)
          for out in /tmp/front-a /tmp/front-b; do
            python scripts/phase2_build_rt031_municipal_access_frontier_v4.py \
              --candidates /tmp/candidates/rt031_single_line_candidates_v3.csv.gz \
              --walk-matrix "$walk" \
              --current-audit outputs/phase2/rt031_current_exact_target_cover_v3/current_exact_target_cover_audit.json \
              --policy config/phase2_final_policy_contract_v3.json \
              --output-dir "$out"
          done
          diff -r /tmp/front-a /tmp/front-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-municipal-access-frontier-v4
          path: /tmp/front-a/
          if-no-files-found: error
