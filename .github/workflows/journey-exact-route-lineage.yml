name: Journey exact route lineage

on:
  push:
    branches: [phase2-analysis-journey-a]
    paths:
      - .github/workflows/journey-exact-route-lineage.yml
      - dietro-l-analisi/journey-lineage.js
      - dietro-l-analisi/journey-browser-smoke.py
      - dietro-l-analisi/current-routes-gtfs.geojson.gz.b64.*
      - dietro-l-analisi/current-stops-gtfs.geojson.gz.b64.*
      - dietro-l-analisi/finalist-routes-gated.geojson.gz.b64.*
      - dietro-l-analisi/finalist-route-anchors.geojson.gz.b64.*
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  exact-route-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact-lineage tooling
        run: |
          python -m pip install --upgrade pandas pyproj playwright
          python -m playwright install --with-deps chromium
      - name: Download pinned certified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/exact/{gate,rpm,final,current}
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9891607118/zip" -o /tmp/gate.zip
          echo "6fbc06d74d5ba970bc980e4cde6234245e0753c22386f703ea313c6a4de9206a  /tmp/gate.zip" | sha256sum -c -
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9912145623/zip" -o /tmp/rpm.zip
          echo "a12cbc5dd63d3ae97d79c040b71fde9da198a7459a0a378e8813c3e8f026bdb5  /tmp/rpm.zip" | sha256sum -c -
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9950786078/zip" -o /tmp/final.zip
          echo "3d1be56ff2f42a2915724ca730d20a58389d1191cbae4aa7af3e76e1b7b46070  /tmp/final.zip" | sha256sum -c -
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9947554863/zip" -o /tmp/current.zip
          echo "b9bfe98c0418f30b79772c524f8525001a5eac91d9f2f9dacd78c510e5aef16a  /tmp/current.zip" | sha256sum -c -
          unzip -q /tmp/gate.zip -d /tmp/exact/gate
          unzip -q /tmp/rpm.zip -d /tmp/exact/rpm
          unzip -q /tmp/final.zip -d /tmp/exact/final
          unzip -q /tmp/current.zip -d /tmp/exact/current
      - name: Build exact current and finalist route assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, csv, gzip, heapq, io, json, math, re, zipfile
          from collections import Counter, defaultdict
          from pathlib import Path
          import pandas as pd
          from pyproj import Transformer

          ROOT=Path('dietro-l-analisi')
          GATE=Path('/tmp/exact/gate')
          RPM=Path('/tmp/exact/rpm')
          FINAL=Path('/tmp/exact/final')
          CURRENT=Path('/tmp/exact/current')
          DEFAULT_SPEED={'motorway':60.,'trunk':50.,'primary':40.,'secondary':35.,'tertiary':30.,'unclassified':25.,'residential':22.,'living_street':12.,'service':15.}
          BUS_HIGHWAYS=set(DEFAULT_SPEED)
          ACCESS_DENY={'no','private','agricultural','forestry'}
          EXPLICIT_ALLOW={'yes','designated','permissive'}
          CONDITIONAL_ACCESS={'destination','customers','delivery'}
          TAG_COLUMNS={'maxspeed','oneway','junction','access','bus','psv','lanes','width','maxwidth','maxheight','maxweight','vehicle','motor_vehicle','oneway:bus','oneway:psv'}

          def text(v):
              if v is None or (isinstance(v,float) and math.isnan(v)): return ''
              s=str(v).strip(); return '' if s.lower()=='nan' else s
          def parse_other(v):
              if v is None: return {}
              return dict(re.findall(r'"([^\"]+)"=>"([^\"]*)"',str(v)))
          def tags(props):
              out=parse_other(props.get('other_tags'))
              for k in TAG_COLUMNS:
                  v=props.get(k)
                  if v is not None:
                      s=str(v).strip()
                      if s and s.lower()!='nan': out[k]=s
              return out
          def modal(t,k):
              r=str(t.get(k,'')).strip().lower()
              if not r:return None
              if r in ACCESS_DENY:return False
              if r in EXPLICIT_ALLOW or r in CONDITIONAL_ACCESS:return True
              return False
          def bus_ok(props):
              hw=str(props.get('highway') or '')
              if hw not in BUS_HIGHWAYS:return False
              t=tags(props); b=modal(t,'bus')
              if 'bus' in t and b is False:return False
              if b is True:return True
              p=modal(t,'psv')
              if 'psv' in t and p is False:return False
              if p is True:return True
              for k in ('access','vehicle','motor_vehicle'):
                  if str(t.get(k,'')).strip().lower() in ACCESS_DENY:return False
              return True
          def direction(t):
              for k in ('oneway:bus','oneway:psv'):
                  r=str(t.get(k,'')).strip().lower()
                  if r:
                      if r in {'no','0','false'}:return 0
                      if r in {'yes','1','true'}:return 1
                      if r=='-1':return -1
                      return 0
              r=str(t.get('oneway','')).strip().lower()
              if r in {'yes','1','true'}:return 1
              if r=='-1':return -1
              if r in {'no','0','false',''}:
                  return 1 if (not r and str(t.get('junction','')).strip().lower()=='roundabout') else 0
              return 0
          def speed(t,hw):
              raw=t.get('maxspeed')
              if raw:
                  m=re.search(r'(\d+(?:\.\d+)?)',raw)
                  if m:
                      s=float(m.group(1))
                      if 'mph' in raw.lower():s*=1.609344
                      return max(8.,s*.70)
              return DEFAULT_SPEED[hw]
          def ekey(x,y):return round(float(x),2),round(float(y),2)
          def nid(x,y):return f'n:{x:.2f}:{y:.2f}'
          def norm(v):
              s=text(v)
              if not s:return ''
              try:return str(int(float(s)))
              except (TypeError,ValueError):return s

          road=json.loads((GATE/'osm_gate_d_structural.geojson').read_text())
          to_xy=Transformer.from_crs(4326,32632,always_xy=True)
          to_ll=Transformer.from_crs(32632,4326,always_xy=True)
          ordered=[]
          for idx,f in enumerate(road['features']):
              props=f.get('properties') or {}
              geom=f.get('geometry') or {}
              if geom.get('type')!='LineString':continue
              try:wid_sort=int(float(props.get('osm_way_id')))
              except:wid_sort=10**30
              ordered.append((wid_sort,idx,props,geom['coordinates']))
          ordered.sort(key=lambda z:(z[0],z[1]))
          adj=defaultdict(list); edge_by_id={}; node_xy={}; counters=Counter(); eligible_ways=0
          for _,feature_seq,props,llcoords in ordered:
              if not bus_ok(props):continue
              eligible_ways+=1; t=tags(props); hw=str(props.get('highway')); sp=speed(t,hw); d=direction(t); wid=text(props.get('osm_way_id'))
              coords=[to_xy.transform(float(lon),float(lat)) for lon,lat,*_ in llcoords]
              for seg,(a,b) in enumerate(zip(coords[:-1],coords[1:]),1):
                  ak,bk=ekey(*a),ekey(*b); lm=math.hypot(b[0]-a[0],b[1]-a[1])
                  if lm<=0:continue
                  mins=lm/(sp*1000/60)
                  for dl,u,v,ok in [('F',ak,bk,d>=0),('R',bk,ak,d<=0)]:
                      if not ok:continue
                      ui,vi=nid(*u),nid(*v); node_xy[ui]=u;node_xy[vi]=v
                      kb=(wid,seg,ui,vi); pi=counters[kb];counters[kb]+=1
                      eid=f'e:{wid}:{seg}:{dl}:{pi}:{ui}>{vi}'
                      adj[ui].append((vi,lm,mins,wid,eid));edge_by_id[eid]=(ui,vi,lm,mins,wid)
          for k in adj:adj[k].sort(key=lambda x:(x[0],x[3],x[4]))
          assert (eligible_ways,len(node_xy),len(edge_by_id))==(15872,104071,199217),(eligible_ways,len(node_xy),len(edge_by_id))

          restrictions=pd.read_csv(GATE/'osm_turn_restrictions_routable.csv',dtype=str)
          rule_index=defaultdict(list)
          for _,r in restrictions.iterrows():
              if str(r.get('applies_to_bus','')).lower() not in {'true','1','yes'} or str(r.get('via_type',''))!='node':continue
              kind=str(r.get('restriction','')).strip().lower()
              if not(kind.startswith('no_') or kind.startswith('only_')):continue
              vals=[text(r.get('via_lon')),text(r.get('via_lat')),norm(r.get('from_ref')),norm(r.get('to_ref'))]
              if not all(vals):continue
              x,y=to_xy.transform(float(vals[0]),float(vals[1])); via=nid(*ekey(x,y))
              if via not in node_xy:continue
              rule_index[(via,vals[2])].append({'restriction':kind,'to_way':vals[3],'relation_id':norm(r.get('relation_id'))})
          for k in rule_index:rule_index[k].sort(key=lambda q:(q['restriction'],q['to_way'],q['relation_id']))
          assert len(rule_index)==535,len(rule_index)

          def allowed(via,prev,inway,outnode,outway):
              if inway is None:return True
              for rule in rule_index.get((via,inway),[]):
                  kind,to=rule['restriction'],rule['to_way']
                  if kind=='no_u_turn':
                      if outway==to and outnode==prev:return False
                  elif kind=='only_u_turn':
                      if not(outway==to and outnode==prev):return False
                  elif kind.startswith('no_'):
                      if outway==to:return False
                  elif kind.startswith('only_'):
                      if outway!=to:return False
              return True
          def route(source,target):
              start=(source,None,None); dist={start:0.};dm={start:0.};previous={};heap=[(0.,0.,source,'','',start)];settled=None
              while heap:
                  cm,cmeters,_,_,_,state=heapq.heappop(heap)
                  if cm!=dist.get(state):continue
                  node,pnode,inway=state
                  if node==target:settled=state;break
                  for outnode,lm,mins,outway,eid in adj.get(node,[]):
                      if not allowed(node,pnode,inway,outnode,outway):continue
                      ns=(outnode,node,outway);nm=cm+mins;nd=cmeters+lm;old=dist.get(ns)
                      if old is None or nm<old-1e-12 or (abs(nm-old)<=1e-12 and nd<dm[ns]-1e-9):
                          dist[ns]=nm;dm[ns]=nd;previous[ns]=(state,eid);heapq.heappush(heap,(nm,nd,outnode,outway,eid,ns))
              assert settled is not None,(source,target)
              edges=[];cur=settled
              while cur!=start:
                  ps,eid=previous[cur];edges.append(eid);cur=ps
              return {'mins':dist[settled],'m':dm[settled],'edges':list(reversed(edges))}

          structures=pd.read_csv(FINAL/'finalist_route_structure_v3.csv').drop_duplicates('route_id')
          anchors=pd.read_csv(RPM/'routing_anchor_universe.csv',dtype=str).set_index('anchor_id')
          matrix=pd.read_csv(RPM/'reduced_path_matrix.csv')
          lookup={(str(r.origin),str(r.destination)):r for r in matrix.itertuples(index=False)}
          route_features=[];anchor_routes=defaultdict(list);anchor_labels={};metrics={}
          route16={'R2_23d58cd05658247380d7','R2_65db885119e69d50c7d4'}
          for _,r in structures.iterrows():
              seq=json.loads(r.anchors_json);labels=json.loads(r.anchor_labels_json);rid=str(r.route_id);coords=[];tm=tmin=0.;te=0
              for aid,label in zip(seq,labels):anchor_routes[aid].append(rid);anchor_labels.setdefault(aid,label)
              for a,b in zip(seq[:-1],seq[1:]):
                  sa=str(anchors.loc[a,'graph_node_id']);sb=str(anchors.loc[b,'graph_node_id']);got=route(sa,sb);ref=lookup[(a,b)]
                  assert len(got['edges'])==int(ref.edge_count),(rid,a,b,'edge_count')
                  assert abs(got['m']/1000-float(ref.distance_km))<2e-6,(rid,a,b,'distance')
                  assert abs(got['mins']-float(ref.runtime_min))<2e-6,(rid,a,b,'runtime')
                  tm+=got['m'];tmin+=got['mins'];te+=len(got['edges']);leg=[]
                  for eid in got['edges']:
                      ui,vi,*_=edge_by_id[eid]
                      for nn in (ui,vi):
                          lon,lat=to_ll.transform(*node_xy[nn]);pt=[round(lon,7),round(lat,7)]
                          if not leg or leg[-1]!=pt:leg.append(pt)
                  if coords and leg and coords[-1]==leg[0]:coords.extend(leg[1:])
                  else:coords.extend(leg)
              budget='16 h' if rid in route16 else '18 h 30'
              props={'route_id':rid,'budget':budget,'in_service_total':budget,'route_slot':str(r.public_route_slot),'runtime_min':round(tmin,6),'distance_km':round(tm/1000,6),'edge_count':te,'source':'Gate D frozen graph + Reduced Path Matrix V2'}
              route_features.append({'type':'Feature','properties':props,'geometry':{'type':'LineString','coordinates':coords}})
              metrics[rid]={'coordinates':len(coords),'edge_count':te,'distance_km':round(tm/1000,9),'runtime_min':round(tmin,9),'ordered_anchors':seq}

          anchor_features=[]
          for aid,rids in sorted(anchor_routes.items()):
              node=str(anchors.loc[aid,'graph_node_id']);lon,lat=to_ll.transform(*node_xy[node])
              kind='PROPOSED_STOP' if aid.startswith('P2V2S_') else ('EXISTING_STOP' if aid.startswith('existing:') else 'RAIL_HUB')
              budgets=sorted({'16 h' if x in route16 else '18 h 30' for x in rids})
              anchor_features.append({'type':'Feature','properties':{'anchor_id':aid,'label':anchor_labels[aid],'kind':kind,'routes':sorted(set(rids)),'budget':' + '.join(budgets),'state_label':'Da verificare sul posto' if kind=='PROPOSED_STOP' else 'Fermata esistente'},'geometry':{'type':'Point','coordinates':[round(lon,7),round(lat,7)]}})

          gtfs=GATE/'raw'/'arriva_addabus_2025_2026.zip'
          with zipfile.ZipFile(gtfs) as z:
              trips=pd.read_csv(z.open('trips.txt'),dtype=str)
              shapes=pd.read_csv(z.open('shapes.txt'),dtype={'shape_id':str,'shape_pt_lat':float,'shape_pt_lon':float,'shape_pt_sequence':int})
          current_features=[];shape_counts={};coord_counts={}
          for rid in ('D184','D185'):
              sids=sorted(trips.loc[trips.route_id==rid,'shape_id'].dropna().unique());shape_counts[rid]=len(sids);coord_counts[rid]=0
              for sid in sids:
                  q=shapes[shapes.shape_id==sid].sort_values('shape_pt_sequence');cs=[[round(float(lon),7),round(float(lat),7)] for lon,lat in zip(q.shape_pt_lon,q.shape_pt_lat)]
                  if len(cs)>=2:
                      coord_counts[rid]+=len(cs);current_features.append({'type':'Feature','properties':{'route':rid,'shape_id':sid,'source':'Official Agenzia TPL GTFS frozen 2025-26'},'geometry':{'type':'LineString','coordinates':cs}})
          assert shape_counts=={'D184':8,'D185':10},shape_counts
          assert coord_counts['D184']>=3000 and coord_counts['D185']>=3800,coord_counts

          clusters=pd.read_csv(CURRENT/'current_service_physical_stop_clusters_v4.csv')
          stop_features=[]
          for _,r in clusters.iterrows():
              stop_features.append({'type':'Feature','properties':{'cluster_id':str(r.physical_stop_cluster_id),'name':str(r.representative_stop_name),'routes':str(r.routes).split(';'),'source':'Current Service Baseline V4'},'geometry':{'type':'Point','coordinates':[round(float(r.representative_stop_lon),7),round(float(r.representative_stop_lat),7)]}})
          assert len(stop_features)==44
          stop_ids={f['properties']['cluster_id'] for f in stop_features};assert {'EX_011','EX_039'}<=stop_ids

          datasets={
              'current-routes-gtfs.geojson':({'type':'FeatureCollection','features':current_features},2),
              'current-stops-gtfs.geojson':({'type':'FeatureCollection','features':stop_features},1),
              'finalist-routes-gated.geojson':({'type':'FeatureCollection','features':route_features},3),
              'finalist-route-anchors.geojson':({'type':'FeatureCollection','features':anchor_features},1),
          }
          generated=[]
          for stem,(obj,nparts) in datasets.items():
              raw=(json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
              buf=io.BytesIO()
              with gzip.GzipFile(filename='',mode='wb',fileobj=buf,compresslevel=9,mtime=0) as gz:gz.write(raw)
              b64=base64.b64encode(buf.getvalue()).decode('ascii');size=((math.ceil(len(b64)/nparts)+3)//4)*4
              parts=[b64[i*size:(i+1)*size] for i in range(nparts-1)]+[b64[(nparts-1)*size:]]
              assert ''.join(parts)==b64 and all(parts)
              for old in ROOT.glob(f'{stem}.gz.b64.*'):old.unlink()
              for i,part in enumerate(parts):
                  p=ROOT/f'{stem}.gz.b64.{i}';p.write_text(part,encoding='ascii');generated.append(p.name)
          manifest={
              'contract':'PHASE2_JOURNEY_EXACT_ROUTE_LINEAGE_V1',
              'decision_output':False,
              'sources':{
                  'gate_d':{'artifact_id':9891607118,'sha256':'6fbc06d74d5ba970bc980e4cde6234245e0753c22386f703ea313c6a4de9206a'},
                  'reduced_path_matrix_v2':{'artifact_id':9912145623,'sha256':'a12cbc5dd63d3ae97d79c040b71fde9da198a7459a0a378e8813c3e8f026bdb5'},
                  'finalist_simplicity_v3':{'artifact_id':9950786078,'sha256':'3d1be56ff2f42a2915724ca730d20a58389d1191cbae4aa7af3e76e1b7b46070'},
                  'current_service_v4':{'artifact_id':9947554863,'sha256':'b9bfe98c0418f30b79772c524f8525001a5eac91d9f2f9dacd78c510e5aef16a'}},
              'graph':{'bus_eligible_ways':eligible_ways,'nodes':len(node_xy),'directed_edges':len(edge_by_id),'turn_rule_keys_in_graph':len(rule_index)},
              'current_service':{'shape_features':shape_counts,'coordinate_counts':coord_counts,'physical_stop_clusters':len(stop_features)},
              'finalists':metrics,
              'generated_files':sorted(generated),
              'semantics':{'current_routes':'OFFICIAL_FROZEN_GTFS_SHAPES','finalist_routes':'RESTRICTION_AWARE_GATE_D_ROUTES_VALIDATED_AGAINST_REDUCED_PATH_MATRIX_V2','screen_space_offsets':False,'winner_selected':False}}
          (ROOT/'exact-route-lineage.json').write_text(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Validate exact web contract
        shell: bash
        run: |
          set -euo pipefail
          node --check dietro-l-analisi/journey-lineage.js
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          root=Path('dietro-l-analisi')
          files={
            'current':['current-routes-gtfs.geojson.gz.b64.0','current-routes-gtfs.geojson.gz.b64.1'],
            'stops':['current-stops-gtfs.geojson.gz.b64.0'],
            'final':['finalist-routes-gated.geojson.gz.b64.0','finalist-routes-gated.geojson.gz.b64.1','finalist-routes-gated.geojson.gz.b64.2'],
            'anchors':['finalist-route-anchors.geojson.gz.b64.0']}
          data={}
          for key,names in files.items():
              b64=''.join((root/n).read_text().strip() for n in names)
              data[key]=json.loads(gzip.decompress(base64.b64decode(b64)))
          assert {f['properties']['route'] for f in data['current']['features']}=={'D184','D185'}
          assert len(data['stops']['features'])==44
          ids={f['properties']['route_id'] for f in data['final']['features']}
          assert ids=={'R2_23d58cd05658247380d7','R2_65db885119e69d50c7d4','R2_b2032eeb31cba06561f0','R2_2ffb6743b10bb3f0a97d'}
          assert all(len(f['geometry']['coordinates'])>700 for f in data['final']['features'])
          aid={f['properties']['anchor_id'] for f in data['anchors']['features']}
          assert 'rail:S01514' in aid
          m=json.loads((root/'exact-route-lineage.json').read_text())
          assert m['graph']=={'bus_eligible_ways':15872,'nodes':104071,'directed_edges':199217,'turn_rule_keys_in_graph':535}
          assert m['semantics']['screen_space_offsets'] is False and m['decision_output'] is False
          print('exact route lineage static contract PASS')
          PY
      - name: Browser smoke and visual QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 >/tmp/journey-exact-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/dietro-l-analisi/ >/dev/null; then break; fi
            sleep 1
          done
          python dietro-l-analisi/journey-browser-smoke.py
      - name: Persist certified exact route assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dietro-l-analisi/current-routes-gtfs.geojson.gz.b64.* \
                  dietro-l-analisi/current-stops-gtfs.geojson.gz.b64.* \
                  dietro-l-analisi/finalist-routes-gated.geojson.gz.b64.* \
                  dietro-l-analisi/finalist-route-anchors.geojson.gz.b64.* \
                  dietro-l-analisi/exact-route-lineage.json
          if git diff --cached --quiet; then
            echo "Exact route assets already current"
          else
            git commit -m "data(journey): materialize certified exact route geometry"
            git push origin HEAD:phase2-analysis-journey-a
          fi
