name: RT031 data-guided hub frontier V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_data_guided_portfolios_v3.py
      - scripts/phase2_build_rt031_data_guided_frontier_v3.py
      - tests/test_phase2_rt031_data_guided_portfolios_v3.py
      - .github/workflows/phase2-rt031-data-guided-frontier-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  data-guided-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest tests/test_phase2_rt031_data_guided_portfolios_v3.py -q
      - name: Acquire pinned pool and walking substrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pool /tmp/walk
          gh api repos/${{ github.repository }}/actions/artifacts/10354879891/zip > /tmp/pool.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9991182904/zip > /tmp/walk.zip
          echo '53b400b11a6db457037a531d612d3abf99147d7a3162573d11149f432131bd87  /tmp/pool.zip' | sha256sum -c
          echo 'e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28  /tmp/walk.zip' | sha256sum -c
          unzip -q /tmp/pool.zip -d /tmp/pool
          unzip -q /tmp/walk.zip -d /tmp/walk
      - name: Build twice and compare every byte
        run: |
          walk=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv | head -1)
          for out in /tmp/front-a /tmp/front-b; do
            python scripts/phase2_build_rt031_data_guided_frontier_v3.py \
              --pool /tmp/pool/physical_walk_search.json \
              --walk-matrix "$walk" \
              --current-audit outputs/phase2/rt031_current_exact_target_cover_v3/current_exact_target_cover_audit.json \
              --policy config/phase2_final_policy_contract_v3.json \
              --output-dir "$out" --max-movements 4
          done
          diff -r /tmp/front-a /tmp/front-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-data-guided-hub-frontier-v3
          path: /tmp/front-a/
          if-no-files-found: error
