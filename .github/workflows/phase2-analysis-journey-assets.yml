name: Phase 2 analysis journey assets

on:
  push:
    branches: [phase2-analysis-journey-a]
    paths:
      - dietro-l-analisi/index.html
      - dietro-l-analisi/journey.css
      - dietro-l-analisi/journey.js
      - dietro-l-analisi/journey-effects.js
      - dietro-l-analisi/journey-director.js
      - dietro-l-analisi/journey-runtime-policy.js
      - dietro-l-analisi/journey-experience-policy.js
      - dietro-l-analisi/journey-bootstrap.mjs
      - dietro-l-analisi/journey-browser-smoke.py
      - dietro-l-analisi/build_journey_assets.py
      - .github/workflows/phase2-analysis-journey-assets.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-journey-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic geospatial and browser tooling
        run: |
          python -m pip install --upgrade pandas geopandas pyogrio shapely playwright
          python -m playwright install --with-deps chromium
      - name: Vendor pinned browser runtimes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/journey-maplibre /tmp/journey-gsap /tmp/journey-pako
          rm -rf dietro-l-analisi/vendor/maplibre dietro-l-analisi/vendor/gsap dietro-l-analisi/vendor/pako
          mkdir -p /tmp/journey-maplibre /tmp/journey-gsap /tmp/journey-pako
          mkdir -p dietro-l-analisi/vendor/maplibre dietro-l-analisi/vendor/gsap dietro-l-analisi/vendor/pako

          cd /tmp/journey-maplibre
          npm pack maplibre-gl@6.7.0 --silent > pack-name.txt
          PKG="$(tail -n 1 pack-name.txt)"
          test -n "${PKG}"
          tar -xzf "${PKG}"
          cp package/dist/maplibre-gl.css "${GITHUB_WORKSPACE}/dietro-l-analisi/vendor/maplibre/"
          cp package/dist/maplibre-gl.mjs "${GITHUB_WORKSPACE}/dietro-l-analisi/vendor/maplibre/"
          cp package/dist/maplibre-gl-shared.mjs "${GITHUB_WORKSPACE}/dietro-l-analisi/vendor/maplibre/"
          cp package/dist/maplibre-gl-worker.mjs "${GITHUB_WORKSPACE}/dietro-l-analisi/vendor/maplibre/"

          cd /tmp/journey-gsap
          npm pack gsap@3.15.0 --silent > pack-name.txt
          PKG="$(tail -n 1 pack-name.txt)"
          test -n "${PKG}"
          tar -xzf "${PKG}"
          cp package/dist/gsap.min.js "${GITHUB_WORKSPACE}/dietro-l-analisi/vendor/gsap/"
          cp package/dist/ScrollTrigger.min.js "${GITHUB_WORKSPACE}/dietro-l-analisi/vendor/gsap/"

          cd /tmp/journey-pako
          npm pack pako@2.1.0 --silent > pack-name.txt
          PKG="$(tail -n 1 pack-name.txt)"
          test -n "${PKG}"
          tar -xzf "${PKG}"
          cp package/dist/pako.min.js "${GITHUB_WORKSPACE}/dietro-l-analisi/vendor/pako/"

          cd "${GITHUB_WORKSPACE}"
          test -f dietro-l-analisi/vendor/maplibre/maplibre-gl.mjs
          test -f dietro-l-analisi/vendor/maplibre/maplibre-gl-shared.mjs
          test -f dietro-l-analisi/vendor/maplibre/maplibre-gl-worker.mjs
          test -f dietro-l-analisi/vendor/maplibre/maplibre-gl.css
          test ! -e dietro-l-analisi/vendor/maplibre/maplibre-gl-dev.mjs
          test ! -e dietro-l-analisi/vendor/maplibre/maplibre-gl-shared-dev.mjs
          test ! -e dietro-l-analisi/vendor/maplibre/maplibre-gl-worker-dev.mjs
          test -f dietro-l-analisi/vendor/gsap/gsap.min.js
          test -f dietro-l-analisi/vendor/gsap/ScrollTrigger.min.js
          test -f dietro-l-analisi/vendor/pako/pako.min.js
          sha256sum dietro-l-analisi/vendor/maplibre/* | sort > dietro-l-analisi/vendor/maplibre/SHA256SUMS
          sha256sum dietro-l-analisi/vendor/gsap/*.js | sort > dietro-l-analisi/vendor/gsap/SHA256SUMS
          sha256sum dietro-l-analisi/vendor/pako/*.js | sort > dietro-l-analisi/vendor/pako/SHA256SUMS
      - name: Localize runtime references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('dietro-l-analisi/index.html')
          s=p.read_text()
          replacements={
            '  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>\n':'',
            '  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>':'  <script src="vendor/gsap/gsap.min.js"></script>',
            '  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>':'  <script src="vendor/gsap/ScrollTrigger.min.js"></script>',
            '  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>':'  <script src="vendor/pako/pako.min.js"></script>',
          }
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new)
              elif new and new not in s:
                  raise RuntimeError(f'expected runtime reference missing: {old}')
          p.write_text(s)
          PY
      - name: Download pinned evidence bundles and frozen runtime sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9910900017/zip" -o /tmp/journey-building-population.zip
          echo "4f5f0123ced2b763c2a063258ad724c43ac7f57ede707db3fa76e6a8977688b1  /tmp/journey-building-population.zip" | sha256sum -c -
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9911651930/zip" -o /tmp/journey-stop-universe-v2.zip
          echo "25d3dbf52cb428d54a46569b7dbbf9e78dcee6fcf5ee69b9c6e928a367e0a2f9  /tmp/journey-stop-universe-v2.zip" | sha256sum -c -

          FROZEN="29203ad64c3e32e6164ef6997933eb5c5ff2d5b1"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FROZEN}"
          curl --fail --location --retry 3 "${RAW}/data/raw/boundaries/comuni_core_istat_2026.geojson" -o /tmp/journey-boundaries.geojson
          test "$(wc -c < /tmp/journey-boundaries.geojson)" -eq 79275
          test "$(git hash-object /tmp/journey-boundaries.geojson)" = "1d5dcb825b21631f824f53aa5a76cfaf669ce744"
          sha256sum /tmp/journey-boundaries.geojson

          curl --fail --location --retry 3 "${RAW}/data/phase2/frozen_gate_d/source/osm_gate_d_structural.geojson.gz" -o /tmp/journey-road-structural.geojson.gz
          test "$(wc -c < /tmp/journey-road-structural.geojson.gz)" -eq 2270082
          test "$(git hash-object /tmp/journey-road-structural.geojson.gz)" = "54594215060b6cbe1cb15cf2d45f994ec85439ab"
          echo "001ca3fd752a8fb378d1769e6ec6d9cb49203ee38dbe812106d7cc8aca752620  /tmp/journey-road-structural.geojson.gz" | sha256sum -c -
      - name: Build source-closed web assets
        run: python dietro-l-analisi/build_journey_assets.py
      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check dietro-l-analisi/journey.js
          node --check dietro-l-analisi/journey-effects.js
          node --check dietro-l-analisi/journey-director.js
          node --check dietro-l-analisi/journey-runtime-policy.js
          node --check dietro-l-analisi/journey-experience-policy.js
          node --check dietro-l-analisi/journey-bootstrap.mjs
          python -m py_compile dietro-l-analisi/journey-browser-smoke.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root=Path('dietro-l-analisi')
          m=json.loads((root/'data-manifest.json').read_text())
          assert m['contract']=='PHASE2_ANALYSIS_JOURNEY_VISUAL_ASSETS_V2_SOURCE_CLOSED_RUNTIME'
          assert m['decision_output'] is False
          assert m['runtime_external_evidence_fetches'] == 0
          assert m['frozen_runtime_source_commit']=='29203ad64c3e32e6164ef6997933eb5c5ff2d5b1'
          assert m['counts']['worldpop_cells']==4283
          assert m['counts']['sections']==229
          assert m['counts']['dbgt_buildings_with_core_population']==4226
          assert m['counts']['building_section_pieces']==4348
          assert m['counts']['proposed_candidates_v2']==155
          assert m['counts']['official_stop_records_v2']==67
          assert m['counts']['municipality_boundaries']==5
          assert m['counts']['gate_d_structural_source_features']==24384
          assert m['counts']['gate_d_visual_features'] > 0
          roads=m['frozen_runtime_sources']['gate_d_structural_roads']
          assert roads['git_blob_sha1']=='54594215060b6cbe1cb15cf2d45f994ec85439ab'
          assert roads['gzip_sha256']=='001ca3fd752a8fb378d1769e6ec6d9cb49203ee38dbe812106d7cc8aca752620'
          assert roads['geojson_sha256']=='9032fa1fa2f8a22fd5cfcf81ad7366269d062cb7c27ffbfd57bfba754a1b51ce'
          boundaries=m['frozen_runtime_sources']['boundaries']
          assert boundaries['git_blob_sha1']=='1d5dcb825b21631f824f53aa5a76cfaf669ce744'
          assert boundaries['size_bytes']==79275
          assert m['local_asset_chunks']['boundaries']
          assert m['local_asset_chunks']['roads']

          required=['index.html','journey.css','journey.js','journey-effects.js','journey-director.js','journey-runtime-policy.js','journey-experience-policy.js','journey-bootstrap.mjs','journey-browser-smoke.py','journey-data.js','data-manifest.json','data-worldpop.geojson.gz.0.b64','data-sections.geojson.gz.0.b64','data-buildings.geojson.gz.0.b64','data-buildings.geojson.gz.1.b64','data-buildings.geojson.gz.2.b64','data-buildings.geojson.gz.3.b64','data-buildings.geojson.gz.4.b64','vendor/maplibre/maplibre-gl.mjs','vendor/maplibre/maplibre-gl-shared.mjs','vendor/maplibre/maplibre-gl-worker.mjs','vendor/maplibre/maplibre-gl.css','vendor/maplibre/SHA256SUMS','vendor/gsap/gsap.min.js','vendor/gsap/ScrollTrigger.min.js','vendor/gsap/SHA256SUMS','vendor/pako/pako.min.js','vendor/pako/SHA256SUMS']
          required += m['local_asset_chunks']['boundaries'] + m['local_asset_chunks']['roads']
          for f in required:
              assert (root/f).is_file(), f
          assert not list((root/'vendor/maplibre').glob('*-dev.mjs')), 'unused MapLibre dev bundles materialized'
          for name,digest in m['files'].items():
              p=root/name
              assert p.is_file(), name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest, name

          html=(root/'index.html').read_text()
          assert '<script type="module" src="journey-bootstrap.mjs"></script>' in html
          assert 'maplibre-gl@6.7.0/dist/maplibre-gl.js' not in html
          assert 'vendor/maplibre/maplibre-gl.css' in html
          assert 'vendor/gsap/gsap.min.js' in html
          assert 'vendor/gsap/ScrollTrigger.min.js' in html
          assert 'vendor/pako/pako.min.js' in html
          assert 'cdn.jsdelivr.net' not in html
          bootstrap=(root/'journey-bootstrap.mjs').read_text()
          assert "await import('./journey-runtime-policy.js')" in bootstrap
          assert "await import('./journey-experience-policy.js')" in bootstrap
          experience=(root/'journey-experience-policy.js').read_text()
          assert "prefers-reduced-motion: reduce" in experience
          assert "duration:0" in experience and "essential:false" in experience
          journey=(root/'journey.js').read_text()
          assert 'raw.githubusercontent.com' not in journey
          assert 'localAssets.boundaries' in journey and 'localAssets.roads' in journey
          assert 'BOUNDARIES_URL' not in journey and 'ROAD_GZ_URL' not in journey
          print('journey source-closed evidence + lean local JS runtime + experience contract PASS')
          PY
          ! grep -R --line-number -E 'np\.random|numpy\.random|import random|from random' dietro-l-analisi
      - name: Browser smoke and visual QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 >/tmp/journey-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/dietro-l-analisi/ >/dev/null; then break; fi
            sleep 1
          done
          python dietro-l-analisi/journey-browser-smoke.py
      - name: Persist generated journey assets and runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dietro-l-analisi/index.html dietro-l-analisi/journey-data.js dietro-l-analisi/data-manifest.json dietro-l-analisi/vendor
          git add -A -- 'dietro-l-analisi/*.b64'
          if git diff --cached --quiet; then
            echo "Journey assets and runtime already current"
          else
            git commit -m "data(journey): materialize lean self-contained browser runtime"
            git push origin HEAD:phase2-analysis-journey-a
          fi
      - name: Upload journey build and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-analysis-journey-${{ github.sha }}
          path: |
            dietro-l-analisi/data-manifest.json
            dietro-l-analisi/journey-data.js
            dietro-l-analisi/*.b64
            dietro-l-analisi/vendor/*/SHA256SUMS
            dietro-l-analisi/qa/*
          if-no-files-found: error
          retention-days: 90
