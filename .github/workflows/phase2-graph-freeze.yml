name: Phase 2 frozen Gate D graph

on:
  push:
    branches: [phase2-graph-freeze]
    paths:
      - src/phase2_frozen_graph.py
      - scripts/phase2_materialize_frozen_gate_d_graph.py
      - tests/test_phase2_frozen_graph.py
      - docs/PHASE2_FROZEN_GATE_D_GRAPH.md
      - data/phase2/frozen_gate_d/source/**
      - outputs/phase2/frozen_gate_d/**
      - .github/workflows/phase2-graph-freeze.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  freeze-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned graph dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pandas==2.2.3 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1 \
            pytest==9.0.2

      - name: Verify frozen official bus GTFS inputs
        run: |
          echo 'f890c393b909a40ae9500ab5acba71166cdfc5af3d42be92f55a92d92927553b  data/raw/gtfs/agency_arriva/GTFS_invernale_2025-2026_-_Arriva_Italia_e_Addabus.zip' | sha256sum -c -
          echo 'f9b902807a2b213caea8e97c7501bdbfcbe1f3fe6d97f21f947ac2ecc6063271  data/raw/gtfs/agency_lineelecco/GTFS_invernale_2025-2026_Linee_Lecco.zip' | sha256sum -c -

      - name: Bootstrap exact Gate D PASS source only when persistent freeze is absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s data/phase2/frozen_gate_d/source/source_manifest.json ]; then
            mkdir -p /tmp/gate-d-pass
            curl --fail --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              https://api.github.com/repos/simoneghezzicolombo/tpl-olgiate-intercomunale/actions/artifacts/9891607118/zip \
              --output /tmp/gate-d-pass.zip
            echo '6fbc06d74d5ba970bc980e4cde6234245e0753c22386f703ea313c6a4de9206a  /tmp/gate-d-pass.zip' | sha256sum -c -
            unzip -q /tmp/gate-d-pass.zip -d /tmp/gate-d-pass
            python scripts/phase2_materialize_frozen_gate_d_graph.py \
              --bootstrap-artifact-dir /tmp/gate-d-pass
            echo 'PHASE2_GRAPH_BOOTSTRAP_USED=true' >> "$GITHUB_ENV"
          else
            python scripts/phase2_materialize_frozen_gate_d_graph.py
            echo 'PHASE2_GRAPH_BOOTSTRAP_USED=false' >> "$GITHUB_ENV"
          fi

      - name: Require source-closed rebuild after bootstrap epoch is committed
        run: |
          test "${PHASE2_GRAPH_BOOTSTRAP_USED}" = "false"

      - name: Strong frozen-graph tests
        run: python -m pytest -q tests/test_phase2_frozen_graph.py

      - name: Existing anti-synthetic guardrails
        run: |
          if [ -f tests/test_audit_anti_synthetic_guardrails.py ]; then
            python -m pytest -q tests/test_audit_anti_synthetic_guardrails.py
          fi

      - name: Byte-for-byte clean rebuild
        run: |
          rm -rf /tmp/phase2-graph-rebuild
          python scripts/phase2_materialize_frozen_gate_d_graph.py \
            --output-dir /tmp/phase2-graph-rebuild
          for file in outputs/phase2/frozen_gate_d/*; do
            name="$(basename "$file")"
            cmp "$file" "/tmp/phase2-graph-rebuild/$name"
          done

      - name: Verify no live OSM acquisition path exists
        run: |
          ! grep -R -n -E 'overpass-api\.de|overpass\.private|overpass\.kumi|requests\.|urllib\.|httpx\.|np\.random|numpy\.random' \
            src/phase2_frozen_graph.py scripts/phase2_materialize_frozen_gate_d_graph.py

      - name: Whitespace checks
        run: |
          git diff --check
          git diff --check 1b9b3d359be48bf58e592e0698702f58e7559e19...HEAD

      - name: Persist frozen epoch and deterministic outputs
        run: |
          git config user.name "phase2-graph-ci"
          git config user.email "actions@users.noreply.github.com"
          git add data/phase2/frozen_gate_d/source outputs/phase2/frozen_gate_d
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2-graph): persist frozen Gate D epoch"
            git push
          fi

      - name: Publish validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-frozen-gate-d-graph-${{ github.sha }}
          path: |
            data/phase2/frozen_gate_d/source/source_manifest.json
            outputs/phase2/frozen_gate_d/graph_validation.json
          if-no-files-found: error
