name: Phase 2 building-population

on:
  push:
    branches: [phase2-building-population]
    paths:
      - src/phase2_building_population.py
      - scripts/phase2_build_building_population.py
      - tests/test_phase2_building_population.py
      - .github/workflows/phase2-building-population.yml
  workflow_dispatch:

jobs:
  building-population-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --upgrade pandas pytest
      - name: Compile deterministic allocation core
        run: python -m py_compile src/phase2_building_population.py
      - name: Building-population focused tests
        run: PYTHONPATH=. pytest -q tests/test_phase2_building_population.py
      - name: Reject synthetic and random active implementation
        run: |
          ! grep -R --line-number -E 'np\.random|random\.' src/phase2_building_population.py tests/test_phase2_building_population.py
      - name: Whitespace check
        run: git diff --check 147ad941579eb7ef17a5a54c19a5f820e5a226d4...HEAD
