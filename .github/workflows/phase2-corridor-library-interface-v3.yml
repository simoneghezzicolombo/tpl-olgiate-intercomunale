name: Phase 2 Corridor Library Interface V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-efficient-alternative-corridors-v3
    paths:
      - src/phase2_corridor_library_v3.py
      - tests/test_phase2_corridor_library_v3.py
      - src/phase2_alternative_corridor_generator_v3.py
      - .github/workflows/phase2-corridor-library-interface-v3.yml

permissions:
  contents: read

concurrency:
  group: phase2-corridor-library-interface-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-efficient-alternative-corridors-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1 \
            pytest==8.3.5

      - name: Compile interface
        run: python -m py_compile src/phase2_corridor_library_v3.py

      - name: Test neutral batch contract
        run: pytest -q tests/test_phase2_corridor_library_v3.py

      - name: Guard against stop and topology leakage
        run: |
          ! grep -niE 'proposed_stop_candidates|passenger_stop_foundation|gpt-stop-source-completeness|C146|ASF|Arlate|Beverate|Perego|Mondonico' src/phase2_corridor_library_v3.py
          ! grep -nE 'np\.random|numpy\.random|random\.' src/phase2_corridor_library_v3.py

      - name: Whitespace check
        run: git diff --check
