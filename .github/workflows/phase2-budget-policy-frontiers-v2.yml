name: Phase 2 Budget Policy Frontiers V2

on:
  push:
    branches:
      - phase2-budget-policy-frontiers-v2-ci
      - phase2-robustness-final-v2
    paths:
      - 'scripts/phase2_build_budget_policy_frontiers_v2.py'
      - 'tests/test_phase2_budget_policy_frontiers_v2.py'
      - '.github/workflows/phase2-budget-policy-frontiers-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-budget-policy-frontiers-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile scripts/phase2_build_budget_policy_frontiers_v2.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Unit tests
        run: python -m pytest -q tests/test_phase2_budget_policy_frontiers_v2.py

      - name: Build explicit budget-policy frontiers
        run: >-
          python scripts/phase2_build_budget_policy_frontiers_v2.py
          --service-ready-frontier outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_v2.csv
          --service-ready-validation outputs/phase2/service_ready_frontier_v2/service_ready_frontier_v2_validation.json
          --operational outputs/phase2/operational_screening_v2/operational_screening_v2.csv
          --operational-validation outputs/phase2/operational_screening_v2/operational_screening_v2_validation.json
          --policy-config config/phase2_service_policy_design_space_v2.json
          --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv
          --policy-feasibility outputs/phase2/service_policy_search_v2/service_policy_feasibility_v2.csv.gz
          --policy-validation outputs/phase2/service_policy_search_v2/service_policy_search_v2_validation.json
          --budget-envelopes outputs/phase2/budget_envelopes.csv
          --budget-validation outputs/phase2/budget_envelopes_validation.json
          --frontier-output outputs/phase2/budget_policy_frontiers_v2/scenario_budget_policy_frontier_v2.csv.gz
          --context-audit-output outputs/phase2/budget_policy_frontiers_v2/budget_policy_context_audit_v2.csv
          --presence-output outputs/phase2/budget_policy_frontiers_v2/scenario_budget_timing_policy_presence_v2.csv
          --validation-output outputs/phase2/budget_policy_frontiers_v2/budget_policy_frontiers_v2_validation.json

      - name: Validate no-weight budget-policy contract
        run: |
          python - <<'PY'
          import csv, gzip, json, math
          from pathlib import Path
          root=Path('outputs/phase2/budget_policy_frontiers_v2')
          v=json.loads((root/'budget_policy_frontiers_v2_validation.json').read_text(encoding='utf-8'))
          assert v['status']=='PASS_PHASE2_BUDGET_POLICY_FRONTIERS_V2'
          assert v['contract']=='PHASE2_EXPLICIT_POLICY_CONTEXT_BUDGET_PARETO_V2'
          assert v['service_ready_frontier_row_count']==21237
          assert v['declared_no_extension_policy_context_count']==72
          assert v['declared_budget_envelope_count']==6
          assert v['policy_budget_context_count']==432
          assert v['frontier_row_count'] > 0
          assert v['decision_budget_selected'] is False
          assert v['calendar_selected'] is False
          assert v['recovery_selected'] is False
          assert v['service_policy_selected'] is False
          assert v['s8_phase_selected'] is False
          assert v['exact_timetable_constructed'] is False
          assert v['exact_vehicle_blocks_constructed'] is False
          assert v['positive_extension_share_in_main_surface'] is False
          assert v['weighted_composite_score'] is False
          assert v['full_gjt_calculated'] is False
          assert v['passenger_demand_assigned_to_routes'] is False
          assert v['mode_choice_inferred'] is False
          assert v['ridership_forecast'] is False
          assert set(v['budget_summary'])=={'m20pct','m10pct','reference','p10pct','p20pct','p30pct'}
          caps={k: float(x['cap_annual_bus_km']) for k,x in v['budget_summary'].items()}
          with gzip.open(root/'scenario_budget_policy_frontier_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==v['frontier_row_count']
          assert rows
          for r in rows:
              assert float(r['extension_share']) == 0.0
              assert math.isfinite(float(r['annual_bus_km']))
              assert math.isfinite(float(r['aggregate_interlinable_fleet_lower_bound']))
              assert float(r['annual_bus_km']) <= caps[r['budget_suffix']] + 1e-8
              assert r['policy_context_id'] == f"{r['budget_suffix']}__{r['policy_id']}"
          with (root/'budget_policy_context_audit_v2.csv').open(encoding='utf-8',newline='') as f:
              audit=list(csv.DictReader(f))
          assert len(audit)==432
          print(json.dumps({
              'frontier_rows': v['frontier_row_count'],
              'nonempty_contexts': v['nonempty_policy_budget_context_count'],
              'budget_summary': v['budget_summary'],
          }, indent=2, sort_keys=True))
          PY

      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/phase2-budget-policy-v2
          mkdir -p /tmp/phase2-budget-policy-v2
          python scripts/phase2_build_budget_policy_frontiers_v2.py \
            --service-ready-frontier outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_v2.csv \
            --service-ready-validation outputs/phase2/service_ready_frontier_v2/service_ready_frontier_v2_validation.json \
            --operational outputs/phase2/operational_screening_v2/operational_screening_v2.csv \
            --operational-validation outputs/phase2/operational_screening_v2/operational_screening_v2_validation.json \
            --policy-config config/phase2_service_policy_design_space_v2.json \
            --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv \
            --policy-feasibility outputs/phase2/service_policy_search_v2/service_policy_feasibility_v2.csv.gz \
            --policy-validation outputs/phase2/service_policy_search_v2/service_policy_search_v2_validation.json \
            --budget-envelopes outputs/phase2/budget_envelopes.csv \
            --budget-validation outputs/phase2/budget_envelopes_validation.json \
            --frontier-output /tmp/phase2-budget-policy-v2/frontier.csv.gz \
            --context-audit-output /tmp/phase2-budget-policy-v2/context.csv \
            --presence-output /tmp/phase2-budget-policy-v2/presence.csv \
            --validation-output /tmp/phase2-budget-policy-v2/validation.json >/dev/null
          cmp outputs/phase2/budget_policy_frontiers_v2/scenario_budget_policy_frontier_v2.csv.gz /tmp/phase2-budget-policy-v2/frontier.csv.gz
          cmp outputs/phase2/budget_policy_frontiers_v2/budget_policy_context_audit_v2.csv /tmp/phase2-budget-policy-v2/context.csv
          cmp outputs/phase2/budget_policy_frontiers_v2/scenario_budget_timing_policy_presence_v2.csv /tmp/phase2-budget-policy-v2/presence.csv
          python - <<'PY'
          import json
          from pathlib import Path
          left=json.loads(Path('outputs/phase2/budget_policy_frontiers_v2/budget_policy_frontiers_v2_validation.json').read_text())
          right=json.loads(Path('/tmp/phase2-budget-policy-v2/validation.json').read_text())
          for payload in (left,right):
              for key in ('frontier_output','context_audit_output','presence_output'):
                  payload['lineage'].pop(key,None)
          assert left==right
          PY

      - name: Guard no synthetic inference or hidden selection
        run: |
          FILE='scripts/phase2_build_budget_policy_frontiers_v2.py'
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' "$FILE"
          ! grep -n -E 'weighted_composite_score.*True|passenger_demand_assigned_to_routes.*True|mode_choice_inferred.*True|ridership_forecast.*True|full_gjt_calculated.*True|decision_budget_selected.*True|service_policy_selected.*True|calendar_selected.*True|recovery_selected.*True' "$FILE"

      - name: Persist evidence
        run: |
          git config user.name "phase2-budget-policy-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/budget_policy_frontiers_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist budget-policy frontiers v2 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-budget-policy-frontiers-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/budget_policy_frontiers_v2
