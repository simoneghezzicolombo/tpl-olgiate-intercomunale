name: Gate B real spatial integrity

on:
  push:
    branches: [antigravity-real-data]
    paths:
      - scripts/audit_02_real_spatial.py
      - tests/test_gate_b_spatial.py
      - scripts/audit_01_fetch_real_inputs.py
      - tests/test_audit_provenance.py
      - .github/workflows/gate-b-real-spatial.yml
  workflow_dispatch:

jobs:
  real-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install spatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas rasterio pyogrio requests pytest networkx scipy

      - name: Compile Gate B pipeline and tests
        run: |
          python -m py_compile scripts/audit_02_real_spatial.py
          python -m py_compile tests/test_gate_b_spatial.py

      - name: Rebuild Gate A inputs from clean checkout
        run: python scripts/audit_01_fetch_real_inputs.py

      - name: Run Gate B real spatial pipeline
        run: python scripts/audit_02_real_spatial.py

      - name: Run Gate B tests
        run: python -m pytest -v tests/test_gate_b_spatial.py

      - name: Gate B red-team diagnostics
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np

          pop = pd.read_csv('data/audit_gate_b/population_cells_real.csv', dtype={'PRO_COM_T': str})
          acc = pd.read_csv('data/audit_gate_b/population_accessibility.csv', dtype={'PRO_COM_T': str})
          stops = pd.read_csv('data/audit_gate_b/gtfs_core_stops.csv', dtype={'stop_id': str})
          edges = pd.read_csv('data/audit_gate_b/walk_graph_edges.csv')

          print('--- calibration by municipality ---')
          diag = pop.groupby(['PRO_COM_T', 'COMUNE']).agg(
              worldpop_2020_sum=('worldpop_2020_raw', 'sum'),
              calibrated_2025=('pop_calibrated_2025', 'sum'),
              calibration_factor=('calibration_factor_2025', 'first'),
              populated_cells=('cell_id', 'count'),
          ).reset_index()
          print(diag.to_string(index=False))
          print('core calibrated total:', float(pop['pop_calibrated_2025'].sum()))

          print('\n--- GTFS stop snap failures / largest snaps ---')
          print(stops.sort_values('snap_distance_m', ascending=False)[
              ['stop_id','stop_name','COMUNE','snap_distance_m','snap_ok']
          ].head(12).to_string(index=False))

          print('\n--- cell connector distance quantiles (m) ---')
          print(acc['connector_distance_m'].quantile([0, .5, .9, .95, .99, 1]).to_string())

          total = float(acc['pop_calibrated_2025'].sum())
          print('\n--- coverage sensitivity to cell connector cap ---')
          for cap in (100, 200, 300):
              vals = []
              for threshold in (5, 8, 10, 12):
                  mask = (
                      (acc['connector_distance_m'] <= cap)
                      & acc['walk_min_to_nearest_gtfs_stop'].notna()
                      & (acc['walk_min_to_nearest_gtfs_stop'] <= threshold)
                  )
                  pct = 100.0 * float(acc.loc[mask, 'pop_calibrated_2025'].sum()) / total
                  vals.append(f'{threshold}m={pct:.2f}%')
              print(f'cap {cap} m: ' + ', '.join(vals))

          print('\n--- DSM-derived edge slope diagnostics ---')
          abs_slope = edges.loc[edges['in_giant_component'], 'slope_uv'].abs().replace([np.inf, -np.inf], np.nan).dropna()
          print(abs_slope.quantile([.5, .9, .95, .99, .999, 1]).to_string())
          print('edges |slope| > 0.30:', int((abs_slope > .30).sum()), 'of', len(abs_slope))
          PY

      - name: Print Gate B summary
        if: always()
        run: |
          if [ -f data/audit_gate_b/gate_b_summary.json ]; then
            cat data/audit_gate_b/gate_b_summary.json
          fi
          if [ -f data/audit_gate_b/coverage_summary.csv ]; then
            echo '--- coverage_summary.csv ---'
            cat data/audit_gate_b/coverage_summary.csv
          fi
          if [ -f data/audit_gate_b/spot_checks.csv ]; then
            echo '--- spot_checks.csv ---'
            cat data/audit_gate_b/spot_checks.csv
          fi

# Gate B starts from a fresh Gate A acquisition and never reads legacy synthetic outputs.
# Trigger revision 5: continuous filtered DSM sampling and slope red-team.
