name: RT-022 real territorial structural search V3

on:
  workflow_dispatch:
  push:
    branches: [phase2-territorial-structural-search-v3]
    paths:
      - .github/workflows/phase2-territorial-structural-search-real-v3.yml
      - .rt022-real-run-trigger

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  territorial-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned RT-022 dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 pyproj==3.7.2 scipy==1.17.0 pytest==8.3.5

      - name: Import certified RT-021 branch outputs
        run: |
          git fetch origin rt021-frozen-territorial-corridor-corpus-v3
          rm -rf /tmp/rt021
          mkdir -p /tmp/rt021
          for f in \
            rt021_stop_attachments_v3.csv \
            rt021_complete_directed_pair_manifest_v3.csv \
            rt021_pair_execution_status_v3.csv \
            rt021_corridor_corpus_v3.csv.gz \
            rt021_validation_v3.json; do
            git show origin/rt021-frozen-territorial-corridor-corpus-v3:outputs/phase2/rt021/$f > /tmp/rt021/$f
          done
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/rt021/rt021_validation_v3.json').read_text())
          assert v['status']=='PASS_RT021_FROZEN_TERRITORIAL_CORRIDOR_CORPUS_V3', v
          assert all(v['checks'].values()), v['checks']
          assert v['pair_universe']['directed_pair_count']==1190
          assert v['stop_layer']['stop_place_count']==36
          print(v['graph_epoch_id'])
          PY

      - name: Compile RT-022
        run: |
          python -m py_compile src/phase2_territorial_structural_search_v3.py
          python -m py_compile scripts/phase2_run_territorial_structural_search_v3.py

      - name: Run first real topology-neutral territorial structural search
        run: |
          rm -rf outputs/phase2/rt022_territorial_structural_search_v3
          python scripts/phase2_run_territorial_structural_search_v3.py \
            --attachments /tmp/rt021/rt021_stop_attachments_v3.csv \
            --pair-manifest /tmp/rt021/rt021_complete_directed_pair_manifest_v3.csv \
            --pair-results /tmp/rt021/rt021_pair_execution_status_v3.csv \
            --corridors /tmp/rt021/rt021_corridor_corpus_v3.csv.gz \
            --metadata /tmp/rt021/rt021_validation_v3.json \
            --out-dir outputs/phase2/rt022_territorial_structural_search_v3 \
            --max-states 100000 \
            --max-structures 20000

      - name: Validate real RT-022 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/phase2/rt022_territorial_structural_search_v3/rt022_audit.json')
          v=json.loads(p.read_text())
          assert v['status']=='PASS_COMPLETE_TOPOLOGY_NEUTRAL_TERRITORIAL_STRUCTURE_UNIVERSE', v
          assert v['complete'] is True
          assert v['counts']['stop_attachments']==36
          assert v['counts']['technical_pair_query_anchors']==35
          assert v['counts']['directed_pair_requests']==1190
          assert v['guards']['service_terminal_selected'] is False
          assert v['guards']['topology_prior_used'] is False
          assert v['guards']['primary_runner_up_selected'] is False
          assert v['guards']['municipality_used_as_routing_filter'] is False
          assert v['guards']['partial_cap_hit_pool_usable'] is False
          print(json.dumps(v, indent=2, sort_keys=True))
          PY

      - name: Anti-bias guards
        run: |
          ! grep -nE 'np\.random|numpy\.random|import random|from random|Cassina|Circolare Meratese|PRIMARY|RUNNER-UP' \
            src/phase2_territorial_structural_search_v3.py \
            scripts/phase2_run_territorial_structural_search_v3.py
          git diff --check

      - name: Upload real RT-022 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-territorial-structural-search-v3-real
          path: outputs/phase2/rt022_territorial_structural_search_v3/
          if-no-files-found: error
          retention-days: 90
