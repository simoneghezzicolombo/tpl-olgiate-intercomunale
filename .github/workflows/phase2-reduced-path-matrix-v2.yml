name: Phase 2 Reduced Path Matrix V2

on:
  push:
    branches:
      - phase2-reduced-path-matrix-v2
    paths:
      - 'src/phase2_reduced_path_matrix_v2.py'
      - 'scripts/phase2_build_reduced_path_matrix_v2.py'
      - 'tests/test_phase2_reduced_path_matrix_v2.py'
      - '.github/workflows/phase2-reduced-path-matrix-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-reduced-path-matrix-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned graph dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pandas==2.2.3 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1 \
            pytest==9.0.2

      - name: Compile V2 matrix bridge
        run: |
          python -m py_compile src/phase2_reduced_path_matrix.py
          python -m py_compile src/phase2_reduced_path_matrix_v2.py
          python -m py_compile scripts/phase2_build_reduced_path_matrix_v2.py

      - name: Run V1 engine and V2 epistemic tests
        run: |
          python -m pytest -q tests/test_phase2_reduced_path_matrix.py
          python -m pytest -q tests/test_phase2_reduced_path_matrix_v2.py

      - name: Validate Stop Universe V2 upstream contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/phase2/stop_universe_v2')
          v = json.loads((root/'stop_universe_v2_validation.json').read_text(encoding='utf-8'))
          assert v['status'] == 'PASS_STOP_UNIVERSE_V2_BUILD'
          assert v['final_proposed_candidates'] == 155
          assert v['existing_physical_stop_clusters'] == 43
          assert v['population_units'] == 4348
          assert v['legacy_worldpop_cells_used_for_v2_candidate_population'] is False
          assert v['final_network_selected'] is False
          assert v['ranking_produced'] is False
          PY
          cd outputs/phase2/stop_universe_v2
          sha256sum -c stop_universe_v2_checksums.sha256

      - name: Materialise Reduced Path Matrix V2 on complete frozen Gate D graph
        run: python scripts/phase2_build_reduced_path_matrix_v2.py

      - name: Validate real V2 matrix outputs
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('outputs/phase2/reduced_path_matrix_v2')
          v = json.loads((root/'reduced_path_matrix_v2_validation.json').read_text(encoding='utf-8'))
          assert v['status'] == 'PASS_REDUCED_PATH_MATRIX_V2_BUILD'
          assert v['contract'] == 'PHASE2_REDUCED_STOP_PATH_MATRIX_V2'
          assert v['source_anchor_count'] == 199
          assert v['source_anchor_counts']['HUB_RAIL'] == 1
          assert v['source_anchor_counts']['EXISTING_PHYSICAL_STOP_CLUSTER'] == 43
          assert v['source_anchor_counts']['PROPOSED_STOP'] == 155
          assert v['source_scope_counts']['STOP_UNIVERSE_V2_PROPOSED'] == 155
          context_scope_count = sum(
              count
              for scope, count in v['source_scope_counts'].items()
              if 'ANALYSIS_ENVELOPE_GATE_D_GTFS_CLUSTER_CENTROID' in scope.split('|')
          )
          assert context_scope_count == 1
          assert v['source_evidence_status_counts']['DERIVED_OFFICIAL_GTFS_REFERENCE_PERIOD_CLUSTER_CENTROID'] == 1
          assert 'FACT' not in v['source_evidence_status_counts']
          assert v['ordered_path_rows'] + v['missing_ordered_pairs'] == v['ordered_path_rows_possible']
          assert 0.0 < v['path_matrix_completeness'] <= 1.0
          assert v['one_to_many_dijkstra_runs'] == v['routing_anchor_count']
          assert v['route_ready_source_anchors'] <= v['source_anchor_count']
          assert v['route_ready_source_anchors'] > 1
          assert v['prohibitions']['live_osm_used'] is False
          assert v['prohibitions']['random_generation_used'] is False
          assert v['prohibitions']['topology_selected'] is False
          assert v['prohibitions']['proposed_stop_physically_certified'] is False
          assert v['prohibitions']['context_gtfs_centroid_promoted_to_exact_fact_coordinate'] is False
          assert v['prohibitions']['headway_or_timetable_selected'] is False
          assert v['prohibitions']['budget_modified'] is False

          with (root/'routing_anchor_universe.csv').open(encoding='utf-8', newline='') as f:
              anchors = list(csv.DictReader(f))
          assert len(anchors) == v['routing_anchor_count']
          assert sum(row['anchor_id'] == 'rail:S01514' for row in anchors) == 1
          assert len({row['graph_node_id'] for row in anchors}) == len(anchors)

          with (root/'routing_anchor_membership.csv').open(encoding='utf-8', newline='') as f:
              membership = list(csv.DictReader(f))
          assert len(membership) == 199
          context = [
              row for row in membership
              if 'ANALYSIS_ENVELOPE_GATE_D_GTFS_CLUSTER_CENTROID' in row['source_scope'].split('|')
          ]
          assert len(context) == 1
          assert context[0]['evidence_status'] == 'DERIVED_OFFICIAL_GTFS_REFERENCE_PERIOD_CLUSTER_CENTROID'
          assert 'GATE_B_CORE_GTFS_RECORD' in context[0]['source_scope'].split('|')
          proposed = [row for row in membership if row['source_kind'] == 'PROPOSED_STOP']
          assert len(proposed) == 155
          assert all(row['evidence_status'] == 'PROPOSED_STOP/FIELD_CHECK_PENDING' for row in proposed)
          assert all(row['physical_status'] == 'FIELD_CHECK_PENDING' for row in proposed)
          assert all(row['candidate_status'] == 'HYPOTHESIS_NOT_RECOMMENDATION' for row in proposed)

          with (root/'reduced_path_matrix.csv').open(encoding='utf-8', newline='') as f:
              matrix = list(csv.DictReader(f))
          assert len(matrix) == v['ordered_path_rows']
          assert all(float(row['distance_km']) > 0 for row in matrix)
          assert all(float(row['runtime_min']) > 0 for row in matrix)
          assert {row['uncertainty'] for row in matrix} <= {'RESOLVED', 'QUANTIFIED', 'UNKNOWN'}

          anchor_ids = {row['anchor_id'] for row in anchors}
          outbound = {row['destination'] for row in matrix if row['origin'] == 'rail:S01514'}
          inbound = {row['origin'] for row in matrix if row['destination'] == 'rail:S01514'}
          topology_ready = {'rail:S01514', *(outbound & inbound)}
          assert topology_ready <= anchor_ids
          assert len(topology_ready) > 1
          print(f"V2 hub bidirectional topology-ready routing anchors: {len(topology_ready)} / {len(anchor_ids)}")
          PY

      - name: Deterministic clean rebuild
        run: |
          rm -rf /tmp/phase2-reduced-matrix-v2
          python scripts/phase2_build_reduced_path_matrix_v2.py --output-dir /tmp/phase2-reduced-matrix-v2
          for name in routing_anchor_universe.csv routing_anchor_membership.csv reduced_path_matrix.csv reduced_path_matrix_v2_validation.json; do
            cmp "outputs/phase2/reduced_path_matrix_v2/$name" "/tmp/phase2-reduced-matrix-v2/$name"
          done

      - name: Guard source-closed deterministic V2 bridge
        run: |
          ! grep -R -n -E 'overpass-api\.de|requests\.|urllib\.|httpx\.|np\.random|numpy\.random|import random|from random' \
            src/phase2_reduced_path_matrix_v2.py scripts/phase2_build_reduced_path_matrix_v2.py
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check origin/phase2-stop-universe-v2...HEAD

      - name: Persist validated Reduced Path Matrix V2
        run: |
          git config user.name "phase2-path-matrix-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/reduced_path_matrix_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist audited Reduced Path Matrix V2"
            git push origin HEAD:phase2-reduced-path-matrix-v2
          fi

      - name: Upload Reduced Path Matrix V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-reduced-path-matrix-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/reduced_path_matrix_v2
