name: Phase 2 Final Method Redteam V2

on:
  push:
    branches:
      - phase2-final-method-redteam-v2
    paths:
      - 'scripts/phase2_run_final_method_redteam_v2.py'
      - 'tests/test_phase2_final_method_redteam_v2.py'
      - 'docs/PHASE2_FINAL_METHOD_REDTEAM_V2.md'
      - '.github/workflows/phase2-final-method-redteam-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-final-method-redteam-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONPATH: .
  OUTDIR: outputs/phase2/final_method_redteam_v2

jobs:
  redteam:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen audit ancestry
        run: |
          test "$(git merge-base HEAD 864c83accb81c615f9778396408b21e31ca72983)" = "864c83accb81c615f9778396408b21e31ca72983"
          git merge-base --is-ancestor 864c83accb81c615f9778396408b21e31ca72983 HEAD

      - name: Compile red-team runner
        run: python -m py_compile scripts/phase2_run_final_method_redteam_v2.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'

      - name: Run methodological regression tests
        run: >-
          python -m pytest -q
          tests/test_phase2_final_method_redteam_v2.py
          tests/test_phase2_access_equity_hub_bridge_v2.py
          tests/test_phase2_passenger_utility_frontier_v2.py
          tests/test_phase2_passenger_utility_all_thresholds_v2.py
          tests/test_phase2_s8_robust_opportunity_surface_v2.py

      - name: Materialise pinned narrow S8 evidence for independent class recomputation
        run: |
          git cat-file -e 8d79cbd74c3ec99ec3eff5fca7a799975210356b^{commit}
          mkdir -p outputs/phase2/passenger_gjt_v2
          git show 8d79cbd74c3ec99ec3eff5fca7a799975210356b:outputs/phase2/passenger_gjt_v2/s8_scenario_feeder_envelope_v2.csv.gz > outputs/phase2/passenger_gjt_v2/s8_scenario_feeder_envelope_v2.csv.gz
          test "$(sha256sum outputs/phase2/passenger_gjt_v2/s8_scenario_feeder_envelope_v2.csv.gz | cut -d' ' -f1)" = "d41baccffcbc573b984cd5ecadb0c5eeda6cffa69b7e44717d77d5b34c2df3d3"

      - name: Run full frozen-lineage red-team
        run: python scripts/phase2_run_final_method_redteam_v2.py

      - name: Validate audit contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/phase2/final_method_redteam_v2')
          v=json.loads((root/'final_method_redteam_v2_validation.json').read_text())
          f=json.loads((root/'findings.json').read_text())
          assert v['contract']=='PHASE2_FINAL_METHOD_REDTEAM_V2'
          assert v['audit_target_sha']=='864c83accb81c615f9778396408b21e31ca72983'
          assert v['audit_complete'] is True
          assert v['primary_selection_authorised'] is False
          assert v['runner_up_selection_authorised'] is False
          assert v['structural_reference_counts_verified'] is True
          assert v['weighted_score_detected'] is False
          assert v['municipal_od_downscaling_detected'] is False
          assert v['ridership_inference_detected'] is False
          assert v['synthetic_data_detected'] is False
          assert v['current_service_baseline_semantics_preserved'] is True
          assert v['station_bridge_semantics_preserved'] is True
          assert len(f['findings']) >= 10
          assert sum(x['severity']=='BLOCKING' for x in f['findings']) == v['blocking_issue_count']
          assert sum(x['severity']=='MAJOR' for x in f['findings']) == v['major_issue_count']
          assert sum(x['severity']=='MINOR' for x in f['findings']) == v['minor_issue_count']
          print(json.dumps({
              'status':v['status'],
              'blocking':v['blocking_issue_count'],
              'major':v['major_issue_count'],
              'minor':v['minor_issue_count'],
              'lineage_mismatches':v['lineage_hash_mismatch_count'],
              'ambiguous_stage_c_budget_rows':v['budget_exactness_audit']['passenger_utility_frontier']['budget_boundary_ambiguous_rows'],
              's8_classes':v['s8_class_audit'],
          }, indent=2))
          PY

      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/final-method-redteam-v2 && mkdir -p /tmp/final-method-redteam-v2
          cp "$OUTDIR/findings.json" /tmp/final-method-redteam-v2/findings.json
          cp "$OUTDIR/final_method_redteam_v2_validation.json" /tmp/final-method-redteam-v2/validation.json
          python scripts/phase2_run_final_method_redteam_v2.py >/dev/null
          cmp "$OUTDIR/findings.json" /tmp/final-method-redteam-v2/findings.json
          cmp "$OUTDIR/final_method_redteam_v2_validation.json" /tmp/final-method-redteam-v2/validation.json

      - name: Guard audit itself from synthetic or network data
        run: |
          ! grep -En 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' scripts/phase2_run_final_method_redteam_v2.py
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check

      - name: Persist red-team evidence
        run: |
          git config user.name 'phase2-final-method-redteam-v2-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo 'No audit evidence changes to persist'
          else
            git commit -m 'audit(phase2): persist final method red-team evidence [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-final-method-redteam-v2-${{ github.sha }}
          path: outputs/phase2/final_method_redteam_v2
          retention-days: 90
          if-no-files-found: error
