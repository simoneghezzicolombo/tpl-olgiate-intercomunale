name: Phase 2 Passenger GJT V2

on:
  push:
    branches:
      - phase2-passenger-gjt-v2
    paths:
      - 'config/phase2_passenger_gjt_sensitivity_v2.json'
      - 'src/phase2_passenger_gjt_v2.py'
      - 'scripts/phase2_build_passenger_journey_universe_v2.py'
      - 'tests/test_phase2_passenger_gjt_v2.py'
      - 'tests/test_phase2_passenger_journey_universe_v2.py'
      - 'docs/PHASE2_PASSENGER_GJT_V2.md'
      - '.github/workflows/phase2-passenger-gjt-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-passenger-gjt-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile Passenger GJT V2
        run: |
          python -m py_compile src/phase2_passenger_gjt_v2.py
          python -m py_compile scripts/phase2_build_passenger_journey_universe_v2.py

      - name: Run Passenger GJT V2 tests
        run: >-
          python -m pytest -q
          tests/test_phase2_passenger_gjt_v2.py
          tests/test_phase2_passenger_journey_universe_v2.py

      - name: Materialise empirical journey universe and sensitivity grid
        run: >-
          python scripts/phase2_build_passenger_journey_universe_v2.py
          --addressability outputs/phase2/s8_work_demand_addressability.csv
          --od-validation outputs/phase2/od_2021_demand_profile_validation.json
          --sensitivity config/phase2_passenger_gjt_sensitivity_v2.json
          --journey-output outputs/phase2/passenger_gjt_v2/empirical_journey_universe_v2.csv
          --sensitivity-output outputs/phase2/passenger_gjt_v2/behavioural_sensitivity_grid_v2.csv
          --validation outputs/phase2/passenger_gjt_v2/passenger_journey_universe_v2_validation.json

      - name: Validate Passenger GJT V2 universe contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('outputs/phase2/passenger_gjt_v2')
          val=json.loads((root/'passenger_journey_universe_v2_validation.json').read_text(encoding='utf-8'))
          assert val['status']=='PASS_PASSENGER_JOURNEY_UNIVERSE_V2_BUILD'
          assert val['contract']=='PHASE2_PASSENGER_JOURNEY_UNIVERSE_V2'
          assert val['source_scope']=='ISTAT_2021_WORK_COMMUTING_ONLY'
          assert val['source_resolution']=='MUNICIPAL_OD'
          assert val['origin_municipality_count']==5
          assert val['demand_weight_sum']==1882.0
          assert val['expected_demand_weight_sum']==1882.0
          assert val['sensitivity_case_count']==81
          assert val['full_gjt_ready'] is False
          assert val['spatial_allocation_performed'] is False
          assert val['population_proportional_worker_allocation_performed'] is False
          assert val['nearest_stop_imputation_performed'] is False
          assert val['S8_DIRECT_is_modal_share'] is False
          assert val['fine_walking_access_combined_with_empirical_OD'] is False
          with (root/'empirical_journey_universe_v2.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==val['journey_count'] and rows
          assert all(r['full_gjt_ready']=='false' for r in rows)
          assert all(r['source_resolution']=='MUNICIPAL_OD' for r in rows)
          assert all(r['spatial_allocation_status']=='MUNICIPAL_OD_ONLY_NO_SPATIAL_ALLOCATION' for r in rows)
          with (root/'behavioural_sensitivity_grid_v2.csv').open(encoding='utf-8',newline='') as f:
              cases=list(csv.DictReader(f))
          assert len(cases)==81
          print(json.dumps({k:val[k] for k in ('journey_count','demand_weight_sum','sensitivity_case_count')}, indent=2))
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          rm -rf /tmp/phase2-passenger-gjt-v2
          mkdir -p /tmp/phase2-passenger-gjt-v2
          python scripts/phase2_build_passenger_journey_universe_v2.py \
            --addressability outputs/phase2/s8_work_demand_addressability.csv \
            --od-validation outputs/phase2/od_2021_demand_profile_validation.json \
            --sensitivity config/phase2_passenger_gjt_sensitivity_v2.json \
            --journey-output /tmp/phase2-passenger-gjt-v2/journey.csv \
            --sensitivity-output /tmp/phase2-passenger-gjt-v2/sensitivity.csv \
            --validation /tmp/phase2-passenger-gjt-v2/validation.json
          cmp outputs/phase2/passenger_gjt_v2/empirical_journey_universe_v2.csv /tmp/phase2-passenger-gjt-v2/journey.csv
          cmp outputs/phase2/passenger_gjt_v2/behavioural_sensitivity_grid_v2.csv /tmp/phase2-passenger-gjt-v2/sensitivity.csv
          cmp outputs/phase2/passenger_gjt_v2/passenger_journey_universe_v2_validation.json /tmp/phase2-passenger-gjt-v2/validation.json

      - name: Guard Passenger GJT epistemic separation
        run: |
          FILES="config/phase2_passenger_gjt_sensitivity_v2.json src/phase2_passenger_gjt_v2.py scripts/phase2_build_passenger_journey_universe_v2.py"
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -n -E 'S8_DIRECT_is_modal_share[^f]*true|population_proportional_worker_allocation_performed[^f]*true|nearest_stop_imputation_performed[^f]*true|full_gjt_ready[^f]*true' $FILES
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check origin/phase2-access-equity-v2...HEAD

      - name: Persist validated Passenger GJT V2 universe
        run: |
          git config user.name "phase2-passenger-gjt-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/passenger_gjt_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist audited Passenger GJT V2 universe [skip ci]"
            git push origin HEAD:phase2-passenger-gjt-v2
          fi

      - name: Upload Passenger GJT V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-passenger-gjt-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/passenger_gjt_v2
