name: Phase 2 Passenger GJT V2

on:
  push:
    branches:
      - phase2-passenger-gjt-v2
    paths:
      - 'config/phase2_passenger_gjt_sensitivity_v2.json'
      - 'src/phase2_passenger_gjt_v2.py'
      - 'src/phase2_s8_destination_direction_v2.py'
      - 'src/phase2_s8_work_transfer_utility_v2.py'
      - 'src/phase2_s8_passenger_support_mask_v2.py'
      - 'src/phase2_s8_transfer_gap_envelope_v2.py'
      - 'scripts/phase2_build_passenger_journey_universe_v2.py'
      - 'scripts/phase2_build_s8_work_direction_weights_v2.py'
      - 'scripts/phase2_build_s8_passenger_support_mask_v2.py'
      - 'scripts/phase2_build_s8_transfer_gap_envelope_v2.py'
      - 'tests/test_phase2_passenger_gjt_v2.py'
      - 'tests/test_phase2_passenger_journey_universe_v2.py'
      - 'tests/test_phase2_s8_destination_direction_v2.py'
      - 'tests/test_phase2_s8_work_transfer_utility_v2.py'
      - 'tests/test_phase2_s8_passenger_support_mask_v2.py'
      - 'tests/test_phase2_s8_transfer_gap_envelope_v2.py'
      - 'docs/PHASE2_PASSENGER_GJT_V2.md'
      - '.github/workflows/phase2-passenger-gjt-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-passenger-gjt-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile Passenger GJT V2
        run: |
          python -m py_compile src/phase2_passenger_gjt_v2.py
          python -m py_compile src/phase2_s8_destination_direction_v2.py
          python -m py_compile src/phase2_s8_work_transfer_utility_v2.py
          python -m py_compile src/phase2_s8_passenger_support_mask_v2.py
          python -m py_compile src/phase2_s8_transfer_gap_envelope_v2.py
          python -m py_compile scripts/phase2_build_passenger_journey_universe_v2.py
          python -m py_compile scripts/phase2_build_s8_work_direction_weights_v2.py
          python -m py_compile scripts/phase2_build_s8_passenger_support_mask_v2.py
          python -m py_compile scripts/phase2_build_s8_transfer_gap_envelope_v2.py

      - name: Run Passenger GJT V2 tests
        run: >-
          python -m pytest -q
          tests/test_phase2_passenger_gjt_v2.py
          tests/test_phase2_passenger_journey_universe_v2.py
          tests/test_phase2_s8_destination_direction_v2.py
          tests/test_phase2_s8_work_transfer_utility_v2.py
          tests/test_phase2_s8_passenger_support_mask_v2.py
          tests/test_phase2_s8_transfer_gap_envelope_v2.py

      - name: Materialise empirical journey universe and sensitivity grid
        run: >-
          python scripts/phase2_build_passenger_journey_universe_v2.py
          --addressability outputs/phase2/s8_work_demand_addressability.csv
          --od-validation outputs/phase2/od_2021_demand_profile_validation.json
          --sensitivity config/phase2_passenger_gjt_sensitivity_v2.json
          --journey-output outputs/phase2/passenger_gjt_v2/empirical_journey_universe_v2.csv
          --sensitivity-output outputs/phase2/passenger_gjt_v2/behavioural_sensitivity_grid_v2.csv
          --validation outputs/phase2/passenger_gjt_v2/passenger_journey_universe_v2_validation.json

      - name: Materialise official S8 work direction weights
        run: >-
          python scripts/phase2_build_s8_work_direction_weights_v2.py
          --journeys outputs/phase2/passenger_gjt_v2/empirical_journey_universe_v2.csv
          --s8-events outputs/phase2/s8_events.csv
          --station-municipalities outputs/phase2/s8_station_municipalities.csv
          --s8-contract outputs/phase2/s8_interchange_contract.json
          --gtfs-zip data/raw/gtfs/rail_trenord/trenord_gtfs.zip
          --output outputs/phase2/passenger_gjt_v2/s8_work_direction_weights_v2.csv
          --summary outputs/phase2/passenger_gjt_v2/s8_work_direction_summary_v2.csv
          --validation outputs/phase2/passenger_gjt_v2/s8_work_direction_weights_v2_validation.json

      - name: Materialise audited S8 passenger support mask
        run: >-
          python scripts/phase2_build_s8_passenger_support_mask_v2.py
          --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json
          --routes outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv
          --scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz
          --route-output outputs/phase2/passenger_gjt_v2/s8_route_passenger_support_v2.csv
          --scenario-output outputs/phase2/passenger_gjt_v2/s8_scenario_passenger_support_v2.csv.gz
          --validation outputs/phase2/passenger_gjt_v2/s8_passenger_support_mask_v2_validation.json

      - name: Materialise exact S8 transfer-gap envelope
        run: >-
          python scripts/phase2_build_s8_transfer_gap_envelope_v2.py
          --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json
          --support-validation outputs/phase2/passenger_gjt_v2/s8_passenger_support_mask_v2_validation.json
          --route-support outputs/phase2/passenger_gjt_v2/s8_route_passenger_support_v2.csv
          --s8-events outputs/phase2/s8_events.csv
          --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv
          --work-direction-summary outputs/phase2/passenger_gjt_v2/s8_work_direction_summary_v2.csv
          --output outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2.csv.gz
          --validation outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2_validation.json

      - name: Validate Passenger GJT V2 contracts
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          root=Path('outputs/phase2/passenger_gjt_v2')
          val=json.loads((root/'passenger_journey_universe_v2_validation.json').read_text(encoding='utf-8'))
          assert val['status']=='PASS_PASSENGER_JOURNEY_UNIVERSE_V2_BUILD'
          assert val['contract']=='PHASE2_PASSENGER_JOURNEY_UNIVERSE_V2'
          assert val['source_scope']=='ISTAT_2021_WORK_COMMUTING_ONLY'
          assert val['source_resolution']=='MUNICIPAL_OD'
          assert val['journey_count']==50
          assert val['origin_municipality_count']==5
          assert val['destination_municipality_count']==10
          assert val['demand_weight_sum']==1882.0
          assert val['expected_demand_weight_sum']==1882.0
          assert val['sensitivity_case_count']==81
          assert val['full_gjt_ready'] is False
          assert val['spatial_allocation_performed'] is False
          assert val['population_proportional_worker_allocation_performed'] is False
          assert val['nearest_stop_imputation_performed'] is False
          assert val['S8_DIRECT_is_modal_share'] is False
          assert val['fine_walking_access_combined_with_empirical_OD'] is False
          with (root/'empirical_journey_universe_v2.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==50
          assert all(r['full_gjt_ready']=='false' for r in rows)
          assert all(r['source_resolution']=='MUNICIPAL_OD' for r in rows)
          assert all(r['spatial_allocation_status']=='MUNICIPAL_OD_ONLY_NO_SPATIAL_ALLOCATION' for r in rows)
          with (root/'behavioural_sensitivity_grid_v2.csv').open(encoding='utf-8',newline='') as f:
              cases=list(csv.DictReader(f))
          assert len(cases)==81

          d=json.loads((root/'s8_work_direction_weights_v2_validation.json').read_text(encoding='utf-8'))
          assert d['status']=='PASS_S8_WORK_DIRECTION_WEIGHTS_V2_BUILD'
          assert d['contract']=='PHASE2_S8_WORK_DIRECTION_WEIGHTS_V2'
          assert d['journey_count']==50
          assert d['destination_municipality_count']==10
          assert d['demand_weight_sum']==1882.0
          assert d['expected_demand_weight_sum']==1882.0
          assert d['S8_DIRECT_is_modal_share'] is False
          assert d['full_gjt_ready'] is False
          assert d['spatial_allocation_performed'] is False
          assert sum(d['outbound_direction_demand'].values())==1882.0
          assert sum(d['return_direction_demand'].values())==1882.0
          assert d['outbound_direction_demand']['LECCO']==d['return_direction_demand']['MILANO']
          assert d['outbound_direction_demand']['MILANO']==d['return_direction_demand']['LECCO']
          with (root/'s8_work_direction_weights_v2.csv').open(encoding='utf-8',newline='') as f:
              directions=list(csv.DictReader(f))
          assert len(directions)==50
          assert all(r['outbound_bus_to_rail_direction'] in {'LECCO','MILANO'} for r in directions)
          assert all(r['return_rail_to_bus_direction'] in {'LECCO','MILANO'} for r in directions)
          assert all(r['full_gjt_ready']=='false' for r in directions)

          s=json.loads((root/'s8_passenger_support_mask_v2_validation.json').read_text(encoding='utf-8'))
          assert s['status']=='PASS_S8_PASSENGER_SUPPORT_MASK_V2_BUILD'
          assert s['contract']=='PHASE2_S8_PASSENGER_SUPPORT_MASK_V2'
          assert s['route_count']==50115
          assert s['roundtrip_passenger_supported_route_count']==35119
          assert s['rail_to_bus_only_route_count']==14996
          assert s['scenario_count']==100000
          assert s['passenger_demand_assigned_to_routes'] is False
          assert s['passenger_utility_calculated'] is False
          assert s['full_gjt_calculated'] is False
          assert s['topology_ranked'] is False
          assert s['service_policy_selected'] is False
          assert s['source_resolution_for_empirical_work_demand']=='MUNICIPAL_OD'
          assert s['s8_addressability_is_modal_share'] is False
          with (root/'s8_route_passenger_support_v2.csv').open(encoding='utf-8',newline='') as f:
              support_rows=list(csv.DictReader(f))
          assert len(support_rows)==50115
          assert sum(r['roundtrip_passenger_supported']=='true' for r in support_rows)==35119
          assert sum(r['passenger_support_class']=='RAIL_TO_BUS_ONLY_PUBLIC_ROUTE_OPEN_AWAY_FROM_HUB' for r in support_rows)==14996
          assert all(r['passenger_demand_assigned_to_route']=='false' for r in support_rows)
          with gzip.open(root/'s8_scenario_passenger_support_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              scenario_rows=list(csv.DictReader(f))
          assert len(scenario_rows)==100000
          assert all(r['passenger_demand_assigned_to_routes']=='false' for r in scenario_rows)
          assert all(r['scenario_passenger_utility_calculated']=='false' for r in scenario_rows)
          assert all(r['topology_ranked']=='false' for r in scenario_rows)

          g=json.loads((root/'s8_transfer_gap_envelope_v2_validation.json').read_text(encoding='utf-8'))
          assert g['status']=='PASS_S8_TRANSFER_GAP_ENVELOPE_V2_BUILD'
          assert g['contract']=='PHASE2_S8_TRANSFER_GAP_ENVELOPE_V2'
          assert g['route_count']==50115
          assert g['timing_archetype_count']==8
          assert g['route_timing_row_count']==400920
          assert g['roundtrip_route_timing_row_count']==280952
          assert g['rail_to_bus_only_route_timing_row_count']==119968
          assert g['worker_direction_weight_reference']==1882.0
          assert g['worker_reference_assigned_to_routes'] is False
          assert g['phase_selected'] is False
          assert g['all_integer_phases_retained'] is True
          assert g['passenger_utility_calculated'] is False
          assert g['full_gjt_calculated'] is False
          assert g['topology_ranked'] is False
          assert g['service_policy_selected'] is False
          assert g['demand_weight_semantics']=='DIRECTION_WEIGHT_ONLY_NOT_ROUTE_DEMAND_NOT_MODAL_SHARE'

          print(json.dumps({
              'journey_count': val['journey_count'],
              'demand_weight_sum': val['demand_weight_sum'],
              'sensitivity_case_count': val['sensitivity_case_count'],
              'outbound_direction_demand': d['outbound_direction_demand'],
              'route_support_count': s['route_count'],
              'roundtrip_route_count': s['roundtrip_passenger_supported_route_count'],
              'directional_only_route_count': s['rail_to_bus_only_route_count'],
              'scenario_support_count': s['scenario_count'],
              'transfer_gap_rows': g['route_timing_row_count'],
              'transfer_gap_complete_rows': g['rows_with_at_least_one_complete_match_phase'],
          }, indent=2))
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          rm -rf /tmp/phase2-passenger-gjt-v2
          mkdir -p /tmp/phase2-passenger-gjt-v2
          python scripts/phase2_build_passenger_journey_universe_v2.py \
            --addressability outputs/phase2/s8_work_demand_addressability.csv \
            --od-validation outputs/phase2/od_2021_demand_profile_validation.json \
            --sensitivity config/phase2_passenger_gjt_sensitivity_v2.json \
            --journey-output /tmp/phase2-passenger-gjt-v2/journey.csv \
            --sensitivity-output /tmp/phase2-passenger-gjt-v2/sensitivity.csv \
            --validation /tmp/phase2-passenger-gjt-v2/validation.json
          python scripts/phase2_build_s8_work_direction_weights_v2.py \
            --journeys /tmp/phase2-passenger-gjt-v2/journey.csv \
            --s8-events outputs/phase2/s8_events.csv \
            --station-municipalities outputs/phase2/s8_station_municipalities.csv \
            --s8-contract outputs/phase2/s8_interchange_contract.json \
            --gtfs-zip data/raw/gtfs/rail_trenord/trenord_gtfs.zip \
            --output /tmp/phase2-passenger-gjt-v2/directions.csv \
            --summary /tmp/phase2-passenger-gjt-v2/direction-summary.csv \
            --validation /tmp/phase2-passenger-gjt-v2/direction-validation.json
          python scripts/phase2_build_s8_passenger_support_mask_v2.py \
            --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json \
            --routes outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv \
            --scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz \
            --route-output /tmp/phase2-passenger-gjt-v2/route-support.csv \
            --scenario-output /tmp/phase2-passenger-gjt-v2/scenario-support.csv.gz \
            --validation /tmp/phase2-passenger-gjt-v2/support-validation.json
          python scripts/phase2_build_s8_transfer_gap_envelope_v2.py \
            --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json \
            --support-validation outputs/phase2/passenger_gjt_v2/s8_passenger_support_mask_v2_validation.json \
            --route-support outputs/phase2/passenger_gjt_v2/s8_route_passenger_support_v2.csv \
            --s8-events outputs/phase2/s8_events.csv \
            --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv \
            --work-direction-summary outputs/phase2/passenger_gjt_v2/s8_work_direction_summary_v2.csv \
            --output /tmp/phase2-passenger-gjt-v2/transfer-gap.csv.gz \
            --validation /tmp/phase2-passenger-gjt-v2/transfer-gap-validation.json
          cmp outputs/phase2/passenger_gjt_v2/empirical_journey_universe_v2.csv /tmp/phase2-passenger-gjt-v2/journey.csv
          cmp outputs/phase2/passenger_gjt_v2/behavioural_sensitivity_grid_v2.csv /tmp/phase2-passenger-gjt-v2/sensitivity.csv
          cmp outputs/phase2/passenger_gjt_v2/passenger_journey_universe_v2_validation.json /tmp/phase2-passenger-gjt-v2/validation.json
          cmp outputs/phase2/passenger_gjt_v2/s8_work_direction_weights_v2.csv /tmp/phase2-passenger-gjt-v2/directions.csv
          cmp outputs/phase2/passenger_gjt_v2/s8_work_direction_summary_v2.csv /tmp/phase2-passenger-gjt-v2/direction-summary.csv
          cmp outputs/phase2/passenger_gjt_v2/s8_route_passenger_support_v2.csv /tmp/phase2-passenger-gjt-v2/route-support.csv
          cmp outputs/phase2/passenger_gjt_v2/s8_scenario_passenger_support_v2.csv.gz /tmp/phase2-passenger-gjt-v2/scenario-support.csv.gz
          cmp outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2.csv.gz /tmp/phase2-passenger-gjt-v2/transfer-gap.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/phase2/passenger_gjt_v2/s8_work_direction_weights_v2_validation.json').read_text())
          b=json.loads(Path('/tmp/phase2-passenger-gjt-v2/direction-validation.json').read_text())
          for p in (a,b):
              p['lineage'].pop('journeys_sha256')
              p['lineage'].pop('output_sha256')
              p['lineage'].pop('summary_sha256')
          assert a==b
          a=json.loads(Path('outputs/phase2/passenger_gjt_v2/s8_passenger_support_mask_v2_validation.json').read_text())
          b=json.loads(Path('/tmp/phase2-passenger-gjt-v2/support-validation.json').read_text())
          for p in (a,b):
              p['lineage']['route_support_output']=None
              p['lineage']['scenario_support_output']=None
          assert a==b
          a=json.loads(Path('outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2_validation.json').read_text())
          b=json.loads(Path('/tmp/phase2-passenger-gjt-v2/transfer-gap-validation.json').read_text())
          for p in (a,b):
              p['lineage']['output']=None
          assert a==b
          PY

      - name: Guard Passenger GJT epistemic separation
        run: |
          FILES="config/phase2_passenger_gjt_sensitivity_v2.json src/phase2_passenger_gjt_v2.py src/phase2_s8_destination_direction_v2.py src/phase2_s8_work_transfer_utility_v2.py src/phase2_s8_passenger_support_mask_v2.py scripts/phase2_build_passenger_journey_universe_v2.py scripts/phase2_build_s8_work_direction_weights_v2.py scripts/phase2_build_s8_passenger_support_mask_v2.py src/phase2_s8_transfer_gap_envelope_v2.py scripts/phase2_build_s8_transfer_gap_envelope_v2.py"
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -n -E 'S8_DIRECT_is_modal_share[^f]*true|population_proportional_worker_allocation_performed[^f]*true|nearest_stop_imputation_performed[^f]*true|full_gjt_ready[^f]*true' $FILES
          ! grep -n -E 'passenger_demand_assigned_to_routes[^f]*true|passenger_demand_assigned_to_route[^f]*true|topology_ranked[^f]*true|service_policy_selected[^f]*true' $FILES
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check origin/phase2-access-equity-v2...HEAD

      - name: Persist validated Passenger GJT V2 universe
        run: |
          git config user.name "phase2-passenger-gjt-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/passenger_gjt_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist audited Passenger GJT V2 universe [skip ci]"
            git push origin HEAD:phase2-passenger-gjt-v2
          fi

      - name: Upload Passenger GJT V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-passenger-gjt-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/passenger_gjt_v2
