name: RT031 municipal tradeoff anatomy V4
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_audit_rt031_municipal_tradeoffs_v4.py
      - tests/test_phase2_rt031_municipal_tradeoffs_v4.py
      - .github/workflows/phase2-rt031-municipal-tradeoffs-v4.yml
permissions:
  contents: read
  actions: read
jobs:
  tradeoff-anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_phase2_rt031_municipal_tradeoffs_v4.py -q
      - name: Acquire pinned municipal frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/frontier
          gh api repos/${{ github.repository }}/actions/artifacts/10416805424/zip > /tmp/frontier.zip
          echo 'd4726e765501c52944428111c43c34eb010b37667b62c96f5f09d8c48dec1d52  /tmp/frontier.zip' | sha256sum -c
          unzip -q /tmp/frontier.zip -d /tmp/frontier
          echo '0757d9513e21e1e68a7fc43c1732b45c4ccd83242e84d20ea8a324d0866bca26  /tmp/frontier/rt031_municipal_access_frontier_v4.json' | sha256sum -c
      - name: Reproduce exact baseline comparisons twice
        run: |
          for out in /tmp/audit-a /tmp/audit-b; do
            python scripts/phase2_audit_rt031_municipal_tradeoffs_v4.py \
              --frontier /tmp/frontier/rt031_municipal_access_frontier_v4.json \
              --output-dir "$out"
          done
          diff -r /tmp/audit-a /tmp/audit-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-municipal-tradeoff-anatomy-v4
          path: /tmp/audit-a/
          if-no-files-found: error
