name: Phase 2 Alternative Corridor Generator V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-efficient-alternative-corridors-v3
    paths:
      - src/phase2_alternative_corridor_generator_v3.py
      - tests/test_phase2_alternative_corridor_generator_v3.py
      - scripts/phase2_audit_alternative_corridor_generator_v3.py
      - docs/PHASE2_ALTERNATIVE_CORRIDOR_GENERATOR_V3.md
      - .github/workflows/phase2-alternative-corridor-generator-v3.yml
      - src/phase2_frozen_graph.py
      - outputs/phase2/frozen_gate_d/**

permissions:
  contents: write

concurrency:
  group: phase2-alternative-corridor-generator-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase2-efficient-alternative-corridors-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned routing dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pandas==2.2.3 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1 \
            pytest==8.3.5

      - name: Compile bounded alternative generator
        run: |
          python -m py_compile src/phase2_alternative_corridor_generator_v3.py
          python -m py_compile scripts/phase2_audit_alternative_corridor_generator_v3.py

      - name: Run focused alternative-router tests
        run: pytest -q tests/test_phase2_alternative_corridor_generator_v3.py

      - name: Revalidate frozen Gate-D routing contract
        run: pytest -q tests/test_phase2_frozen_graph.py

      - name: Run frozen Gate-D real-graph audit
        run: |
          python scripts/phase2_audit_alternative_corridor_generator_v3.py \
            --fixture-count 5 \
            --max-alternatives 3 \
            --max-generation-rounds 10 \
            --penalty-increment 0.20 \
            --max-runtime-factor 1.50 \
            --max-overlap 0.90

      - name: Validate V3 routing and epistemic contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('outputs/phase2/network_design_method_audit_v3/alternative_corridor_generator_v3/alternative_corridor_generator_v3_validation.json')
          validation = json.loads(path.read_text(encoding='utf-8'))
          assert validation['status'] == 'PASS_ALTERNATIVE_CORRIDOR_GENERATOR_V3', validation
          assert validation['scope'] == 'ALGORITHM_AND_ROUTING_AUDIT_NOT_NETWORK_RECOMMENDATION'
          assert validation['baseline_exact_edge_sequence_all'] is True
          assert validation['real_graph_determinism_pass'] is True
          assert validation['fixture_count'] == 5
          assert validation['fixtures_passing'] == 5
          assert validation['stop_inventory_dependency'].startswith('NONE_FOR_THIS_AUDIT')
          assert validation['technical_parameters']['semantics'] == 'TECHNICAL_EXPLORATION_PARAMETERS_NOT_POLICY_WEIGHTS_OR_THRESHOLDS'
          forbidden = set(validation['claims_not_authorized'])
          for claim in ['OPTIMAL_NETWORK', 'RECOMMENDED_CORRIDOR', 'PRIMARY', 'RUNNER_UP']:
              assert claim in forbidden
          print(json.dumps(validation, indent=2, sort_keys=True))
          PY

      - name: Anti-random, anti-web and stop-workstream isolation guard
        run: |
          ! grep -nE 'np\.random|numpy\.random|random\.' \
            src/phase2_alternative_corridor_generator_v3.py \
            scripts/phase2_audit_alternative_corridor_generator_v3.py
          ! grep -niE 'requests|overpass-api|urllib|httpx|google maps|gemini' \
            src/phase2_alternative_corridor_generator_v3.py \
            scripts/phase2_audit_alternative_corridor_generator_v3.py
          ! grep -niE 'proposed_stop_candidates|passenger_stop_foundation|gpt-stop-source-completeness|C146|ASF' \
            src/phase2_alternative_corridor_generator_v3.py \
            scripts/phase2_audit_alternative_corridor_generator_v3.py

      - name: Whitespace check
        run: git diff --check

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-alternative-corridor-generator-v3
          path: outputs/phase2/network_design_method_audit_v3/alternative_corridor_generator_v3/
          if-no-files-found: error
          retention-days: 90

      - name: Persist audited generator evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/phase2/network_design_method_audit_v3/alternative_corridor_generator_v3/
          if git diff --cached --quiet; then
            echo 'No alternative-corridor evidence changes to persist.'
          else
            git commit -m 'audit: persist bounded alternative corridor V3 evidence [skip ci]'
            git push origin HEAD:phase2-efficient-alternative-corridors-v3
          fi
