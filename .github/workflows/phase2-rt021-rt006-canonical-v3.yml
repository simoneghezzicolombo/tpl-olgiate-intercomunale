name: RT-021 certified RT-006 canonical corpus V3

on:
  push:
    branches: [rt021-frozen-territorial-corridor-corpus-v3]
    paths:
      - .github/workflows/phase2-rt021-rt006-canonical-v3.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: rt021-certified-rt006-canonical-v3
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  build-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 networkx==3.6.1 scipy==1.17.0 pyproj==3.7.2 \
            geopandas==1.1.4 shapely==2.1.2 pyogrio==0.13.0 requests==2.34.2 \
            pytest==8.3.5

      - name: Compile certified RT-006 execution chain
        run: |
          python -m py_compile src/phase2_rt021_bounded_corpus_v3.py
          python -m py_compile src/phase2_rt021_validated_grid_corpus_v3.py
          python -m py_compile src/phase2_rt021_parallel_driver_v3.py
          python -m py_compile scripts/phase2_rt021_frozen_territorial_corridor_corpus_v3.py
          python -m py_compile scripts/phase2_rt021_canonical_handoff_v3.py

      - name: Verify frozen dependencies
        run: |
          test "$(git hash-object src/phase2_final_stop_materialization_v3.py)" = "6249ca6df9e1bdc6916825135669e7724457e5b2"
          STOP=outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv
          test "$(git hash-object "$STOP")" = "8d3a4368a6f62bbdf8fe18ee99482aff18e38fe5"
          test "$(($(wc -l < "$STOP") - 1))" -eq 36

      - name: Run inherited RT-006 grid parallel and handoff tests
        run: |
          python -m pytest -q \
            tests/test_phase2_complete_directed_pairs_v3.py \
            tests/test_phase2_rt021_territorial_corridor_corpus_v3.py \
            tests/test_phase2_rt021_validated_grid_corpus_v3.py \
            tests/test_phase2_rt021_parallel_driver_v3.py \
            tests/test_phase2_rt021_canonical_handoff_v3.py

      - name: Reject synthetic geographic bias and prohibited decisions
        run: |
          if grep -n -E 'np\.random|numpy\.random|import random|from random|allowed_municip|denied_municip|whitelist.*municip|blacklist.*municip|Circolare Meratese|Cassina' \
            src/phase2_rt021_bounded_corpus_v3.py \
            src/phase2_rt021_validated_grid_corpus_v3.py \
            src/phase2_rt021_parallel_driver_v3.py \
            scripts/phase2_rt021_frozen_territorial_corridor_corpus_v3.py \
            scripts/phase2_rt021_canonical_handoff_v3.py; then
            echo 'Forbidden RT-021 semantic found'
            exit 1
          fi
          git diff --check

      - name: Download and verify pinned certified RT-017 graph artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/rt017_source /tmp/rt017_source.zip
          mkdir -p /tmp/rt017_source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9972204236" \
            -o /tmp/rt017_artifact_metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path('/tmp/rt017_artifact_metadata.json').read_text())
          assert meta['id']==9972204236
          assert meta['digest']=='sha256:e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225'
          assert meta['workflow_run']['id']==33975545284
          assert meta['workflow_run']['head_sha']=='512a055f415c7e34c3a5c40c8463f6a6bf51148d'
          PY
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9972204236/zip" \
            -o /tmp/rt017_source.zip
          unzip -q /tmp/rt017_source.zip -d /tmp/rt017_source
          python - <<'PY'
          from pathlib import Path
          hits=list(Path('/tmp/rt017_source').rglob('frozen_routing_envelope_metadata_v3.json'))
          assert len(hits)==1, hits
          Path('/tmp/rt017_dir').write_text(str(hits[0].parent))
          PY
          echo "RT017_DIR=$(cat /tmp/rt017_dir)" >> "$GITHUB_ENV"

      - name: Build real RT-006 corpus first replay
        run: |
          rm -rf outputs/phase2/rt021 outputs/phase2/rt021_repeat
          python scripts/phase2_rt021_frozen_territorial_corridor_corpus_v3.py \
            --rt017-dir "$RT017_DIR" \
            --output-dir outputs/phase2/rt021 \
            --k 3 --max-raw-state-paths 20000
          python scripts/phase2_rt021_canonical_handoff_v3.py \
            --output-dir outputs/phase2/rt021

      - name: Build independent real RT-006 corpus replay
        run: |
          python scripts/phase2_rt021_frozen_territorial_corridor_corpus_v3.py \
            --rt017-dir "$RT017_DIR" \
            --output-dir outputs/phase2/rt021_repeat \
            --k 3 --max-raw-state-paths 20000
          python scripts/phase2_rt021_canonical_handoff_v3.py \
            --output-dir outputs/phase2/rt021_repeat

      - name: Assert deterministic canonical RT-021 acceptance
        run: |
          diff -qr outputs/phase2/rt021 outputs/phase2/rt021_repeat
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          import pandas as pd
          out=Path('outputs/phase2/rt021')
          v=json.loads((out/'rt021_validation_v3.json').read_text())
          assert v['status']=='PASS_RT021_FROZEN_TERRITORIAL_CORRIDOR_CORPUS_V3', v
          assert all(v['checks'].values()), v['checks']
          assert v['pair_universe']['directed_pair_count']==1190
          assert v['pair_universe']['complete_execution_count']==1190
          assert v['corridor_corpus']['generator']=='RT006_BOUNDED_DEFAULT_PLUS_VALIDATED_12_CONFIG_SENSITIVITY_UNION'
          assert v['corridor_corpus']['full_state_yen_production_used'] is False
          assert v['corridor_corpus']['sensitivity_grid']['configuration_count']==12
          assert v['corridor_corpus']['sensitivity_grid']['parameter_selection_authorized'] is False
          assert v['canonical_downstream_handoff']['status']=='PASS_CANONICAL_RT010_RT022_IDENTITY_HANDOFF'
          pairs=pd.read_csv(out/'rt021_pair_execution_status_v3.csv').fillna('')
          assert len(pairs)==1190 and pairs['pair_id'].nunique()==1190
          assert pairs['gate_d_route_found'].astype(bool).all()
          assert not pairs['source_routing_terminal_id'].astype(str).str.startswith('STOP_PLACE::').any()
          counts=pairs['corridor_count'].astype(int)
          assert ((counts>0) | pairs['failure_reason'].astype(str).ne('')).all()
          with gzip.open(out/'rt021_corridor_corpus_v3.csv.gz','rt',encoding='utf-8') as h:
              corridors=pd.read_csv(h)
          assert corridors['corridor_id'].nunique()==len(corridors)
          assert corridors['admissible_for_corridor_pool'].astype(bool).all()
          assert not corridors['source_routing_terminal_id'].astype(str).str.startswith('STOP_PLACE::').any()
          print(json.dumps({
              'pairs':len(pairs),
              'corridors':len(corridors),
              'explicit_failures':int((counts==0).sum()),
              'sensitivity_recovered':v['corridor_corpus'].get('pairs_recovered_by_sensitivity_union'),
              'graph_epoch_id':v['graph_epoch_id'],
          }, indent=2))
          PY

      - name: Upload certified canonical RT-021 handoff
        uses: actions/upload-artifact@v4
        with:
          name: phase2-rt021-certified-rt006-canonical-v3
          path: outputs/phase2/rt021/
          if-no-files-found: error
          retention-days: 90

      - name: Persist certified canonical RT-021 corpus
        run: |
          rm -rf outputs/phase2/rt021_repeat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/phase2/rt021/
          if git diff --cached --quiet; then
            echo 'Certified RT-021 output already persisted.'
          else
            git commit -m 'data(rt021): persist certified canonical RT-006 corpus'
            git push origin HEAD:rt021-frozen-territorial-corridor-corpus-v3
          fi
