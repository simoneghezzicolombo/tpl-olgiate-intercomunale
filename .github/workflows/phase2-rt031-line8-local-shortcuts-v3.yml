name: RT031 Linea 8 local shortcuts V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_audit_rt031_line8_local_shortcuts_v3.py
      - scripts/phase2_audit_rt031_line8_local_shortcuts_walk_v3.py
      - scripts/phase2_export_rt031_line8_west_swap_v3.py
      - scripts/phase2_audit_rt031_line8_east_tail_orders_v3.py
      - scripts/phase2_audit_rt031_line8_west_orders_v3.py
      - scripts/phase2_audit_rt031_line8_distance_objective_v3.py
      - scripts/phase2_audit_rt031_line8_waypoint_lower_bound_v3.py
      - scripts/phase2_audit_rt031_line8_distance_walk_v3.py
      - scripts/phase2_render_rt031_line8_distance_option_v3.py
      - scripts/phase2_audit_rt031_south_road_probe_v3.py
      - scripts/phase2_probe_rt031_unique_line_v3.py
      - scripts/phase2_audit_rt031_via_como_proximity_v3.py
      - tests/test_phase2_rt031_line8_local_shortcuts_v3.py
      - tests/test_phase2_rt031_line8_distance_objective_v3.py
      - outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/walk.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/west_swap.geojson
      - outputs/phase2/rt031_line8_local_shortcuts_v3/east_tail_orders.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/west_group_orders.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/distance_objective_audit.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/waypoint_lower_bound.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/distance_option.geojson
      - outputs/phase2/rt031_line8_local_shortcuts_v3/distance_option.png
      - outputs/phase2/rt031_line8_local_shortcuts_v3/distance_option_walk.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/west_full_retention.geojson
      - outputs/phase2/rt031_line8_local_shortcuts_v3/via_como_proximity.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/via_como_proximity.geojson
      - .github/workflows/phase2-rt031-line8-local-shortcuts-v3.yml
  pull_request:
    paths:
      - scripts/phase2_audit_rt031_line8_local_shortcuts_v3.py
      - scripts/phase2_audit_rt031_line8_local_shortcuts_walk_v3.py
      - scripts/phase2_export_rt031_line8_west_swap_v3.py
      - scripts/phase2_audit_rt031_line8_east_tail_orders_v3.py
      - scripts/phase2_audit_rt031_line8_west_orders_v3.py
      - scripts/phase2_audit_rt031_line8_distance_objective_v3.py
      - scripts/phase2_audit_rt031_line8_waypoint_lower_bound_v3.py
      - scripts/phase2_audit_rt031_line8_distance_walk_v3.py
      - scripts/phase2_render_rt031_line8_distance_option_v3.py
      - scripts/phase2_audit_rt031_south_road_probe_v3.py
      - scripts/phase2_probe_rt031_unique_line_v3.py
      - scripts/phase2_audit_rt031_via_como_proximity_v3.py
      - tests/test_phase2_rt031_line8_local_shortcuts_v3.py
      - tests/test_phase2_rt031_line8_distance_objective_v3.py
      - outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/walk.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/west_swap.geojson
      - outputs/phase2/rt031_line8_local_shortcuts_v3/east_tail_orders.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/west_group_orders.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/distance_objective_audit.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/waypoint_lower_bound.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/distance_option.geojson
      - outputs/phase2/rt031_line8_local_shortcuts_v3/distance_option.png
      - outputs/phase2/rt031_line8_local_shortcuts_v3/distance_option_walk.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/west_full_retention.geojson
      - outputs/phase2/rt031_line8_local_shortcuts_v3/via_como_proximity.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/via_como_proximity.geojson
      - .github/workflows/phase2-rt031-line8-local-shortcuts-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<4' 'scipy>=1.13,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'matplotlib>=3.8,<4'
      - name: Test committed bounded audit
        run: |
          python -m unittest discover -s tests -p test_phase2_rt031_line8_local_shortcuts_v3.py
          python -m unittest discover -s tests -p test_phase2_rt031_line8_distance_objective_v3.py
      - name: Verify and fetch pinned road and pedestrian evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          test "$(gh api "repos/$REPO/actions/artifacts/9972204236" --jq .digest)" = 'sha256:e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225'
          test "$(gh api "repos/$REPO/actions/artifacts/9988386073" --jq .digest)" = 'sha256:1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7'
          test "$(gh api "repos/$REPO/actions/artifacts/10023387513" --jq .digest)" = 'sha256:1603606d02a170567c1d423b7689b7044933fff6490caeaf848ae0ca0f2d77d0'
          test "$(gh api "repos/$REPO/actions/artifacts/9991182904" --jq .digest)" = 'sha256:e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28'
          gh run download 33975545284 -n rt017-final-certified-evidence-v3 -D /tmp/rt031/rt017
          gh run download 34030321683 -n phase2-rt022-minimum-backbones-v3-real -D /tmp/rt031/rt022
          gh run download 34134177590 -n rt031-successor-via-way-relevance-v3 -D /tmp/rt031/successor
          gh run download 34039162932 -n rt028-final-stop-pedestrian-accessibility-substrate-v3 -D /tmp/rt031/rt028
      - name: Reproduce bounded road audit and geometry byte for byte
        run: |
          set -euo pipefail
          python -m scripts.phase2_audit_rt031_line8_local_shortcuts_v3 \
            --edges /tmp/rt031/rt017/frozen_graph_edges.csv.gz \
            --nodes /tmp/rt031/rt017/frozen_graph_nodes.csv.gz \
            --rules /tmp/rt031/rt017/frozen_turn_rules.csv.gz \
            --attachments /tmp/rt031/rt022/stop_attachments.csv \
            --successor /tmp/rt031/successor/rt031-successor-via-way-relevance.json \
            --candidates_normalized_newlines outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --anchor data/phase2/frozen_gate_d/source/structural_anchor_evidence.csv \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --repair outputs/phase2/rt031_current_stop_repair_v3/road_options.json \
            --output /tmp/rt031/shortcuts.json
          cmp /tmp/rt031/shortcuts.json outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json
          python -m scripts.phase2_export_rt031_line8_west_swap_v3 \
            --edges /tmp/rt031/rt017/frozen_graph_edges.csv.gz \
            --nodes /tmp/rt031/rt017/frozen_graph_nodes.csv.gz \
            --rules /tmp/rt031/rt017/frozen_turn_rules.csv.gz \
            --attachments /tmp/rt031/rt022/stop_attachments.csv \
            --successor /tmp/rt031/successor/rt031-successor-via-way-relevance.json \
            --candidates_normalized_newlines outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --audit outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json \
            --output /tmp/rt031/west-swap.geojson
          cmp /tmp/rt031/west-swap.geojson outputs/phase2/rt031_line8_local_shortcuts_v3/west_swap.geojson
          python -m scripts.phase2_audit_rt031_line8_east_tail_orders_v3 \
            --edges /tmp/rt031/rt017/frozen_graph_edges.csv.gz \
            --nodes /tmp/rt031/rt017/frozen_graph_nodes.csv.gz \
            --rules /tmp/rt031/rt017/frozen_turn_rules.csv.gz \
            --attachments /tmp/rt031/rt022/stop_attachments.csv \
            --successor /tmp/rt031/successor/rt031-successor-via-way-relevance.json \
            --candidates_normalized_newlines outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --anchor data/phase2/frozen_gate_d/source/structural_anchor_evidence.csv \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --local_audit outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json \
            --output /tmp/rt031/east-tail-orders.json
          cmp /tmp/rt031/east-tail-orders.json outputs/phase2/rt031_line8_local_shortcuts_v3/east_tail_orders.json
          python -m scripts.phase2_audit_rt031_line8_west_orders_v3 \
            --edges /tmp/rt031/rt017/frozen_graph_edges.csv.gz \
            --nodes /tmp/rt031/rt017/frozen_graph_nodes.csv.gz \
            --rules /tmp/rt031/rt017/frozen_turn_rules.csv.gz \
            --attachments /tmp/rt031/rt022/stop_attachments.csv \
            --successor /tmp/rt031/successor/rt031-successor-via-way-relevance.json \
            --candidates_normalized_newlines outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --anchor data/phase2/frozen_gate_d/source/structural_anchor_evidence.csv \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --local_audit outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json \
            --output /tmp/rt031/west-group-orders.json
          cmp /tmp/rt031/west-group-orders.json outputs/phase2/rt031_line8_local_shortcuts_v3/west_group_orders.json
          python -m scripts.phase2_audit_rt031_line8_distance_objective_v3 \
            --edges /tmp/rt031/rt017/frozen_graph_edges.csv.gz \
            --nodes /tmp/rt031/rt017/frozen_graph_nodes.csv.gz \
            --rules /tmp/rt031/rt017/frozen_turn_rules.csv.gz \
            --attachments /tmp/rt031/rt022/stop_attachments.csv \
            --successor /tmp/rt031/successor/rt031-successor-via-way-relevance.json \
            --candidates_normalized_newlines outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --west_orders outputs/phase2/rt031_line8_local_shortcuts_v3/west_group_orders.json \
            --output /tmp/rt031/distance-objective.json
          cmp /tmp/rt031/distance-objective.json outputs/phase2/rt031_line8_local_shortcuts_v3/distance_objective_audit.json
          python -m scripts.phase2_audit_rt031_line8_waypoint_lower_bound_v3 \
            --edges /tmp/rt031/rt017/frozen_graph_edges.csv.gz \
            --nodes /tmp/rt031/rt017/frozen_graph_nodes.csv.gz \
            --rules /tmp/rt031/rt017/frozen_turn_rules.csv.gz \
            --attachments /tmp/rt031/rt022/stop_attachments.csv \
            --successor /tmp/rt031/successor/rt031-successor-via-way-relevance.json \
            --candidates_normalized_newlines outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --output /tmp/rt031/waypoint-lower-bound.json
          cmp /tmp/rt031/waypoint-lower-bound.json outputs/phase2/rt031_line8_local_shortcuts_v3/waypoint_lower_bound.json
          python -m scripts.phase2_render_rt031_line8_distance_option_v3 \
            --edges /tmp/rt031/rt017/frozen_graph_edges.csv.gz \
            --nodes /tmp/rt031/rt017/frozen_graph_nodes.csv.gz \
            --rules /tmp/rt031/rt017/frozen_turn_rules.csv.gz \
            --attachments /tmp/rt031/rt022/stop_attachments.csv \
            --successor /tmp/rt031/successor/rt031-successor-via-way-relevance.json \
            --candidates_normalized_newlines outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --audit outputs/phase2/rt031_line8_local_shortcuts_v3/distance_objective_audit.json \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --roads data/raw/osm/osm_highways_core.geojson \
            --geojson_output /tmp/rt031/distance-option.geojson \
            --image_output /tmp/rt031/distance-option.png
          cmp /tmp/rt031/distance-option.geojson outputs/phase2/rt031_line8_local_shortcuts_v3/distance_option.geojson
          python -m scripts.phase2_export_rt031_line8_west_swap_v3 \
            --edges /tmp/rt031/rt017/frozen_graph_edges.csv.gz \
            --nodes /tmp/rt031/rt017/frozen_graph_nodes.csv.gz \
            --rules /tmp/rt031/rt017/frozen_turn_rules.csv.gz \
            --attachments /tmp/rt031/rt022/stop_attachments.csv \
            --successor /tmp/rt031/successor/rt031-successor-via-way-relevance.json \
            --candidates_normalized_newlines outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --audit outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json \
            --west-orders outputs/phase2/rt031_line8_local_shortcuts_v3/west_group_orders.json \
            --output /tmp/rt031/west-full-retention.geojson
          cmp /tmp/rt031/west-full-retention.geojson outputs/phase2/rt031_line8_local_shortcuts_v3/west_full_retention.geojson
          python -m scripts.phase2_audit_rt031_via_como_proximity_v3 \
            --baseline outputs/phase2/rt031_line8_inclusive_shape_v3/line8_inclusive_model.geojson \
            --swap outputs/phase2/rt031_line8_local_shortcuts_v3/west_swap.geojson \
            --road-audit outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json \
            --output /tmp/rt031/via-como-proximity.json \
            --geojson-output /tmp/rt031/via-como-proximity.geojson
          cmp /tmp/rt031/via-como-proximity.json outputs/phase2/rt031_line8_local_shortcuts_v3/via_como_proximity.json
          cmp /tmp/rt031/via-como-proximity.geojson outputs/phase2/rt031_line8_local_shortcuts_v3/via_como_proximity.geojson
      - name: Reproduce conditional walking-access audit byte for byte
        run: |
          set -euo pipefail
          python -m scripts.phase2_audit_rt031_line8_local_shortcuts_walk_v3 \
            --matrix /tmp/rt031/rt028/output/rt028_population_unit_stop_walk_matrix_v3.csv \
            --pedestrian_osm /tmp/rt031/rt028/input/rt028_osm_pedestrian_snapshot_v3.osm \
            --candidates_normalized outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --shortcuts outputs/phase2/rt031_line8_local_shortcuts_v3/audit.json \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --prior_access outputs/phase2/rt031_unique_line_walk_access_v3/access.json \
            --output /tmp/rt031/walk.json
          cmp /tmp/rt031/walk.json outputs/phase2/rt031_line8_local_shortcuts_v3/walk.json
          python -m scripts.phase2_audit_rt031_line8_distance_walk_v3 \
            --matrix /tmp/rt031/rt028/output/rt028_population_unit_stop_walk_matrix_v3.csv \
            --pedestrian_osm /tmp/rt031/rt028/input/rt028_osm_pedestrian_snapshot_v3.osm \
            --candidates_normalized outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv \
            --distance_audit outputs/phase2/rt031_line8_local_shortcuts_v3/distance_objective_audit.json \
            --road_screen outputs/phase2/rt031_unique_line_road_screen_v3/screen.json \
            --prior_access outputs/phase2/rt031_unique_line_walk_access_v3/access.json \
            --output /tmp/rt031/distance-option-walk.json
          cmp /tmp/rt031/distance-option-walk.json outputs/phase2/rt031_line8_local_shortcuts_v3/distance_option_walk.json
