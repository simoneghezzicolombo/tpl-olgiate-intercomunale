name: Phase 2 RT-031 Safe Pareto Cycle Bound V3

on:
  workflow_dispatch:
  push:
    branches:
      - rt031-pareto-cycle-bound-v3
    paths:
      - "src/phase2_rt031_pareto_cycle_bound_v3.py"
      - "scripts/phase2_run_rt031_pareto_cycle_bound_v3.py"
      - "tests/test_phase2_rt031_pareto_cycle_bound_v3.py"
      - ".github/workflows/phase2-rt031-pareto-cycle-bound-v3.yml"

permissions:
  contents: read
  actions: read

jobs:
  safe-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      RT022_RUN_ID: "34030321683"
      RT022_ARTIFACT_DIGEST: "sha256:1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7"
      RT023_RUN_ID: "34034770563"
      RT023_ARTIFACT_DIGEST: "sha256:d206af90c247f87940f51db17e5497183199cceb9070e84124c0ef3b5ddba981"
      RT030_RUN_ID: "34043902080"
      RT030_ARTIFACT_DIGEST: "sha256:350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564"
      LINKS_SHA256: "3c773163e1ffa792a72c0bda9ccd699b5be6666e01c9179a775f267baf97557a"
      REALIZATIONS_SHA256: "a33b24664f9cd416f16989c7a66a668a3e90a83244dd3662cac735751532adc5"
      PATTERNS_SHA256: "44fd5d95717ea99d8bee205fa1949c978b44074af4134420ac59bc8a0769684e"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run adversarial tests
        run: python -m pytest -q tests/test_phase2_rt031_pareto_cycle_bound_v3.py
      - name: Verify upstream run identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT022_RUN_ID}" --jq '.head_sha')" = "157badd6fc4aeaed4dcf19b08e37a48626b31b35"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT023_RUN_ID}" --jq '.head_sha')" = "0d9a82caa1d1d624e0f6945e709f3548785fb8dc"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT030_RUN_ID}" --jq '.head_sha')" = "37873b8a8c693234603281283eec8ad88802fb7f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT022_RUN_ID}/artifacts" --jq '.artifacts[0].digest')" = "${RT022_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT023_RUN_ID}/artifacts" --jq '.artifacts[0].digest')" = "${RT023_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT030_RUN_ID}/artifacts" --jq '.artifacts[0].digest')" = "${RT030_ARTIFACT_DIGEST}"
      - name: Download RT-022
        uses: actions/download-artifact@v4
        with:
          name: phase2-rt022-minimum-backbones-v3-real
          path: _upstream/rt022
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34030321683
      - name: Download RT-023
        uses: actions/download-artifact@v4
        with:
          name: rt023-service-pattern-realization-v3
          path: _upstream/rt023
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34034770563
      - name: Download RT-030
        uses: actions/download-artifact@v4
        with:
          name: rt030-passenger-stop-realization-v3
          path: _upstream/rt030
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34043902080
      - name: Resolve exact inputs
        run: |
          set -euo pipefail
          LINKS="$(find _upstream/rt022 -name reciprocal_structural_links.csv -print -quit)"
          REALIZATIONS="$(find _upstream/rt023 -name link_realization_catalog.csv -print -quit)"
          PATTERNS="$(find _upstream/rt030 -name rt030_realization_passenger_stop_patterns.csv -print -quit)"
          test "$(sha256sum "${LINKS}" | awk '{print $1}')" = "${LINKS_SHA256}"
          test "$(sha256sum "${REALIZATIONS}" | awk '{print $1}')" = "${REALIZATIONS_SHA256}"
          test "$(sha256sum "${PATTERNS}" | awk '{print $1}')" = "${PATTERNS_SHA256}"
          echo "LINKS=${LINKS}" >> "${GITHUB_ENV}"
          echo "REALIZATIONS=${REALIZATIONS}" >> "${GITHUB_ENV}"
          echo "PATTERNS=${PATTERNS}" >> "${GITHUB_ENV}"
      - name: Build A
        run: |
          rm -rf outputs/phase2/rt031_cycle_bound_v3_a
          python scripts/phase2_run_rt031_pareto_cycle_bound_v3.py --links "${LINKS}" --patterns "${PATTERNS}" --realizations "${REALIZATIONS}" --outdir outputs/phase2/rt031_cycle_bound_v3_a
      - name: Build B
        run: |
          rm -rf outputs/phase2/rt031_cycle_bound_v3_b
          python scripts/phase2_run_rt031_pareto_cycle_bound_v3.py --links "${LINKS}" --patterns "${PATTERNS}" --realizations "${REALIZATIONS}" --outdir outputs/phase2/rt031_cycle_bound_v3_b
      - name: Enforce deterministic safe-bound contract
        run: |
          set -euo pipefail
          cmp outputs/phase2/rt031_cycle_bound_v3_a/rt031_edge_guaranteed_interior_stop_evidence.csv outputs/phase2/rt031_cycle_bound_v3_b/rt031_edge_guaranteed_interior_stop_evidence.csv
          cmp outputs/phase2/rt031_cycle_bound_v3_a/rt031_safe_pareto_cycle_bound_audit.json outputs/phase2/rt031_cycle_bound_v3_b/rt031_safe_pareto_cycle_bound_audit.json
          python - <<'PY'
          import json
          a=json.load(open('outputs/phase2/rt031_cycle_bound_v3_a/rt031_safe_pareto_cycle_bound_audit.json'))
          assert a['status']=='PASS_SAFE_PARETO_CYCLE_RANK_BOUND_DIAGNOSTIC_NOT_SEARCH_PASS'
          assert a['global_guaranteed_interior_stop_ids']==['ASF::CALCO_LARGO_POMEA','ASF::OLGIATE_MOLGORA_SCARPONE']
          assert a['safe_pareto_cycle_rank_upper_bound']==2
          assert a['safe_pareto_elementary_edge_upper_bound']==36
          assert a['strictly_positive_lower_envelope_burden_all_links'] is True
          assert all(v is False for v in a['negative_assertions'].values())
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rt031-safe-pareto-cycle-bound-v3
          path: outputs/phase2/rt031_cycle_bound_v3_a
          if-no-files-found: error
          retention-days: 90
