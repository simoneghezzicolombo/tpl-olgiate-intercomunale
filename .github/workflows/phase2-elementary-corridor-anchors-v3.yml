name: Phase 2 Elementary Corridor Anchors V3

on:
  push:
    branches:
      - phase2-elementary-corridor-anchors-v3
    paths:
      - src/phase2_elementary_corridor_reduction_v3.py
      - scripts/phase2_audit_elementary_corridor_reduction_v3.py
      - tests/test_phase2_elementary_corridor_reduction_v3.py
      - docs/PHASE2_ELEMENTARY_CORRIDOR_REDUCTION_V3.md
      - .github/workflows/phase2-elementary-corridor-anchors-v3.yml
  pull_request:
    branches:
      - phase2-final-stop-materialization-v3
    paths:
      - src/phase2_elementary_corridor_reduction_v3.py
      - scripts/phase2_audit_elementary_corridor_reduction_v3.py
      - tests/test_phase2_elementary_corridor_reduction_v3.py
      - docs/PHASE2_ELEMENTARY_CORRIDOR_REDUCTION_V3.md
      - .github/workflows/phase2-elementary-corridor-anchors-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 \
            pytest==8.3.5

      - name: Compile RT-019
        run: |
          python -m py_compile src/phase2_elementary_corridor_reduction_v3.py
          python -m py_compile scripts/phase2_audit_elementary_corridor_reduction_v3.py

      - name: Run focused tests
        run: pytest -q tests/test_phase2_elementary_corridor_reduction_v3.py

      - name: Audit current RT-018 compatibility evidence
        run: python scripts/phase2_audit_elementary_corridor_reduction_v3.py

      - name: Validate audit contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/elementary_corridor_reduction_v3/elementary_corridor_reduction_v3_validation.json')
          v = json.loads(p.read_text(encoding='utf-8'))
          assert v['status'] == 'PASS_RT019_TECHNICAL_PAIR_QUERY_ANCHORS_AND_ELEMENTARY_CORRIDOR_REDUCTION_V3', v
          assert all(v['checks'].values()), v['checks']
          assert v['counts']['final_stop_places'] == 36
          assert v['counts']['technical_pair_query_anchors'] == 35
          assert v['counts']['complete_directed_pair_requests'] == 1190
          assert v['counts']['unordered_pair_identities'] == 595
          assert v['territorial_status'] == 'BLOCKED_PENDING_RT017_PASS_CORRIDOR_CORPUS'
          assert v['guards']['service_terminus_or_capolinea_selected'] is False
          assert v['guards']['route_topology_selected'] is False
          assert v['guards']['rt017_rebind_required_before_territorial_use'] is True
          print(json.dumps(v, indent=2, sort_keys=True))
          PY

      - name: Deterministic audit rebuild
        run: |
          cp -r outputs/phase2/elementary_corridor_reduction_v3 /tmp/rt019-first
          rm -rf outputs/phase2/elementary_corridor_reduction_v3
          python scripts/phase2_audit_elementary_corridor_reduction_v3.py >/tmp/rt019-second.log
          diff -ru /tmp/rt019-first outputs/phase2/elementary_corridor_reduction_v3

      - name: Anti-bias and lineage guards
        run: |
          ! grep -nE 'np\.random|numpy\.random|import random|from random' src/phase2_elementary_corridor_reduction_v3.py scripts/phase2_audit_elementary_corridor_reduction_v3.py
          ! grep -nE 'Cassina|Circolare Meratese|PRIMARY|RUNNER-UP' src/phase2_elementary_corridor_reduction_v3.py scripts/phase2_audit_elementary_corridor_reduction_v3.py
          git diff --check

      - name: Upload RT-019 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-elementary-corridor-anchors-v3-validation
          path: outputs/phase2/elementary_corridor_reduction_v3/
          if-no-files-found: error
