name: RT031 successor via-way relevance V3
on:
  push:
    branches: [codex/rt031-typed-composition-gate]
    paths:
      - src/phase2_rt031_successor_via_way_relevance_v3.py
      - tests/test_phase2_rt031_successor_via_way_relevance_v3.py
      - scripts/phase2_audit_rt031_successor_via_way_relevance_v3.py
      - .github/workflows/phase2-rt031-successor-via-way-relevance-v3.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  successor-via-way-relevance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Unit tests
        env:
          PYTHONPATH: .:src
        run: python -m pytest tests/test_phase2_rt031_successor_via_way_relevance_v3.py -q
      - name: Download pinned RT017 RT022 RT030 evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/rt031-viaway/{rt017,rt022,rt030}
          gh api "/repos/${REPO}/actions/artifacts/9972204236/zip" > /tmp/rt017.zip
          gh api "/repos/${REPO}/actions/artifacts/9988386073/zip" > /tmp/rt022.zip
          gh api "/repos/${REPO}/actions/artifacts/9992507233/zip" > /tmp/rt030.zip
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-viaway/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-viaway/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-viaway/rt030
      - name: Replay historical successor restrictions and audit RT023 relevance
        env:
          PYTHONPATH: .
        run: |
          python scripts/phase2_audit_rt031_successor_via_way_relevance_v3.py \
            --inputs /tmp/rt031-viaway \
            --out /tmp/rt031-successor-via-way-relevance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rt031-successor-via-way-relevance-v3
          path: /tmp/rt031-successor-via-way-relevance.json
          if-no-files-found: warn
