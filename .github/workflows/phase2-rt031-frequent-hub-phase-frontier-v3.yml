name: RT031 frequent shortlist hub phase frontier V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_hub_phase_frontier_v3.py
      - scripts/phase2_build_rt031_frequent_hub_phase_frontier_v3.py
      - tests/test_phase2_rt031_hub_phase_frontier_v3.py
      - .github/workflows/phase2-rt031-frequent-hub-phase-frontier-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  exact-h30-phase-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_phase2_rt031_hub_phase_frontier_v3.py -q
      - name: Acquire pinned typed shortlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/typed
          gh api repos/${{ github.repository }}/actions/artifacts/10389064542/zip > /tmp/typed.zip
          echo '9bb4f4ebaebcb00bc0c51065fbc8eb604d0c8e0715b6e531d0a8f26396cf3c31  /tmp/typed.zip' | sha256sum -c
          unzip -q /tmp/typed.zip -d /tmp/typed
      - name: Build twice and compare every byte
        run: |
          typed=$(find /tmp/typed -name frequent_access_typed_shortlist_audit.json | head -1)
          for out in /tmp/phase-a /tmp/phase-b; do
            python scripts/phase2_build_rt031_frequent_hub_phase_frontier_v3.py \
              --typed-audit "$typed" \
              --s8-events outputs/phase2/s8_events.csv \
              --sensitivity config/phase2_s8_phasing_sensitivity_v2.json \
              --output-dir "$out"
          done
          diff -r /tmp/phase-a /tmp/phase-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-frequent-shortlist-hub-phase-frontier-v3
          path: /tmp/phase-a/
          if-no-files-found: error
