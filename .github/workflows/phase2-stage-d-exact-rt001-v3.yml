name: Phase 2 Stage D Exact Timetable RT001 V3

on:
  push:
    branches: [codex/phase2-stage-d-exact-rt001-v3]
    paths:
      - 'src/phase2_exact_timetable_optimizer_v2.py'
      - 'src/phase2_exact_timetable_contract_v2.py'
      - 'scripts/phase2_run_exact_timetable_integration_fix_v2.py'
      - 'scripts/phase2_run_stage_d_exact_rt001_v3.py'
      - 'tests/test_phase2_exact_timetable_optimizer_v2.py'
      - 'tests/test_phase2_exact_timetable_contract_v2.py'
      - 'tests/test_phase2_stage_d_exact_rt001_v3.py'
      - 'docs/PHASE2_STAGE_D_EXACT_TIMETABLE_RT001_V3.md'
      - '.github/workflows/phase2-stage-d-exact-rt001-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      OUTDIR: outputs/phase2/stage_d_exact_rt001_v3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile \
            src/phase2_exact_timetable_optimizer_v2.py \
            src/phase2_exact_timetable_contract_v2.py \
            scripts/phase2_run_exact_timetable_integration_fix_v2.py \
            scripts/phase2_run_stage_d_exact_rt001_v3.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Unit and semantic regression tests
        run: |
          python -m pytest -q \
            tests/test_phase2_exact_timetable_optimizer_v2.py \
            tests/test_phase2_exact_timetable_contract_v2.py \
            tests/test_phase2_stage_d_exact_rt001_v3.py
      - name: Full exhaustive exact build
        run: |
          mkdir -p "$OUTDIR"
          python scripts/phase2_run_stage_d_exact_rt001_v3.py \
            --timing-inputs outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_daily_timing_inputs_rt001_v3.csv.gz \
            --route-inputs outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_public_route_inputs_rt001_v3.csv \
            --manifest-validation outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_input_manifest_rt001_v3_validation.json \
            --passenger-frontier outputs/phase2/passenger_utility_frontier_rt001_v3/passenger_utility_frontier_rt001_v3.csv.gz \
            --passenger-validation outputs/phase2/passenger_utility_frontier_rt001_v3/passenger_utility_frontier_rt001_v3_validation.json \
            --budget-validation outputs/phase2/budget_lossless_policy_surface_v2/budget_lossless_policy_surface_v2_validation.json \
            --path-matrix outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix.csv \
            --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json \
            --s8-events outputs/phase2/s8_events.csv \
            --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json \
            --s8-sensitivity-config config/phase2_s8_phasing_sensitivity_v2.json \
            --context-output "$OUTDIR/exact_plan_context_results_rt001_v3.csv.gz" \
            --timetable-output "$OUTDIR/exact_selected_timetables_rt001_v3.csv" \
            --trip-output "$OUTDIR/exact_selected_trips_rt001_v3.csv.gz" \
            --validation "$OUTDIR/stage_d_exact_rt001_v3_validation.json"
      - name: Validate contract and exact budget semantics
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path

          out = Path('outputs/phase2/stage_d_exact_rt001_v3')
          manifest = json.loads(Path('outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_input_manifest_rt001_v3_validation.json').read_text())
          validation = json.loads((out/'stage_d_exact_rt001_v3_validation.json').read_text())
          assert manifest['status'] == 'PASS_PHASE2_STAGE_D_INPUT_MANIFEST_RT001_V3'
          assert validation['status'] == 'PASS_PHASE2_STAGE_D_EXACT_TIMETABLE_RT001_V3'
          assert validation['contract'] == 'PHASE2_BUDGET_LOSSLESS_EXHAUSTIVE_EXACT_CLOCKFACE_TIMETABLE_RT001_V3'
          assert validation['stage_d_daily_timing_input_count'] == manifest['stage_d_daily_timing_input_count']
          assert validation['stage_c_plan_context_count'] == manifest['passenger_plan_context_count_represented']
          assert validation['phase_vectors_evaluated_once'] == manifest['naive_joint_phase_vector_count_sum']
          assert validation['exhaustive_route_specific_phase_domain'] is True
          assert validation['approximate_or_heuristic_phase_search'] is False
          assert validation['exact_budget_hard_cap_reapplied_after_materialisation'] is True
          assert validation['budget_calendar_identity_preserved'] is True
          assert validation['s8_target_selection_semantics'] == 'MAX_CONTINUOUS_TRANSFER_QUALITY_OVER_FINITE_EXPLICIT_TARGET_EVENTS'
          assert validation['s8_target_localisation_is_exact_not_heuristic'] is True
          assert validation['exact_budget_hard_ineligible_context_count'] == 0
          for key in ('passenger_weighting_applied','topology_weighting_applied','worker_reference_used_for_phase_selection','decision_budget_selected','calendar_selected','recovery_selected','topology_ranked','primary_selected','runner_up_selected','weighted_composite_score','delay_stress_certified_as_robustness'):
              assert validation[key] is False, key

          with gzip.open(out/'exact_plan_context_results_rt001_v3.csv.gz','rt',encoding='utf-8',newline='') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == manifest['passenger_plan_context_count_represented']
          assert len({row['plan_context_id'] for row in rows}) == len(rows)
          some = [row for row in rows if row['upstream_exact_budget_phase_feasibility_class'] == 'SOME_PHASES_BUDGET_FEASIBLE']
          recovered = [row for row in rows if row['recovered_from_continuous_hard_filter'] == 'true']
          assert len(some) == validation['upstream_some_phases_budget_feasible_context_count']
          assert len(recovered) == validation['recovered_from_continuous_hard_filter_context_count']
          assert len(some) > 0
          assert len(recovered) > 0
          for row in rows:
              assert row['exact_budget_hard_eligible'] == 'true'
              assert row['selected_timetable_id']
              assert 0 < int(row['exact_budget_feasible_phase_vector_count']) <= int(row['phase_vectors_evaluated_once_for_daily_input'])
              assert float(row['exact_annual_bus_km']) <= float(row['budget_cap_annual_bus_km']) + 1e-6
          for row in recovered:
              assert float(row['continuous_annual_bus_km']) > float(row['budget_cap_annual_bus_km'])

          with gzip.open(out/'exact_selected_trips_rt001_v3.csv.gz','rt',encoding='utf-8',newline='') as handle:
              trips = list(csv.DictReader(handle))
          assert trips
          for row in trips:
              assert row['vehicle_id_recovery5']
              assert row['vehicle_id_recovery10']
              assert row['vehicle_id_recovery15']
          PY
      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/stage-d-rt001-v3 && mkdir -p /tmp/stage-d-rt001-v3
          python scripts/phase2_run_stage_d_exact_rt001_v3.py \
            --timing-inputs outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_daily_timing_inputs_rt001_v3.csv.gz \
            --route-inputs outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_public_route_inputs_rt001_v3.csv \
            --manifest-validation outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_input_manifest_rt001_v3_validation.json \
            --passenger-frontier outputs/phase2/passenger_utility_frontier_rt001_v3/passenger_utility_frontier_rt001_v3.csv.gz \
            --passenger-validation outputs/phase2/passenger_utility_frontier_rt001_v3/passenger_utility_frontier_rt001_v3_validation.json \
            --budget-validation outputs/phase2/budget_lossless_policy_surface_v2/budget_lossless_policy_surface_v2_validation.json \
            --path-matrix outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix.csv \
            --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json \
            --s8-events outputs/phase2/s8_events.csv \
            --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json \
            --s8-sensitivity-config config/phase2_s8_phasing_sensitivity_v2.json \
            --context-output /tmp/stage-d-rt001-v3/contexts.csv.gz \
            --timetable-output /tmp/stage-d-rt001-v3/timetables.csv \
            --trip-output /tmp/stage-d-rt001-v3/trips.csv.gz \
            --validation /tmp/stage-d-rt001-v3/validation.json
          cmp "$OUTDIR/exact_plan_context_results_rt001_v3.csv.gz" /tmp/stage-d-rt001-v3/contexts.csv.gz
          cmp "$OUTDIR/exact_selected_timetables_rt001_v3.csv" /tmp/stage-d-rt001-v3/timetables.csv
          cmp "$OUTDIR/exact_selected_trips_rt001_v3.csv.gz" /tmp/stage-d-rt001-v3/trips.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/phase2/stage_d_exact_rt001_v3/stage_d_exact_rt001_v3_validation.json').read_text())
          b=json.loads(Path('/tmp/stage-d-rt001-v3/validation.json').read_text())
          for payload in (a,b):
              for key in ('context_output_sha256','timetable_output_sha256','trip_output_sha256'):
                  payload['lineage'].pop(key,None)
          assert a == b
          PY
      - name: Epistemic and anti-hardcode guard
        run: |
          ! grep -REn 'np\.random|random\.' \
            src/phase2_exact_timetable_optimizer_v2.py \
            src/phase2_exact_timetable_contract_v2.py \
            scripts/phase2_run_exact_timetable_integration_fix_v2.py \
            scripts/phase2_run_stage_d_exact_rt001_v3.py
          ! grep -En '16495|5325|6772755|803|16883|5345|6758835|804' \
            scripts/phase2_run_exact_timetable_integration_fix_v2.py \
            scripts/phase2_run_stage_d_exact_rt001_v3.py
          git diff --check
      - name: Persist evidence after PASS
        run: |
          git config user.name 'phase2-stage-d-rt001-v3-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo 'No evidence changes to persist'
          else
            git commit -m 'data(phase2): persist exact Stage-D RT001 V3 [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-stage-d-exact-rt001-v3
          path: outputs/phase2/stage_d_exact_rt001_v3
          if-no-files-found: error
