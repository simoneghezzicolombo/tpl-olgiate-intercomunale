name: Phase 2 graph freeze bootstrap

on:
  push:
    branches: [phase2-graph-freeze]
    paths:
      - tools/phase2_graph_bootstrap/**
      - .github/workflows/phase2-graph-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  bootstrap-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct audited implementation payload
        run: |
          cat tools/phase2_graph_bootstrap/chunk*.txt > /tmp/phase2_graph_code.b64
          echo '737b2efed65c5047b03829b9a8c655d13557af58af37f511fe667c14daae5b2c  /tmp/phase2_graph_code.b64' | sha256sum -c -
          base64 --decode /tmp/phase2_graph_code.b64 > /tmp/phase2_graph_code.tar.gz
          echo 'b16fb2c5931acc1b8dcd3319ad7655da3fd45f86d2400a67202a361e0cae0d96  /tmp/phase2_graph_code.tar.gz' | sha256sum -c -
          tar -xzf /tmp/phase2_graph_code.tar.gz
          python -m py_compile src/phase2_frozen_graph.py scripts/phase2_materialize_frozen_gate_d_graph.py tests/test_phase2_frozen_graph.py

      - name: Install pinned graph dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pandas==2.2.3 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1 \
            pytest==9.0.2

      - name: Verify frozen official bus GTFS inputs
        run: |
          echo 'f890c393b909a40ae9500ab5acba71166cdfc5af3d42be92f55a92d92927553b  data/raw/gtfs/agency_arriva/GTFS_invernale_2025-2026_-_Arriva_Italia_e_Addabus.zip' | sha256sum -c -
          echo 'f9b902807a2b213caea8e97c7501bdbfcbe1f3fe6d97f21f947ac2ecc6063271  data/raw/gtfs/agency_lineelecco/GTFS_invernale_2025-2026_Linee_Lecco.zip' | sha256sum -c -

      - name: Acquire exact Gate D PASS artifact, never live OSM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gate-d-pass
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/simoneghezzicolombo/tpl-olgiate-intercomunale/actions/artifacts/9891607118/zip \
            --output /tmp/gate-d-pass.zip
          echo '6fbc06d74d5ba970bc980e4cde6234245e0753c22386f703ea313c6a4de9206a  /tmp/gate-d-pass.zip' | sha256sum -c -
          unzip -q /tmp/gate-d-pass.zip -d /tmp/gate-d-pass
          python scripts/phase2_materialize_frozen_gate_d_graph.py --bootstrap-artifact-dir /tmp/gate-d-pass

      - name: Strong graph tests and byte reproducibility
        run: |
          python -m pytest -q tests/test_phase2_frozen_graph.py
          rm -rf /tmp/phase2-graph-rebuild
          python scripts/phase2_materialize_frozen_gate_d_graph.py --output-dir /tmp/phase2-graph-rebuild
          for file in outputs/phase2/frozen_gate_d/*; do
            name="$(basename "$file")"
            cmp "$file" "/tmp/phase2-graph-rebuild/$name"
          done

      - name: Anti-synthetic and no-live-OSM guardrails
        run: |
          python -m pytest -q tests/test_audit_anti_synthetic_guardrails.py
          ! grep -R -n -E 'overpass-api\.de|overpass\.private|overpass\.kumi|requests\.|urllib\.|httpx\.|np\.random|numpy\.random' \
            src/phase2_frozen_graph.py scripts/phase2_materialize_frozen_gate_d_graph.py

      - name: Whitespace checks
        run: |
          git diff --check
          git diff --check 1b9b3d359be48bf58e592e0698702f58e7559e19...HEAD

      - name: Persist code, frozen epoch and deterministic outputs
        run: |
          git config user.name "phase2-graph-ci"
          git config user.email "actions@users.noreply.github.com"
          # The Actions token intentionally does not create/update workflow files.
          # The final source-closed workflow is installed separately via the GitHub connector.
          git add docs/PHASE2_FROZEN_GATE_D_GRAPH.md \
            scripts/phase2_materialize_frozen_gate_d_graph.py src/phase2_frozen_graph.py \
            tests/test_phase2_frozen_graph.py data/phase2/frozen_gate_d/source outputs/phase2/frozen_gate_d
          git commit -m "feat(phase2-graph): freeze validated Gate D graph and transfer layer"
          git push
