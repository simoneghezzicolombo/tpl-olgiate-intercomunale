name: Phase 2 RT-031 Macro Contraction V3

on:
  workflow_dispatch:
  push:
    branches:
      - rt031-macro-structure-decoupling-v3
    paths:
      - "src/phase2_macro_structure_decoupling_v3.py"
      - "scripts/phase2_run_rt031_macro_contraction_diagnostic_v3.py"
      - "tests/test_phase2_macro_structure_decoupling_v3.py"
      - "docs/PHASE2_RT031_MACRO_STRUCTURE_DECOUPLING_V3.md"
      - ".github/workflows/phase2-rt031-macro-contraction-v3.yml"

permissions:
  contents: read
  actions: read

jobs:
  macro-contraction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      RT022_RUN_ID: "34030321683"
      RT022_ARTIFACT_ID: "9988386073"
      RT022_ARTIFACT_DIGEST: "sha256:1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7"
      RT024_RUN_ID: "34032406204"
      RT024_ARTIFACT_ID: "9989049119"
      RT024_ARTIFACT_DIGEST: "sha256:6909e6c4395ad912eff7eeb2056cb9c8573975a647058e89f01263f2e1f69afc"
      RT025_RUN_ID: "34032979836"
      RT025_ARTIFACT_ID: "9989241752"
      RT025_ARTIFACT_DIGEST: "sha256:725350ea9d2a42b75e58f7ec6240e381cde788e956f0de01046e1aad833419da"
      RT023_RUN_ID: "34034770563"
      RT023_ARTIFACT_ID: "9989805162"
      RT023_ARTIFACT_DIGEST: "sha256:d206af90c247f87940f51db17e5497183199cceb9070e84124c0ef3b5ddba981"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: python -m pip install --upgrade pip pandas pytest

      - name: Run RT-031 adversarial tests
        run: python -m pytest -q tests/test_phase2_macro_structure_decoupling_v3.py

      - name: Verify frozen upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RT022_ARTIFACT_ID}" --jq '.digest')" = "${RT022_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RT024_ARTIFACT_ID}" --jq '.digest')" = "${RT024_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RT025_ARTIFACT_ID}" --jq '.digest')" = "${RT025_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RT023_ARTIFACT_ID}" --jq '.digest')" = "${RT023_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT022_RUN_ID}" --jq '.head_sha')" = "157badd6fc4aeaed4dcf19b08e37a48626b31b35"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT024_RUN_ID}" --jq '.head_sha')" = "c6d86f8d91a0825e92ba52325af5ec3e200a8dc1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT025_RUN_ID}" --jq '.head_sha')" = "046fe3a9c8c88a60c88f7d70c830dd44e8bb940e"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT023_RUN_ID}" --jq '.head_sha')" = "0d9a82caa1d1d624e0f6945e709f3548785fb8dc"

      - name: Download RT-022 E4
        uses: actions/download-artifact@v4
        with:
          name: phase2-rt022-minimum-backbones-v3-real
          path: _upstream/rt022
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34030321683

      - name: Download RT-024 E5
        uses: actions/download-artifact@v4
        with:
          name: phase2-rt024-exact-five-edge-v3
          path: _upstream/rt024
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34032406204

      - name: Download RT-025 E6
        uses: actions/download-artifact@v4
        with:
          name: phase2-rt025-exact-six-edge-v3
          path: _upstream/rt025
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34032979836

      - name: Download RT-023 realizations
        uses: actions/download-artifact@v4
        with:
          name: rt023-service-pattern-realization-v3
          path: _upstream/rt023
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34034770563

      - name: Resolve exact frozen inputs
        run: |
          set -euo pipefail
          E4="$(find _upstream/rt022 -type f -name 'minimum_topology_neutral_backbone_universe.csv' -print -quit)"
          E5="$(find _upstream/rt024 -type f -name 'exact_five_edge_topology_neutral_structure_universe.csv' -print -quit)"
          E6="$(find _upstream/rt025 -type f -name 'exact_six_edge_topology_neutral_structure_universe.csv' -print -quit)"
          REALIZATIONS="$(find _upstream/rt023 -type f -name 'link_realization_catalog.csv' -print -quit)"
          for file in "${E4}" "${E5}" "${E6}" "${REALIZATIONS}"; do test -n "${file}" && test -f "${file}"; done
          {
            echo "E4=${E4}"
            echo "E5=${E5}"
            echo "E6=${E6}"
            echo "REALIZATIONS=${REALIZATIONS}"
          } >> "${GITHUB_ENV}"

      - name: Build macro contraction A
        run: |
          rm -rf outputs/phase2/rt031_macro_contraction_v3_a
          python scripts/phase2_run_rt031_macro_contraction_diagnostic_v3.py \
            --e4 "${E4}" --e5 "${E5}" --e6 "${E6}" \
            --realizations "${REALIZATIONS}" \
            --outdir outputs/phase2/rt031_macro_contraction_v3_a

      - name: Build macro contraction B
        run: |
          rm -rf outputs/phase2/rt031_macro_contraction_v3_b
          python scripts/phase2_run_rt031_macro_contraction_diagnostic_v3.py \
            --e4 "${E4}" --e5 "${E5}" --e6 "${E6}" \
            --realizations "${REALIZATIONS}" \
            --outdir outputs/phase2/rt031_macro_contraction_v3_b

      - name: Enforce lossless deterministic diagnostic contract
        run: |
          set -euo pipefail
          cmp outputs/phase2/rt031_macro_contraction_v3_a/rt031_macro_structure_signatures.csv outputs/phase2/rt031_macro_contraction_v3_b/rt031_macro_structure_signatures.csv
          cmp outputs/phase2/rt031_macro_contraction_v3_a/rt031_macro_edge_chains.csv outputs/phase2/rt031_macro_contraction_v3_b/rt031_macro_edge_chains.csv
          cmp outputs/phase2/rt031_macro_contraction_v3_a/rt031_macro_contraction_audit.json outputs/phase2/rt031_macro_contraction_v3_b/rt031_macro_contraction_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('outputs/phase2/rt031_macro_contraction_v3_a/rt031_macro_contraction_audit.json').read_text())
          assert audit['status']=='PASS_MACRO_CONTRACTION_DIAGNOSTIC_NOT_SEARCH_PASS'
          assert audit['structure_count']==112843
          assert audit['layer_counts']=={'E4':88,'E5':4076,'E6':108679}
          assert audit['elementary_link_membership_count_input']==672806
          assert audit['elementary_link_membership_count_output']==672806
          assert audit['macro_topology_counts']=={'CYCLIC_BRANCHING_CORE':2764,'PATH_CORE':19572,'TREE_BRANCHING_CORE':90507}
          assert audit['lossless_elementary_link_partition'] is True
          assert all(value is False for value in audit['negative_assertions'].values())
          PY

      - name: Upload RT-031 macro contraction diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rt031-macro-contraction-diagnostic-v3
          path: outputs/phase2/rt031_macro_contraction_v3_a
          if-no-files-found: error
          retention-days: 90
