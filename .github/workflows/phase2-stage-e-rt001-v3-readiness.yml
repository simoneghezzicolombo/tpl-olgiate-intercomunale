name: Phase 2 Stage E RT001 V3 Readiness

on:
  push:
    branches:
      - phase2-stage-e-rt001-v3-readiness
    paths:
      - 'src/phase2_stage_e_stage_d_interface_v3.py'
      - 'scripts/phase2_check_stage_e_stage_d_interface_v3.py'
      - 'tests/test_phase2_stage_e_stage_d_interface_v3.py'
      - 'src/phase2_final_operational_robustness_v2.py'
      - 'scripts/phase2_build_final_operational_robustness_v2.py'
      - 'tests/test_phase2_final_operational_robustness_v2.py'
      - 'docs/PHASE2_STAGE_E_RT001_V3_READINESS.md'
      - '.github/workflows/phase2-stage-e-rt001-v3-readiness.yml'
  workflow_dispatch:

concurrency:
  group: phase2-stage-e-rt001-v3-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONPATH: .
  OUTDIR: outputs/phase2/stage_e_rt001_v3_readiness

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify certified Stage-E / Stage-D V2 fixture ancestry
        run: |
          git merge-base --is-ancestor 96e033e77f2b9b7b82ff4555b682816bf8c71111 HEAD
          test -f outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_timetable_v2_validation.json
          test -f outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_timing_summary_v2.csv.gz
          test -f outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_public_trips_v2.csv.gz

      - name: Compile readiness adapter
        run: |
          python -m py_compile src/phase2_stage_e_stage_d_interface_v3.py
          python -m py_compile scripts/phase2_check_stage_e_stage_d_interface_v3.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'

      - name: Run readiness and Stage-E regression tests
        run: >-
          python -m pytest -q
          tests/test_phase2_stage_e_stage_d_interface_v3.py
          tests/test_phase2_final_operational_robustness_v2.py

      - name: Validate real legacy Stage-D V2 compatibility fixture
        run: |
          rm -rf "$OUTDIR"
          mkdir -p "$OUTDIR"
          python scripts/phase2_check_stage_e_stage_d_interface_v3.py \
            --validation outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_timetable_v2_validation.json \
            --summary outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_timing_summary_v2.csv.gz \
            --trips outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_public_trips_v2.csv.gz \
            --output "$OUTDIR/legacy_stage_d_v2_interface_validation.json" \
            --input-role LEGACY_CERTIFIED_STAGE_D_V2_COMPATIBILITY_FIXTURE

      - name: Assert readiness contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/phase2/stage_e_rt001_v3_readiness/legacy_stage_d_v2_interface_validation.json')
          v=json.loads(p.read_text())
          assert v['status']=='PASS_PHASE2_STAGE_E_STAGE_D_INTERFACE_V3_READINESS'
          assert v['contract']=='PHASE2_STAGE_E_EXACT_TIMETABLE_INTERFACE_NO_CONTEXT_COLLAPSE_V3'
          assert v['interface_ready'] is True
          assert v['identity_field']=='stage_d_input_id'
          assert v['exact_timetable_count']==5345
          assert v['stage_d_input_count']==5345
          assert v['stage_d_inputs_with_context_dependent_exact_split']==0
          assert v['represented_plan_context_count_declared']==16883
          assert v['represented_plan_context_count_observed']==16883
          assert v['trip_count']==262149
          assert v['all_exact_timetables_have_trips'] is True
          assert v['stage_e_can_consume_without_context_collapse'] is True
          assert v['stage_e_algorithm_changed'] is False
          assert v['decision_budget_selected'] is False
          assert v['calendar_selected'] is False
          assert v['recovery_selected'] is False
          assert v['primary_selected'] is False
          assert v['runner_up_selected'] is False
          assert v['weighted_composite_score'] is False
          print(json.dumps(v,indent=2,sort_keys=True))
          PY

      - name: Deterministic readiness rebuild
        run: |
          rm -rf /tmp/stage-e-v3-readiness
          mkdir -p /tmp/stage-e-v3-readiness
          python scripts/phase2_check_stage_e_stage_d_interface_v3.py \
            --validation outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_timetable_v2_validation.json \
            --summary outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_timing_summary_v2.csv.gz \
            --trips outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_public_trips_v2.csv.gz \
            --output /tmp/stage-e-v3-readiness/legacy_stage_d_v2_interface_validation.json \
            --input-role LEGACY_CERTIFIED_STAGE_D_V2_COMPATIBILITY_FIXTURE >/dev/null
          cmp "$OUTDIR/legacy_stage_d_v2_interface_validation.json" /tmp/stage-e-v3-readiness/legacy_stage_d_v2_interface_validation.json

      - name: Guard readiness layer
        run: |
          FILES='src/phase2_stage_e_stage_d_interface_v3.py scripts/phase2_check_stage_e_stage_d_interface_v3.py'
          ! grep -En 'np\.random|numpy\.random|(^|[[:space:]])import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -En '\b(5325|16495|6772755)\b' $FILES
          ! grep -En 'weighted_composite_score[^\n]{0,40}(True|"true")|primary_selected[^\n]{0,40}(True|"true")|runner_up_selected[^\n]{0,40}(True|"true")' $FILES
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check

      - name: Persist readiness evidence
        run: |
          git config user.name 'phase2-stage-e-rt001-v3-readiness-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo 'No readiness evidence changes to persist'
          else
            git commit -m 'data(phase2): persist Stage-E RT001 V3 readiness [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-stage-e-rt001-v3-readiness-${{ github.sha }}
          path: outputs/phase2/stage_e_rt001_v3_readiness
          retention-days: 90
          if-no-files-found: error
