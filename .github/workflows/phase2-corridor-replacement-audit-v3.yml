name: Phase 2 Corridor Replacement Audit V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-network-design-method-audit-v3
    paths:
      - src/phase2_corridor_replacement_v3.py
      - tests/test_phase2_corridor_replacement_v3.py
      - scripts/phase2_audit_corridor_replacement_v3.py
      - .github/workflows/phase2-corridor-replacement-audit-v3.yml
      - src/phase2_frozen_graph.py
      - outputs/phase2/frozen_gate_d/**
      - outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix.csv

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase2-network-design-method-audit-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned routing dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pandas==2.2.3 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1 \
            pytest==8.3.5

      - name: Compile replacement core and audit
        run: |
          python -m py_compile src/phase2_corridor_replacement_v3.py
          python -m py_compile scripts/phase2_audit_corridor_replacement_v3.py

      - name: Run focused replacement tests
        run: pytest -q tests/test_phase2_corridor_replacement_v3.py

      - name: Revalidate frozen Gate-D routing contract
        run: pytest -q tests/test_phase2_frozen_graph.py

      - name: Run frozen Gate-D replacement-corridor audit
        run: python scripts/phase2_audit_corridor_replacement_v3.py --pairs 3

      - name: Validate corridor-diversification contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/network_design_method_audit_v3/corridor_replacement_v3/corridor_replacement_v3_validation.json')
          v = json.loads(p.read_text(encoding='utf-8'))
          assert v['status'] == 'PASS_CORRIDOR_REPLACEMENT_AUDIT_V3', v
          assert v['contract'] == 'COMPLETE_SINGLE_BASELINE_OSM_WAY_REPLACEMENT_SET_NOT_K_SHORTEST_NOT_NETWORK_SELECTION'
          assert all(v['checks'].values()), v['checks']
          assert v['guards']['k_shortest_exhaustiveness_claimed'] is False
          assert v['guards']['candidate_network_generated'] is False
          assert v['guards']['passenger_stop_pattern_selected'] is False
          assert v['guards']['named_service_area_forced'] is False
          assert v['guards']['topology_selected'] is False
          assert v['guards']['winner_selected'] is False
          print(json.dumps(v, indent=2, sort_keys=True))
          PY

      - name: Anti-random and source-closure guard
        run: |
          ! grep -nE 'np\.random|numpy\.random|random\.' src/phase2_corridor_replacement_v3.py scripts/phase2_audit_corridor_replacement_v3.py
          ! grep -niE 'requests|overpass-api|urllib|httpx' src/phase2_corridor_replacement_v3.py scripts/phase2_audit_corridor_replacement_v3.py

      - name: Upload corridor audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-corridor-replacement-audit-v3
          path: outputs/phase2/network_design_method_audit_v3/corridor_replacement_v3/
          if-no-files-found: error

      - name: Persist corridor audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/phase2/network_design_method_audit_v3/corridor_replacement_v3/
          if git diff --cached --quiet; then
            echo 'No corridor replacement evidence changes to persist.'
          else
            git commit -m 'audit: persist corridor replacement V3 evidence'
            git push origin HEAD:phase2-network-design-method-audit-v3
          fi
