name: RT031 network-connected max-3 domain probe V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_network_connected_portfolios_v3.py
      - scripts/phase2_probe_rt031_network_connected_max3_v3.py
      - tests/test_phase2_rt031_network_connected_portfolios_v3.py
      - .github/workflows/phase2-rt031-network-connected-max3-probe-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  max3-domain-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_phase2_rt031_network_connected_portfolios_v3.py -q
      - name: Acquire pinned physical pools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/hub /tmp/generic
          gh api repos/${{ github.repository }}/actions/artifacts/10368324023/zip > /tmp/hub.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10354879891/zip > /tmp/generic.zip
          echo 'dedf6d067af0188dde13c3041c482dd5551e23b9d4551cf757c7a137590dcf6b  /tmp/hub.zip' | sha256sum -c
          echo '53b400b11a6db457037a531d612d3abf99147d7a3162573d11149f432131bd87  /tmp/generic.zip' | sha256sum -c
          unzip -q /tmp/hub.zip -d /tmp/hub
          unzip -q /tmp/generic.zip -d /tmp/generic
      - name: Probe max-3 domain twice and compare every byte
        run: |
          mkdir -p /tmp/max3-a /tmp/max3-b
          python scripts/phase2_probe_rt031_network_connected_max3_v3.py \
            --hub-pool /tmp/hub/physical_walk_search.json \
            --generic-pool /tmp/generic/physical_walk_search.json \
            --output /tmp/max3-a/rt031_network_connected_max3_domain_probe_v3.json
          python scripts/phase2_probe_rt031_network_connected_max3_v3.py \
            --hub-pool /tmp/hub/physical_walk_search.json \
            --generic-pool /tmp/generic/physical_walk_search.json \
            --output /tmp/max3-b/rt031_network_connected_max3_domain_probe_v3.json
          diff -r /tmp/max3-a /tmp/max3-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-network-connected-max3-domain-probe-v3
          path: /tmp/max3-a/
          if-no-files-found: error
