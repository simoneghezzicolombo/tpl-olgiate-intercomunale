name: Phase 2 Final Operational Robustness RT001 V3

on:
  push:
    branches: [phase2-stage-e-rt001-v3-final-a]
    paths:
      - 'src/phase2_final_operational_robustness_v2.py'
      - 'scripts/phase2_build_final_operational_robustness_v2.py'
      - 'scripts/phase2_run_final_operational_robustness_rt001_v3.py'
      - 'scripts/phase2_run_final_operational_robustness_rt001_v3_stream.py'
      - 'tests/test_phase2_final_operational_robustness_v2.py'
      - 'tests/test_phase2_final_operational_robustness_rt001_v3_adapter.py'
      - 'config/phase2_final_operational_robustness_v2.json'
      - 'docs/PHASE2_STAGE_E_FINAL_OPERATIONAL_ROBUSTNESS_RT001_V3.md'
      - '.github/workflows/phase2-final-operational-robustness-rt001-v3.yml'
  workflow_dispatch:

concurrency:
  group: phase2-final-operational-robustness-rt001-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONPATH: .
  CODEX_STAGE_D_EVIDENCE_COMMIT: d41bb678382d018929c1c6b46542f12549f20d4f
  CROSS_AUDIT_EVIDENCE_COMMIT: 3bc703c2f06ad776d40beafcb4fe2f9ecc67dc90
  OUTDIR: outputs/phase2/final_operational_robustness_rt001_v3

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialise frozen Stage-D and cross-audit evidence
        run: |
          git fetch origin "$CODEX_STAGE_D_EVIDENCE_COMMIT" "$CROSS_AUDIT_EVIDENCE_COMMIT" phase2-stage-e-rt001-v3-readiness
          git cat-file -e "$CODEX_STAGE_D_EVIDENCE_COMMIT^{commit}"
          git cat-file -e "$CROSS_AUDIT_EVIDENCE_COMMIT^{commit}"
          git worktree add --detach /tmp/stage-d-v3 "$CODEX_STAGE_D_EVIDENCE_COMMIT"
          git worktree add --detach /tmp/stage-d-v3-cross-audit "$CROSS_AUDIT_EVIDENCE_COMMIT"
          test -f /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/stage_d_exact_rt001_v3_validation.json
          test -f /tmp/stage-d-v3-cross-audit/outputs/phase2/stage_d_v3_cross_implementation_audit/stage_d_v3_cross_implementation_validation.json

      - name: Prove certified Stage-E engine is unchanged
        run: |
          test "$(git rev-parse HEAD:src/phase2_final_operational_robustness_v2.py)" = "$(git rev-parse origin/phase2-stage-e-rt001-v3-readiness:src/phase2_final_operational_robustness_v2.py)"
          test "$(git rev-parse HEAD:scripts/phase2_build_final_operational_robustness_v2.py)" = "$(git rev-parse origin/phase2-stage-e-rt001-v3-readiness:scripts/phase2_build_final_operational_robustness_v2.py)"
          test "$(git rev-parse HEAD:config/phase2_final_operational_robustness_v2.json)" = "$(git rev-parse origin/phase2-stage-e-rt001-v3-readiness:config/phase2_final_operational_robustness_v2.json)"

      - name: Compile engine and V3 adapter
        run: |
          python -m py_compile src/phase2_final_operational_robustness_v2.py
          python -m py_compile scripts/phase2_build_final_operational_robustness_v2.py
          python -m py_compile scripts/phase2_run_final_operational_robustness_rt001_v3.py
          python -m py_compile scripts/phase2_run_final_operational_robustness_rt001_v3_stream.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'

      - name: Run Stage-E engine and adapter regressions
        run: |
          python -m pytest -q \
            tests/test_phase2_final_operational_robustness_v2.py \
            tests/test_phase2_final_operational_robustness_rt001_v3_adapter.py

      - name: Verify frozen cross-audit prerequisite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/stage-d-v3-cross-audit/outputs/phase2/stage_d_v3_cross_implementation_audit/stage_d_v3_cross_implementation_validation.json')
          v=json.loads(p.read_text())
          assert v['status']=='PASS_PHASE2_STAGE_D_V3_CROSS_IMPLEMENTATION_EQUIVALENCE'
          assert v['equivalent'] is True
          assert v['context_count_a']==v['context_count_b']==16495
          assert v['differing_context_count']==0
          assert v['differing_selected_phase_context_count']==0
          assert v['semantic_timetable_count_a']==v['semantic_timetable_count_b']==6000
          assert v['semantic_timetables_only_a_count']==0
          assert v['semantic_timetables_only_b_count']==0
          assert v['differing_semantic_timetable_count']==0
          assert v['trip_count_a']==v['trip_count_b']==285748
          assert v['differing_semantic_trip_set_count']==0
          assert v['block_partition_mismatch_count_by_recovery']['15']==0
          assert v['primary_selected'] is False
          assert v['runner_up_selected'] is False
          PY

      - name: Build final Stage-E RT001 V3 evidence
        run: |
          rm -rf "$OUTDIR"
          python scripts/phase2_run_final_operational_robustness_rt001_v3_stream.py \
            --stage-d-validation /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/stage_d_exact_rt001_v3_validation.json \
            --stage-d-contexts /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/exact_plan_context_results_rt001_v3.csv.gz \
            --stage-d-timetables /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/exact_selected_timetables_rt001_v3.csv \
            --stage-d-trips /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/exact_selected_trips_rt001_v3.csv.gz \
            --cross-audit-validation /tmp/stage-d-v3-cross-audit/outputs/phase2/stage_d_v3_cross_implementation_audit/stage_d_v3_cross_implementation_validation.json \
            --runtime-sensitivity-provenance outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_timetable_v2_validation.json \
            --route-input /tmp/stage-d-v3/outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_public_route_inputs_rt001_v3.csv \
            --s8-events /tmp/stage-d-v3/outputs/phase2/s8_events.csv \
            --s8-sensitivity /tmp/stage-d-v3/config/phase2_s8_phasing_sensitivity_v2.json \
            --stage-e-sensitivity config/phase2_final_operational_robustness_v2.json \
            --output-dir "$OUTDIR"

      - name: Validate final Stage-E V3 contract
        run: |
          python - <<'PY'
          import csv,gzip,json
          from pathlib import Path
          out=Path('outputs/phase2/final_operational_robustness_rt001_v3')
          v=json.loads((out/'final_operational_robustness_rt001_v3_validation.json').read_text())
          d=json.loads(Path('/tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/stage_d_exact_rt001_v3_validation.json').read_text())
          assert v['status']=='PASS_PHASE2_FINAL_OPERATIONAL_ROBUSTNESS_RT001_V3'
          assert v['contract']=='PHASE2_PLANNED_CONNECTION_PRESERVING_OPERATIONAL_ROBUSTNESS_RT001_V3'
          assert v['underlying_engine_status']=='PASS_PHASE2_FINAL_OPERATIONAL_ROBUSTNESS_V2'
          assert v['underlying_stage_e_algorithm_changed'] is False
          assert v['robustness_unit_identity']=='selected_timetable_id'
          assert v['source_daily_timing_problem_count']==d['stage_d_daily_timing_input_count']==5325
          assert v['selected_exact_timetable_count']==d['unique_selected_exact_timetable_count']==6000
          assert v['timetable_count']==6000
          assert v['represented_plan_context_count']==d['stage_c_plan_context_count']==16495
          assert v['plan_context_to_selected_timetable_mapping_lossless'] is True
          assert v['exact_public_trip_count']==d['selected_exact_trip_row_count']==285748
          assert v['stage_d_cross_implementation_audit_pass'] is True
          assert v['stage_d_fixture_is_final_selection_lineage'] is True
          assert v['stage_d_lineage_role']=='LOSSLESS_STAGE_D_FINAL_SELECTION_LINEAGE'
          assert v['planned_connection_identity_preserved'] is True
          assert v['next_train_rebinding_used_as_success'] is False
          assert v['next_alternative_connection_reported_separately'] is True
          assert v['technical_return_used_as_passenger_service'] is False
          assert v['technical_return_connection_count']==0
          assert v['fixed_target_runtime_retention_monotonic_sanity'] is True
          assert v['bus_runtime_delay_minutes']==[0.0,5.0,10.0,15.0]
          assert v['runtime_sensitivity_provenance_separate_from_stage_d_v3'] is True
          assert v['runtime_sensitivity_is_empirical_probability'] is False
          assert v['rail_arrival_delay_minutes']==[0.0]
          assert v['nonzero_rail_delay_sensitivity_authorized'] is False
          assert v['recovery_minutes']==[5,10,15]
          assert v['block_sensitivity_row_count']==v['selected_exact_timetable_count']*len(v['recovery_minutes'])*len(v['bus_runtime_delay_minutes'])
          assert v['summary_row_count']==v['selected_exact_timetable_count']*v['transfer_profile_count']
          for key in ('budget_selected','calendar_selected','recovery_values_selected','primary_selected','runner_up_selected','weighted_composite_score','passenger_weighting_applied','municipal_od_downscaled','ridership_forecast','random_search','final_selection_authorized'):
              assert v[key] is False,key

          with gzip.open(out/'stage_e_plan_context_map_rt001_v3.csv.gz','rt',encoding='utf-8',newline='') as f:
              mapping=list(csv.DictReader(f))
          assert len(mapping)==16495
          assert len({r['plan_context_id'] for r in mapping})==16495
          assert len({r['selected_timetable_id'] for r in mapping})==6000

          for name in (
              'final_operational_connection_audit_rt001_v3.csv.gz',
              'final_operational_robustness_surface_rt001_v3.csv.gz',
              'final_operational_block_sensitivity_rt001_v3.csv.gz',
              'final_operational_robustness_summary_rt001_v3.csv.gz',
          ):
              with gzip.open(out/name,'rt',encoding='utf-8',newline='') as f:
                  reader=csv.DictReader(f)
                  assert 'selected_timetable_id' in (reader.fieldnames or []),name
                  assert 'stage_d_input_id' not in (reader.fieldnames or []),name
                  first=next(reader,None)
                  assert first is not None,name
          print(json.dumps({
              'status':v['status'],
              'daily_problems':v['source_daily_timing_problem_count'],
              'exact_timetables':v['selected_exact_timetable_count'],
              'plan_contexts':v['represented_plan_context_count'],
              'exact_trips':v['exact_public_trip_count'],
              'planned_connections':v['planned_connection_count_across_profiles_and_directions'],
              'surface_rows':v['robustness_surface_row_count'],
              'block_rows':v['block_sensitivity_row_count'],
              'summary_rows':v['summary_row_count'],
              'misses_by_runtime':v['planned_bus_to_rail_misses_by_runtime_delay'],
          },indent=2,sort_keys=True))
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          rm -rf /tmp/stage-e-v3-rebuild
          python scripts/phase2_run_final_operational_robustness_rt001_v3_stream.py \
            --stage-d-validation /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/stage_d_exact_rt001_v3_validation.json \
            --stage-d-contexts /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/exact_plan_context_results_rt001_v3.csv.gz \
            --stage-d-timetables /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/exact_selected_timetables_rt001_v3.csv \
            --stage-d-trips /tmp/stage-d-v3/outputs/phase2/stage_d_exact_rt001_v3/exact_selected_trips_rt001_v3.csv.gz \
            --cross-audit-validation /tmp/stage-d-v3-cross-audit/outputs/phase2/stage_d_v3_cross_implementation_audit/stage_d_v3_cross_implementation_validation.json \
            --runtime-sensitivity-provenance outputs/phase2/exact_timetable_optimizer_v2/stage_d_exact_timetable_v2_validation.json \
            --route-input /tmp/stage-d-v3/outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_public_route_inputs_rt001_v3.csv \
            --s8-events /tmp/stage-d-v3/outputs/phase2/s8_events.csv \
            --s8-sensitivity /tmp/stage-d-v3/config/phase2_s8_phasing_sensitivity_v2.json \
            --stage-e-sensitivity config/phase2_final_operational_robustness_v2.json \
            --output-dir /tmp/stage-e-v3-rebuild >/dev/null
          for f in \
            final_operational_connection_audit_rt001_v3.csv.gz \
            final_operational_robustness_surface_rt001_v3.csv.gz \
            final_operational_block_sensitivity_rt001_v3.csv.gz \
            final_operational_robustness_summary_rt001_v3.csv.gz \
            stage_e_plan_context_map_rt001_v3.csv.gz \
            final_operational_robustness_rt001_v3_validation.json; do
            cmp "$OUTDIR/$f" "/tmp/stage-e-v3-rebuild/$f"
          done

      - name: Guard source-closed and non-decisional semantics
        run: |
          FILES='src/phase2_final_operational_robustness_v2.py scripts/phase2_build_final_operational_robustness_v2.py scripts/phase2_run_final_operational_robustness_rt001_v3.py scripts/phase2_run_final_operational_robustness_rt001_v3_stream.py'
          ! grep -En 'np\.random|numpy\.random|(^|[[:space:]])import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -En 'primary_selected[^\n]{0,40}(True|"true")|runner_up_selected[^\n]{0,40}(True|"true")|weighted_composite_score[^\n]{0,40}(True|"true")' $FILES
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check

      - name: Persist Stage-E V3 evidence
        run: |
          git config user.name 'phase2-stage-e-rt001-v3-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo 'No Stage-E V3 evidence changes to persist'
          else
            git commit -m 'data(phase2): persist final Stage-E RT001 V3 [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-final-operational-robustness-rt001-v3-${{ github.sha }}
          path: outputs/phase2/final_operational_robustness_rt001_v3
          retention-days: 90
          if-no-files-found: error
