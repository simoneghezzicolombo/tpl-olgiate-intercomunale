name: GPT Gate A finalize

on:
  push:
    branches: [antigravity-real-data]
    paths:
      - tools/gpt_gate_a_finalize_retry.flag

permissions:
  contents: write

jobs:
  finalize-gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity-real-data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install provenance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas rasterio pyogrio requests pytest

      - name: Regenerate authoritative Gate A manifest
        run: python scripts/audit_01_fetch_real_inputs.py

      - name: Finalize documentation and clean temporary tooling
        run: |
          python tools/gpt_gate_a_finalize.py
          sed -i 's/[[:space:]]*$//' AGENT_STATUS.md docs/GATE_A_PASS.md docs/fonti.md
          rm -f tools/gpt_gate_a_finalize_retry.flag
          git diff --check

      - name: Commit authoritative Gate A snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes produced; refusing false success."
            exit 1
          fi
          git commit -m "audit(gate-a): record authoritative PASS snapshot"
          git push origin HEAD:antigravity-real-data
