name: Journey official KML baseline

on:
  push:
    branches: [phase2-analysis-journey-a]
    paths:
      - .github/workflows/journey-official-kml-baseline.yml
      - dietro-l-analisi/build_official_kml_baseline.py
      - data/external/current_service_v4/archived_kml/D84.kml
      - data/external/current_service_v4/archived_kml/E03.kml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-official-kml:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source-closed archived official KML
        shell: bash
        run: |
          set -euo pipefail
          echo '6cf715a83c1e85e7ebfeecd82b666eee623119e7b37e35875ed0be419fa5523a  data/external/current_service_v4/archived_kml/D84.kml' | sha256sum -c -
          echo '10239544443134a10992b938a878ff62a906618f8f7f6babe2a339647f41bfa5  data/external/current_service_v4/archived_kml/E03.kml' | sha256sum -c -
      - name: Convert archived official KML to browser geometry
        run: |
          python dietro-l-analisi/build_official_kml_baseline.py \
            --d184 data/external/current_service_v4/archived_kml/D84.kml \
            --d185 data/external/current_service_v4/archived_kml/E03.kml
      - name: Validate KML geometry contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          root = Path('dietro-l-analisi')
          m = json.loads((root/'current-routes-kml-source.json').read_text())
          assert m['contract'] == 'CURRENT_ROUTE_BASELINE_ARCHIVED_OFFICIAL_ATP_KML_V1'
          assert m['decision_output'] is False
          assert m['current_codes'] == {'D184':'D84','D185':'E03'}
          assert m['routes']['D184']['sha256'] == '6cf715a83c1e85e7ebfeecd82b666eee623119e7b37e35875ed0be419fa5523a'
          assert m['routes']['D185']['sha256'] == '10239544443134a10992b938a878ff62a906618f8f7f6babe2a339647f41bfa5'
          assert m['routes']['D184']['line_components'] == 7
          assert m['routes']['D184']['coordinates'] == 2268
          assert m['routes']['D185']['line_components'] == 11
          assert m['routes']['D185']['coordinates'] == 3618
          names = [c['file'] for c in m['geojson']['gzip_base64_chunks']
          data = json.loads(gzip.decompress(base64.b64decode(''.join((root/n).read_text().strip() for n in names))))
          assert len(data['features']) == 18
          assert {f['properties']['route'] for f in data['features']} == {'D184','D185'}
          assert all(f['properties']['source'] == 'OFFICIAL_ATP_ARCHIVED_KML' for f in data['features'])
          assert sum(len(f['geometry']['coordinates']) for f in data['features']) == 5886
          print('source-closed archived official KML geometry PASS')
          PY
      - name: Persist deterministic browser assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dietro-l-analisi/current-routes-kml.geojson.gz.b64.* dietro-l-analisi/current-routes-kml-source.json
          if git diff --cached --quiet; then
            echo 'KML browser assets already deterministic and current.'
          else
            git commit -m "data(journey): refresh certified archived KML browser geometry"
            git push origin HEAD:phase2-analysis-journey-a
          fi
