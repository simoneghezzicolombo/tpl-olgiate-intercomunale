name: Journey official KML baseline

on:
  push:
    branches: [phase2-analysis-journey-a]
    paths:
      - .github/workflows/journey-official-kml-baseline.yml
      - dietro-l-analisi/build_official_kml_baseline.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-official-kml:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official ATP KML files
        shell: bash
        run: |
          set -euo pipefail
          normalize_kml() {
            local src="$1"
            local dst="$2"
            python -c "import pathlib,sys,xml.etree.ElementTree as ET; s=pathlib.Path(sys.argv[1]).read_text(errors='ignore'); starts=[i for i in (s.find('<?xml'),s.find('<kml'),s.find('<kml ')) if i>=0]; assert starts, 'no KML/XML marker'; s=s[min(starts):]; end=s.rfind('</kml>'); assert end>=0, 'no closing kml'; s=s[:end+6]; pathlib.Path(sys.argv[2]).write_text(s); r=ET.parse(sys.argv[2]).getroot(); assert r.tag.rsplit('}',1)[-1].lower()=='kml', r.tag" "${src}" "${dst}"
          }
          download_kml() {
            local route="$1"
            local out="$2"
            local path="atpcolc/images/Fil%20KML%202025/Urbano%20e%20interurbano%20Lecco/${route}.kml"
            local target="http://www.tplcomoleccovarese.it/${path}"
            local ok=0
            local candidates=(
              "https://r.jina.ai/${target}"
              "https://r.jina.ai/https://www.tplcomoleccovarese.it/${path}"
              "https://www.tplcomoleccovarese.it/${path}"
              "https://tecuting.halleylombardia.it/${path}"
            )
            for url in "${candidates[@]}"; do
              echo "Trying ${url}"
              if curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 45 \
                --user-agent 'Mozilla/5.0 (compatible; tpl-olgiate-intercomunale/1.0; official open-data retrieval)' \
                --header 'Accept: application/vnd.google-earth.kml+xml, application/xml, text/plain, text/xml, */*' \
                "${url}" -o "${out}.tmp"; then
                echo "Candidate bytes: $(wc -c < "${out}.tmp")"
                head -c 240 "${out}.tmp" | tr '\n' ' ' || true
                echo
                if normalize_kml "${out}.tmp" "${out}"; then
                  ok=1
                  break
                fi
              fi
              rm -f "${out}.tmp" "${out}"
            done
            rm -f "${out}.tmp"
            if [[ "${ok}" != 1 ]]; then
              echo "Unable to retrieve ${route} official KML" >&2
              exit 1
            fi
            wc -c "${out}"
            sha256sum "${out}"
          }
          download_kml D184 /tmp/D184.kml
          download_kml D185 /tmp/D185.kml
      - name: Convert official KML to deterministic browser geometry
        run: |
          python dietro-l-analisi/build_official_kml_baseline.py \
            --d184 /tmp/D184.kml \
            --d185 /tmp/D185.kml
      - name: Validate official KML asset
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,gzip,json,pathlib; root=pathlib.Path('dietro-l-analisi'); m=json.loads((root/'current-routes-kml-source.json').read_text()); assert m['contract']=='CURRENT_ROUTE_BASELINE_OFFICIAL_ATP_KML_V1'; assert m['decision_output'] is False; assert 'No stop-to-stop reconstruction' in m['semantics']; [(_ for _ in ()).throw(AssertionError(route)) if not (m['routes'][route]['source_url'].endswith('/'+route+'.kml') and m['routes'][route]['bytes']>100 and len(m['routes'][route]['sha256'])==64 and m['routes'][route]['line_components']>=1 and m['routes'][route]['coordinates']>=20) else None for route in ('D184','D185')]; names=[c['file'] for c in m['geojson']['gzip_base64_chunks']]; data=json.loads(gzip.decompress(base64.b64decode(''.join((root/n).read_text().strip() for n in names)))); assert data['type']=='FeatureCollection'; assert {f['properties']['route'] for f in data['features']}=={'D184','D185'}; assert all(f['geometry']['type']=='LineString' and len(f['geometry']['coordinates'])>=2 and f['properties']['source']=='OFFICIAL_ATP_KML_2025' for f in data['features']); print('official D184/D185 KML baseline PASS')"
      - name: Persist official KML browser asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dietro-l-analisi/current-routes-kml.geojson.gz.b64.* dietro-l-analisi/current-routes-kml-source.json
          if git diff --cached --quiet; then
            echo "Official KML baseline already current"
          else
            git commit -m "data(journey): materialize official D184 D185 KML geometry"
            git push origin HEAD:phase2-analysis-journey-a
          fi
