name: RT-025 exact six-edge structural layer V3

on:
  push:
    branches: [phase2-exact-six-edge-structural-layer-v3]
  pull_request:
    branches: [phase2-exact-five-edge-structural-layer-v3]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  exact-six-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas==2.2.3 pytest==8.3.5
      - name: Compile and focused tests
        run: |
          python -m py_compile src/phase2_exact_edge_policy_structures_v3.py
          python -m py_compile scripts/phase2_run_rt024_exact_five_edge_v3.py
          python -m py_compile scripts/phase2_run_rt025_exact_six_edge_v3.py
          python -m pytest -q \
            tests/test_phase2_exact_edge_policy_structures_v3.py \
            tests/test_phase2_network_structure_search_v3.py
      - name: Validate frozen RT-022 source identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('outputs/phase2/rt022_minimum_backbones_v3/rt022_minimum_backbone_audit.json').read_text())
          assert v['status']=='PASS_EXACT_MINIMUM_TOPOLOGY_NEUTRAL_TERRITORIAL_BACKBONE_UNIVERSE'
          assert v['complete'] is True
          assert v['counts']['reciprocal_elementary_structural_links']==110
          assert v['digests']['structure_universe_sha256']=='1d6ccd18a5707aa8e2e51b1eefcc9d27056678f0d5e260c9027d1414a1ddf8d7'
          PY
      - name: Regression reproduce certified RT-024 five-edge layer
        run: |
          rm -rf /tmp/rt024_regression
          python scripts/phase2_run_rt024_exact_five_edge_v3.py \
            --links outputs/phase2/rt022_minimum_backbones_v3/reciprocal_structural_links.csv \
            --stop-inventory outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv \
            --rt022-audit outputs/phase2/rt022_minimum_backbones_v3/rt022_minimum_backbone_audit.json \
            --out-dir /tmp/rt024_regression
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/rt024_regression/rt024_exact_five_edge_audit.json').read_text())
          assert v['counts']['exact_five_edge_structures']==4076
          assert v['topology_counts']=={'PATH':1374,'TREE_BRANCHING':2678,'UNICYCLIC_BRANCHING':24}
          assert v['structure_universe_sha256']=='b03c704bbfadfc8d66494087163604d794b2e1502d8b38d294f711d55230bc92'
          PY
      - name: Build exact six-edge real structural layer
        run: |
          rm -rf outputs/phase2/rt025_exact_six_edge_v3
          python scripts/phase2_run_rt025_exact_six_edge_v3.py \
            --links outputs/phase2/rt022_minimum_backbones_v3/reciprocal_structural_links.csv \
            --stop-inventory outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv \
            --rt022-audit outputs/phase2/rt022_minimum_backbones_v3/rt022_minimum_backbone_audit.json
      - name: Assert real exhaustive six-edge counts and guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('outputs/phase2/rt025_exact_six_edge_v3/rt025_exact_six_edge_audit.json').read_text())
          assert v['status']=='PASS_RT025_EXACT_SIX_EDGE_TOPOLOGY_NEUTRAL_STRUCTURAL_LAYER_V3'
          assert v['complete'] is True
          assert v['counts']['reciprocal_structural_links']==110
          assert v['counts']['conventional_terminals']==35
          assert v['counts']['exact_six_edge_structures']==108679
          assert v['counts']['bicyclic_structures']==0
          assert v['counts']['figure_eight_like_structures']==0
          assert v['topology_counts']=={'PATH':18144,'TREE_BRANCHING':87795,'UNICYCLIC_BRANCHING':2740}
          assert v['vertex_count_distribution']=={'6':2740,'7':105939}
          assert v['cycle_rank_distribution']=={'0':105939,'1':2740}
          assert v['connected_state_counts_by_edge_count']=={
              '1':110,'2':723,'3':6299,'4':61409,'5':622352,'6':6318018
          }
          assert all(value is False for value in v['guards'].values())
          PY
      - name: Anti-bias guards
        run: |
          ! grep -nE 'np\.random|numpy\.random|import random|from random|PRIMARY|RUNNER-UP|Cassina|Circolare Meratese' \
            src/phase2_exact_edge_policy_structures_v3.py \
            scripts/phase2_run_rt025_exact_six_edge_v3.py
          git diff --check
      - name: Upload RT-025 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-rt025-exact-six-edge-v3
          path: outputs/phase2/rt025_exact_six_edge_v3/
          if-no-files-found: error
          retention-days: 90
