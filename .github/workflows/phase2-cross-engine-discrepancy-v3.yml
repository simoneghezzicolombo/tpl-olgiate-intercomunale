name: Phase 2 Cross-engine Discrepancy V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-cross-engine-discrepancy-v3
    paths:
      - src/phase2_cross_engine_discrepancy_v3.py
      - tests/test_phase2_cross_engine_discrepancy_v3.py
      - scripts/phase2_audit_cross_engine_discrepancy_v3.py
      - docs/PHASE2_CROSS_ENGINE_DISCREPANCY_V3.md
      - .github/workflows/phase2-cross-engine-discrepancy-v3.yml

permissions:
  contents: read

jobs:
  discrepancy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-cross-engine-discrepancy-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Compile RT-013
        run: |
          python -m py_compile src/phase2_cross_engine_discrepancy_v3.py
          python -m py_compile scripts/phase2_audit_cross_engine_discrepancy_v3.py
      - name: Run RT-013 unit tests
        run: pytest -q tests/test_phase2_cross_engine_discrepancy_v3.py
      - name: Run controlled discrepancy audit
        run: python scripts/phase2_audit_cross_engine_discrepancy_v3.py
      - name: Validate RT-013 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/cross_engine_discrepancy_v3/cross_engine_discrepancy_v3_validation.json')
          d = json.loads(p.read_text())
          assert d['status'] == 'PASS_RT013_CROSS_ENGINE_DISCREPANCY_CONTRACT_V3'
          assert d['fixture_semantics'] == 'CONTROLLED_ABSTRACT_OD_FIXTURE_NOT_TERRITORIAL_DATA'
          assert d['od_alignment_fail_closed'] is True
          assert d['engine_average_constructed'] is False
          assert d['automatic_equivalence_claim'] is False
          assert d['reporting_bands_are_diagnostic_only'] is True
          assert d['max_absolute_difference_min'] == 20.0
          assert d['large_disagreement_signed_min'] == 20.0
          assert d['zero_denominator_relative_is_undefined'] is True
          assert d['weighted_composite_score'] is False
          assert d['territorial_candidate_claim'] is False
          PY
      - name: Guard against geography, source and decision leakage
        run: |
          ! grep -niE 'Arlate|Beverate|Perego|Mondonico|Calco|Brivio|Olgiate|Santa Maria|C146|ASF|PRIMARY|RUNNER-UP|recommended route' src/phase2_cross_engine_discrepancy_v3.py scripts/phase2_audit_cross_engine_discrepancy_v3.py
          ! grep -nE 'np\.random|numpy\.random|random\.' src/phase2_cross_engine_discrepancy_v3.py scripts/phase2_audit_cross_engine_discrepancy_v3.py
      - name: Whitespace check
        run: git diff --check
      - name: Upload RT-013 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-cross-engine-discrepancy-v3
          path: outputs/phase2/cross_engine_discrepancy_v3/cross_engine_discrepancy_v3_validation.json
          if-no-files-found: error
