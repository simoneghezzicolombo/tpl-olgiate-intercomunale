name: Phase 2 Alpha GJT Bounds Targeted Red-Team A PASS

on:
  push:
    branches:
      - phase2-gjt-bounds-targeted-redteam-a-pass
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile targeted review
        run: |
          python -m py_compile \
            scripts/phase2_redteam_alpha_gjt_bounds_pass_a.py \
            src/phase2_gjt_set_bounds_exact_v3.py \
            tests/test_phase2_redteam_alpha_gjt_bounds_pass_a.py

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'

      - name: Run independent targeted regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_phase2_redteam_alpha_gjt_bounds_pass_a.py

      - name: Materialize targeted PASS verdict
        env:
          PYTHONPATH: .
        run: |
          mkdir -p outputs/phase2/gjt_bounds_targeted_redteam_a_pass
          python scripts/phase2_redteam_alpha_gjt_bounds_pass_a.py \
            --validation outputs/phase2/gjt_bounds_targeted_redteam_a_pass/validation.json

      - name: Validate review contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('outputs/phase2/gjt_bounds_targeted_redteam_a_pass/validation.json').read_text())
          assert p['status'] == 'PASS_PHASE2_GJT_BOUNDS_TARGETED_REVIEW_A_V3'
          assert p['certification_pass'] is True
          assert p['findings']['blocking_issue_count'] == 0
          assert p['findings']['out_of_span_public_return_leak_detected'] is False
          assert p['findings']['next_train_rebinding_detected'] is False
          assert p['findings']['hidden_demand_or_worker_weighting_detected'] is False
          assert p['persisted_evidence']['finite_upper_bound_row_count'] == 0
          assert p['persisted_evidence']['unbounded_upper_bound_row_count'] == 60000
          assert p['alpha_evidence_commit'] == 'c90232d13fa9e4acde6f3e9732b9a0ec62a89aef'
          PY

      - name: Epistemic guard
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/phase2_redteam_alpha_gjt_bounds_pass_a.py').read_text(encoding='utf-8')
          for token in ('np.random', 'numpy.random', 'import random', 'from random'):
              assert token not in source, token
          PY

      - name: Persist review evidence
        run: |
          git config user.name "phase2-gjt-bounds-redteam-a-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/gjt_bounds_targeted_redteam_a_pass/validation.json
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist targeted Alpha bounds PASS [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-gjt-bounds-targeted-redteam-a-pass-${{ github.sha }}
          path: outputs/phase2/gjt_bounds_targeted_redteam_a_pass/validation.json
          retention-days: 90
