name: RT031 Arlate retained one-line access frontier V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_audit_rt031_arlate_retained_line_v3.py
      - tests/test_phase2_rt031_arlate_retained_line_v3.py
      - .github/workflows/phase2-rt031-arlate-retained-line-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  arlate-retained-line:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest tests/test_phase2_rt031_arlate_retained_line_v3.py -q
      - name: Acquire pinned physical, walking, and retention evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rt031-inputs/{rt017,rt022,rt030} /tmp/via /tmp/walk /tmp/probes
          gh api repos/${{ github.repository }}/actions/artifacts/9972204236/zip > /tmp/rt017.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9988386073/zip > /tmp/rt022.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9992507233/zip > /tmp/rt030.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10023387513/zip > /tmp/via.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9991182904/zip > /tmp/walk.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10668537794/zip > /tmp/probes.zip
          echo 'e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225  /tmp/rt017.zip' | sha256sum -c
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          echo '1603606d02a170567c1d423b7689b7044933fff6490caeaf848ae0ca0f2d77d0  /tmp/via.zip' | sha256sum -c
          echo 'e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28  /tmp/walk.zip' | sha256sum -c
          echo '439106c02c353b80c4acefb798ffb8206b3f4bc22eac24e7adfe8169e35fc25e  /tmp/probes.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-inputs/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-inputs/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-inputs/rt030
          unzip -q /tmp/via.zip -d /tmp/via
          unzip -q /tmp/walk.zip -d /tmp/walk
          unzip -q /tmp/probes.zip -d /tmp/probes
      - name: Bind every under-reference witness and compare exact walking twice
        run: |
          evidence=$(find /tmp/via -name '*.json' | head -1)
          walk=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv | head -1)
          for replica in a b; do
            python scripts/phase2_audit_rt031_arlate_retained_line_v3.py \
              --probes /tmp/probes/arlate_retention_probes_size4_v3.json \
              --inputs /tmp/rt031-inputs --via-way-evidence "$evidence" \
              --walk-matrix "$walk" \
              --output "/tmp/arlate-retained-line-$replica.json"
          done
          cmp /tmp/arlate-retained-line-a.json /tmp/arlate-retained-line-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-arlate-retained-one-line-access-v3
          path: /tmp/arlate-retained-line-a.json
          if-no-files-found: error
