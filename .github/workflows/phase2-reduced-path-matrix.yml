name: Phase 2 reduced stop path matrix

on:
  push:
    branches: [phase2-optimizer-core]
    paths:
      - src/phase2_reduced_path_matrix.py
      - scripts/phase2_build_reduced_path_matrix.py
      - tests/test_phase2_reduced_path_matrix.py
      - outputs/phase2/frozen_gate_d/**
      - outputs/phase2/existing_official_stops.csv
      - outputs/phase2/proposed_stop_candidates.csv
      - .github/workflows/phase2-reduced-path-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reduced-path-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned graph dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pandas==2.2.3 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1 \
            pytest==9.0.2

      - name: Compile bridge
        run: |
          python -m py_compile src/phase2_reduced_path_matrix.py
          python -m py_compile scripts/phase2_build_reduced_path_matrix.py

      - name: Run bridge unit and adversarial tests
        run: python -m pytest -q tests/test_phase2_reduced_path_matrix.py

      - name: Materialise integrated routing anchors and path matrix
        run: python scripts/phase2_build_reduced_path_matrix.py

      - name: Validate real integrated outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('outputs/phase2')
          v = json.loads((root / 'reduced_path_matrix_validation.json').read_text(encoding='utf-8'))
          assert v['status'] == 'PASS'
          assert v['source_anchor_count'] == 224
          assert v['source_anchor_counts']['HUB_RAIL'] == 1
          assert v['source_anchor_counts']['EXISTING_PHYSICAL_STOP_CLUSTER'] == 43
          assert v['source_anchor_counts']['PROPOSED_STOP'] == 180
          # Freeze observed integration facts rather than imposing a made-up
          # connectivity percentage on a graph known to contain components.
          assert v['route_ready_source_anchors'] == 224
          assert v['routing_anchor_count'] == 223
          assert v['ordered_path_rows'] + v['missing_ordered_pairs'] == v['ordered_path_rows_possible']
          assert 0.0 < v['path_matrix_completeness'] <= 1.0
          assert v['one_to_many_dijkstra_runs'] == v['routing_anchor_count']
          assert v['prohibitions']['live_osm_used'] is False
          assert v['prohibitions']['random_generation_used'] is False
          assert v['prohibitions']['topology_selected'] is False
          assert v['prohibitions']['proposed_stop_physically_certified'] is False

          with (root / 'routing_anchor_universe.csv').open(encoding='utf-8', newline='') as f:
              anchors = list(csv.DictReader(f))
          assert len(anchors) == v['routing_anchor_count']
          assert sum(row['anchor_id'] == 'rail:S01514' for row in anchors) == 1
          assert len({row['graph_node_id'] for row in anchors}) == len(anchors)

          with (root / 'reduced_path_matrix.csv').open(encoding='utf-8', newline='') as f:
              matrix = list(csv.DictReader(f))
          assert len(matrix) == v['ordered_path_rows']
          assert all(float(row['distance_km']) > 0 for row in matrix)
          assert all(float(row['runtime_min']) > 0 for row in matrix)
          assert {row['uncertainty'] for row in matrix} <= {'RESOLVED', 'QUANTIFIED', 'UNKNOWN'}

          anchor_ids = {row['anchor_id'] for row in anchors}
          outbound = {row['destination'] for row in matrix if row['origin'] == 'rail:S01514'}
          inbound = {row['origin'] for row in matrix if row['destination'] == 'rail:S01514'}
          bidirectional = outbound & inbound
          topology_ready = {'rail:S01514', *bidirectional}
          assert topology_ready <= anchor_ids
          assert len(topology_ready) > 1
          print(f"hub bidirectional topology-ready routing anchors: {len(topology_ready)} / {len(anchor_ids)}")
          PY

      - name: Deterministic clean rebuild
        run: |
          rm -rf /tmp/phase2-reduced-matrix
          python scripts/phase2_build_reduced_path_matrix.py --output-dir /tmp/phase2-reduced-matrix
          for name in routing_anchor_universe.csv routing_anchor_membership.csv reduced_path_matrix.csv reduced_path_matrix_validation.json; do
            cmp "outputs/phase2/$name" "/tmp/phase2-reduced-matrix/$name"
          done

      - name: Guard source-closed deterministic bridge
        run: |
          ! grep -R -n -E 'overpass-api\.de|requests\.|urllib\.|httpx\.|np\.random|numpy\.random|import random|from random' \
            src/phase2_reduced_path_matrix.py scripts/phase2_build_reduced_path_matrix.py
          git diff --check

      - name: Persist validated reduced matrix
        run: |
          FILES="outputs/phase2/routing_anchor_universe.csv outputs/phase2/routing_anchor_membership.csv outputs/phase2/reduced_path_matrix.csv outputs/phase2/reduced_path_matrix_validation.json"
          git config user.name "phase2-path-matrix-ci"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): materialise reduced stop path matrix [skip ci]"
            git push
          fi
