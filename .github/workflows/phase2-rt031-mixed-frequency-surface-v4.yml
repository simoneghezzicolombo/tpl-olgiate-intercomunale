name: RT031 mixed frequency timetable surface V4
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_mixed_frequency_surface_v4.py
      - scripts/phase2_build_rt031_mixed_frequency_surface_v4.py
      - tests/test_phase2_rt031_mixed_frequency_surface_v4.py
      - .github/workflows/phase2-rt031-mixed-frequency-surface-v4.yml
      - data/external/google_maps_olgiate_fs_popular_times_2026-09-15/weekday_mean_profile.csv
permissions:
  contents: read
  actions: read
jobs:
  mixed-frequency-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_phase2_rt031_mixed_frequency_surface_v4.py -q
      - name: Acquire pinned typed, municipal and uniform-H30 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/typed /tmp/municipal /tmp/uniform
          gh api repos/${{ github.repository }}/actions/artifacts/10414630100/zip > /tmp/typed.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10416805424/zip > /tmp/municipal.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10414363725/zip > /tmp/uniform.zip
          echo '9dbc356dedb7e2fdf774f5d7e8d1fb6e3538f557fdd6dab5218b0930ebe8c673  /tmp/typed.zip' | sha256sum -c
          echo 'd4726e765501c52944428111c43c34eb010b37667b62c96f5f09d8c48dec1d52  /tmp/municipal.zip' | sha256sum -c
          echo 'ae05e90d41ae198892372862cb32efc2c71c7d527be05dd76be3e5471f2b99ff  /tmp/uniform.zip' | sha256sum -c
          unzip -q /tmp/typed.zip -d /tmp/typed
          unzip -q /tmp/municipal.zip -d /tmp/municipal
          unzip -q /tmp/uniform.zip -d /tmp/uniform
          echo '735c8f650dbcfc6c429e21cbad374be78cb7436af390bef84b54161baf6337cd  /tmp/typed/single_line_h30_typed_context_audit.json' | sha256sum -c
          echo '0757d9513e21e1e68a7fc43c1732b45c4ccd83242e84d20ea8a324d0866bca26  /tmp/municipal/rt031_municipal_access_frontier_v4.json' | sha256sum -c
          echo '08e950b773eb2b8ddbc91c3112539d40afe822c7d2205859459f774af4da5481  /tmp/uniform/single_line_h30_timetable_surface_v3.json' | sha256sum -c
      - name: Build mixed and joint surfaces twice
        run: |
          for out in /tmp/surface-a /tmp/surface-b; do
            python scripts/phase2_build_rt031_mixed_frequency_surface_v4.py \
              --typed-audit /tmp/typed/single_line_h30_typed_context_audit.json \
              --municipal-frontier /tmp/municipal/rt031_municipal_access_frontier_v4.json \
              --uniform-h30-surface /tmp/uniform/single_line_h30_timetable_surface_v3.json \
              --s8-events outputs/phase2/s8_events.csv \
              --sensitivity config/phase2_s8_phasing_sensitivity_v2.json \
              --popular-times-profile data/external/google_maps_olgiate_fs_popular_times_2026-09-15/weekday_mean_profile.csv \
              --output-dir "$out"
          done
          diff -r /tmp/surface-a /tmp/surface-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-mixed-frequency-timetable-surface-v4
          path: /tmp/surface-a/
          if-no-files-found: error
