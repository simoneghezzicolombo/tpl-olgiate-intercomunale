name: RT-026 seven-edge bicyclic feasibility diagnostic V3

on:
  push:
    branches: [phase2-seven-edge-bicyclic-feasibility-v3]
  pull_request:
    branches: [phase2-exact-six-edge-structural-layer-v3]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  bicyclic-seven-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pytest==8.3.5
      - name: Compile and focused tests
        run: |
          python -m py_compile src/phase2_seven_edge_bicyclic_feasibility_v3.py
          python -m py_compile scripts/phase2_run_rt026_seven_edge_bicyclic_v3.py
          python -m pytest -q \
            tests/test_phase2_seven_edge_bicyclic_feasibility_v3.py \
            tests/test_phase2_network_structure_search_v3.py
      - name: Run exact real seven-edge bicyclic diagnostic
        run: |
          rm -rf outputs/phase2/rt026_seven_edge_bicyclic_v3
          python scripts/phase2_run_rt026_seven_edge_bicyclic_v3.py \
            --links outputs/phase2/rt022_minimum_backbones_v3/reciprocal_structural_links.csv \
            --stop-inventory outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv \
            --rt022-audit outputs/phase2/rt022_minimum_backbones_v3/rt022_minimum_backbone_audit.json
      - name: Assert exact feasibility counts and boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('outputs/phase2/rt026_seven_edge_bicyclic_v3/rt026_seven_edge_bicyclic_audit.json').read_text())
          assert v['status']=='PASS_RT026_EXACT_SEVEN_EDGE_BICYCLIC_FEASIBILITY_DIAGNOSTIC_V3'
          assert v['complete'] is True
          assert v['counts']=={
              'six_terminal_policy_vertex_sets_scanned':189000,
              'six_terminal_sets_with_at_least_seven_induced_links':487,
              'seven_edge_subsets_scanned':1481,
              'bicyclic_structures':889,
              'figure_eight_like_structures':12,
          }
          assert v['topology_counts']=={'BICYCLIC_ARTICULATED':889}
          assert v['duplicated_policy_group_counts']=={
              'Calco':216,
              'La Valletta Brianza':24,
              'Olgiate Molgora':629,
              'Santa Maria Hoè':20,
          }
          assert all(value is False for value in v['guards'].values())
          PY
      - name: Anti-bias guards
        run: |
          ! grep -nE 'PRIMARY|RUNNER-UP|np\.random|numpy\.random|import random|from random|Cassina|Circolare Meratese' \
            src/phase2_seven_edge_bicyclic_feasibility_v3.py \
            scripts/phase2_run_rt026_seven_edge_bicyclic_v3.py
          git diff --check
      - name: Upload RT-026 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-rt026-seven-edge-bicyclic-v3
          path: outputs/phase2/rt026_seven_edge_bicyclic_v3/
          if-no-files-found: error
          retention-days: 90
