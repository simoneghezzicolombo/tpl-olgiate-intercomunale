name: Phase 2 S8 Robust Opportunity V2

on:
  push:
    branches:
      - phase2-s8-robust-opportunity-v2
      - phase2-robustness-final-v2
    paths:
      - 'scripts/phase2_build_s8_robust_opportunity_surface_v2.py'
      - 'tests/test_phase2_s8_robust_opportunity_surface_v2.py'
      - '.github/workflows/phase2-s8-robust-opportunity-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-s8-robust-opportunity-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONPATH: .
  PINNED_S8_COMMIT: 8d79cbd74c3ec99ec3eff5fca7a799975210356b

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and tests
        run: |
          python -m py_compile scripts/phase2_build_s8_robust_opportunity_surface_v2.py
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python -m pytest -q tests/test_phase2_s8_robust_opportunity_surface_v2.py

      - name: Extract pinned narrow S8 evidence
        run: |
          set -euo pipefail
          git cat-file -e "${PINNED_S8_COMMIT}^{commit}"
          mkdir -p /tmp/pinned-s8
          git show "${PINNED_S8_COMMIT}:outputs/phase2/passenger_gjt_v2/s8_scenario_feeder_envelope_v2.csv.gz" > /tmp/pinned-s8/envelope.csv.gz
          git show "${PINNED_S8_COMMIT}:outputs/phase2/passenger_gjt_v2/s8_scenario_feeder_envelope_v2_validation.json" > /tmp/pinned-s8/envelope_validation.json
          git show "${PINNED_S8_COMMIT}:outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2_validation.json" > /tmp/pinned-s8/transfer_validation.json
          git show "${PINNED_S8_COMMIT}:outputs/phase2/passenger_gjt_v2/s8_passenger_support_mask_v2_validation.json" > /tmp/pinned-s8/support_validation.json
          git show "${PINNED_S8_COMMIT}:outputs/phase2/passenger_gjt_v2/s8_work_direction_summary_v2.csv" > /tmp/pinned-s8/work_direction_summary.csv
          git show "${PINNED_S8_COMMIT}:outputs/phase2/passenger_gjt_v2/s8_work_direction_weights_v2_validation.json" > /tmp/pinned-s8/work_weights_validation.json

      - name: Build S8 opportunity surface
        run: >-
          python scripts/phase2_build_s8_robust_opportunity_surface_v2.py
          --passenger-frontier outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2.csv.gz
          --passenger-validation outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2_validation.json
          --current-s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json
          --current-route-universe outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv
          --current-scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz
          --current-s8-events outputs/phase2/s8_events.csv
          --current-policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv
          --current-s8-contract outputs/phase2/s8_interchange_contract.json
          --legacy-envelope /tmp/pinned-s8/envelope.csv.gz
          --legacy-envelope-validation /tmp/pinned-s8/envelope_validation.json
          --legacy-transfer-validation /tmp/pinned-s8/transfer_validation.json
          --legacy-support-validation /tmp/pinned-s8/support_validation.json
          --legacy-work-direction-summary /tmp/pinned-s8/work_direction_summary.csv
          --legacy-work-weights-validation /tmp/pinned-s8/work_weights_validation.json
          --output outputs/phase2/s8_robust_opportunity_v2/passenger_plans_s8_opportunity_v2.csv.gz
          --validation outputs/phase2/s8_robust_opportunity_v2/s8_robust_opportunity_v2_validation.json

      - name: Validate contract
        run: |
          python - <<'PY'
          import csv,gzip,json
          from pathlib import Path
          root=Path('outputs/phase2/s8_robust_opportunity_v2')
          v=json.loads((root/'s8_robust_opportunity_v2_validation.json').read_text())
          assert v['status']=='PASS_PHASE2_S8_ROBUST_OPPORTUNITY_SURFACE_V2'
          assert v['contract']=='PHASE2_LINEAGE_PINNED_PRE_TIMETABLE_S8_OPPORTUNITY_V2'
          assert v['pinned_source_commit']=='8d79cbd74c3ec99ec3eff5fca7a799975210356b'
          assert v['passenger_utility_plan_count']==16883
          assert sum(v['s8_opportunity_class_counts'].values())==16883
          assert v['worker_direction_weight_reference']==1882.0
          assert sum(v['outbound_direction_weight'].values())==1882.0
          assert sum(v['return_direction_weight'].values())==1882.0
          for key in ('worker_reference_assigned_to_routes','route_weighting_applied','cross_route_phase_selected','exact_timetable_constructed','joint_vehicle_block_timetable_feasibility_evaluated','missed_connection_probability_calculated','final_reliability_proven','hard_s8_threshold_applied','candidate_eliminated_by_s8_opportunity_class','service_policy_selected','decision_budget_selected','primary_selected','runner_up_selected','historical_ranking_or_finalists_imported'):
              assert v[key] is False
          with gzip.open(root/'passenger_plans_s8_opportunity_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==16883
          assert all(r['s8_cross_route_phase_selected']=='false' for r in rows)
          assert all(r['s8_exact_timetable_constructed']=='false' for r in rows)
          assert all(r['s8_final_reliability_proven']=='false' for r in rows)
          print(json.dumps(v['s8_opportunity_class_counts'],indent=2,sort_keys=True))
          print(json.dumps(v['budget_opportunity_class_counts'],indent=2,sort_keys=True))
          PY

      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/s8-opportunity-rebuild
          mkdir -p /tmp/s8-opportunity-rebuild
          python scripts/phase2_build_s8_robust_opportunity_surface_v2.py \
            --passenger-frontier outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2.csv.gz \
            --passenger-validation outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2_validation.json \
            --current-s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json \
            --current-route-universe outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv \
            --current-scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz \
            --current-s8-events outputs/phase2/s8_events.csv \
            --current-policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv \
            --current-s8-contract outputs/phase2/s8_interchange_contract.json \
            --legacy-envelope /tmp/pinned-s8/envelope.csv.gz \
            --legacy-envelope-validation /tmp/pinned-s8/envelope_validation.json \
            --legacy-transfer-validation /tmp/pinned-s8/transfer_validation.json \
            --legacy-support-validation /tmp/pinned-s8/support_validation.json \
            --legacy-work-direction-summary /tmp/pinned-s8/work_direction_summary.csv \
            --legacy-work-weights-validation /tmp/pinned-s8/work_weights_validation.json \
            --output /tmp/s8-opportunity-rebuild/output.csv.gz \
            --validation /tmp/s8-opportunity-rebuild/validation.json >/dev/null
          cmp outputs/phase2/s8_robust_opportunity_v2/passenger_plans_s8_opportunity_v2.csv.gz /tmp/s8-opportunity-rebuild/output.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/phase2/s8_robust_opportunity_v2/s8_robust_opportunity_v2_validation.json').read_text())
          b=json.loads(Path('/tmp/s8-opportunity-rebuild/validation.json').read_text())
          assert a==b
          PY

      - name: Guard no synthetic selection
        run: |
          FILE=scripts/phase2_build_s8_robust_opportunity_surface_v2.py
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' "$FILE"
          ! grep -n -E 'hard_s8_threshold_applied.*True|candidate_eliminated_by_s8_opportunity_class.*True|primary_selected.*True|runner_up_selected.*True|historical_ranking_or_finalists_imported.*True' "$FILE"

      - name: Persist evidence
        run: |
          git config user.name "phase2-s8-opportunity-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/s8_robust_opportunity_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist S8 robust opportunity v2 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-s8-robust-opportunity-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/s8_robust_opportunity_v2
