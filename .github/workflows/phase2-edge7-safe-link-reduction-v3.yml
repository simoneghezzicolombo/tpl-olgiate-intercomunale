name: RT-027 edge-7 safe-link feasibility reduction V3

on:
  push:
    branches: [phase2-edge7-safe-link-reduction-v3]
    paths:
      - 'src/phase2_edge7_safe_link_reduction_v3.py'
      - 'tests/test_phase2_edge7_safe_link_reduction_v3.py'
      - 'scripts/phase2_run_rt027_edge7_safe_link_reduction_v3.py'
      - '.github/workflows/phase2-edge7-safe-link-reduction-v3.yml'
  pull_request:
    paths:
      - 'src/phase2_edge7_safe_link_reduction_v3.py'
      - 'tests/test_phase2_edge7_safe_link_reduction_v3.py'
      - 'scripts/phase2_run_rt027_edge7_safe_link_reduction_v3.py'
      - '.github/workflows/phase2-edge7-safe-link-reduction-v3.yml'

permissions:
  contents: read

jobs:
  exact-safe-link-reduction:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Compile and focused tests
        run: |
          python -m py_compile src/phase2_edge7_safe_link_reduction_v3.py
          python -m py_compile scripts/phase2_run_rt027_edge7_safe_link_reduction_v3.py
          python -m pytest -q tests/test_phase2_edge7_safe_link_reduction_v3.py
      - name: Validate frozen RT-022 identity
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          links=Path('outputs/phase2/rt022_minimum_backbones_v3/reciprocal_structural_links.csv')
          audit=Path('outputs/phase2/rt022_minimum_backbones_v3/rt022_minimum_backbone_audit.json')
          rows=list(csv.DictReader(links.open()))
          v=json.loads(audit.read_text())
          assert len(rows)==110
          assert v['status']=='PASS_EXACT_MINIMUM_TOPOLOGY_NEUTRAL_TERRITORIAL_BACKBONE_UNIVERSE'
          assert v['complete'] is True
          assert v['counts']['reciprocal_elementary_structural_links']==110
          assert v['digests']['structure_universe_sha256']=='1d6ccd18a5707aa8e2e51b1eefcc9d27056678f0d5e260c9027d1414a1ddf8d7'
          h=hashlib.sha256(links.read_bytes()).hexdigest()
          assert h=='009789fbaf2cf5434555075c1de6a6931bee3bbc0473580e26a79a82d827885d'
          PY
      - name: Run exact real safe-link reduction
        run: |
          rm -rf outputs/phase2/rt027_edge7_safe_link_reduction_v3
          python scripts/phase2_run_rt027_edge7_safe_link_reduction_v3.py \
            --links outputs/phase2/rt022_minimum_backbones_v3/reciprocal_structural_links.csv \
            --stop-inventory outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv
      - name: Assert reduction boundaries
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          out=Path('outputs/phase2/rt027_edge7_safe_link_reduction_v3')
          audit=json.loads((out/'rt027_edge7_safe_link_reduction_audit.json').read_text())
          rows=list(csv.DictReader((out/'edge7_safe_link_feasibility.csv').open()))
          assert audit['status']=='PASS_EXACT_EDGE7_SAFE_LINK_FEASIBILITY_REDUCTION_V3'
          assert audit['complete'] is True
          assert len(rows)==110
          assert audit['counts']['structural_links']==110
          assert audit['counts']['retained_safe_superset_links'] + audit['counts']['safely_excludable_links']==110
          assert all(value is False for value in audit['guards'].values())
          for row in rows:
              minimum=int(row['minimum_policy_covering_edges_including_link'])
              retained=row['retained_for_edge7_safe_superset']=='True'
              excluded=row['safely_excludable_from_edge7']=='True'
              assert retained == (minimum <= 7)
              assert excluded == (minimum > 7)
          PY
      - name: Anti-bias guards
        run: |
          ! grep -nE 'PRIMARY|RUNNER-UP|np\.random|numpy\.random|import random|from random|Cassina|Circolare Meratese' \
            src/phase2_edge7_safe_link_reduction_v3.py \
            scripts/phase2_run_rt027_edge7_safe_link_reduction_v3.py
          git diff --check
      - name: Upload RT-027 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-rt027-edge7-safe-link-reduction-v3
          path: outputs/phase2/rt027_edge7_safe_link_reduction_v3/
          if-no-files-found: error
          retention-days: 90
