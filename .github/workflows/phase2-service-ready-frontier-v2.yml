name: Phase 2 Service-Ready Frontier V2

on:
  push:
    branches:
      - phase2-robustness-final-v2
    paths:
      - 'scripts/phase2_build_service_ready_frontier_v2.py'
      - 'tests/test_phase2_service_ready_frontier_v2.py'
      - '.github/workflows/phase2-service-ready-frontier-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-service-ready-frontier-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile scripts/phase2_build_service_ready_frontier_v2.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Unit tests
        run: python -m pytest -q tests/test_phase2_service_ready_frontier_v2.py

      - name: Build budget-neutral service-ready frontier
        run: >-
          python scripts/phase2_build_service_ready_frontier_v2.py
          --access outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz
          --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json
          --pre-gjt outputs/phase2/pre_gjt_screening_v2/pre_gjt_scenario_timing_screening_v2.csv.gz
          --pre-gjt-validation outputs/phase2/pre_gjt_screening_v2/pre_gjt_screening_v2_validation.json
          --current-baseline-validation outputs/phase2/current_service_access_baseline_v2/current_service_access_baseline_v2_validation.json
          --territorial outputs/phase2/territorial_commuting_addressability_v2/scenario_territorial_commuting_addressability_v2.csv.gz
          --territorial-validation outputs/phase2/territorial_commuting_addressability_v2/territorial_commuting_addressability_v2_validation.json
          --operational outputs/phase2/operational_screening_v2/operational_screening_v2.csv
          --operational-validation outputs/phase2/operational_screening_v2/operational_screening_v2_validation.json
          --reference-frontier outputs/phase2/multiblock_frontier_v2/scenario_timing_multiblock_frontier_v2.csv
          --reference-frontier-validation outputs/phase2/multiblock_frontier_v2/multiblock_frontier_v2_validation.json
          --frontier-output outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_v2.csv
          --audit-output outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_audit_v2.csv
          --validation-output outputs/phase2/service_ready_frontier_v2/service_ready_frontier_v2_validation.json

      - name: Validate budget-neutral contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('outputs/phase2/service_ready_frontier_v2')
          v=json.loads((root/'service_ready_frontier_v2_validation.json').read_text(encoding='utf-8'))
          assert v['status']=='PASS_PHASE2_SERVICE_READY_FRONTIER_V2'
          assert v['contract']=='PHASE2_BUDGET_NEUTRAL_SERVICE_READY_PARETO_V2'
          assert v['candidate_scenario_count']==100000
          assert v['timing_archetype_count']==8
          assert v['budget_filter_applied'] is False
          assert v['decision_budget_selected'] is False
          assert v['calendar_selected'] is False
          assert v['recovery_selected'] is False
          assert v['service_policy_selected'] is False
          assert v['s8_phase_selected'] is False
          assert v['exact_timetable_constructed'] is False
          assert v['weighted_composite_score'] is False
          assert v['full_gjt_calculated'] is False
          assert v['passenger_demand_assigned_to_routes'] is False
          assert v['mode_choice_inferred'] is False
          assert v['ridership_forecast'] is False
          assert v['positive_extensions_selected'] is False
          assert v['territorial_evaluated_worker_mass']==1855
          assert 'public_equal_pattern_set_cycle_distance_km_lower_bound' in v['pareto_minimise_axes']
          assert 'public_equal_pattern_set_cycle_runtime_min_lower_bound' in v['pareto_minimise_axes']
          assert v['production_monotonicity_contract']['purpose']=='SAFE_SUPERSET_FOR_LATER_NO_EXTENSION_POLICY_AND_BUDGET_FRONTIERS'
          for timing, s in v['timing_frontiers'].items():
              assert s['rows']==100000
              assert s['reference_budget_frontier_missing_count']==0
              assert s['frontier_scenario_count'] >= s['reference_budget_frontier_scenario_count']
          with (root/'scenario_timing_service_ready_frontier_v2.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==v['frontier_row_count_all_timings']
          print(json.dumps({
              'frontier_rows': v['frontier_row_count_all_timings'],
              'outside_reference_slice': v['service_ready_frontier_outside_reference_slice_count_all_timings'],
          }, indent=2, sort_keys=True))
          PY

      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/phase2-service-ready-v2
          mkdir -p /tmp/phase2-service-ready-v2
          python scripts/phase2_build_service_ready_frontier_v2.py \
            --access outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz \
            --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json \
            --pre-gjt outputs/phase2/pre_gjt_screening_v2/pre_gjt_scenario_timing_screening_v2.csv.gz \
            --pre-gjt-validation outputs/phase2/pre_gjt_screening_v2/pre_gjt_screening_v2_validation.json \
            --current-baseline-validation outputs/phase2/current_service_access_baseline_v2/current_service_access_baseline_v2_validation.json \
            --territorial outputs/phase2/territorial_commuting_addressability_v2/scenario_territorial_commuting_addressability_v2.csv.gz \
            --territorial-validation outputs/phase2/territorial_commuting_addressability_v2/territorial_commuting_addressability_v2_validation.json \
            --operational outputs/phase2/operational_screening_v2/operational_screening_v2.csv \
            --operational-validation outputs/phase2/operational_screening_v2/operational_screening_v2_validation.json \
            --reference-frontier outputs/phase2/multiblock_frontier_v2/scenario_timing_multiblock_frontier_v2.csv \
            --reference-frontier-validation outputs/phase2/multiblock_frontier_v2/multiblock_frontier_v2_validation.json \
            --frontier-output /tmp/phase2-service-ready-v2/frontier.csv \
            --audit-output /tmp/phase2-service-ready-v2/audit.csv \
            --validation-output /tmp/phase2-service-ready-v2/validation.json >/dev/null
          cmp outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_v2.csv /tmp/phase2-service-ready-v2/frontier.csv
          cmp outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_audit_v2.csv /tmp/phase2-service-ready-v2/audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          left=json.loads(Path('outputs/phase2/service_ready_frontier_v2/service_ready_frontier_v2_validation.json').read_text())
          right=json.loads(Path('/tmp/phase2-service-ready-v2/validation.json').read_text())
          for payload in (left,right):
              payload['lineage'].pop('frontier_output',None)
              payload['lineage'].pop('audit_output',None)
          assert left==right
          PY

      - name: Guard no synthetic inference
        run: |
          FILE='scripts/phase2_build_service_ready_frontier_v2.py'
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILE
          ! grep -n -E 'weighted_composite_score.*True|passenger_demand_assigned_to_routes.*True|mode_choice_inferred.*True|ridership_forecast.*True|full_gjt_calculated.*True|decision_budget_selected.*True|service_policy_selected.*True' $FILE

      - name: Persist evidence
        run: |
          git config user.name "phase2-service-ready-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/service_ready_frontier_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist service-ready frontier v2 [skip ci]"
            git push origin HEAD:phase2-robustness-final-v2
          fi

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-service-ready-frontier-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/service_ready_frontier_v2
