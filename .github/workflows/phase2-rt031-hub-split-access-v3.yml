name: RT031 hub-split exact walking access V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_audit_rt031_hub_split_access_v3.py
      - .github/workflows/phase2-rt031-hub-split-access-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas
      - name: Acquire pinned typed and walking evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/typed /tmp/walk
          gh api repos/${{ github.repository }}/actions/artifacts/10702692659/zip > /tmp/typed.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9991182904/zip > /tmp/walk.zip
          echo 'e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28  /tmp/walk.zip' | sha256sum -c
          unzip -q /tmp/typed.zip -d /tmp/typed
          unzip -q /tmp/walk.zip -d /tmp/walk
          echo 'c0169f3e39e1132853c2e8324d00bbb3030dbf5219c65889eee6ae4acf31b32e  /tmp/typed/hub-split-typed-a.json' | sha256sum -c
      - name: Calculate exact walking access twice
        run: |
          walk=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv | head -1)
          for replica in a b; do
            python -m scripts.phase2_audit_rt031_hub_split_access_v3 \
              --typed /tmp/typed/hub-split-typed-a.json \
              --walk-matrix "$walk" \
              --output "/tmp/hub-split-access-$replica.json"
          done
          cmp /tmp/hub-split-access-a.json /tmp/hub-split-access-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-hub-split-exact-walk-access-v3
          path: /tmp/hub-split-access-a.json
          if-no-files-found: error
