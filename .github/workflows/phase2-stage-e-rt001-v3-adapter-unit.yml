name: Phase 2 Stage E RT001 V3 Adapter Unit

on:
  push:
    branches: [phase2-stage-e-rt001-v3-final-a]
    paths:
      - 'src/phase2_final_operational_robustness_v2.py'
      - 'scripts/phase2_build_final_operational_robustness_v2.py'
      - 'scripts/phase2_run_final_operational_robustness_rt001_v3.py'
      - 'scripts/phase2_run_final_operational_robustness_rt001_v3_stream.py'
      - 'tests/test_phase2_final_operational_robustness_v2.py'
      - 'tests/test_phase2_final_operational_robustness_rt001_v3_adapter.py'
      - '.github/workflows/phase2-stage-e-rt001-v3-adapter-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile unchanged engine and V3 adapter
        run: |
          python -m py_compile src/phase2_final_operational_robustness_v2.py
          python -m py_compile scripts/phase2_build_final_operational_robustness_v2.py
          python -m py_compile scripts/phase2_run_final_operational_robustness_rt001_v3.py
          python -m py_compile scripts/phase2_run_final_operational_robustness_rt001_v3_stream.py
      - name: Install pytest
        run: python -m pip install --disable-pip-check 'pytest>=8,<10' || python -m pip install --disable-pip-version-check 'pytest>=8,<10'
      - name: Engine and adapter regression tests
        run: |
          python -m pytest -q \
            tests/test_phase2_final_operational_robustness_v2.py \
            tests/test_phase2_final_operational_robustness_rt001_v3_adapter.py
      - name: Prove Stage-E engine remains byte-identical to readiness parent
        run: |
          git fetch origin phase2-stage-e-rt001-v3-readiness
          test "$(git rev-parse HEAD:src/phase2_final_operational_robustness_v2.py)" = "$(git rev-parse origin/phase2-stage-e-rt001-v3-readiness:src/phase2_final_operational_robustness_v2.py)"
          test "$(git rev-parse HEAD:scripts/phase2_build_final_operational_robustness_v2.py)" = "$(git rev-parse origin/phase2-stage-e-rt001-v3-readiness:scripts/phase2_build_final_operational_robustness_v2.py)"
          test "$(git rev-parse HEAD:config/phase2_final_operational_robustness_v2.json)" = "$(git rev-parse origin/phase2-stage-e-rt001-v3-readiness:config/phase2_final_operational_robustness_v2.json)"
      - name: Guard adapter epistemic boundary
        run: |
          FILES='scripts/phase2_run_final_operational_robustness_rt001_v3.py scripts/phase2_run_final_operational_robustness_rt001_v3_stream.py'
          ! grep -En 'np\.random|numpy\.random|(^|[[:space:]])import random|from random|requests\.|urllib\.|httpx\.' $FILES
          ! grep -En 'primary_selected[^\n]{0,40}(True|"true")|runner_up_selected[^\n]{0,40}(True|"true")|weighted_composite_score[^\n]{0,40}(True|"true")' $FILES
          git diff --check
