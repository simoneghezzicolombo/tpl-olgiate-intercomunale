name: Phase 2 Corridor Reciprocity V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-corridor-reciprocity-contract-v3
    paths:
      - src/phase2_corridor_reciprocity_v3.py
      - tests/test_phase2_corridor_reciprocity_v3.py
      - scripts/phase2_audit_corridor_reciprocity_v3.py
      - docs/PHASE2_CORRIDOR_RECIPROCITY_V3.md
      - .github/workflows/phase2-corridor-reciprocity-v3.yml

permissions:
  contents: read

concurrency:
  group: phase2-corridor-reciprocity-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reciprocity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-corridor-reciprocity-contract-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 \
            pytest==8.3.5

      - name: Compile RT-009 core and audit
        run: |
          python -m py_compile src/phase2_corridor_reciprocity_v3.py
          python -m py_compile scripts/phase2_audit_corridor_reciprocity_v3.py

      - name: Run RT-009 unit tests
        run: pytest -q tests/test_phase2_corridor_reciprocity_v3.py

      - name: Run controlled reciprocity audit
        run: python scripts/phase2_audit_corridor_reciprocity_v3.py

      - name: Validate RT-009 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/corridor_reciprocity_v3/corridor_reciprocity_v3_validation.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'PASS_RT009_DIRECTIONAL_RECIPROCITY_CONTRACT_V3'
          assert d['not_requested_is_unknown_not_infeasible'] is True
          assert d['both_directions_admitted_required'] is True
          assert d['multiple_corridor_variants_collapse_to_one_structural_link'] is True
          assert d['row_order_deterministic'] is True
          assert d['directional_only_service_authorized'] is False
          assert d['weighted_composite_score'] is False
          assert d['territorial_candidate_claim'] is False
          PY

      - name: Guard against geography, stops, winner logic and random search
        run: |
          ! grep -niE 'Arlate|Beverate|Perego|Mondonico|Calco|Brivio|Olgiate|Santa Maria|proposed_stop_candidates|passenger_stop_foundation|C146|ASF' src/phase2_corridor_reciprocity_v3.py
          ! grep -nE 'PRIMARY|RUNNER-UP|RECOMMENDED_ROUTE|NETWORK_WINNER|TOPOLOGY_SCORE' src/phase2_corridor_reciprocity_v3.py
          ! grep -nE 'np\.random|numpy\.random|random\.' src/phase2_corridor_reciprocity_v3.py scripts/phase2_audit_corridor_reciprocity_v3.py

      - name: Whitespace check
        run: git diff --check

      - name: Upload RT-009 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-corridor-reciprocity-v3
          path: outputs/phase2/corridor_reciprocity_v3/corridor_reciprocity_v3_validation.json
          if-no-files-found: error
