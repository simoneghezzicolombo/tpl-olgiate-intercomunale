name: Phase 2 DBGT footprint duplicate probe

# Exhaustive diagnostic workflow. No sampling.
on:
  push:
    branches: [phase2-building-population]
    paths:
      - scripts/phase2_probe_dbgt_footprint_duplicates.py
      - .github/workflows/phase2-dbgt-footprint-duplicate-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused geospatial dependencies
        run: >-
          python -m pip install --upgrade
          pandas requests geopandas pyogrio shapely pyproj openpyxl networkx scipy
      - name: Compile probe
        run: python -m py_compile scripts/phase2_probe_dbgt_footprint_duplicates.py
      - name: Exhaustively inspect repeated active CLASSREF footprints
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/phase2_probe_dbgt_footprint_duplicates.py \
            | tee /tmp/dbgt-footprint-duplicate-probe.log
      - name: Reject random or sampled duplicate audit
        run: |
          ! grep -R --line-number -E 'np\.random|random\.' scripts/phase2_probe_dbgt_footprint_duplicates.py
          python - <<'PY'
          import json
          p = json.load(open('/tmp/dbgt-footprint-duplicate-probe.json'))
          assert p['random_used'] is False
          assert p['sampling_used'] is False
          assert p['bbox_candidate_object_ids'] == p['returned_attribute_rows']
          assert p['duplicate_geometry_rows_fetched'] == p['duplicate_footprint_rows']
          print(json.dumps({k:v for k,v in p.items() if k != 'details'}, indent=2))
          PY
      - name: Upload duplicate evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dbgt-footprint-duplicate-probe-${{ github.sha }}
          path: |
            /tmp/dbgt-footprint-duplicate-probe.json
            /tmp/dbgt-footprint-duplicate-attributes.csv
            /tmp/dbgt-footprint-duplicate-probe.log
          if-no-files-found: error
          retention-days: 30
