name: Phase 2 Final Stop Materialization V3

on:
  push:
    branches:
      - phase2-final-stop-materialization-v3
    paths:
      - src/phase2_final_stop_materialization_v3.py
      - scripts/phase2_build_final_stop_materialization_v3.py
      - tests/test_phase2_final_stop_materialization_v3.py
      - docs/PHASE2_FINAL_STOP_MATERIALIZATION_V3.md
      - .github/workflows/phase2-final-stop-materialization-v3.yml
      - outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv
      - outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_validation_gpt_v5.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            pytest==8.3.5

      - name: Compile RT-018
        run: |
          python -m py_compile src/phase2_final_stop_materialization_v3.py
          python -m py_compile scripts/phase2_build_final_stop_materialization_v3.py

      - name: Run focused tests
        run: pytest -q tests/test_phase2_final_stop_materialization_v3.py

      - name: Build current-graph compatibility evidence
        run: python scripts/phase2_build_final_stop_materialization_v3.py

      - name: Validate production contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/final_stop_materialization_v3/final_stop_materialization_v3_validation.json')
          v = json.loads(p.read_text(encoding='utf-8'))
          assert v['status'] == 'PASS_FINAL_STOP_MATERIALIZATION_V3', v
          assert all(v['checks'].values()), v['checks']
          assert v['counts']['stop_places_total'] == 36
          assert v['counts']['by_municipality'] == {
              'Brivio': 10,
              'Calco': 9,
              'La Valletta Brianza': 4,
              'Olgiate Molgora': 6,
              'Santa Maria Hoè': 7,
          }
          assert v['guards']['obsolete_43_stop_bridge_active'] is False
          assert v['guards']['new_stop_created'] is False
          assert v['guards']['structural_anchor_promoted_to_passenger_stop'] is False
          assert v['guards']['special_service_auto_promoted'] is False
          assert v['guards']['rt017_graph_rebind_required_before_final_territorial_search'] is True
          print(json.dumps(v, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Deterministic rebuild check
        run: |
          mkdir -p /tmp/rt018-first
          cp outputs/phase2/final_stop_materialization_v3/stop_graph_attachments_v3.csv /tmp/rt018-first/
          cp outputs/phase2/final_stop_materialization_v3/final_stop_materialization_v3_validation.json /tmp/rt018-first/
          rm -rf outputs/phase2/final_stop_materialization_v3
          python scripts/phase2_build_final_stop_materialization_v3.py >/tmp/rt018-second.log
          cmp /tmp/rt018-first/stop_graph_attachments_v3.csv outputs/phase2/final_stop_materialization_v3/stop_graph_attachments_v3.csv
          cmp /tmp/rt018-first/final_stop_materialization_v3_validation.json outputs/phase2/final_stop_materialization_v3/final_stop_materialization_v3_validation.json

      - name: Anti-invention and lineage guards
        run: |
          ! grep -nE 'np\.random|numpy\.random|import random|from random' src/phase2_final_stop_materialization_v3.py scripts/phase2_build_final_stop_materialization_v3.py
          ! grep -n 'alpha_stop_inventory_bridge_v3.csv' scripts/phase2_build_final_stop_materialization_v3.py src/phase2_final_stop_materialization_v3.py
          ! grep -nE 'Cassina|Circolare Meratese|PRIMARY|RUNNER-UP' src/phase2_final_stop_materialization_v3.py scripts/phase2_build_final_stop_materialization_v3.py
          git diff --check

      - name: Upload RT-018 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-final-stop-materialization-v3
          path: outputs/phase2/final_stop_materialization_v3/
          if-no-files-found: error

      - name: Persist validated evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/phase2/final_stop_materialization_v3/
          if git diff --cached --quiet; then
            echo 'No RT-018 evidence changes to persist.'
          else
            git commit -m 'audit: persist RT-018 final stop materialization evidence'
            git push origin HEAD:phase2-final-stop-materialization-v3
          fi
