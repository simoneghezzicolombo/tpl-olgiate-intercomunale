name: Phase 2 · Tra Paesi site QA

on:
  push:
    branches:
      - phase2-site-tra-paesi
    paths:
      - index.html
      - styles.css
      - app.js
      - network-data.js
      - geo-data.js
      - geo-map.js
      - geo-map.css
      - robots.txt
      - .nojekyll
      - .github/workflows/phase2-site-tra-paesi-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check network-data.js
          node --check app.js
          node --check geo-data.js
          node --check geo-map.js

      - name: Certified data contract
        run: |
          node <<'NODE'
          global.window = {};
          global.document = { createElement: () => ({}), head: { appendChild: () => {} } };
          require('./network-data.js');
          require('./geo-data.js');
          const d = window.TRA_PAESI_DATA;
          const g = window.TRA_PAESI_GEO;
          const fail = (m) => { throw new Error(m); };
          d.evidence.diagnostic === 'aa16a9934a78be9a3ee1230996fcaf72c5657f92' || fail('wrong diagnostic evidence commit');
          Object.keys(d.finalists).length === 4 || fail('site must expose exactly 4 finalists');
          d.packages['16'].exactTrips === 32 || fail('16h exact trip count drift');
          d.packages['18.5'].exactTrips === 36 || fail('18h30 exact trip count drift');
          d.packages['16'].routes.length === 2 || fail('16h route count drift');
          d.packages['18.5'].routes.length === 2 || fail('18h30 route count drift');
          for (const pkg of Object.values(d.packages)) {
            for (const route of pkg.routes) {
              route.perfectClockface === true || fail('all finalist public routes must remain H60 clockface');
              route.technicalClosureMin === 0 || fail('technical closure drift');
              route.anchors[0].kind === 'hub' || fail('route must start at certified hub');
              route.anchors.at(-1).kind === 'hub' || fail('route must return to certified hub');
            }
          }

          g.provenance.finalists === d.evidence.diagnostic || fail('geo finalist evidence drift');
          g.provenance.currentServiceV4 === '95d99b52bff4558c6ab40b5514fa6d09ba3b1e50' || fail('geo current-service V4 pin drift');
          g.provenance.currentGtfsFrozen === '4ab527827456eb40572a72b4c7b87f8fe5f4dcac' || fail('geo GTFS freeze pin drift');
          Object.keys(g.proposedPackages).sort().join(',') === '16,18.5' || fail('geo package set drift');
          g.proposedPackages['16'].length === 2 && g.proposedPackages['18.5'].length === 2 || fail('geo proposed route count drift');
          g.currentPatterns.length === 4 || fail('expected four frozen representative ordinary patterns');
          new Set(g.currentPatterns.map(p => p.route)).size === 2 || fail('current map must contain D184 and D185');
          for (const [pkg, routes] of Object.entries(g.proposedPackages)) {
            for (const route of routes) {
              route.anchors[0] === g.hub.id && route.anchors.at(-1) === g.hub.id || fail(`geo ${pkg} route must start/end at hub`);
              for (const id of route.anchors) {
                const stop = id === g.hub.id ? g.hub : g.proposedStops[id];
                stop || fail(`missing geo stop ${id}`);
                Number.isFinite(stop.lat) && Number.isFinite(stop.lon) || fail(`invalid coordinates ${id}`);
              }
            }
          }
          for (const pattern of g.currentPatterns) {
            for (const id of pattern.stopIds) g.currentStops[id] || fail(`missing frozen current stop ${id}`);
          }
          /not official route alignments/i.test(g.provenance.geometryContract) || fail('geometry reconstruction caveat missing');
          console.log('PASS: certified finalist snapshot and geographic lineage are internally closed');
          NODE

      - name: Static semantic checks
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('app.js').read_text(encoding='utf-8')
          data = Path('network-data.js').read_text(encoding='utf-8')
          geo_js = Path('geo-map.js').read_text(encoding='utf-8')
          geo_data = Path('geo-data.js').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')
          geo_css = Path('geo-map.css').read_text(encoding='utf-8')

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.buttons_without_type = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'button' and not attrs.get('type'):
                      self.buttons_without_type.append(attrs)

          p = AuditParser()
          p.feed(html)
          duplicates = sorted({x for x in p.ids if p.ids.count(x) > 1})
          assert not duplicates, f'Duplicate HTML ids: {duplicates}'
          assert not p.buttons_without_type, 'All static buttons must declare type=button'
          assert 'name="robots" content="noindex,nofollow,noarchive"' in html, 'Preview must remain noindex'
          assert 'href="styles.css"' in html and 'src="network-data.js"' in html and 'src="app.js"' in html, 'Static assets must remain linked'

          forbidden = ['Modello Merate', 'LINEA 8 OLGIATE', 'Sistema Circolare Intercomunale a Doppio Verso']
          for term in forbidden:
              assert term.lower() not in html.lower(), f'Legacy branding regression: {term}'

          selectors = set(re.findall(r'querySelector\([\"\']#([A-Za-z0-9_-]+)[\"\']\)', js))
          missing = sorted(selectors - set(p.ids))
          assert not missing, f'JS references missing static HTML ids: {missing}'

          required = ['--paper', '--ink', '--accent', 'prefers-reduced-motion', ':focus-visible']
          for token in required:
              assert token in css, f'Missing CSS contract token: {token}'

          assert 'document.startViewTransition' in js, 'Smooth state transition layer missing'
          assert 'IntersectionObserver' in js, 'Progressive reveal/navigation layer missing'
          assert 'history.replaceState' in js, 'Shareable decision state missing'
          assert 'aa16a9934a78be9a3ee1230996fcaf72c5657f92' in data, 'Evidence pin missing from data snapshot'
          assert 'router.project-osrm.org' in geo_js, 'Road-following reconstruction provider missing'
          assert 'fallback' in geo_js.lower(), 'Geographic graceful fallback missing'
          assert 'leaflet' in geo_js.lower(), 'Interactive map engine missing'
          assert 'section-map' in geo_css and 'tp-marker' in geo_css, 'Geographic visual system missing'
          assert '4ab527827456eb40572a72b4c7b87f8fe5f4dcac' in geo_data, 'Frozen current GTFS lineage missing'
          print(f'PASS: {len(p.ids)} static ids, map module present, semantic guards intact')

      - name: Epistemic UI guard
        shell: python
        run: |
          from pathlib import Path
          text = (Path('index.html').read_text() + Path('app.js').read_text() + Path('network-data.js').read_text() + Path('geo-map.js').read_text() + Path('geo-data.js').read_text()).lower()
          forbidden_claims = [
              'probabilità empirica di perdita',
              'punteggio complessivo',
              'vincitore automatico',
              'geometria stradale certificata',
              'tracciato ufficiale definitivo',
          ]
          for claim in forbidden_claims:
              assert claim not in text, f'Unsupported decision claim in site: {claim}'
          assert 'ricostruzione' in text and 'non un allineamento ufficiale' in text, 'Road-geometry caveat missing'
          assert 'primary / runner-up' in text and 'non assegnati' in text, 'Non-decision contract missing'
          print('PASS: no unsupported decision claims and road-reconstruction caveat intact')
