name: Phase 2 Multiblock Frontier V2

on:
  push:
    branches:
      - phase2-robustness-final-v2
    paths:
      - 'scripts/phase2_build_multiblock_frontier_v2.py'
      - 'tests/test_phase2_multiblock_frontier_v2.py'
      - '.github/workflows/phase2-multiblock-frontier-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-multiblock-frontier-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile scripts/phase2_build_multiblock_frontier_v2.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Unit tests
        run: python -m pytest -q tests/test_phase2_multiblock_frontier_v2.py

      - name: Build multiblock frontier from full hard-eligible universe
        run: >-
          python scripts/phase2_build_multiblock_frontier_v2.py
          --access outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz
          --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json
          --pre-gjt outputs/phase2/pre_gjt_screening_v2/pre_gjt_scenario_timing_screening_v2.csv.gz
          --pre-gjt-validation outputs/phase2/pre_gjt_screening_v2/pre_gjt_screening_v2_validation.json
          --current-baseline-validation outputs/phase2/current_service_access_baseline_v2/current_service_access_baseline_v2_validation.json
          --territorial outputs/phase2/territorial_commuting_addressability_v2/scenario_territorial_commuting_addressability_v2.csv.gz
          --territorial-validation outputs/phase2/territorial_commuting_addressability_v2/territorial_commuting_addressability_v2_validation.json
          --prior-frontier outputs/phase2/robustness_frontier_v2/scenario_timing_frontier_v2.csv
          --prior-frontier-validation outputs/phase2/robustness_frontier_v2/robustness_frontier_v2_validation.json
          --frontier-output outputs/phase2/multiblock_frontier_v2/scenario_timing_multiblock_frontier_v2.csv
          --audit-output outputs/phase2/multiblock_frontier_v2/scenario_timing_multiblock_frontier_audit_v2.csv
          --validation-output outputs/phase2/multiblock_frontier_v2/multiblock_frontier_v2_validation.json

      - name: Validate no-weight multiblock contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('outputs/phase2/multiblock_frontier_v2')
          v=json.loads((root/'multiblock_frontier_v2_validation.json').read_text(encoding='utf-8'))
          assert v['status']=='PASS_PHASE2_MULTIBLOCK_FRONTIER_V2'
          assert v['contract']=='PHASE2_NO_WEIGHT_MULTIBLOCK_SCENARIO_TIMING_PARETO_V2'
          assert v['candidate_scenario_count']==100000
          assert v['weighted_composite_score'] is False
          assert v['full_gjt_calculated'] is False
          assert v['passenger_demand_assigned_to_routes'] is False
          assert v['mode_choice_inferred'] is False
          assert v['ridership_forecast'] is False
          assert v['exact_timetable_constructed'] is False
          assert v['service_policy_selected'] is False
          assert v['prior_frontier_used_as_filter'] is False
          assert v['territorial_evaluated_worker_mass']==1855
          assert v['territorial_evaluated_other_core_worker_mass']==1055
          assert v['territorial_evaluated_other_external_worker_mass']==800
          assert v['territorial_unrepresented_worker_mass_not_scored']==3702
          assert 'territorial_other_core_worker_mass_upper_bound' in v['pareto_maximise_axes']
          assert 'territorial_other_external_worker_mass_upper_bound' in v['pareto_maximise_axes']
          assert v['frontier_row_count_all_timings'] > 0
          assert v['frontier_row_count_headway_30_or_better'] > 0
          with (root/'scenario_timing_multiblock_frontier_v2.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==v['frontier_row_count_all_timings']
          assert any(int(r['uniform_headway_min'])<=30 for r in rows)
          print(json.dumps({
              'frontier_rows': v['frontier_row_count_all_timings'],
              'headway_30_or_better_rows': v['frontier_row_count_headway_30_or_better'],
              'recovered_due_to_territorial_axes': v['recovered_due_to_territorial_axes_count_all_timings'],
          }, indent=2, sort_keys=True))
          PY

      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/phase2-multiblock-v2
          mkdir -p /tmp/phase2-multiblock-v2
          python scripts/phase2_build_multiblock_frontier_v2.py \
            --access outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz \
            --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json \
            --pre-gjt outputs/phase2/pre_gjt_screening_v2/pre_gjt_scenario_timing_screening_v2.csv.gz \
            --pre-gjt-validation outputs/phase2/pre_gjt_screening_v2/pre_gjt_screening_v2_validation.json \
            --current-baseline-validation outputs/phase2/current_service_access_baseline_v2/current_service_access_baseline_v2_validation.json \
            --territorial outputs/phase2/territorial_commuting_addressability_v2/scenario_territorial_commuting_addressability_v2.csv.gz \
            --territorial-validation outputs/phase2/territorial_commuting_addressability_v2/territorial_commuting_addressability_v2_validation.json \
            --prior-frontier outputs/phase2/robustness_frontier_v2/scenario_timing_frontier_v2.csv \
            --prior-frontier-validation outputs/phase2/robustness_frontier_v2/robustness_frontier_v2_validation.json \
            --frontier-output /tmp/phase2-multiblock-v2/frontier.csv \
            --audit-output /tmp/phase2-multiblock-v2/audit.csv \
            --validation-output /tmp/phase2-multiblock-v2/validation.json >/dev/null
          cmp outputs/phase2/multiblock_frontier_v2/scenario_timing_multiblock_frontier_v2.csv /tmp/phase2-multiblock-v2/frontier.csv
          cmp outputs/phase2/multiblock_frontier_v2/scenario_timing_multiblock_frontier_audit_v2.csv /tmp/phase2-multiblock-v2/audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          left=json.loads(Path('outputs/phase2/multiblock_frontier_v2/multiblock_frontier_v2_validation.json').read_text())
          right=json.loads(Path('/tmp/phase2-multiblock-v2/validation.json').read_text())
          for payload in (left,right):
              payload['lineage'].pop('frontier_output',None)
              payload['lineage'].pop('audit_output',None)
          assert left==right
          PY

      - name: Guard no synthetic inference
        run: |
          FILE='scripts/phase2_build_multiblock_frontier_v2.py'
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILE
          ! grep -n -E 'weighted_composite_score.*True|passenger_demand_assigned_to_routes.*True|mode_choice_inferred.*True|ridership_forecast.*True|full_gjt_calculated.*True' $FILE

      - name: Persist evidence
        run: |
          git config user.name "phase2-multiblock-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/multiblock_frontier_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist multiblock frontier v2 [skip ci]"
            git push origin HEAD:phase2-robustness-final-v2
          fi

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-multiblock-frontier-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/multiblock_frontier_v2
