name: RT031 single-line diversified physical search V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_budgeted_walk_search_v3.py
      - scripts/phase2_search_rt031_affordable_walks_v3.py
      - tests/test_phase2_rt031_budgeted_walk_search_v3.py
      - .github/workflows/phase2-rt031-single-line-diversified-search-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  diversified-single-line-search:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest tests/test_phase2_rt031_budgeted_walk_search_v3.py -q
      - name: Acquire pinned physical and walking evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rt031-inputs/{rt017,rt022,rt030} /tmp/via /tmp/walk
          gh api repos/${{ github.repository }}/actions/artifacts/9972204236/zip > /tmp/rt017.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9988386073/zip > /tmp/rt022.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9992507233/zip > /tmp/rt030.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10023387513/zip > /tmp/via.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9991182904/zip > /tmp/walk.zip
          echo 'e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225  /tmp/rt017.zip' | sha256sum -c
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          echo '1603606d02a170567c1d423b7689b7044933fff6490caeaf848ae0ca0f2d77d0  /tmp/via.zip' | sha256sum -c
          echo 'e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28  /tmp/walk.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-inputs/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-inputs/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-inputs/rt030
          unzip -q /tmp/via.zip -d /tmp/via
          unzip -q /tmp/walk.zip -d /tmp/walk
      - name: Search stop-rich and current-stop-rich single walks twice
        shell: bash
        run: |
          evidence=$(find /tmp/via -name '*.json' | head -1)
          walk=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv | head -1)
          mapfile -t preferred < <(python - <<'PY'
          import json
          p=json.load(open('outputs/phase2/rt031_current_exact_target_cover_v3/current_exact_target_cover_audit.json'))
          print('\n'.join(p['current_exact_identity_subset']['mapped_stop_place_ids']))
          PY
          )
          preferred_args=()
          for stop in "${preferred[@]}"; do preferred_args+=(--preferred-stop-id "$stop"); done
          for replica in a b; do
            for mode in available_stop_count preferred_stop_count; do
              out="/tmp/${replica}/${mode}"
              python scripts/phase2_search_rt031_affordable_walks_v3.py \
                --inputs /tmp/rt031-inputs --via-way-evidence "$evidence" \
                --walk-matrix "$walk" --out "$out" \
                --required-root-stop-id FROZEN::L00407 \
                --distance-budget-m 30000 --max-expansions 750000 \
                --priority-mode "$mode" "${preferred_args[@]}"
            done
          done
          diff -r /tmp/a /tmp/b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-single-line-diversified-physical-search-v3
          path: /tmp/a/
          if-no-files-found: error
