name: Phase 2 Network Structure Frontier V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-network-structure-frontier-v3
    paths:
      - src/phase2_network_structure_frontier_v3.py
      - tests/test_phase2_network_structure_frontier_v3.py
      - scripts/phase2_audit_network_structure_frontier_v3.py
      - docs/PHASE2_NETWORK_STRUCTURE_FRONTIER_V3.md
      - .github/workflows/phase2-network-structure-frontier-v3.yml

permissions:
  contents: read

concurrency:
  group: phase2-network-structure-frontier-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontier-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-network-structure-frontier-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile RT-008 core and audit
        run: |
          python -m py_compile src/phase2_network_structure_frontier_v3.py
          python -m py_compile scripts/phase2_audit_network_structure_frontier_v3.py

      - name: Run RT-008 unit tests
        run: pytest -q tests/test_phase2_network_structure_frontier_v3.py

      - name: Run connected-only equivalence audit
        run: python scripts/phase2_audit_network_structure_frontier_v3.py

      - name: Validate RT-008 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/network_structure_frontier_v3/network_structure_frontier_v3_validation.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'PASS_RT008_CONNECTED_ONLY_STRUCTURE_ENUMERATION_V3'
          assert d['k5_exact_signature_equivalence'] is True
          assert d['ladder_exact_signature_equivalence'] is True
          assert d['ladder_state_ratio_vs_exhaustive'] < 0.20
          assert d['cap_fail_closed'] is True
          assert d['random_search'] is False
          assert d['topology_generation_filter'] is False
          assert d['weighted_composite_score'] is False
          assert d['territorial_candidate_claim'] is False
          PY

      - name: Guard against geography, stops, topology priors and random search
        run: |
          ! grep -niE 'Arlate|Beverate|Perego|Mondonico|Calco|Brivio|Olgiate|Santa Maria|proposed_stop_candidates|passenger_stop_foundation|C146|ASF' src/phase2_network_structure_frontier_v3.py
          ! grep -nE 'PREFER_(PATH|CYCLE|TREE)|FORCE_(LOOP|FIGURE)|TOPOLOGY_SCORE|PRIMARY|RUNNER-UP|RECOMMENDED_ROUTE' src/phase2_network_structure_frontier_v3.py
          ! grep -nE 'np\.random|numpy\.random|random\.' src/phase2_network_structure_frontier_v3.py scripts/phase2_audit_network_structure_frontier_v3.py

      - name: Whitespace check
        run: git diff --check

      - name: Upload RT-008 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-network-structure-frontier-v3
          path: outputs/phase2/network_structure_frontier_v3/network_structure_frontier_v3_validation.json
          if-no-files-found: error
