name: RT031 south Olgiate provisional area V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_audit_rt031_south_olgiate_provisional_area_v3.py
      - tests/test_phase2_rt031_south_olgiate_provisional_area_v3.py
      - .github/workflows/phase2-rt031-south-olgiate-provisional-area-v3.yml
      - data/raw/osm/osm_highways_core.geojson
      - outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv
permissions:
  contents: read
  actions: read
jobs:
  provisional-area:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<4' 'scipy>=1.13,<2' 'shapely>=2,<3' 'pytest>=8,<10'
      - run: python -m pytest tests/test_phase2_rt031_south_olgiate_provisional_area_v3.py -q
      - name: Acquire pinned RT016 RT028 RT031 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/walk /tmp/typed /tmp/siting
          gh api repos/${{ github.repository }}/actions/artifacts/9991182904/zip > /tmp/walk.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10702692659/zip > /tmp/typed.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10800501329/zip > /tmp/siting.zip
          echo 'e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28  /tmp/walk.zip' | sha256sum -c
          unzip -q /tmp/walk.zip -d /tmp/walk
          unzip -q /tmp/typed.zip -d /tmp/typed
          unzip -q /tmp/siting.zip -d /tmp/siting
          echo 'c0169f3e39e1132853c2e8324d00bbb3030dbf5219c65889eee6ae4acf31b32e  /tmp/typed/hub-split-typed-a.json' | sha256sum -c
          echo '61c18718037efe5b38bd31f621175055028b8ecad916093ce04ebb88ec630815  /tmp/siting/olgiate-siting-a.json' | sha256sum -c
      - name: Reproduce provisional area sensitivity twice
        run: |
          matrix=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv | head -1)
          osm=$(find /tmp/walk -name rt028_osm_pedestrian_snapshot_v3.osm | head -1)
          population=$(find /tmp/walk -name rt016_border_neutral_population_units_v3.csv | head -1)
          test -n "$matrix" && test -n "$osm" && test -n "$population"
          for replica in a b; do
            python -m scripts.phase2_audit_rt031_south_olgiate_provisional_area_v3 \
              --typed /tmp/typed/hub-split-typed-a.json \
              --siting /tmp/siting/olgiate-siting-a.json \
              --matrix "$matrix" --pedestrian-osm "$osm" --population "$population" \
              --output "/tmp/south-olgiate-provisional-$replica.json"
          done
          cmp /tmp/south-olgiate-provisional-a.json /tmp/south-olgiate-provisional-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-south-olgiate-provisional-area-v3
          path: /tmp/south-olgiate-provisional-a.json
          if-no-files-found: error
