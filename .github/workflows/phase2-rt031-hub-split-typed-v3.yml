name: RT031 hub-split typed one-line V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_bind_rt031_hub_split_service_v3.py
      - .github/workflows/phase2-rt031-hub-split-typed-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  typed-hub-split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Acquire pinned physical and occurrence evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rt031-inputs/{rt017,rt022,rt030} /tmp/via /tmp/physical
          gh api repos/${{ github.repository }}/actions/artifacts/9972204236/zip > /tmp/rt017.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9988386073/zip > /tmp/rt022.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9992507233/zip > /tmp/rt030.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10023387513/zip > /tmp/via.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10702776319/zip > /tmp/physical.zip
          echo 'e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225  /tmp/rt017.zip' | sha256sum -c
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-inputs/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-inputs/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-inputs/rt030
          unzip -q /tmp/via.zip -d /tmp/via
          unzip -q /tmp/physical.zip -d /tmp/physical
          echo '14e39b47c09c4afe0d26d13b7369b906299db15d14690ba0e5d06e11b2fd7b7c  /tmp/via/rt031-successor-via-way-relevance.json' | sha256sum -c
          echo 'c1cca6630d01f6449c9a46baf527401392f6995a30c7a7b566c906004a738e71  /tmp/physical/hub-split-a.json' | sha256sum -c
      - name: Bind both ordered directions twice
        run: |
          for replica in a b; do
            python -m scripts.phase2_bind_rt031_hub_split_service_v3 \
              --source /tmp/physical/hub-split-a.json \
              --inputs /tmp/rt031-inputs \
              --via-way-evidence /tmp/via/rt031-successor-via-way-relevance.json \
              --output "/tmp/hub-split-typed-$replica.json"
          done
          cmp /tmp/hub-split-typed-a.json /tmp/hub-split-typed-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-hub-split-typed-one-line-v3
          path: /tmp/hub-split-typed-a.json
          if-no-files-found: error
