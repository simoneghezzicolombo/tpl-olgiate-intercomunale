name: phase2-border-neutral-catchment-population-v3

on:
  push:
    branches:
      - phase2-border-neutral-catchment-population-v3
  pull_request:
    paths:
      - 'src/phase2_border_neutral_catchment_population_v3.py'
      - 'tests/test_phase2_border_neutral_catchment_population_v3.py'
      - 'scripts/phase2_audit_border_neutral_catchment_population_v3.py'
      - 'scripts/phase2_build_border_neutral_catchment_population_v3.py'
      - 'docs/PHASE2_BORDER_NEUTRAL_CATCHMENT_POPULATION_V3.md'
      - '.github/workflows/phase2-border-neutral-catchment-population-v3.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract-test dependencies
        run: python -m pip install --upgrade pip pytest shapely

      - name: Compile RT-016 sources
        run: |
          python -m py_compile src/phase2_border_neutral_catchment_population_v3.py
          python -m py_compile scripts/phase2_audit_border_neutral_catchment_population_v3.py
          python -m py_compile scripts/phase2_build_border_neutral_catchment_population_v3.py

      - name: Run RT-016 tests
        run: pytest -q tests/test_phase2_border_neutral_catchment_population_v3.py

      - name: Run controlled RT-016 audit
        run: python scripts/phase2_audit_border_neutral_catchment_population_v3.py

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-border-neutral-catchment-population-v3-validation
          path: outputs/phase2/border_neutral_catchment_population_v3/border_neutral_catchment_population_v3_validation.json
          if-no-files-found: error
