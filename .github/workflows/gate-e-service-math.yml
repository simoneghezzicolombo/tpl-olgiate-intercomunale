name: Gate E service math

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [gate-e-workstream, antigravity-real-data]
    paths:
      - 'src/**'
      - 'scripts/gate_e_*.py'
      - 'scripts/10_service_simulation.py'
      - 'tests/test_gate_e_*.py'
      - 'tests/test_cycle_times.py'
      - 'schemas/gate_*.csv'
      - 'data/risorse_tpl_pdb.csv'
      - 'data/processed/gate_d_pass/**'
      - 'outputs/gate_e/**'
      - 'docs/GATE_E_*.md'
      - '.github/workflows/gate-e-service-math.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/gate_e_*.py'
      - 'scripts/10_service_simulation.py'
      - 'tests/test_gate_e_*.py'
      - 'tests/test_cycle_times.py'
      - 'schemas/gate_*.csv'
      - 'data/risorse_tpl_pdb.csv'
      - 'data/processed/gate_d_pass/**'
      - 'outputs/gate_e/**'
      - 'docs/GATE_E_*.md'
      - '.github/workflows/gate-e-service-math.yml'

jobs:
  service-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Diff whitespace audit
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/antigravity-real-data 2>/dev/null || true)
          if [ -n "$base" ]; then
            git diff --check "$base"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Compile
        shell: bash
        run: python -m py_compile src/*.py scripts/gate_e_*.py scripts/10_service_simulation.py
      - name: Gate E tests
        run: pytest -q tests/test_gate_e_*.py tests/test_cycle_times.py
      - name: Verify committed Gate D PASS snapshot hashes
        shell: bash
        run: |
          echo "0d2c187b888ce711da04fb96a8ff8f6e638f67980099e9d9e67a073b9b6cc2a1  data/processed/gate_d_pass/structural_candidate_metrics.csv" | sha256sum -c -
          echo "b12a047efc70f8cf816cd905a9a6de56ebfee200b1815295f42f75d2b9fbbf4e  data/processed/gate_d_pass/candidate_loop_evidence.csv" | sha256sum -c -
      - name: Gate C PASS pinned integration
        shell: bash
        run: |
          GATE_C_PASS=dcc3e75ae3b4f4ea5170f48e85345b83620c5536
          git cat-file -e "$GATE_C_PASS^{commit}"
          git show "$GATE_C_PASS:outputs/gate_c/live_bus_timetables_2026-09-03.json" > /tmp/gate_c_bus.json
          git show "$GATE_C_PASS:outputs/gate_c/live_trenord_2026-09-03.json" > /tmp/gate_c_rail.json
          python scripts/gate_e_gate_c_baseline.py \
            --bus-json /tmp/gate_c_bus.json \
            --rail-json /tmp/gate_c_rail.json \
            --gate-c-commit "$GATE_C_PASS" \
            --output /tmp/gate_e_gate_c_baseline.csv
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open('/tmp/gate_e_gate_c_baseline.csv', encoding='utf-8')))
          assert {r['service_id'] for r in rows} == {'D184', 'D185', 'D184+D185', 'S8@S01514'}
          assert all(r['annualization_status'] == 'FORBIDDEN_FROM_SINGLE_DATE_BASELINE' for r in rows)
          assert all(r['gate_c_commit'] == 'dcc3e75ae3b4f4ea5170f48e85345b83620c5536' for r in rows)
          assert {r['epistemic_status'] for r in rows} <= {'RECONSTRUCTED', 'DERIVED'}
          PY
      - name: Gate C pinned D184/D185 GTFS runtime calibration
        shell: bash
        run: |
          GATE_C_PASS=dcc3e75ae3b4f4ea5170f48e85345b83620c5536
          git show "$GATE_C_PASS:data/raw/gtfs/agency_arriva/trips.txt" > /tmp/arriva_trips.txt
          git show "$GATE_C_PASS:data/raw/gtfs/agency_arriva/stop_times.txt" > /tmp/arriva_stop_times.txt
          python scripts/gate_e_gtfs_runtime_benchmark.py \
            --trips /tmp/arriva_trips.txt \
            --stop-times /tmp/arriva_stop_times.txt \
            --source-commit "$GATE_C_PASS" \
            --output /tmp/gate_e_gtfs_runtime_benchmark.csv
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open('/tmp/gate_e_gtfs_runtime_benchmark.csv', encoding='utf-8')))
          assert rows
          assert {'D184', 'D185'} <= {r['route_id'] for r in rows}
          assert all(r['epistemic_status'] == 'DERIVED' for r in rows)
          assert all('NOT_OBSERVED' in r['runtime_semantics'] for r in rows)
          PY
      - name: Gate D PASS exact artifact integration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=9891607118
          ARTIFACT_SHA=6fbc06d74d5ba970bc980e4cde6234245e0753c22386f703ea313c6a4de9206a
          GATE_D_PASS=7c220f7586d0f6e5cccd14a2d518be52eb1c4a55
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/gate-d-pass.zip
          echo "$ARTIFACT_SHA  /tmp/gate-d-pass.zip" | sha256sum -c -
          rm -rf /tmp/gate-d-pass && mkdir -p /tmp/gate-d-pass
          unzip -q /tmp/gate-d-pass.zip -d /tmp/gate-d-pass
          cmp /tmp/gate-d-pass/structural_candidate_metrics.csv data/processed/gate_d_pass/structural_candidate_metrics.csv
          python - <<'PY'
          import csv
          from collections import defaultdict
          source = '/tmp/gate-d-pass/structural_candidate_waypoints.csv'
          rows = list(csv.DictReader(open(source, encoding='utf-8-sig')))
          groups = defaultdict(list)
          for row in rows:
              groups[row['candidate_id']].append(row)
          output = []
          source_sha = 'a8bf8fe133590230b4cd063b58c3332d27243c11b501c160979a2e1a94de054b'
          for candidate_id, group in sorted(groups.items()):
              group.sort(key=lambda r: int(r['sequence']))
              output.append({
                  'candidate_id': candidate_id, 'family': group[0]['family'], 'direction': group[0]['direction'],
                  'first_anchor': group[0]['anchor_id'], 'last_anchor': group[-1]['anchor_id'],
                  'waypoint_count': len(group),
                  'assumption_waypoint_count': sum(r['epistemic_status'] == 'ASSUMPTION' for r in group),
                  'source_waypoints_sha256': source_sha, 'epistemic_status': 'DERIVED',
              })
          with open('/tmp/candidate_loop_evidence.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=list(output[0].keys()), lineterminator='\n')
              writer.writeheader(); writer.writerows(output)
          PY
          cmp /tmp/candidate_loop_evidence.csv data/processed/gate_d_pass/candidate_loop_evidence.csv
          python scripts/gate_e_gate_d_pass_analysis.py \
            --artifact-zip /tmp/gate-d-pass.zip \
            --artifact-sha256 "$ARTIFACT_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --gate-d-commit "$GATE_D_PASS" \
            --composite-id FIG8_COMPACT \
            --composite-families WEST_COMPACT_MONDONICO,EAST_COMPACT_ARLATE \
            --headways 30,45,60,90 \
            --vehicles-each-direction 1,2,3 \
            --budget-output /tmp/gate_e_budget_envelope.csv \
            --fleet-output /tmp/gate_e_fleet_envelope.csv \
            --unpaired-output /tmp/gate_e_unpaired.csv
          python - <<'PY'
          import csv, math
          budget = list(csv.DictReader(open('/tmp/gate_e_budget_envelope.csv', encoding='utf-8')))
          fig8 = next(r for r in budget if r['route_id'] == 'FIG8_COMPACT')
          assert fig8['route_definition_status'] == 'ASSUMPTION'
          assert int(fig8['max_equal_CW_CCW_cycles_year_under_budget']) == 2383
          assert float(fig8['budget_margin_km_at_max_equal_pairs']) > 0
          assert float(fig8['next_equal_pair_delta_km_vs_budget']) > 0
          assert math.isclose(
              float(fig8['annual_bus_km_at_max_equal_pairs']) + float(fig8['budget_margin_km_at_max_equal_pairs']),
              float(fig8['budget_bus_km_year']), abs_tol=1e-8
          )
          fleet = list(csv.DictReader(open('/tmp/gate_e_fleet_envelope.csv', encoding='utf-8')))
          cw60 = next(r for r in fleet if r['route_id']=='FIG8_COMPACT' and r['direction']=='CW' and r['target_headway_min']=='60.0' and r['in_service_vehicles_direction']=='1')
          assert 14 < float(cw60['maximum_dwell_plus_recovery_min_compatible']) < 15
          cw45 = next(r for r in fleet if r['route_id']=='FIG8_COMPACT' and r['direction']=='CW' and r['target_headway_min']=='45.0' and r['in_service_vehicles_direction']=='1')
          assert cw45['headway_possible_with_zero_nonrunning'] == 'False'
          unpaired = list(csv.DictReader(open('/tmp/gate_e_unpaired.csv', encoding='utf-8')))
          assert {'WEST_RAVELLINO_EXTENSION','EAST_CAPRINO_CELANA_EXTENSION','WEST_SAN_ZENO_SENSITIVITY'} <= {r['candidate_id'] for r in unpaired}
          assert all(r['gate_e_pairing_status'].startswith('UNPAIRED') for r in unpaired)
          PY
      - name: Benchmark audit
        run: python scripts/10_service_simulation.py --benchmark-only --budget-output /tmp/gate_e_budget.csv
      - name: Missing integrated input must block
        shell: bash
        run: |
          set +e
          python scripts/10_service_simulation.py --input /tmp/does-not-exist.csv --budget-output /tmp/gate_e_budget2.csv
          code=$?
          test "$code" -eq 2
