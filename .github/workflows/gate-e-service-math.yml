name: Gate E service math

on:
  push:
    branches: [gate-e-workstream, antigravity-real-data]
    paths:
      - 'src/service_math.py'
      - 'src/headway_audit.py'
      - 'src/fleet_audit.py'
      - 'scripts/10_service_simulation.py'
      - 'scripts/gate_e_sensitivity.py'
      - 'scripts/gate_e_build_input.py'
      - 'scripts/gate_e_headway_audit.py'
      - 'scripts/gate_e_fleet_audit.py'
      - 'tests/test_gate_e_*.py'
      - 'tests/test_cycle_times.py'
      - 'schemas/gate_e_*.csv'
      - 'schemas/gate_c_to_e_v1.csv'
      - 'schemas/gate_c_departures_to_e_v1.csv'
      - 'schemas/gate_d_to_e_v1.csv'
      - 'data/risorse_tpl_pdb.csv'
      - 'docs/GATE_E_*.md'
  pull_request:
    paths:
      - 'src/service_math.py'
      - 'src/headway_audit.py'
      - 'src/fleet_audit.py'
      - 'scripts/10_service_simulation.py'
      - 'scripts/gate_e_sensitivity.py'
      - 'scripts/gate_e_build_input.py'
      - 'scripts/gate_e_headway_audit.py'
      - 'scripts/gate_e_fleet_audit.py'
      - 'tests/test_gate_e_*.py'
      - 'tests/test_cycle_times.py'
      - 'schemas/gate_e_*.csv'
      - 'schemas/gate_c_to_e_v1.csv'
      - 'schemas/gate_c_departures_to_e_v1.csv'
      - 'schemas/gate_d_to_e_v1.csv'
      - 'data/risorse_tpl_pdb.csv'
      - 'docs/GATE_E_*.md'

jobs:
  service-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Diff whitespace audit
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/antigravity-real-data 2>/dev/null || true)
          if [ -n "$base" ]; then
            git diff --check "$base"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Compile
        run: >-
          python -m py_compile
          src/service_math.py src/headway_audit.py src/fleet_audit.py
          scripts/10_service_simulation.py scripts/gate_e_sensitivity.py
          scripts/gate_e_build_input.py scripts/gate_e_headway_audit.py
          scripts/gate_e_fleet_audit.py
      - name: Gate E tests
        run: pytest -q tests/test_gate_e_*.py tests/test_cycle_times.py
      - name: Benchmark audit
        run: python scripts/10_service_simulation.py --benchmark-only --budget-output /tmp/gate_e_budget.csv
      - name: Missing upstream input must block
        shell: bash
        run: |
          set +e
          python scripts/10_service_simulation.py --input /tmp/does-not-exist.csv --budget-output /tmp/gate_e_budget2.csv
          code=$?
          test "$code" -eq 2
