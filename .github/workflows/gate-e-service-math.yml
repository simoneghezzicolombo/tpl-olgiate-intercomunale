name: Gate E service math

on:
  push:
    branches: [gate-e-workstream, antigravity-real-data]
    paths:
      - 'src/service_math.py'
      - 'scripts/10_service_simulation.py'
      - 'scripts/gate_e_sensitivity.py'
      - 'tests/test_gate_e_*.py'
      - 'tests/test_cycle_times.py'
      - 'schemas/gate_e_inputs_v2.csv'
      - 'data/risorse_tpl_pdb.csv'
      - 'docs/GATE_E_*.md'
  pull_request:
    paths:
      - 'src/service_math.py'
      - 'scripts/10_service_simulation.py'
      - 'scripts/gate_e_sensitivity.py'
      - 'tests/test_gate_e_*.py'
      - 'tests/test_cycle_times.py'
      - 'schemas/gate_e_inputs_v2.csv'
      - 'data/risorse_tpl_pdb.csv'
      - 'docs/GATE_E_*.md'

jobs:
  service-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/service_math.py scripts/10_service_simulation.py scripts/gate_e_sensitivity.py
      - name: Gate E tests
        run: pytest -q tests/test_gate_e_service_math.py tests/test_gate_e_preupstream.py tests/test_cycle_times.py
      - name: Benchmark audit
        run: python scripts/10_service_simulation.py --benchmark-only --budget-output /tmp/gate_e_budget.csv
      - name: Missing upstream input must block
        shell: bash
        run: |
          set +e
          python scripts/10_service_simulation.py --input /tmp/does-not-exist.csv --budget-output /tmp/gate_e_budget2.csv
          code=$?
          test "$code" -eq 2
