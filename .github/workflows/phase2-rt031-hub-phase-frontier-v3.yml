name: RT031 hub phase frontier V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_hub_phase_frontier_v3.py
      - scripts/phase2_build_rt031_hub_phase_frontier_v3.py
      - tests/test_phase2_rt031_hub_phase_frontier_v3.py
      - .github/workflows/phase2-rt031-hub-phase-frontier-v3.yml
permissions:
  contents: read
jobs:
  exact-phase-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_phase2_rt031_hub_phase_frontier_v3.py -q
      - name: Build twice and compare every byte
        run: |
          for out in /tmp/phase-a /tmp/phase-b; do
            python scripts/phase2_build_rt031_hub_phase_frontier_v3.py \
              --typed-audit outputs/phase2/rt031_target_cover_typed_service_v3/target_cover_typed_service_audit.json \
              --s8-events outputs/phase2/s8_events.csv \
              --sensitivity config/phase2_s8_phasing_sensitivity_v2.json \
              --output-dir "$out"
          done
          diff -r /tmp/phase-a /tmp/phase-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-hub-phase-frontier-v3
          path: /tmp/phase-a/
          if-no-files-found: error
