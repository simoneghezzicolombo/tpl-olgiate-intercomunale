name: Patch exact route lineage validation once

on:
  push:
    branches: [phase2-analysis-journey-a]
    paths:
      - .github/workflows/journey-exact-route-lineage-patch-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace invalid vertex threshold with edge-continuity contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/journey-exact-route-lineage.yml')
          s=p.read_text()
          old="          assert all(len(f['geometry']['coordinates'])>700 for f in data['final']['features'])"
          new="          assert all(len(f['geometry']['coordinates'])==int(f['properties']['edge_count'])+1 for f in data['final']['features'])"
          if old not in s:
              raise SystemExit('expected obsolete assertion not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/journey-exact-route-lineage.yml
          git commit -m "fix(journey): validate route continuity instead of vertex threshold"
          git push origin HEAD:phase2-analysis-journey-a
