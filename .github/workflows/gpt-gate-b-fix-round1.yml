name: GPT Gate B fix round 1

on:
  push:
    branches: [antigravity-real-data]
    paths:
      - tools/gpt_gate_b_fix_round1.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity-real-data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply audited fixes
        run: |
          python tools/gpt_gate_b_fix_round1.py
          python -m py_compile scripts/audit_01_fetch_real_inputs.py
          python -m py_compile scripts/audit_02_real_spatial.py
          python -m py_compile tests/test_audit_provenance.py
          python -m py_compile tests/test_gate_b_spatial.py
          git diff --check

      - name: Commit and clean one-shot tooling
        run: |
          rm tools/gpt_gate_b_fix_round1.py
          rm .github/workflows/gpt-gate-b-fix-round1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(gate-b): correct Overpass recursion and accessibility connectors"
          git push origin HEAD:antigravity-real-data
