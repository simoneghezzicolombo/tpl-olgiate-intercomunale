name: RT031 bounded typed composition V3
on:
  push:
    branches: [codex/rt031-typed-composition-gate]
  pull_request:
    paths:
      - src/phase2_rt031_typed_composition_v3.py
      - tests/test_phase2_rt031_typed_composition_v3.py
      - scripts/phase2_audit_rt031_typed_composition_v3.py
      - src/phase2_rt031_occurrence_binding_v3.py
      - tests/test_phase2_rt031_occurrence_binding_v3.py
      - scripts/phase2_audit_rt031_real_occurrence_binding_v3.py
      - .github/workflows/phase2-rt031-typed-composition-v3.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bounded-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pandas
      - name: Controlled adversarial and macro regression tests
        env:
          PYTHONPATH: .:src
        run: python -m pytest tests/test_phase2_rt031_occurrence_binding_v3.py tests/test_phase2_rt031_typed_composition_v3.py tests/test_phase2_macro_structure_decoupling_v3.py -q
      - name: Independent byte-for-byte replay
        env:
          PYTHONPATH: .
        run: |
          python scripts/phase2_audit_rt031_typed_composition_v3.py --out replay-a.json
          python scripts/phase2_audit_rt031_typed_composition_v3.py --out replay-b.json
          cmp replay-a.json replay-b.json
          cmp replay-a.json outputs/phase2/rt031_typed_composition_v3/bounded_replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-bounded-typed-composition-v3
          path: replay-a.json
  real-occurrence-binding:
    runs-on: ubuntu-latest
    needs: bounded-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned upstream evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/rt031-inputs/{rt017,rt022,rt030}
          gh api "/repos/${REPO}/actions/artifacts/9972204236/zip" > /tmp/rt017.zip
          gh api "/repos/${REPO}/actions/artifacts/9988386073/zip" > /tmp/rt022.zip
          gh api "/repos/${REPO}/actions/artifacts/9992507233/zip" > /tmp/rt030.zip
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-inputs/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-inputs/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-inputs/rt030
      - name: Bind all pinned real occurrences twice
        env:
          PYTHONPATH: .
        run: |
          python scripts/phase2_audit_rt031_real_occurrence_binding_v3.py --inputs /tmp/rt031-inputs --out /tmp/rt031-real-a
          python scripts/phase2_audit_rt031_real_occurrence_binding_v3.py --inputs /tmp/rt031-inputs --out /tmp/rt031-real-b
          diff -r /tmp/rt031-real-a /tmp/rt031-real-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-pinned-real-occurrence-binding-v3
          path: /tmp/rt031-real-a/
          if-no-files-found: error
