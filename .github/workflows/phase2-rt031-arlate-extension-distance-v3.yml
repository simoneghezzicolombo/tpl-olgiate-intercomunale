name: RT031 Arlate village extension physical distance V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_joint_target_shortest_cycle_v3.py
      - scripts/phase2_certify_rt031_joint_target_distance_v3.py
      - tests/test_phase2_rt031_joint_target_shortest_cycle_v3.py
      - .github/workflows/phase2-rt031-arlate-extension-distance-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  arlate-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest tests/test_phase2_rt031_joint_target_shortest_cycle_v3.py -q
      - name: Acquire pinned physical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rt031-inputs/{rt017,rt022,rt030} /tmp/via
          gh api repos/${{ github.repository }}/actions/artifacts/9972204236/zip > /tmp/rt017.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9988386073/zip > /tmp/rt022.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9992507233/zip > /tmp/rt030.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10023387513/zip > /tmp/via.zip
          echo 'e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225  /tmp/rt017.zip' | sha256sum -c
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          echo '1603606d02a170567c1d423b7689b7044933fff6490caeaf848ae0ca0f2d77d0  /tmp/via.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-inputs/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-inputs/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-inputs/rt030
          unzip -q /tmp/via.zip -d /tmp/via
      - name: Certify village and individual Arlate targets twice
        run: |
          evidence=$(find /tmp/via -name '*.json' | head -1)
          for target in bivio cantina; do
            if [ "$target" = bivio ]; then stop=ASF::ARLATE_BIVIO_PER_IL_PAESE; else stop=ASF::ARLATE_CANTINA_PIROVANO; fi
            for replica in a b; do
              python scripts/phase2_certify_rt031_joint_target_distance_v3.py \
                --inputs /tmp/rt031-inputs --via-way-evidence "$evidence" \
                --extra-stop-id "$stop" \
                --output "/tmp/arlate-$target-$replica.json"
            done
            cmp "/tmp/arlate-$target-a.json" "/tmp/arlate-$target-b.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-arlate-individual-distance-v3
          path: /tmp/arlate-*-a.json
          if-no-files-found: error
