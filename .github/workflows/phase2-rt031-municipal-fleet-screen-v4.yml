name: RT031 municipal frontier fleet screen V4
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_screen_rt031_municipal_fleet_v4.py
      - tests/test_phase2_rt031_municipal_fleet_screen_v4.py
      - .github/workflows/phase2-rt031-municipal-fleet-screen-v4.yml
permissions:
  contents: read
  actions: read
jobs:
  municipal-fleet-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_phase2_rt031_municipal_fleet_screen_v4.py -q
      - name: Acquire pinned complete typed frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/typed
          gh api repos/${{ github.repository }}/actions/artifacts/10438835538/zip > /tmp/typed.zip
          echo 'a5c61c01934890c4a7a06a0bbc24c7e56ff477bb4efa7da8084c21a18c74cca6  /tmp/typed.zip' | sha256sum -c
          unzip -q /tmp/typed.zip -d /tmp/typed
          echo 'd2d27d1c5fb4f1faaeaa4d911735daab57c64dd3a173c2e887c500027cb9f60f  /tmp/typed/municipal_frontier_typed_binding_v4_audit.json' | sha256sum -c
      - name: Screen every within-cap typed line twice
        run: |
          for out in /tmp/fleet-a /tmp/fleet-b; do
            python scripts/phase2_screen_rt031_municipal_fleet_v4.py \
              --typed-audit /tmp/typed/municipal_frontier_typed_binding_v4_audit.json \
              --output-dir "$out"
          done
          diff -r /tmp/fleet-a /tmp/fleet-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-municipal-frontier-fleet-screen-v4
          path: /tmp/fleet-a/
          if-no-files-found: error
