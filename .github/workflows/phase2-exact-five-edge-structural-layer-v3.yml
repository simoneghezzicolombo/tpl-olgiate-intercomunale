name: RT-024 exact five-edge structural layer V3

on:
  push:
    branches: [phase2-exact-five-edge-structural-layer-v3]
  pull_request:
    branches: [phase2-territorial-structural-search-v3]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  exact-five-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas==2.2.3 pytest==8.3.5
      - name: Compile and focused tests
        run: |
          python -m py_compile src/phase2_exact_edge_policy_structures_v3.py
          python -m py_compile scripts/phase2_run_rt024_exact_five_edge_v3.py
          python -m pytest -q \
            tests/test_phase2_exact_edge_policy_structures_v3.py \
            tests/test_phase2_network_structure_search_v3.py
      - name: Validate frozen RT-022 source identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/phase2/rt022_minimum_backbones_v3/rt022_minimum_backbone_audit.json')
          v=json.loads(p.read_text())
          assert v['status']=='PASS_EXACT_MINIMUM_TOPOLOGY_NEUTRAL_TERRITORIAL_BACKBONE_UNIVERSE'
          assert v['complete'] is True
          assert v['counts']['reciprocal_elementary_structural_links']==110
          assert v['digests']['structure_universe_sha256']=='1d6ccd18a5707aa8e2e51b1eefcc9d27056678f0d5e260c9027d1414a1ddf8d7'
          PY
      - name: Build exact five-edge real structural layer
        run: |
          rm -rf outputs/phase2/rt024_exact_five_edge_v3
          python scripts/phase2_run_rt024_exact_five_edge_v3.py \
            --links outputs/phase2/rt022_minimum_backbones_v3/reciprocal_structural_links.csv \
            --stop-inventory outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv \
            --rt022-audit outputs/phase2/rt022_minimum_backbones_v3/rt022_minimum_backbone_audit.json
      - name: Assert real exhaustive counts and guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('outputs/phase2/rt024_exact_five_edge_v3/rt024_exact_five_edge_audit.json').read_text())
          assert v['status']=='PASS_RT024_EXACT_FIVE_EDGE_TOPOLOGY_NEUTRAL_STRUCTURAL_LAYER_V3'
          assert v['complete'] is True
          assert v['counts']['reciprocal_structural_links']==110
          assert v['counts']['conventional_terminals']==35
          assert v['counts']['exact_five_edge_structures']==4076
          assert v['topology_counts']=={'PATH': 1374, 'TREE_BRANCHING': 2678, 'UNICYCLIC_BRANCHING': 24}
          assert v['vertex_count_distribution']=={'5': 24, '6': 4052}
          assert v['cycle_rank_distribution']=={'0': 4052, '1': 24}
          assert v['connected_state_counts_by_edge_count']=={
              '1':110,'2':723,'3':6299,'4':61409,'5':622352
          }
          assert all(value is False for value in v['guards'].values())
          PY
      - name: Anti-bias guards
        run: |
          ! grep -nE 'np\.random|numpy\.random|import random|from random|PRIMARY|RUNNER-UP|Cassina|Circolare Meratese' \
            src/phase2_exact_edge_policy_structures_v3.py \
            scripts/phase2_run_rt024_exact_five_edge_v3.py
          git diff --check
      - name: Upload RT-024 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-rt024-exact-five-edge-v3
          path: outputs/phase2/rt024_exact_five_edge_v3/
          if-no-files-found: error
          retention-days: 90
      - name: Persist certified RT-024 handoff
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            outputs/phase2/rt024_exact_five_edge_v3/exact_five_edge_topology_neutral_structure_universe.csv \
            outputs/phase2/rt024_exact_five_edge_v3/rt024_exact_five_edge_audit.json
          if git diff --cached --quiet; then
            echo 'RT-024 handoff already persisted byte-identically.'
            exit 0
          fi
          git commit -m 'data(rt024): persist certified exact five-edge handoff'
          git push origin HEAD:phase2-exact-five-edge-structural-layer-v3
