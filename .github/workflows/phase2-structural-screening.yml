name: Phase 2 topology-neutral structural screening

on:
  push:
    branches:
      - phase2-screening-neutral
  pull_request:
    branches:
      - phase2-optimizer-core
  workflow_dispatch:

jobs:
  structural-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile screening implementation
        run: |
          python -m py_compile src/phase2_structural_screening.py
          python -m py_compile scripts/phase2_screen_structural_catalog.py

      - name: Run structural-screening unit and adversarial tests
        run: python -m pytest -q tests/test_phase2_structural_screening.py

      - name: Screen frozen V1 100k catalog as benchmark only
        run: |
          python scripts/phase2_screen_structural_catalog.py \
            --catalog outputs/phase2/structural_scenario_catalog_balanced.csv \
            --path-matrix outputs/phase2/reduced_path_matrix.csv \
            --anchor-universe outputs/phase2/routing_anchor_universe.csv \
            --output /tmp/phase2_structural_screening_v1.csv \
            --validation /tmp/phase2_structural_screening_v1_validation.json \
            --on-path-abs-tol-km 0.000001 \
            --on-path-rel-tol 0.000000001 \
            --evidence-label FROZEN_V1_BENCHMARK_NOT_FINAL

      - name: Validate production screening contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          out = Path('/tmp/phase2_structural_screening_v1.csv')
          val = json.loads(Path('/tmp/phase2_structural_screening_v1_validation.json').read_text())
          with out.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 100_000, len(rows)
          assert val['scenario_count'] == 100_000
          assert val['evidence_label'] == 'FROZEN_V1_BENCHMARK_NOT_FINAL'
          assert val['selects_topology'] is False
          assert val['ranks_topology_family'] is False
          assert val['selects_stops'] is False
          assert val['annualises_service'] is False
          assert val['chooses_service_policy'] is False
          forbidden = {'rank', 'score', 'winner', 'recommended', 'primary_recommendation'}
          assert not (forbidden & set(rows[0]))
          assert all(float(r['public_distance_km']) > 0 for r in rows)
          assert all(float(r['public_runtime_min']) > 0 for r in rows)
          print('validated rows:', len(rows))
          print('unique directed legs:', val['unique_directed_scenario_legs_screened'])
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          python scripts/phase2_screen_structural_catalog.py \
            --catalog outputs/phase2/structural_scenario_catalog_balanced.csv \
            --path-matrix outputs/phase2/reduced_path_matrix.csv \
            --anchor-universe outputs/phase2/routing_anchor_universe.csv \
            --output /tmp/phase2_structural_screening_v1_second.csv \
            --validation /tmp/phase2_structural_screening_v1_validation_second.json \
            --on-path-abs-tol-km 0.000001 \
            --on-path-rel-tol 0.000000001 \
            --evidence-label FROZEN_V1_BENCHMARK_NOT_FINAL
          cmp /tmp/phase2_structural_screening_v1.csv /tmp/phase2_structural_screening_v1_second.csv
          cmp /tmp/phase2_structural_screening_v1_validation.json /tmp/phase2_structural_screening_v1_validation_second.json

      - name: Anti-shortcut guard
        run: |
          ! grep -R "np\.random" src/phase2_structural_screening.py scripts/phase2_screen_structural_catalog.py
          ! grep -R "outputs/route_variants.csv\|08_candidate_routes" src/phase2_structural_screening.py scripts/phase2_screen_structural_catalog.py
          ! grep -R "primary recommendation\|runner-up\|recommended topology" src/phase2_structural_screening.py scripts/phase2_screen_structural_catalog.py

      - name: Whitespace check against optimizer merge base
        run: |
          git fetch origin phase2-optimizer-core
          BASE=$(git merge-base HEAD origin/phase2-optimizer-core)
          git diff --check "$BASE"...HEAD

      - name: Upload V1 benchmark screening artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-structural-screening-v1-${{ github.sha }}
          path: |
            /tmp/phase2_structural_screening_v1.csv
            /tmp/phase2_structural_screening_v1_validation.json
          if-no-files-found: error
