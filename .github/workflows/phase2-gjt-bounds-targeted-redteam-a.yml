name: Phase 2 GJT Bounds Targeted Red-Team A

on:
  push:
    branches:
      - phase2-gjt-bounds-targeted-redteam-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: |
          python -m py_compile scripts/phase2_redteam_gjt_bounds_corner_envelope_a.py tests/test_phase2_gjt_bounds_targeted_redteam_a.py

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run targeted tests
        run: pytest -q tests/test_phase2_gjt_bounds_targeted_redteam_a.py

      - name: Build precheck evidence
        run: |
          mkdir -p outputs/phase2/gjt_bounds_targeted_redteam_a
          python scripts/phase2_redteam_gjt_bounds_corner_envelope_a.py \
            --config config/phase2_feeder_generalized_access_sensitivity_v2.json \
            --validation outputs/phase2/gjt_bounds_targeted_redteam_a/precheck_validation.json

      - name: Deterministic rebuild
        run: |
          mkdir -p /tmp/gjt_bounds_redteam_rebuild
          python scripts/phase2_redteam_gjt_bounds_corner_envelope_a.py \
            --config config/phase2_feeder_generalized_access_sensitivity_v2.json \
            --validation /tmp/gjt_bounds_redteam_rebuild/precheck_validation.json
          cmp outputs/phase2/gjt_bounds_targeted_redteam_a/precheck_validation.json /tmp/gjt_bounds_redteam_rebuild/precheck_validation.json

      - name: Epistemic guard
        run: |
          python - <<'PY'
          import json
          p = json.load(open('outputs/phase2/gjt_bounds_targeted_redteam_a/precheck_validation.json', encoding='utf-8'))
          assert p['status'] == 'PASS_PHASE2_GJT_BOUNDS_TARGETED_PRECHECK_A'
          assert p['historical_h2_authorized_for_exact_bounds'] is False
          assert p['origin_waiting_estimated_by_this_precheck'] is False
          assert p['final_alpha_exact_builder_review_pending'] is True
          g = p['epistemic_guards']
          assert not any(g.values())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-gjt-bounds-targeted-redteam-a-${{ github.sha }}
          path: outputs/phase2/gjt_bounds_targeted_redteam_a/precheck_validation.json
