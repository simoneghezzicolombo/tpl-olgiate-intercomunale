name: Gate D road and route integrity

on:
  push:
    branches: [gate-d-workstream]
    paths:
      - scripts/08_candidate_routes.py
      - scripts/gate_d_route_integrity.py
      - scripts/gate_d_real_road_audit.py
      - scripts/gate_d_turn_restrictions.py
      - scripts/gate_d_structural_candidates.py
      - scripts/gate_d_structural_candidates_v2.py
      - scripts/gate_d_structural_candidates_v3.py
      - scripts/gate_d_structural_candidates_v4.py
      - scripts/gate_d_slope_audit.py
      - scripts/gate_d_baseline_calibration.py
      - scripts/gate_d_baseline_calibration_v2.py
      - scripts/gate_d_baseline_calibration_v3.py
      - scripts/gate_d_baseline_calibration_v4.py
      - tests/test_gate_d_route_integrity.py
      - tests/test_gate_d_structural_candidates.py
      - tests/test_gate_d_anchor_and_slope.py
      - tests/test_gate_d_dependency_closed.py
      - tests/test_gate_d_baseline_calibration.py
      - tests/test_gate_d_baseline_calibration_v4.py
      - tests/test_gate_d_access_precedence.py
      - data/gate_d_structural_road_constraints.csv
      - .github/workflows/gate-d-road-route-integrity.yml
  workflow_dispatch:

concurrency:
  group: gate-d-workstream-road-audit
  cancel-in-progress: true

jobs:
  gate-d-unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Gate D dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas shapely networkx pyogrio pytest requests rasterio scipy
      - name: Compile Gate D pipeline
        run: |
          python -m py_compile scripts/08_candidate_routes.py
          python -m py_compile scripts/gate_d_route_integrity.py
          python -m py_compile scripts/gate_d_real_road_audit.py
          python -m py_compile scripts/gate_d_turn_restrictions.py
          python -m py_compile scripts/gate_d_structural_candidates.py
          python -m py_compile scripts/gate_d_structural_candidates_v2.py
          python -m py_compile scripts/gate_d_structural_candidates_v3.py
          python -m py_compile scripts/gate_d_structural_candidates_v4.py
          python -m py_compile scripts/gate_d_slope_audit.py
          python -m py_compile scripts/gate_d_baseline_calibration.py
          python -m py_compile scripts/gate_d_baseline_calibration_v2.py
          python -m py_compile scripts/gate_d_baseline_calibration_v3.py
          python -m py_compile scripts/gate_d_baseline_calibration_v4.py
          python -m py_compile tests/test_gate_d_route_integrity.py
          python -m py_compile tests/test_gate_d_structural_candidates.py
          python -m py_compile tests/test_gate_d_anchor_and_slope.py
          python -m py_compile tests/test_gate_d_dependency_closed.py
          python -m py_compile tests/test_gate_d_baseline_calibration.py
          python -m py_compile tests/test_gate_d_baseline_calibration_v4.py
          python -m py_compile tests/test_gate_d_access_precedence.py
      - name: Run Gate D adversarial tests
        run: python -m pytest -v tests/test_gate_d_route_integrity.py tests/test_gate_d_structural_candidates.py tests/test_gate_d_anchor_and_slope.py tests/test_gate_d_dependency_closed.py tests/test_gate_d_baseline_calibration.py tests/test_gate_d_baseline_calibration_v4.py tests/test_gate_d_access_precedence.py
      - name: Check patch whitespace
        run: git diff --check 549198743e7265b333da565ce6990f9241cfd1fd..HEAD
      - name: Fail if legacy hardcoded route outputs are regenerated
        run: |
          if grep -R -n -E 'PARETO-OTTIMALE|\(Raccomandata\)|pop_servita_5min|od_flusso_intercettato|runtime_ovest_min|km_ovest' scripts/08_candidate_routes.py; then
            echo 'Legacy hard-coded route metrics detected'
            exit 1
          fi

  gate-d-live-evidence:
    needs: gate-d-unit-and-static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify and stage official reference-period bus GTFS snapshots
        run: |
          python - <<'PY'
          import csv, hashlib, pathlib, shutil

          wanted = {
              'gtfs_arriva_addabus_inv_2025_2026': pathlib.Path('data/audit_gate_d/raw/arriva_addabus_2025_2026.zip'),
              'gtfs_lineelecco_inv_2025_2026': pathlib.Path('data/audit_gate_d/raw/lineelecco_2025_2026.zip'),
          }
          with open('data/manifest.csv', encoding='utf-8', newline='') as handle:
              rows = {row['dataset_id']: row for row in csv.DictReader(handle)}
          for dataset_id, target in wanted.items():
              row = rows[dataset_id]
              source = pathlib.Path(row['filepath_locale'])
              assert source.exists() and source.stat().st_size > 0, f'missing official reference input: {source}'
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              assert digest == row['sha256_hash'], f'checksum mismatch for {dataset_id}'
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              assert hashlib.sha256(target.read_bytes()).hexdigest() == digest
              print(f'{dataset_id}: verified {digest} -> {target}')
          PY
      - name: Verify official S8 station source and Gate B DEM
        run: |
          test -s data/raw/gtfs/rail_trenord/stops.txt
          grep '^S01514,Olgiate-Calco-Brivio,' data/raw/gtfs/rail_trenord/stops.txt
          test -s data/raw/dem/copernicus_dem_core_raw.tif
      - name: Install spatial and network dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas shapely networkx pyogrio requests rasterio scipy
      - name: Acquire tiled OSM and run dependency-closed structural candidate audit
        run: python scripts/gate_d_structural_candidates_v4.py
      - name: Route D184/D185 dominant official baseline patterns and diagnose runtime model bias
        run: python scripts/gate_d_baseline_calibration_v4.py
      - name: Derive Copernicus DSM grade diagnostics
        run: python scripts/gate_d_slope_audit.py
      - name: Print structural numerical evidence
        if: always()
        run: |
          if [ -f data/audit_gate_d/structural_candidate_summary.json ]; then cat data/audit_gate_d/structural_candidate_summary.json; fi
          if [ -f data/audit_gate_d/structural_candidate_metrics.csv ]; then echo '--- STRUCTURAL CANDIDATES ---'; cat data/audit_gate_d/structural_candidate_metrics.csv; fi
          if [ -f data/audit_gate_d/structural_baseline_calibration_summary.json ]; then echo '--- BASELINE CALIBRATION SUMMARY ---'; cat data/audit_gate_d/structural_baseline_calibration_summary.json; fi
          if [ -f data/audit_gate_d/structural_baseline_calibration.csv ]; then echo '--- BASELINE CALIBRATION ---'; cat data/audit_gate_d/structural_baseline_calibration.csv; fi
          if [ -f data/audit_gate_d/structural_candidate_slope_audit.csv ]; then echo '--- DSM GRADE DIAGNOSTICS ---'; cat data/audit_gate_d/structural_candidate_slope_audit.csv; fi
          if [ -f data/audit_gate_d/structural_anchor_evidence.csv ]; then echo '--- ANCHOR EVIDENCE ---'; cat data/audit_gate_d/structural_anchor_evidence.csv; fi
          if [ -f data/audit_gate_d/station_anchor_diagnostic.csv ]; then echo '--- STATION ANCHOR DIAGNOSTIC ---'; cat data/audit_gate_d/station_anchor_diagnostic.csv; fi
          if [ -f data/audit_gate_d/structural_gtfs_baseline_patterns.csv ]; then echo '--- GTFS BASELINES ---'; cat data/audit_gate_d/structural_gtfs_baseline_patterns.csv; fi
          if [ -f data/audit_gate_d/osm_turn_restrictions_summary.json ]; then echo '--- TURN RESTRICTIONS ---'; cat data/audit_gate_d/osm_turn_restrictions_summary.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-d-structural-evidence
          path: data/audit_gate_d/
          if-no-files-found: warn
