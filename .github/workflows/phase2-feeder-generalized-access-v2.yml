name: Phase 2 Feeder Generalized Access V2

on:
  push:
    branches:
      - phase2-feeder-generalized-access-v2
      - phase2-robustness-final-v2
    paths:
      - 'config/phase2_feeder_generalized_access_sensitivity_v2.json'
      - 'scripts/phase2_build_feeder_generalized_access_v2.py'
      - 'tests/test_phase2_feeder_generalized_access_v2.py'
      - '.github/workflows/phase2-feeder-generalized-access-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-feeder-generalized-access-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile scripts/phase2_build_feeder_generalized_access_v2.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Unit tests
        run: python -m pytest -q tests/test_phase2_feeder_generalized_access_v2.py

      - name: Build feeder generalized-access screening
        run: >-
          python scripts/phase2_build_feeder_generalized_access_v2.py
          --service-ready-frontier outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_v2.csv
          --service-ready-validation outputs/phase2/service_ready_frontier_v2/service_ready_frontier_v2_validation.json
          --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json
          --population-units outputs/phase2/stop_universe_v2/accessibility_gap_building_pieces.csv
          --anchors outputs/phase2/reduced_path_matrix_v2/routing_anchor_universe.csv
          --proposed-catchments outputs/phase2/stop_universe_v2/proposed_stop_candidate_catchment_units_10min.csv
          --existing-catchments outputs/phase2/stop_universe_v2/existing_stop_catchment_units_12min.csv
          --route-universe outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv
          --scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz
          --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json
          --path-matrix outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix.csv
          --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json
          --sensitivity-config config/phase2_feeder_generalized_access_sensitivity_v2.json
          --base-output outputs/phase2/feeder_generalized_access_v2/scenario_feeder_generalized_access_base_v2.csv.gz
          --timing-output outputs/phase2/feeder_generalized_access_v2/scenario_timing_feeder_generalized_access_v2.csv.gz
          --validation-output outputs/phase2/feeder_generalized_access_v2/feeder_generalized_access_v2_validation.json

      - name: Validate feeder generalized-access contract
        run: |
          python - <<'PY'
          import csv, gzip, json, math
          from pathlib import Path
          root=Path('outputs/phase2/feeder_generalized_access_v2')
          v=json.loads((root/'feeder_generalized_access_v2_validation.json').read_text(encoding='utf-8'))
          assert v['status']=='PASS_FEEDER_GENERALIZED_ACCESS_V2_BUILD'
          assert v['contract']=='PHASE2_PRE_PHASE_FEEDER_GENERALIZED_ACCESS_V2'
          assert v['service_ready_row_count']==21237
          assert v['service_ready_unique_scenario_count']==2883
          assert v['population_unit_count']==4348
          assert v['sensitivity_case_count']==243
          assert v['base_bus_walk_weight_pair_count']==9
          assert 0 < v['direct_hub_walk_population_excluded'] < v['located_population']
          assert v['feeder_dependent_located_population'] > 0
          assert v['technical_return_closure_used_for_to_rail'] is False
          assert v['municipal_work_od_downscaled'] is False
          assert v['resident_population_is_passenger_demand'] is False
          assert v['ridership_forecast'] is False
          assert v['weighted_composite_score'] is False
          assert v['exact_s8_phase_used'] is False
          assert v['exact_train_connection_wait_used'] is False
          assert v['missed_connection_probability_used'] is False
          assert v['delay_robustness_used'] is False
          assert v['full_gjt_calculated'] is False
          assert v['exact_timetable_constructed'] is False
          assert v['primary_selected'] is False
          assert v['runner_up_selected'] is False
          with gzip.open(root/'scenario_feeder_generalized_access_base_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              base=list(csv.DictReader(f))
          assert len(base)==2883
          assert len({r['scenario_id'] for r in base})==2883
          with gzip.open(root/'scenario_timing_feeder_generalized_access_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              timing=list(csv.DictReader(f))
          assert len(timing)==21237
          for r in timing:
              for field in ('to_rail_reachable_share','from_rail_reachable_share','bidirectional_reachable_share'):
                  x=float(r[field]); assert math.isfinite(x) and 0 <= x <= 1 + 1e-12
              assert float(r['average_random_arrival_wait_min']) == int(r['uniform_headway_min'])/2
              assert r['resident_population_is_passenger_demand']=='false'
              assert r['municipal_work_od_downscaled']=='false'
              assert r['exact_s8_phase_used']=='false'
              assert r['full_gjt_calculated']=='false'
              for direction in ('to_rail','from_rail'):
                  vals=[r[f'{direction}_{m}_mean_generalized_access_min'] for m in ('minimum','median','p90','maximum')]
                  if vals[0]:
                      nums=list(map(float,vals))
                      assert all(math.isfinite(x) for x in nums)
                      assert nums == sorted(nums)
          print(json.dumps({
              'unique_scenarios': v['service_ready_unique_scenario_count'],
              'direct_hub_walk_population': v['direct_hub_walk_population_excluded'],
              'feeder_dependent_population': v['feeder_dependent_located_population'],
              'zero_to_rail': v['zero_to_rail_reach_scenario_count'],
              'zero_from_rail': v['zero_from_rail_reach_scenario_count'],
          }, indent=2, sort_keys=True))
          PY

      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/phase2-feeder-gfa-v2
          mkdir -p /tmp/phase2-feeder-gfa-v2
          python scripts/phase2_build_feeder_generalized_access_v2.py \
            --service-ready-frontier outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_v2.csv \
            --service-ready-validation outputs/phase2/service_ready_frontier_v2/service_ready_frontier_v2_validation.json \
            --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json \
            --population-units outputs/phase2/stop_universe_v2/accessibility_gap_building_pieces.csv \
            --anchors outputs/phase2/reduced_path_matrix_v2/routing_anchor_universe.csv \
            --proposed-catchments outputs/phase2/stop_universe_v2/proposed_stop_candidate_catchment_units_10min.csv \
            --existing-catchments outputs/phase2/stop_universe_v2/existing_stop_catchment_units_12min.csv \
            --route-universe outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv \
            --scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz \
            --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json \
            --path-matrix outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix.csv \
            --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json \
            --sensitivity-config config/phase2_feeder_generalized_access_sensitivity_v2.json \
            --base-output /tmp/phase2-feeder-gfa-v2/base.csv.gz \
            --timing-output /tmp/phase2-feeder-gfa-v2/timing.csv.gz \
            --validation-output /tmp/phase2-feeder-gfa-v2/validation.json >/dev/null
          cmp outputs/phase2/feeder_generalized_access_v2/scenario_feeder_generalized_access_base_v2.csv.gz /tmp/phase2-feeder-gfa-v2/base.csv.gz
          cmp outputs/phase2/feeder_generalized_access_v2/scenario_timing_feeder_generalized_access_v2.csv.gz /tmp/phase2-feeder-gfa-v2/timing.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          left=json.loads(Path('outputs/phase2/feeder_generalized_access_v2/feeder_generalized_access_v2_validation.json').read_text())
          right=json.loads(Path('/tmp/phase2-feeder-gfa-v2/validation.json').read_text())
          for payload in (left,right):
              for key in ('base_output','timing_output'):
                  payload['lineage'].pop(key,None)
          assert left==right
          PY

      - name: Guard epistemic boundary
        run: |
          FILE='scripts/phase2_build_feeder_generalized_access_v2.py'
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' "$FILE"
          ! grep -n -E 'municipal_work_od_downscaled.*True|resident_population_is_passenger_demand.*True|ridership_forecast.*True|weighted_composite_score.*True|exact_s8_phase_used.*True|full_gjt_calculated.*True|primary_selected.*True|runner_up_selected.*True' "$FILE"

      - name: Persist evidence
        run: |
          git config user.name "phase2-feeder-gfa-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/feeder_generalized_access_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist feeder generalized-access v2 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-feeder-generalized-access-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/feeder_generalized_access_v2
