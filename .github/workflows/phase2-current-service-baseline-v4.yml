name: Phase 2 Current Service Baseline V4

on:
  push:
    branches:
      - phase2-current-service-baseline-v4
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .
  OUTDIR: outputs/phase2/current_service_access_baseline_v4
  SOURCEDIR: /tmp/phase2_current_service_v4_sources
  RECOVERY_COMMIT: 4ab527827456eb40572a72b4c7b87f8fe5f4dcac

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile
        run: |
          python -m py_compile src/phase2_current_service_baseline_v4.py
          python -m py_compile scripts/phase2_build_current_service_access_baseline_v4.py
          python -m py_compile scripts/phase2_build_current_service_access_baseline_v4_source_closed.py

      - name: Regression tests
        run: pytest -q tests/test_phase2_current_service_baseline_v4.py

      - name: Materialise frozen official public-source evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCEDIR"
          mkdir -p "$SOURCEDIR" "$OUTDIR"
          git cat-file -e "${RECOVERY_COMMIT}^{commit}"
          git show "${RECOVERY_COMMIT}:outputs/phase2/current_service_public_geodata_recovery_a/official_gtfs_d184_d185_route_stops.csv" > "$SOURCEDIR/official_gtfs_d184_d185_route_stops.csv"
          git show "${RECOVERY_COMMIT}:outputs/phase2/current_service_public_geodata_recovery_a/official_gtfs_d184_d185_trip_patterns.csv" > "$SOURCEDIR/official_gtfs_d184_d185_trip_patterns.csv"
          git show "${RECOVERY_COMMIT}:outputs/phase2/current_service_public_geodata_recovery_a/summary.json" > "$SOURCEDIR/gtfs_recovery_summary.json"
          git show "${RECOVERY_COMMIT}:outputs/phase2/current_service_public_geodata_recovery_a/source_sha256.txt" > "$SOURCEDIR/gtfs_source_sha256.txt"
          git show "${RECOVERY_COMMIT}:outputs/phase2/current_service_reference_2026-09-03.csv" > "$SOURCEDIR/current_service_reference_2026-09-03.csv"
          git show "${RECOVERY_COMMIT}:outputs/phase2/current_service_temporary_conditions_2026-09-03.csv" > "$SOURCEDIR/current_service_temporary_conditions_2026-09-03.csv"
          python - <<'PY'
          import csv, json
          from pathlib import Path
          base = Path('/tmp/phase2_current_service_v4_sources')
          summary = json.loads((base/'gtfs_recovery_summary.json').read_text())
          assert summary['status'] == 'PASS_PUBLIC_SOURCE_DISCOVERY'
          assert summary['route_ids_gtfs'] == ['D184', 'D185']
          assert summary['official_route_specific_stop_record_count'] == 72
          assert summary['distinct_route_trip_patterns'] == 18
          source_hash = (base/'gtfs_source_sha256.txt').read_text().split()[0]
          assert source_hash == 'f890c393b909a40ae9500ab5acba71166cdfc5af3d42be92f55a92d92927553b'
          refs = {r['route_id']: r for r in csv.DictReader((base/'current_service_reference_2026-09-03.csv').open())}
          assert {'D184','D185'} <= set(refs)
          assert refs['D184']['valid_to'] == '2026-09-13'
          assert refs['D185']['valid_to'] == '2026-09-13'
          temporary = list(csv.DictReader((base/'current_service_temporary_conditions_2026-09-03.csv').open()))
          assert len(temporary) == 1
          assert temporary[0]['route_id'] == 'D185'
          assert temporary[0]['ordinary_network_baseline_replaced'] == 'False'
          print({'source_closed': True, 'gtfs_sha256': source_hash, 'route_stop_records': 72, 'patterns': 18})
          PY

      - name: Full V4 current-service structural baseline build
        run: |
          python scripts/phase2_build_current_service_access_baseline_v4_source_closed.py \
            --gtfs-route-stops "$SOURCEDIR/official_gtfs_d184_d185_route_stops.csv" \
            --gtfs-patterns "$SOURCEDIR/official_gtfs_d184_d185_trip_patterns.csv" \
            --gtfs-recovery-summary "$SOURCEDIR/gtfs_recovery_summary.json" \
            --gtfs-source-sha256 "$SOURCEDIR/gtfs_source_sha256.txt" \
            --current-service-reference "$SOURCEDIR/current_service_reference_2026-09-03.csv" \
            --temporary-conditions "$SOURCEDIR/current_service_temporary_conditions_2026-09-03.csv" \
            --archived-kml-provenance data/external/current_service_v4/archived_kml_provenance.csv \
            --frozen-official-stops outputs/phase2/stop_universe_v2/existing_official_stops.csv \
            --existing-catchments outputs/phase2/stop_universe_v2/existing_stop_catchment_units_12min.csv \
            --population-units outputs/phase2/stop_universe_v2/accessibility_gap_building_pieces.csv \
            --settlement-anchors outputs/phase2/stop_universe_v2/settlement_destination_anchors.csv \
            --v3-validation outputs/phase2/current_service_access_baseline_v3/current_service_access_baseline_v3_validation.json \
            --outdir "$OUTDIR"

      - name: Validate V4 epistemic contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          out = Path('outputs/phase2/current_service_access_baseline_v4')
          v = json.loads((out/'current_service_access_baseline_v4_validation.json').read_text())
          assert v['status'] == 'PASS_PHASE2_CURRENT_SERVICE_ACCESS_BASELINE_V4'
          assert v['contract'] == 'PHASE2_CURRENT_SERVICE_STRUCTURAL_PHYSICAL_STOP_BASELINE_V4'
          assert v['reference_date'] == '2026-09-04'
          assert v['gtfs_source_official'] is True
          assert v['gtfs_source_closed_extract'] is True
          assert v['gtfs_live_download_required'] is False
          assert v['gtfs_recovery_frozen_commit'] == '4ab527827456eb40572a72b4c7b87f8fe5f4dcac'
          assert v['gtfs_upstream_binary_sha256'] == 'f890c393b909a40ae9500ab5acba71166cdfc5af3d42be92f55a92d92927553b'
          assert v['archived_kml_corroboration_available'] is True
          assert v['archived_kml_used_in_numeric_coverage'] is False
          assert v['archived_kml_legacy_to_current_mapping'] == {'D84':'D184','E03':'D185'}
          assert v['future_2026_09_14_used_as_current'] is False
          assert v['pdf_timing_rows_treated_as_complete_stop_universe'] is False
          assert v['physical_stop_clustering_deterministic'] is True
          assert v['fuzzy_matching_used'] is False
          assert v['nearest_neighbour_matching_used'] is False
          assert v['invented_stop_coordinates'] is False
          assert v['walking_graph_epoch_changed'] is False
          assert v['population_units_changed'] is False
          assert v['current_service_baseline_complete'] is False
          assert v['temporary_brivio_bridge_disruption_excluded_from_structural_baseline'] is True
          assert v['temporary_condition_ordinary_network_baseline_replaced'] is False
          assert v['historical_gtfs_identity_implies_current_trip_activation'] is False
          assert v['current_route_level_activation_certified_for_reference_date'] is True
          assert v['current_service_evidence_relabelled_as_ridership'] is False
          assert v['route_specific_stop_record_count'] == 72
          assert v['pattern_count'] == 18
          assert v['olgiate_diagnostic_available'] is True
          assert v['olgiate_diagnostic_used_in_candidate_optimisation'] is False
          assert v['decision_gate_reopen_required'] is False
          assert v['primary_selected'] is False
          assert v['runner_up_selected'] is False
          assert v['unresolved_stop_coordinate_count'] == 0
          assert v['official_gtfs_unique_stop_id_count'] > 15
          assert v['official_physical_stop_cluster_count'] >= v['physical_clusters_with_certified_phase2_catchment_count']
          for t in ('5','8','10'):
              assert v[f'coverage_{t}m'] + 1e-12 >= v['v3_comparison'][f'v3_coverage_{t}m']
          diag = list(csv.DictReader((out/'current_service_olgiate_diagnostic_v4.csv').open(encoding='utf-8')))
          assert [r['area'] for r in diag] == ['Centro/Stazione','Mondonico','San Zeno','Monticello']
          assert all(r['used_in_candidate_optimisation'] == 'false' for r in diag)
          print(json.dumps({
              'route_specific_stop_records': v['route_specific_stop_record_count'],
              'unique_stop_ids': v['official_gtfs_unique_stop_id_count'],
              'physical_clusters': v['official_physical_stop_cluster_count'],
              'catchment_clusters': v['physical_clusters_with_certified_phase2_catchment_count'],
              'coverage_5m': v['coverage_5m'],
              'coverage_8m': v['coverage_8m'],
              'coverage_10m': v['coverage_10m'],
              'archived_kml_corroboration': v['archived_kml_corroboration_available'],
          }, indent=2))
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          REBUILD=/tmp/current_service_baseline_v4_rebuild
          rm -rf "$REBUILD"
          mkdir -p "$REBUILD"
          python scripts/phase2_build_current_service_access_baseline_v4_source_closed.py \
            --gtfs-route-stops "$SOURCEDIR/official_gtfs_d184_d185_route_stops.csv" \
            --gtfs-patterns "$SOURCEDIR/official_gtfs_d184_d185_trip_patterns.csv" \
            --gtfs-recovery-summary "$SOURCEDIR/gtfs_recovery_summary.json" \
            --gtfs-source-sha256 "$SOURCEDIR/gtfs_source_sha256.txt" \
            --current-service-reference "$SOURCEDIR/current_service_reference_2026-09-03.csv" \
            --temporary-conditions "$SOURCEDIR/current_service_temporary_conditions_2026-09-03.csv" \
            --archived-kml-provenance data/external/current_service_v4/archived_kml_provenance.csv \
            --frozen-official-stops outputs/phase2/stop_universe_v2/existing_official_stops.csv \
            --existing-catchments outputs/phase2/stop_universe_v2/existing_stop_catchment_units_12min.csv \
            --population-units outputs/phase2/stop_universe_v2/accessibility_gap_building_pieces.csv \
            --settlement-anchors outputs/phase2/stop_universe_v2/settlement_destination_anchors.csv \
            --v3-validation outputs/phase2/current_service_access_baseline_v3/current_service_access_baseline_v3_validation.json \
            --outdir "$REBUILD"
          diff -qr "$OUTDIR" "$REBUILD"

      - name: Anti-fuzzy anti-invention anti-network guard
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('src/phase2_current_service_baseline_v4.py'),
              Path('scripts/phase2_build_current_service_access_baseline_v4_source_closed.py'),
          ]
          text = '\n'.join(p.read_text(encoding='utf-8') for p in files)
          forbidden = ['np.random', 'random.', 'rapidfuzz', 'fuzzywuzzy', 'SequenceMatcher', 'Nominatim', 'geopy.geocoders', 'urlopen(', 'requests.get(', 'curl ']
          for token in forbidden:
              assert token not in text, token
          assert 'StopForClustering("' not in text
          v = Path('outputs/phase2/current_service_access_baseline_v4/current_service_access_baseline_v4_validation.json').read_text()
          assert '"invented_stop_coordinates": false' in v
          assert '"fuzzy_matching_used": false' in v
          assert '"gtfs_live_download_required": false' in v
          PY

      - name: Persist evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTDIR"
          if git diff --cached --quiet -- "$OUTDIR"; then
            echo 'No output changes to persist.'
            exit 0
          fi
          git commit -m 'evidence(phase2): persist current-service baseline V4 [skip ci]'
          git push origin HEAD:phase2-current-service-baseline-v4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-current-service-baseline-v4
          path: outputs/phase2/current_service_access_baseline_v4/
          if-no-files-found: error
