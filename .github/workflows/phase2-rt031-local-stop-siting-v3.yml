name: RT031 Olgiate stop-siting inventory V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_audit_rt031_local_stop_siting_v3.py
      - tests/test_phase2_rt031_local_stop_siting_v3.py
      - .github/workflows/phase2-rt031-local-stop-siting-v3.yml
      - outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv
      - data/processed/poi_dataset.csv
      - data/phase2/frozen_gate_d/source/structural_anchor_evidence.csv
      - data/raw/osm/osm_highways_core.geojson
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_phase2_rt031_local_stop_siting_v3.py -q
      - name: Acquire pinned physical and typed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rt031-inputs/{rt017,rt022,rt030} /tmp/typed
          gh api repos/${{ github.repository }}/actions/artifacts/9972204236/zip > /tmp/rt017.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9988386073/zip > /tmp/rt022.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9992507233/zip > /tmp/rt030.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10702692659/zip > /tmp/typed.zip
          echo 'e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225  /tmp/rt017.zip' | sha256sum -c
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-inputs/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-inputs/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-inputs/rt030
          unzip -q /tmp/typed.zip -d /tmp/typed
          echo 'c0169f3e39e1132853c2e8324d00bbb3030dbf5219c65889eee6ae4acf31b32e  /tmp/typed/hub-split-typed-a.json' | sha256sum -c
      - name: Reproduce complete non-decisional siting inventory twice
        run: |
          for replica in a b; do
            python -m scripts.phase2_audit_rt031_local_stop_siting_v3 \
              --inputs /tmp/rt031-inputs \
              --typed /tmp/typed/hub-split-typed-a.json \
              --output "/tmp/olgiate-siting-$replica.json"
          done
          cmp /tmp/olgiate-siting-a.json /tmp/olgiate-siting-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-olgiate-stop-siting-inventory-v3
          path: /tmp/olgiate-siting-a.json
          if-no-files-found: error
