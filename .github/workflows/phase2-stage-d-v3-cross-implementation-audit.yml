name: Phase 2 Stage D V3 Cross Implementation Audit

on:
  push:
    branches: [phase2-stage-d-v3-cross-implementation-audit]
    paths:
      - 'src/phase2_stage_d_v3_cross_audit.py'
      - 'scripts/phase2_compare_stage_d_v3_implementations.py'
      - 'tests/test_phase2_stage_d_v3_cross_audit.py'
      - '.github/workflows/phase2-stage-d-v3-cross-implementation-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CODEX_EVIDENCE_COMMIT: d41bb678382d018929c1c6b46542f12549f20d4f
  OTHER_SOURCE_COMMIT: 5a391b26ce31e016d894121eb2427d7d2aade8e1
  OTHER_DETERMINISTIC_RUN: '33873248969'
  OUTDIR: outputs/phase2/stage_d_v3_cross_implementation_audit

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch frozen independent implementations
        run: |
          git fetch origin "$CODEX_EVIDENCE_COMMIT" "$OTHER_SOURCE_COMMIT"
          git cat-file -e "$CODEX_EVIDENCE_COMMIT^{commit}"
          git cat-file -e "$OTHER_SOURCE_COMMIT^{commit}"
          git worktree add --detach /tmp/codex-stage-d "$CODEX_EVIDENCE_COMMIT"
          git worktree add --detach /tmp/other-stage-d "$OTHER_SOURCE_COMMIT"

      - name: Verify Codex persisted evidence exists
        run: |
          test -f /tmp/codex-stage-d/outputs/phase2/stage_d_exact_rt001_v3/stage_d_exact_rt001_v3_validation.json
          test -f /tmp/codex-stage-d/outputs/phase2/stage_d_exact_rt001_v3/exact_plan_context_results_rt001_v3.csv.gz
          test -f /tmp/codex-stage-d/outputs/phase2/stage_d_exact_rt001_v3/exact_selected_timetables_rt001_v3.csv
          test -f /tmp/codex-stage-d/outputs/phase2/stage_d_exact_rt001_v3/exact_selected_trips_rt001_v3.csv.gz

      - name: Rebuild independent Stage-D implementation once
        working-directory: /tmp/other-stage-d
        env:
          PYTHONPATH: /tmp/other-stage-d
        run: |
          mkdir -p /tmp/other-stage-d-output
          python scripts/phase2_run_exact_timetable_rt001_v3.py \
            --timing-inputs outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_daily_timing_inputs_rt001_v3.csv.gz \
            --route-inputs outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_public_route_inputs_rt001_v3.csv \
            --manifest-validation outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_input_manifest_rt001_v3_validation.json \
            --passenger-frontier outputs/phase2/passenger_utility_frontier_rt001_v3/passenger_utility_frontier_rt001_v3.csv.gz \
            --passenger-validation outputs/phase2/passenger_utility_frontier_rt001_v3/passenger_utility_frontier_rt001_v3_validation.json \
            --budget-lossless-validation outputs/phase2/budget_lossless_policy_surface_v2/budget_lossless_policy_surface_v2_validation.json \
            --budget-envelopes outputs/phase2/budget_envelopes.csv \
            --budget-envelope-validation outputs/phase2/budget_envelopes_validation.json \
            --path-matrix outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix.csv \
            --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json \
            --s8-events outputs/phase2/s8_events.csv \
            --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json \
            --s8-sensitivity-config config/phase2_s8_phasing_sensitivity_v2.json \
            --context-output /tmp/other-stage-d-output/contexts.csv.gz \
            --timetable-output /tmp/other-stage-d-output/timetables.csv \
            --trip-output /tmp/other-stage-d-output/trips.csv.gz \
            --validation /tmp/other-stage-d-output/validation.json

      - name: Validate reconstructed independent contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/other-stage-d-output/validation.json').read_text())
          assert v['status']=='PASS_PHASE2_STAGE_D_EXACT_TIMETABLE_RT001_V3'
          assert v['stage_d_daily_timing_input_count']==5325
          assert v['stage_c_plan_context_count']==16495
          assert v['phase_vectors_evaluated_once']==6772755
          assert v['exact_budget_hard_eligible_context_count']==16495
          assert v['exact_budget_hard_ineligible_context_count']==0
          assert v['primary_selected'] is False
          assert v['runner_up_selected'] is False
          assert v['weighted_composite_score'] is False
          PY

      - name: Compile and test semantic comparator
        run: |
          python -m py_compile src/phase2_stage_d_v3_cross_audit.py scripts/phase2_compare_stage_d_v3_implementations.py
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m pytest -q tests/test_phase2_stage_d_v3_cross_audit.py

      - name: Compare all contexts, timetables, trips and common block assignments
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "$OUTDIR"
          python scripts/phase2_compare_stage_d_v3_implementations.py \
            --a-label CODEX_STAGE_D_RT001_V3 \
            --a-validation /tmp/codex-stage-d/outputs/phase2/stage_d_exact_rt001_v3/stage_d_exact_rt001_v3_validation.json \
            --a-contexts /tmp/codex-stage-d/outputs/phase2/stage_d_exact_rt001_v3/exact_plan_context_results_rt001_v3.csv.gz \
            --a-timetables /tmp/codex-stage-d/outputs/phase2/stage_d_exact_rt001_v3/exact_selected_timetables_rt001_v3.csv \
            --a-trips /tmp/codex-stage-d/outputs/phase2/stage_d_exact_rt001_v3/exact_selected_trips_rt001_v3.csv.gz \
            --b-label INDEPENDENT_STAGE_D_RT001_V3 \
            --b-validation /tmp/other-stage-d-output/validation.json \
            --b-contexts /tmp/other-stage-d-output/contexts.csv.gz \
            --b-timetables /tmp/other-stage-d-output/timetables.csv \
            --b-trips /tmp/other-stage-d-output/trips.csv.gz \
            --output "$OUTDIR/stage_d_v3_cross_implementation_validation.json" \
            --require-equivalent

      - name: Add audit provenance and assert non-selection boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('outputs/phase2/stage_d_v3_cross_implementation_audit/stage_d_v3_cross_implementation_validation.json')
          v=json.loads(p.read_text())
          assert v['status']=='PASS_PHASE2_STAGE_D_V3_CROSS_IMPLEMENTATION_EQUIVALENCE'
          assert v['equivalent'] is True
          assert v['context_count_a']==16495 and v['context_count_b']==16495
          assert v['differing_context_count']==0
          assert v['differing_selected_phase_context_count']==0
          assert v['semantic_timetables_only_a_count']==0
          assert v['semantic_timetables_only_b_count']==0
          assert v['differing_semantic_timetable_count']==0
          assert v['differing_semantic_trip_set_count']==0
          assert v['primary_selected'] is False and v['runner_up_selected'] is False
          v['provenance']={
              'codex_persisted_evidence_commit': os.environ['CODEX_EVIDENCE_COMMIT'],
              'independent_source_commit': os.environ['OTHER_SOURCE_COMMIT'],
              'independent_prior_run_with_successful_full_build_validation_and_deterministic_rebuild': int(os.environ['OTHER_DETERMINISTIC_RUN']),
              'independent_prior_run_final_failure_scope': 'GUARD_ONLY_AFTER_SUCCESSFUL_DETERMINISTIC_REBUILD',
          }
          v['stage_e_direct_block_assignment_note']=(
              'Codex materialises recovery 5/10/15 per-trip assignments; independent implementation '
              'materialises recovery 15 only. Fleet counts 5/10/15 are compared at context/timetable level. '
              'Canonical Stage-E input must supply exact assignments for every declared recovery.'
          )
          p.write_text(json.dumps(v,indent=2,sort_keys=True)+'\n')
          PY

      - name: Guard audit itself
        run: |
          FILES='src/phase2_stage_d_v3_cross_audit.py scripts/phase2_compare_stage_d_v3_implementations.py'
          ! grep -En 'np\.random|numpy\.random|(^|[[:space:]])import random|from random' $FILES
          git diff --check

      - name: Persist cross-audit evidence
        run: |
          git config user.name 'phase2-stage-d-v3-cross-audit-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo 'No cross-audit evidence changes to persist'
          else
            git commit -m 'audit(phase2): persist Stage-D V3 cross-implementation evidence [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-stage-d-v3-cross-implementation-audit-${{ github.sha }}
          path: outputs/phase2/stage_d_v3_cross_implementation_audit
          retention-days: 90
          if-no-files-found: error
