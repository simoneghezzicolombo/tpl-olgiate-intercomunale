name: Phase 2 Network Structure Search V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-network-structure-search-v3
    paths:
      - src/phase2_network_structure_search_v3.py
      - tests/test_phase2_network_structure_search_v3.py
      - scripts/phase2_audit_network_structure_search_v3.py
      - docs/PHASE2_NETWORK_STRUCTURE_SEARCH_V3.md
      - .github/workflows/phase2-network-structure-search-v3.yml

permissions:
  contents: read

concurrency:
  group: phase2-network-structure-search-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-network-structure-search-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile RT-007 core and audit
        run: |
          python -m py_compile src/phase2_network_structure_search_v3.py
          python -m py_compile scripts/phase2_audit_network_structure_search_v3.py

      - name: Run RT-007 unit tests
        run: pytest -q tests/test_phase2_network_structure_search_v3.py

      - name: Run controlled abstract-graph audit
        run: python scripts/phase2_audit_network_structure_search_v3.py

      - name: Validate audit contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/network_structure_search_v3/network_structure_search_v3_validation.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'PASS_RT007_ABSTRACT_NETWORK_STRUCTURE_SEARCH_V3'
          assert d['fixture_semantics'] == 'CONTROLLED_ABSTRACT_FIXTURE_NOT_TERRITORIAL_DATA'
          assert d['cap_fail_closed'] is True
          assert d['weighted_composite_score'] is False
          assert d['random_search'] is False
          assert d['territorial_candidate_claim'] is False
          assert d['passenger_stop_pattern_claim'] is False
          assert d['network_winner_claim'] is False
          assert d['figure_eight_like_count'] >= 1
          PY

      - name: Guard against geography, stop and winner leakage
        run: |
          ! grep -niE 'Arlate|Beverate|Perego|Mondonico|Calco|Brivio|Olgiate|Santa Maria|proposed_stop_candidates|passenger_stop_foundation|C146|ASF' src/phase2_network_structure_search_v3.py
          ! grep -niE 'PRIMARY|RUNNER-UP|winner|recommended route' src/phase2_network_structure_search_v3.py
          ! grep -nE 'np\.random|numpy\.random|random\.' src/phase2_network_structure_search_v3.py scripts/phase2_audit_network_structure_search_v3.py

      - name: Whitespace check
        run: git diff --check

      - name: Upload RT-007 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-network-structure-search-v3
          path: outputs/phase2/network_structure_search_v3/network_structure_search_v3_validation.json
          if-no-files-found: error
