name: Phase 2 analysis envelope

on:
  push:
    branches: [phase2-analysis-envelope]
    paths:
      - 'scripts/phase2_analysis_envelope.py'
      - 'tests/test_phase2_analysis_envelope.py'
      - 'docs/PHASE2_ANALYSIS_ENVELOPE.md'
      - '.github/workflows/phase2-analysis-envelope.yml'
      - 'data/phase2/analysis_envelope/**'
      - 'outputs/phase2/analysis_envelope/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE: 147ad941579eb7ef17a5a54c19a5f820e5a226d4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited municipality-label encoding correction
        run: |
          python - <<'PY'
          from pathlib import Path

          script=Path('scripts/phase2_analysis_envelope.py')
          s=script.read_text(encoding='utf-8')
          anchor='''def norm(v):
              s=str(v).strip().removesuffix(".0") if v is not None else ""
              d="".join(c for c in s if c.isdigit())
              return d.zfill(6) if d else ""
          '''.replace('              ','    ')
          helper='''def repair_utf8_mojibake(v):
              """Repair only reversible UTF-8-as-Latin-1 display-label corruption."""
              text=str(v).strip()
              if not any(marker in text for marker in ("Ã", "Â", "â", "ð")):
                  return text
              try:
                  repaired=text.encode("latin-1").decode("utf-8")
              except (UnicodeEncodeError, UnicodeDecodeError):
                  return text
              return repaired
          '''.replace('              ','    ')
          if 'def repair_utf8_mojibake' not in s:
              if anchor not in s: raise SystemExit('norm anchor not found')
              s=s.replace(anchor,anchor+helper)
          s=s.replace('x["municipality_name"]=x[n].astype(str).str.strip()','x["municipality_name"]=x[n].astype(str).map(repair_utf8_mojibake)')
          load='sm=verify_src(src); m=load_gz(src/"municipalities_context.geojson.gz"); secall=load_gz(src/"census_sections_context.geojson.gz"); bldall=load_gz(src/"dbgt_buildings_context.geojson.gz")'
          repl=load+'; m["municipality_name"]=m["municipality_name"].map(repair_utf8_mojibake)'
          if repl not in s:
              if load not in s: raise SystemExit('source-load anchor not found')
              s=s.replace(load,repl)
          script.write_text(s,encoding='utf-8')

          test=Path('tests/test_phase2_analysis_envelope.py')
          t=test.read_text(encoding='utf-8')
          block='''\n\ndef test_municipality_labels_are_clean_utf8_text():
              inv = pd.read_csv(OUT / "municipalities_intersected.csv", dtype={"procom": str})
              joined = "|".join(inv["municipality_name"].astype(str))
              for marker in ("Ã", "Â", "�"):
                  assert marker not in joined
              names = inv.assign(procom=inv.procom.str.zfill(6)).set_index("procom")["municipality_name"]
              assert names["097074"] == "Santa Maria Hoè"
              assert names["097006"] == "Barzanò"
              assert names["097090"] == "Viganò"
          '''.replace('              ','    ')
          if 'test_municipality_labels_are_clean_utf8_text' not in t:
              t=t.rstrip()+block+'\n'
          test.write_text(t,encoding='utf-8')

          doc=Path('docs/PHASE2_ANALYSIS_ENVELOPE.md')
          d=doc.read_text(encoding='utf-8')
          note='''\nMunicipality identity is keyed by the official six-digit ISTAT code. A small number of names in the frozen shapefile-derived snapshot expose reversible UTF-8-as-Latin-1 mojibake. The builder repairs only those reversible display labels during materialisation; codes, geometries, source bytes and source checksums are unchanged. Tests explicitly reject mojibake in the published municipality inventory.\n'''
          marker='The first acquisition writes deterministic compressed source snapshots under `data/phase2/analysis_envelope/source/`, with upstream ZIP/query provenance and SHA256 checksums. Subsequent CI builds are source-closed and must reproduce from those committed snapshots.\n'
          if note.strip() not in d:
              if marker not in d: raise SystemExit('doc anchor not found')
              d=d.replace(marker,marker+note)
          doc.write_text(d,encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile analysis-envelope builder
        run: python -m py_compile scripts/phase2_analysis_envelope.py tests/test_phase2_analysis_envelope.py
      - name: Require frozen source snapshot
        run: |
          test -f data/phase2/analysis_envelope/source/source_manifest.json
          test -f data/phase2/analysis_envelope/source/municipalities_context.geojson.gz
          test -f data/phase2/analysis_envelope/source/census_sections_context.geojson.gz
          test -f data/phase2/analysis_envelope/source/dbgt_buildings_context.geojson.gz
      - name: Source-closed materialisation
        run: python scripts/phase2_analysis_envelope.py --forbid-live
      - name: Record source-closed output hashes
        run: |
          find outputs/phase2/analysis_envelope -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/envelope_hashes_1.txt
      - name: Deterministic second source-closed rebuild
        run: |
          python scripts/phase2_analysis_envelope.py --forbid-live
          find outputs/phase2/analysis_envelope -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/envelope_hashes_2.txt
          diff -u /tmp/envelope_hashes_1.txt /tmp/envelope_hashes_2.txt
      - name: Analysis-envelope tests
        run: python -m pytest -q tests/test_phase2_analysis_envelope.py
      - name: Preserve all V1 Phase 2 outputs
        run: |
          git diff --exit-code "$BASELINE" -- outputs/phase2 ':(exclude)outputs/phase2/analysis_envelope/**'
      - name: Anti-synthetic and anti-manual-whitelist guards
        run: |
          ! grep -R -n -E 'np\.random|random\.' scripts/phase2_analysis_envelope.py
          ! grep -n -E 'Merate|Imbersago|Airuno' scripts/phase2_analysis_envelope.py
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('outputs/phase2/analysis_envelope/analysis_envelope_validation.json').read_text())
          assert v['acquisition_used_this_run'] is False
          assert v['prohibitions']['synthetic_data_used'] is False
          assert v['prohibitions']['manual_external_municipality_whitelist_used'] is False
          assert v['prohibitions']['topology_selected'] is False
          assert v['prohibitions']['final_stop_selected'] is False
          print(json.dumps({'status':v['status'],'rule':v['selected_rule'],'counts':v['counts']},indent=2))
          PY
      - name: Whitespace and provenance checks
        run: |
          git diff --check "$BASELINE"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('data/phase2/analysis_envelope/source/source_manifest.json')
          m=json.loads(p.read_text())
          for f,h in m['frozen_source_files_sha256'].items():
              q=p.parent/f
              assert hashlib.sha256(q.read_bytes()).hexdigest()==h, f
          print('source checksums PASS')
          PY
      - name: Commit audited label fix and regenerated outputs
        run: |
          git add scripts/phase2_analysis_envelope.py tests/test_phase2_analysis_envelope.py docs/PHASE2_ANALYSIS_ENVELOPE.md outputs/phase2/analysis_envelope
          if ! git diff --cached --quiet; then
            git config user.name 'phase2-analysis-envelope-ci'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'fix(phase2): normalize municipality display labels [skip ci]'
            git push
          fi
      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase2-analysis-envelope-audit
          path: |
            outputs/phase2/analysis_envelope
            data/phase2/analysis_envelope/source/source_manifest.json
          if-no-files-found: error
