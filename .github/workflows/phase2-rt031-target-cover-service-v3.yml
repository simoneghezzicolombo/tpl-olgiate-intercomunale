name: RT031 target-cover typed service V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_bind_rt031_target_cover_service_v3.py
      - src/phase2_rt031_service_network_v3.py
      - src/phase2_rt031_occurrence_binding_v3.py
      - tests/test_phase2_rt031_service_network_v3.py
      - .github/workflows/phase2-rt031-target-cover-service-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  typed-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: >-
          python -m pytest tests/test_phase2_rt031_service_network_v3.py
          tests/test_phase2_rt031_occurrence_binding_v3.py -q
      - name: Acquire pinned physical and target-cover evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rt031-inputs/{rt017,rt022,rt030} /tmp/via /tmp/target
          gh api repos/${{ github.repository }}/actions/artifacts/9972204236/zip > /tmp/rt017.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9988386073/zip > /tmp/rt022.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9992507233/zip > /tmp/rt030.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10023387513/zip > /tmp/via.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10358581671/zip > /tmp/target.zip
          echo 'e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225  /tmp/rt017.zip' | sha256sum -c
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          echo '1603606d02a170567c1d423b7689b7044933fff6490caeaf848ae0ca0f2d77d0  /tmp/via.zip' | sha256sum -c
          echo '9c7f95d7766914341a609f3a18cf734afedc0954302012c309dde932bd6f93fb  /tmp/target.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-inputs/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-inputs/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-inputs/rt030
          unzip -q /tmp/via.zip -d /tmp/via
          unzip -q /tmp/target.zip -d /tmp/target
      - name: Bind candidate service events twice
        run: |
          evidence=$(find /tmp/via -name '*.json' | head -1)
          target=$(find /tmp/target -name current_exact_target_cover_search.json | head -1)
          for out in /tmp/service-a /tmp/service-b; do
            python scripts/phase2_bind_rt031_target_cover_service_v3.py \
              --inputs /tmp/rt031-inputs --via-way-evidence "$evidence" \
              --target-search "$target" --output-dir "$out"
          done
          diff -r /tmp/service-a /tmp/service-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-target-cover-typed-service-v3
          path: /tmp/service-a/
          if-no-files-found: error
