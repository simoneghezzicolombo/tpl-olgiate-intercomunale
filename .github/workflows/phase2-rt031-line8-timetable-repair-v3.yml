name: RT031 Linea 8 timetable repair V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_audit_rt031_line8_site_rides_v3.py
      - tests/test_phase2_rt031_line8_site_rides_v3.py
      - docs/RT031_LINEA8_TEMPI_PER_SITO_V3.md
      - scripts/phase2_compare_rt031_line8_shorter_span_v3.py
      - tests/test_phase2_rt031_line8_shorter_span_v3.py
      - scripts/phase2_solve_rt031_line8_joint_evening_v3.py
      - scripts/phase2_export_rt031_line8_joint_evening_v3.py
      - outputs/phase2/rt031_line8_local_shortcuts_v3/*.geojson
      - tests/test_phase2_rt031_line8_joint_evening_v3.py
      - scripts/phase2_audit_rt031_line8_evening_peak_closure_v3.py
      - tests/test_phase2_rt031_line8_evening_peak_closure_v3.py
      - scripts/phase2_compare_rt031_line8_evening_reallocation_v3.py
      - tests/test_phase2_rt031_line8_evening_reallocation_v3.py
      - scripts/phase2_retime_rt031_line8_peak_direction_v3.py
      - tests/test_phase2_rt031_line8_retiming_v3.py
      - scripts/phase2_build_rt031_line8_peak_direction_v3.py
      - tests/test_phase2_rt031_line8_peak_direction_v3.py
      - scripts/phase2_solve_rt031_line8_flexible_peaks_v3.py
      - scripts/phase2_build_rt031_line8_regular_compromise_v3.py
      - scripts/phase2_close_rt031_line8_timetable_repair_v3.py
      - tests/test_phase2_rt031_line8_timetable_repair_v3.py
      - outputs/phase2/rt031_line8_local_shortcuts_v3/*.json
      - outputs/phase2/s8_events.csv
      - outputs/phase2/s8_interchange_contract.json
      - config/phase2_final_policy_contract_v3.json
      - .github/workflows/phase2-rt031-line8-timetable-repair-v3.yml
  pull_request:
    paths:
      - scripts/phase2_audit_rt031_line8_site_rides_v3.py
      - tests/test_phase2_rt031_line8_site_rides_v3.py
      - docs/RT031_LINEA8_TEMPI_PER_SITO_V3.md
      - scripts/phase2_compare_rt031_line8_shorter_span_v3.py
      - tests/test_phase2_rt031_line8_shorter_span_v3.py
      - scripts/phase2_solve_rt031_line8_joint_evening_v3.py
      - scripts/phase2_export_rt031_line8_joint_evening_v3.py
      - outputs/phase2/rt031_line8_local_shortcuts_v3/*.geojson
      - tests/test_phase2_rt031_line8_joint_evening_v3.py
      - scripts/phase2_audit_rt031_line8_evening_peak_closure_v3.py
      - tests/test_phase2_rt031_line8_evening_peak_closure_v3.py
      - scripts/phase2_compare_rt031_line8_evening_reallocation_v3.py
      - tests/test_phase2_rt031_line8_evening_reallocation_v3.py
      - scripts/phase2_retime_rt031_line8_peak_direction_v3.py
      - tests/test_phase2_rt031_line8_retiming_v3.py
      - scripts/phase2_build_rt031_line8_peak_direction_v3.py
      - tests/test_phase2_rt031_line8_peak_direction_v3.py
      - scripts/phase2_solve_rt031_line8_flexible_peaks_v3.py
      - scripts/phase2_build_rt031_line8_regular_compromise_v3.py
      - scripts/phase2_close_rt031_line8_timetable_repair_v3.py
      - tests/test_phase2_rt031_line8_timetable_repair_v3.py
      - outputs/phase2/rt031_line8_local_shortcuts_v3/*.json
      - outputs/phase2/s8_events.csv
      - outputs/phase2/s8_interchange_contract.json
      - config/phase2_final_policy_contract_v3.json
      - .github/workflows/phase2-rt031-line8-timetable-repair-v3.yml
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<4' 'scipy>=1.13,<2'
      - name: Regression tests and constructive compromise
        run: |
          python -m unittest discover -s tests -p test_phase2_rt031_line8_timetable_repair_v3.py
          python -m unittest discover -s tests -p test_phase2_rt031_line8_peak_direction_v3.py
          python -m unittest discover -s tests -p test_phase2_rt031_line8_retiming_v3.py
          python -m unittest discover -s tests -p test_phase2_rt031_line8_evening_reallocation_v3.py
          python -m unittest discover -s tests -p test_phase2_rt031_line8_evening_peak_closure_v3.py
          python -m unittest discover -s tests -p test_phase2_rt031_line8_joint_evening_v3.py
          python -m unittest discover -s tests -p test_phase2_rt031_line8_shorter_span_v3.py
          python -m unittest discover -s tests -p test_phase2_rt031_line8_site_rides_v3.py
      - name: Independently reproduce relaxed wing infeasibility
        run: |
          set -euo pipefail
          for wing in west east; do
            python -m scripts.phase2_solve_rt031_line8_flexible_peaks_v3 \
              --source outputs/phase2/rt031_line8_local_shortcuts_v3/independent_wings.json \
              --output /tmp/rt031-repair-$wing.json --fixed_counts --wing "$wing"
          done
          python -m scripts.phase2_close_rt031_line8_timetable_repair_v3 \
            --wings outputs/phase2/rt031_line8_local_shortcuts_v3/independent_wings.json \
            --west /tmp/rt031-repair-west.json --east /tmp/rt031-repair-east.json \
            --policy config/phase2_final_policy_contract_v3.json --output /tmp/rt031-repair-floor.json
          python -c "import json; a=json.load(open('/tmp/rt031-repair-floor.json')); assert a['status']=='REFERENCE_CAP_EXCLUDED_IN_DECLARED_FINITE_DOMAIN'; assert abs(a['annual_service_km_lower_bound']-114741.185305)<0.001"
