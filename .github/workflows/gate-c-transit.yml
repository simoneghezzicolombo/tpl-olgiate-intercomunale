name: Gate C - Transit Integrity

on:
  push:
    branches: [gate-c-workstream]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gate C test dependencies
        run: python -m pip install pytest pandas pypdf
      - name: Gate C targeted tests
        run: python -m pytest tests/test_gate_c_transit.py tests/test_gate_c_quarantine.py -q
      - name: Audit covered bus date
        run: python scripts/gate_c_transit_audit.py --service-date 2026-05-06 --output outputs/gate_c/transit_integrity_2026-05-06.json
      - name: Audit current project date against frozen snapshots
        run: python scripts/gate_c_transit_audit.py --service-date 2026-09-03 --output outputs/gate_c/transit_integrity_2026-09-03.json
      - name: Audit current official bus timetable PDFs
        run: python scripts/gate_c_live_bus_timetables.py --service-date 2026-09-03 --output outputs/gate_c/live_bus_timetables_2026-09-03.json
      - name: Upload current bus timetable evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-live-bus-timetables-2026-09-03
          path: outputs/gate_c/live_bus_timetables_2026-09-03.json
      - name: Audit current official Trenord GTFS live
        run: python scripts/gate_c_live_trenord.py --service-date 2026-09-03 --output outputs/gate_c/live_trenord_2026-09-03.json
      - name: Upload live Trenord audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-live-trenord-2026-09-03
          path: outputs/gate_c/live_trenord_2026-09-03.json
      - name: Anti-synthetic guardrails
        run: python -m pytest tests/test_audit_anti_synthetic_guardrails.py -q
      - name: Diff whitespace check
        run: git diff --check 549198743e7265b333da565ce6990f9241cfd1fd...HEAD
      - name: Persist deterministic Gate C reports
        run: |
          git config user.name "gate-c-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/gate_c/transit_integrity_2026-05-06.json outputs/gate_c/transit_integrity_2026-09-03.json
          if ! git diff --cached --quiet; then
            git commit -m "data(gate-c): record deterministic transit audit outputs [skip ci]"
            git push
          fi
