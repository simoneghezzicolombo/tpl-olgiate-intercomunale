name: Phase 2 Restriction-Aware K-Shortest Audit V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-network-design-method-audit-v3
    paths:
      - src/phase2_restriction_aware_ksp.py
      - tests/test_phase2_restriction_aware_ksp_v3.py
      - scripts/phase2_audit_restriction_aware_ksp_v3.py
      - .github/workflows/phase2-restriction-aware-ksp-audit-v3.yml
      - src/phase2_frozen_graph.py
      - src/phase2_reduced_path_matrix.py
      - outputs/phase2/frozen_gate_d/**

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase2-network-design-method-audit-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned routing dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pandas==2.2.3 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1 \
            pytest==8.3.5

      - name: Compile KSP core and audit runner
        run: |
          python -m py_compile src/phase2_restriction_aware_ksp.py
          python -m py_compile scripts/phase2_audit_restriction_aware_ksp_v3.py

      - name: Run focused KSP unit tests
        run: pytest -q tests/test_phase2_restriction_aware_ksp_v3.py

      - name: Revalidate frozen Gate-D routing contract
        run: pytest -q tests/test_phase2_frozen_graph.py

      - name: Run frozen Gate-D KSP equivalence audit
        run: |
          python scripts/phase2_audit_restriction_aware_ksp_v3.py \
            --k 3 \
            --pairs 8 \
            --max-raw-state-paths 20000

      - name: Validate routing-equivalence and corridor guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/restriction_aware_ksp_v3_validation.json')
          v = json.loads(p.read_text(encoding='utf-8'))
          assert v['status'] == 'PASS_RESTRICTION_AWARE_KSP_AUDIT_V3', v
          assert v['contract'] == 'EDGE_STATE_YEN_CERTIFIED_GATE_D_EQUIVALENCE_PLUS_LOOPLESS_CORRIDOR_FILTER_NOT_NETWORK_SELECTION'
          checks = v['checks']
          for key in [
              'state_vertex_count_equals_directed_edge_count',
              'turn_restrictions_reject_at_least_one_transition',
              'all_certified_paths_exact_frozen_edge_sequence',
              'all_certified_paths_state_representable',
              'all_certified_runtime_deltas_le_1e_9',
              'all_certified_distance_deltas_le_1e_6',
              'all_output_corridor_paths_physical_loopless',
              'loopless_certified_paths_remain_exact_rank1',
          ]:
              assert checks[key] is True, (key, checks)
          guards = v['guards']
          for key in [
              'candidate_network_generated',
              'corridor_selected',
              'passenger_stop_pattern_selected',
              'new_stop_generated',
              'topology_selected',
              'headway_optimised',
              'winner_selected',
              'manual_settlement_waypoints_used_for_design',
          ]:
              assert guards[key] is False, (key, guards)
          assert v['parameters']['audit_pair_count_used'] >= 4
          print(json.dumps(v, indent=2, sort_keys=True))
          PY

      - name: Deterministic rebuild check
        run: |
          mkdir -p /tmp/ksp-first
          cp outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/gate_d_ksp_audit_paths_v3.csv /tmp/ksp-first/
          cp outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/gate_d_ksp_audit_pairs_v3.csv /tmp/ksp-first/
          cp outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/restriction_aware_ksp_v3_validation.json /tmp/ksp-first/
          rm -rf outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3
          python scripts/phase2_audit_restriction_aware_ksp_v3.py \
            --k 3 \
            --pairs 8 \
            --max-raw-state-paths 20000 > /tmp/ksp-second.log
          cmp /tmp/ksp-first/gate_d_ksp_audit_paths_v3.csv outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/gate_d_ksp_audit_paths_v3.csv
          cmp /tmp/ksp-first/gate_d_ksp_audit_pairs_v3.csv outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/gate_d_ksp_audit_pairs_v3.csv
          cmp /tmp/ksp-first/restriction_aware_ksp_v3_validation.json outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/restriction_aware_ksp_v3_validation.json

      - name: Anti-random and source-closure guard
        run: |
          ! grep -nE 'np\.random|numpy\.random|random\.' src/phase2_restriction_aware_ksp.py scripts/phase2_audit_restriction_aware_ksp_v3.py
          ! grep -niE 'requests|overpass-api|urllib|httpx' src/phase2_restriction_aware_ksp.py scripts/phase2_audit_restriction_aware_ksp_v3.py

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-restriction-aware-ksp-audit-v3
          path: outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/
          if-no-files-found: error

      - name: Persist audited KSP evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/phase2/network_design_method_audit_v3/restriction_aware_ksp_v3/
          if git diff --cached --quiet; then
            echo 'No KSP evidence changes to persist.'
          else
            git commit -m 'audit: persist restriction-aware KSP V3 evidence'
            git push origin HEAD:phase2-network-design-method-audit-v3
          fi
