name: Phase 2 Access Equity V2

on:
  push:
    branches:
      - phase2-access-equity-v2
    paths:
      - 'src/phase2_access_equity_v2.py'
      - 'scripts/phase2_run_access_equity_v2.py'
      - 'tests/test_phase2_access_equity_v2.py'
      - 'docs/PHASE2_ACCESS_EQUITY_V2.md'
      - '.github/workflows/phase2-access-equity-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-access-equity-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile access-equity engine
        run: |
          python -m py_compile src/phase2_access_equity_v2.py
          python -m py_compile scripts/phase2_run_access_equity_v2.py

      - name: Run access-equity tests
        run: python -m pytest -q tests/test_phase2_access_equity_v2.py

      - name: Materialise Access Equity V2
        run: >-
          python scripts/phase2_run_access_equity_v2.py
          --catalog outputs/phase2/structural_catalog_v2/structural_scenario_catalog_balanced_v2.csv
          --catalog-validation outputs/phase2/structural_catalog_v2/structural_scenario_catalog_balanced_v2_validation.json
          --stop-validation outputs/phase2/stop_universe_v2/stop_universe_v2_validation.json
          --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json
          --anchors outputs/phase2/reduced_path_matrix_v2/routing_anchor_universe.csv
          --proposed-catchments outputs/phase2/stop_universe_v2/proposed_stop_candidate_catchment_units_10min.csv
          --existing-catchments outputs/phase2/stop_universe_v2/existing_stop_catchment_units_12min.csv
          --population-units outputs/phase2/stop_universe_v2/accessibility_gap_building_pieces.csv
          --scenario-output outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz
          --validation-output outputs/phase2/access_equity_v2/access_equity_v2_validation.json

      - name: Validate Access Equity V2 contract
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          root=Path('outputs/phase2/access_equity_v2')
          val=json.loads((root/'access_equity_v2_validation.json').read_text(encoding='utf-8'))
          assert val['status']=='PASS_ACCESS_EQUITY_V2_BUILD'
          assert val['contract']=='PHASE2_BUILDING_CATCHMENT_ACCESS_EQUITY_V2'
          assert val['scenario_count']==100000
          assert val['population_unit_count']==4348
          assert val['municipality_count']==5
          assert val['extension_scenario_count']==9981
          assert val['unique_stop_set_count_evaluated']==35082
          assert val['exact_population_access_thresholds_min']==[5,8,10]
          assert val['twelve_minute_candidate_access_exact'] is False
          assert val['unlocated_population_retained'] > 0
          for key in (
              'passenger_demand_inferred','s8_demand_used','current_service_baseline_compared',
              'topology_ranked','service_policy_selected','stop_set_selected',
              'primary_selected','runner_up_selected','exact_timetable_constructed',
          ):
              assert val[key] is False, key
          rows=0
          with gzip.open(root/'scenario_access_equity_v2.csv.gz','rt',encoding='utf-8',newline='') as handle:
              reader=csv.DictReader(handle)
              required={
                  'scenario_id','topology_family',
                  'public_population_coverage_share_10min',
                  'public_worst_municipality_coverage_share_10min',
                  'public_plus_extensions_population_coverage_share_10min',
                  'proposed_stop_12min_unit_memberships_exact',
                  'passenger_demand_inferred','topology_ranked',
              }
              assert required <= set(reader.fieldnames or [])
              for row in reader:
                  rows += 1
                  assert row['proposed_stop_12min_unit_memberships_exact']=='false'
                  assert row['passenger_demand_inferred']=='false'
                  assert row['topology_ranked']=='false'
                  for field in (
                      'public_population_coverage_share_10min',
                      'public_worst_municipality_coverage_share_10min',
                      'public_plus_extensions_population_coverage_share_10min',
                  ):
                      value=float(row[field])
                      assert 0.0 <= value <= 1.0
          assert rows==100000
          print(json.dumps({
              'scenario_count': rows,
              'unique_stop_set_count_evaluated': val['unique_stop_set_count_evaluated'],
              'max_public_population_coverage_share_10min': val['max_public_population_coverage_share_10min'],
              'max_public_worst_municipality_coverage_share_10min': val['max_public_worst_municipality_coverage_share_10min'],
          }, indent=2))
          PY

      - name: Deterministic byte-for-byte access-equity rebuild
        run: |
          rm -rf /tmp/phase2-access-equity-v2
          mkdir -p /tmp/phase2-access-equity-v2
          python scripts/phase2_run_access_equity_v2.py \
            --catalog outputs/phase2/structural_catalog_v2/structural_scenario_catalog_balanced_v2.csv \
            --catalog-validation outputs/phase2/structural_catalog_v2/structural_scenario_catalog_balanced_v2_validation.json \
            --stop-validation outputs/phase2/stop_universe_v2/stop_universe_v2_validation.json \
            --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json \
            --anchors outputs/phase2/reduced_path_matrix_v2/routing_anchor_universe.csv \
            --proposed-catchments outputs/phase2/stop_universe_v2/proposed_stop_candidate_catchment_units_10min.csv \
            --existing-catchments outputs/phase2/stop_universe_v2/existing_stop_catchment_units_12min.csv \
            --population-units outputs/phase2/stop_universe_v2/accessibility_gap_building_pieces.csv \
            --scenario-output /tmp/phase2-access-equity-v2/scenario.csv.gz \
            --validation-output /tmp/phase2-access-equity-v2/validation.json >/dev/null
          cmp outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz /tmp/phase2-access-equity-v2/scenario.csv.gz
          cmp outputs/phase2/access_equity_v2/access_equity_v2_validation.json /tmp/phase2-access-equity-v2/validation.json

      - name: Guard access-equity epistemic separation
        run: |
          FILES="src/phase2_access_equity_v2.py scripts/phase2_run_access_equity_v2.py docs/PHASE2_ACCESS_EQUITY_V2.md"
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -n -E 'passenger_demand_inferred *= *true|recommended topology|primary recommendation|winner|weighted composite score' $FILES
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check origin/phase2-service-policy-search-v2...HEAD

      - name: Persist validated Access Equity V2
        run: |
          git config user.name "phase2-access-equity-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/access_equity_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist audited Access Equity V2 [skip ci]"
            git push origin HEAD:phase2-access-equity-v2
          fi

      - name: Upload Access Equity V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-access-equity-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/access_equity_v2
