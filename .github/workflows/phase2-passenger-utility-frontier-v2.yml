name: Phase 2 Passenger Utility Frontier V2

on:
  push:
    branches:
      - phase2-passenger-utility-frontier-v2
      - phase2-robustness-final-v2
    paths:
      - 'scripts/phase2_build_passenger_utility_frontier_v2.py'
      - 'scripts/phase2_build_passenger_utility_frontier_v2_all_thresholds.py'
      - 'tests/test_phase2_passenger_utility_frontier_v2.py'
      - 'tests/test_phase2_passenger_utility_all_thresholds_v2.py'
      - '.github/workflows/phase2-passenger-utility-frontier-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-passenger-utility-frontier-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: >-
          python -m py_compile
          scripts/phase2_build_passenger_utility_frontier_v2.py
          scripts/phase2_build_passenger_utility_frontier_v2_all_thresholds.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Unit tests
        run: >-
          python -m pytest -q
          tests/test_phase2_passenger_utility_frontier_v2.py
          tests/test_phase2_passenger_utility_all_thresholds_v2.py

      - name: Build passenger utility frontier
        run: >-
          python scripts/phase2_build_passenger_utility_frontier_v2_all_thresholds.py
          --budget-policy-frontier outputs/phase2/budget_policy_frontiers_v2/scenario_budget_policy_frontier_v2.csv.gz
          --budget-policy-validation outputs/phase2/budget_policy_frontiers_v2/budget_policy_frontiers_v2_validation.json
          --feeder-timing outputs/phase2/feeder_generalized_access_v2/scenario_timing_feeder_generalized_access_v2.csv.gz
          --feeder-validation outputs/phase2/feeder_generalized_access_v2/feeder_generalized_access_v2_validation.json
          --frontier-output outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2.csv.gz
          --context-audit-output outputs/phase2/passenger_utility_frontier_v2/passenger_utility_context_audit_v2.csv
          --validation-output outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2_validation.json

      - name: Validate passenger utility contract
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          root=Path('outputs/phase2/passenger_utility_frontier_v2')
          v=json.loads((root/'passenger_utility_frontier_v2_validation.json').read_text(encoding='utf-8'))
          assert v['status']=='PASS_PHASE2_PASSENGER_UTILITY_FRONTIER_V2'
          assert v['contract']=='PHASE2_NO_WEIGHT_PASSENGER_UTILITY_FRONTIER_V2'
          assert v['budget_count']==6
          assert v['budget_policy_frontier_row_count_upstream']==490962
          assert v['recovery_values_collapsed_not_selected']==[5,10,15]
          assert 0 < v['collapsed_recovery_plan_count_all_budgets'] < 490962
          assert 0 < v['passenger_utility_frontier_row_count_all_budgets'] <= v['collapsed_recovery_plan_count_all_budgets']
          axes=set(v['passenger_maximise_axes_within_service_context'])
          for threshold in (5,8,10):
              assert f'public_population_coverage_share_{threshold}min' in axes
              assert f'public_worst_municipality_coverage_share_{threshold}min' in axes
          assert v['budget_is_hard_constraint_not_utility_axis'] is True
          for key in ('annual_bus_km_retained_for_tie_break_not_passenger_dominance','route_count_retained_for_tie_break_not_passenger_dominance','field_checks_retained_for_tie_break_not_passenger_dominance','unknown_distance_exposure_retained_for_tie_break_not_passenger_dominance'):
              assert v[key] is True
          for key in ('recovery_selected','calendar_selected','service_policy_selected','decision_budget_selected','exact_s8_phase_used','exact_timetable_constructed','full_gjt_calculated','weighted_composite_score','municipal_work_od_downscaled','resident_population_is_passenger_demand','ridership_forecast','primary_selected','runner_up_selected'):
              assert v[key] is False
          assert set(v['budget_summary'])=={'m20pct','m10pct','reference','p10pct','p20pct','p30pct'}
          for suffix, row in v['budget_summary'].items():
              assert row['collapsed_recovery_plan_count'] > 0
              assert 0 < row['passenger_utility_frontier_plan_count'] <= row['stage1_context_frontier_union_plan_count'] <= row['collapsed_recovery_plan_count']
              assert row['passenger_utility_frontier_unique_scenario_count'] > 0
          with gzip.open(root/'passenger_utility_frontier_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==v['passenger_utility_frontier_row_count_all_budgets']
          assert len({(r['budget_suffix'],r['plan_id']) for r in rows})==len(rows)
          for r in rows:
              assert r['recovery_selected']=='false'
              assert r['exact_timetable_constructed']=='false'
              assert r['primary_selected']=='false'
              assert r['runner_up_selected']=='false'
              assert int(r['fleet_lower_bound_recovery5']) > 0
              assert int(r['fleet_lower_bound_recovery10']) > 0
              assert int(r['fleet_lower_bound_recovery15']) > 0
              assert int(r['fleet_lower_bound_recovery5']) <= int(r['fleet_lower_bound_recovery10']) <= int(r['fleet_lower_bound_recovery15'])
          print(json.dumps(v['budget_summary'], indent=2, sort_keys=True))
          PY

      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/phase2-pu-v2
          mkdir -p /tmp/phase2-pu-v2
          python scripts/phase2_build_passenger_utility_frontier_v2_all_thresholds.py \
            --budget-policy-frontier outputs/phase2/budget_policy_frontiers_v2/scenario_budget_policy_frontier_v2.csv.gz \
            --budget-policy-validation outputs/phase2/budget_policy_frontiers_v2/budget_policy_frontiers_v2_validation.json \
            --feeder-timing outputs/phase2/feeder_generalized_access_v2/scenario_timing_feeder_generalized_access_v2.csv.gz \
            --feeder-validation outputs/phase2/feeder_generalized_access_v2/feeder_generalized_access_v2_validation.json \
            --frontier-output /tmp/phase2-pu-v2/frontier.csv.gz \
            --context-audit-output /tmp/phase2-pu-v2/audit.csv \
            --validation-output /tmp/phase2-pu-v2/validation.json >/dev/null
          cmp outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2.csv.gz /tmp/phase2-pu-v2/frontier.csv.gz
          cmp outputs/phase2/passenger_utility_frontier_v2/passenger_utility_context_audit_v2.csv /tmp/phase2-pu-v2/audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          left=json.loads(Path('outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2_validation.json').read_text())
          right=json.loads(Path('/tmp/phase2-pu-v2/validation.json').read_text())
          for payload in (left,right):
              payload['lineage'].pop('frontier_output',None)
              payload['lineage'].pop('context_audit_output',None)
          assert left==right
          PY

      - name: Guard epistemic boundary
        run: |
          for FILE in scripts/phase2_build_passenger_utility_frontier_v2.py scripts/phase2_build_passenger_utility_frontier_v2_all_thresholds.py; do
            ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' "$FILE"
            ! grep -n -E 'weighted_composite_score.*True|municipal_work_od_downscaled.*True|resident_population_is_passenger_demand.*True|ridership_forecast.*True|exact_timetable_constructed.*True|primary_selected.*True|runner_up_selected.*True' "$FILE"
          done

      - name: Persist evidence
        run: |
          git config user.name "phase2-passenger-utility-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/passenger_utility_frontier_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist passenger utility frontier v2 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-passenger-utility-frontier-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/passenger_utility_frontier_v2
