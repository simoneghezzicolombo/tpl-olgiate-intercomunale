name: RT031 south frontier and resource sensitivity V3
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/phase2-rt031-south-frontier-resource-v3.yml
      - scripts/phase2_audit_rt031_south_municipal_frontier_v3.py
      - scripts/phase2_audit_rt031_south_resource_overlay_v3.py
      - tests/test_phase2_rt031_south_municipal_frontier_v3.py
      - tests/test_phase2_rt031_south_resource_overlay_v3.py
      - outputs/phase2/rt031_south_municipal_frontier_v3/screen.json
      - outputs/phase2/rt031_south_resource_overlay_v3/overlay.json
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - .github/workflows/phase2-rt031-south-frontier-resource-v3.yml
      - scripts/phase2_audit_rt031_south_municipal_frontier_v3.py
      - scripts/phase2_audit_rt031_south_resource_overlay_v3.py
      - tests/test_phase2_rt031_south_municipal_frontier_v3.py
      - tests/test_phase2_rt031_south_resource_overlay_v3.py
      - outputs/phase2/rt031_south_municipal_frontier_v3/screen.json
      - outputs/phase2/rt031_south_resource_overlay_v3/overlay.json
permissions:
  contents: read
  actions: read
jobs:
  pinned-sensitivities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest shapely
      - run: python -m pytest tests/test_phase2_rt031_south_municipal_frontier_v3.py tests/test_phase2_rt031_south_resource_overlay_v3.py -q
      - name: Verify and fetch pinned typed and walking evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          test "$(gh api "repos/$REPO/actions/artifacts/10438835538" --jq .digest)" = 'sha256:a5c61c01934890c4a7a06a0bbc24c7e56ff477bb4efa7da8084c21a18c74cca6'
          test "$(gh api "repos/$REPO/actions/artifacts/9991182904" --jq .digest)" = 'sha256:e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28'
          gh run download 35076669258 -n rt031-municipal-frontier-typed-binding-v4 -D /tmp/rt031-south/typed
          gh run download 34039162932 -n rt028-final-stop-pedestrian-accessibility-substrate-v3 -D /tmp/rt031-south/walk
      - name: Reproduce south walking frontier and arithmetic resource overlay twice
        run: |
          set -euo pipefail
          for replica in a b; do
            python -m scripts.phase2_audit_rt031_south_municipal_frontier_v3 \
              --profiles /tmp/rt031-south/typed/municipal_frontier_typed_binding_v4.json \
              --matrix /tmp/rt031-south/walk/output/rt028_population_unit_stop_walk_matrix_v3.csv \
              --population /tmp/rt031-south/walk/input/rt016_border_neutral_population_units_v3.csv \
              --area outputs/phase2/rt031_south_olgiate_provisional_area_v3/sensitivity.json \
              --output "/tmp/rt031-south/frontier-$replica.json"
            python -m scripts.phase2_audit_rt031_south_resource_overlay_v3 \
              --profiles /tmp/rt031-south/typed/municipal_frontier_typed_binding_v4.json \
              --road-probe outputs/phase2/rt031_south_olgiate_road_probe_v3/probe.json \
              --policy config/phase2_final_policy_contract_v3.json \
              --output "/tmp/rt031-south/overlay-$replica.json"
          done
          cmp /tmp/rt031-south/frontier-a.json /tmp/rt031-south/frontier-b.json
          cmp /tmp/rt031-south/overlay-a.json /tmp/rt031-south/overlay-b.json
          cmp /tmp/rt031-south/frontier-a.json outputs/phase2/rt031_south_municipal_frontier_v3/screen.json
          cmp /tmp/rt031-south/overlay-a.json outputs/phase2/rt031_south_resource_overlay_v3/overlay.json
