name: Phase 2 Stop Universe V2

on:
  push:
    branches:
      - phase2-stop-universe-v2
    paths:
      - 'scripts/phase2_build_stop_universe_v2.py'
      - 'tests/test_phase2_stop_universe_v2.py'
      - 'docs/PHASE2_STOP_UNIVERSE_V2.md'
      - '.github/workflows/phase2-stop-universe-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-stop-universe-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic geospatial dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install pandas numpy geopandas networkx scipy pyproj shapely pytest requests

      - name: Compile V2 stop-universe code
        run: >-
          python -m py_compile
          scripts/phase2_build_stop_universe_v2.py
          src/phase2_stop_core.py
          src/phase2_stop_sources.py
          src/phase2_stop_metrics_v2.py
          src/phase2_stop_cluster.py

      - name: Focused V2 adapter tests
        run: pytest -q tests/test_phase2_stop_universe_v2.py

      - name: Reject synthetic and random active implementation
        run: pytest -q tests/test_audit_anti_synthetic_guardrails.py

      - name: Fetch checksum-validated upstream PASS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate_b /tmp/gate_d /tmp/building
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import requests

          repo = 'simoneghezzicolombo/tpl-olgiate-intercomunale'
          token = os.environ['GH_TOKEN']
          artifacts = [
              (9873385893, 'aca8889c8f1a4148c252c3530a56e8c68fa3f33c8e6ddf81a9ed743c51c1cfd1', Path('/tmp/gate_b.zip')),
              (9891607118, '6fbc06d74d5ba970bc980e4cde6234245e0753c22386f703ea313c6a4de9206a', Path('/tmp/gate_d.zip')),
              (9910900017, '4f5f0123ced2b763c2a063258ad724c43ac7f57ede707db3fa76e6a8977688b1', Path('/tmp/building.zip')),
          ]
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for artifact_id, expected, destination in artifacts:
              response = requests.get(
                  f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
                  headers=headers,
                  timeout=240,
                  allow_redirects=True,
              )
              response.raise_for_status()
              destination.write_bytes(response.content)
              actual = hashlib.sha256(response.content).hexdigest()
              if actual != expected:
                  raise SystemExit(f'artifact {artifact_id} sha mismatch: {actual} != {expected}')
              print(f'artifact {artifact_id}: bytes={len(response.content)} sha256={actual}')
          PY
          unzip -q /tmp/gate_b.zip -d /tmp/gate_b
          unzip -q /tmp/gate_d.zip -d /tmp/gate_d
          unzip -q /tmp/building.zip -d /tmp/building
          test -s /tmp/gate_b/walk_graph_nodes.csv
          test -s /tmp/gate_b/walk_graph_edges.csv
          test -s /tmp/gate_b/gtfs_core_stops.csv
          test -s /tmp/gate_d/osm_gate_d_structural.geojson
          test -s /tmp/gate_d/raw/arriva_addabus_2025_2026.zip
          test -s /tmp/gate_d/raw/lineelecco_2025_2026.zip
          test -s /tmp/building/building_population_accessibility.csv
          test -s /tmp/building/building_population_municipal_reconciliation.csv
          test -s /tmp/building/building_population_validation.json

      - name: Stage official municipality geometry and context-only GTFS centroids
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc data/phase2/analysis_envelope/source/municipalities_context.geojson.gz > /tmp/municipalities_context.geojson
          test -s /tmp/municipalities_context.geojson
          python - <<'PY'
          import pandas as pd
          source = pd.read_csv('outputs/phase2/analysis_envelope/stops_and_anchors_intersected.csv', dtype=str)
          context = source[
              source['anchor_class'].eq('GATE_D_VALIDATED_ANCHOR')
              & source['source_detail'].eq('OFFICIAL_GTFS_STOP_CLUSTER_CENTROID')
              & source['analysis_role'].eq('CONTEXT')
          ].copy()
          if context.empty:
              raise SystemExit('No context-only official GTFS cluster centroids found in analysis envelope')
          if not context['equity_scope'].eq('CONTEXT_ONLY').all():
              raise SystemExit('Context GTFS centroids unexpectedly enter decision-core equity scope')
          context.to_csv('/tmp/context_gtfs_anchors.csv', index=False)
          print(f'context-only official GTFS cluster centroids: {len(context)}')
          PY
          test -s /tmp/context_gtfs_anchors.csv

      - name: Build Stop Universe V2
        run: >-
          python scripts/phase2_build_stop_universe_v2.py
          --gate-b-dir /tmp/gate_b
          --gate-d-dir /tmp/gate_d
          --building-dir /tmp/building
          --analysis-envelope outputs/phase2/analysis_envelope/analysis_envelope.geojson
          --municipalities-context /tmp/municipalities_context.geojson
          --context-stops-anchors /tmp/context_gtfs_anchors.csv
          --osm-pois data/raw/osm/osm_pois_core.json
          --osm-points data/raw/osm/osm_points_core.geojson
          --od-summary outputs/phase2/od_2021_core_summary.csv
          --output-dir outputs/phase2/stop_universe_v2

      - name: Validate V2 contract and accounting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path('outputs/phase2/stop_universe_v2')
          validation = json.loads((out/'stop_universe_v2_validation.json').read_text(encoding='utf-8'))
          candidates = pd.read_csv(out/'proposed_stop_candidates.csv')
          gaps = pd.read_csv(out/'accessibility_gap_building_pieces.csv')
          catchments = pd.read_csv(out/'proposed_stop_candidate_catchment_units_10min.csv')
          existing = pd.read_csv(out/'existing_official_stops.csv')

          assert validation['status'] == 'PASS_STOP_UNIVERSE_V2_BUILD'
          assert validation['scope'] == 'CANDIDATE_STOP_UNIVERSE_V2_NOT_FINAL_NETWORK'
          assert validation['population_unit_type'] == 'BUILDING_SECTION_INTERSECTION'
          assert validation['population_units'] == 4348
          assert abs(validation['core_population_total_posas_2025'] - 22914.0) < 1e-9
          assert abs(
              validation['core_population_located_building_pieces']
              + validation['core_population_residual_unlocated']
              - validation['core_population_total_posas_2025']
          ) < 1e-6
          assert validation['residual_population_forced_to_buildings'] is False
          assert validation['legacy_worldpop_cells_used_for_v2_candidate_population'] is False
          assert validation['final_network_selected'] is False
          assert validation['final_stop_ranking_produced'] is False
          assert validation['ranking_produced'] is False
          assert validation['headway_modified'] is False
          assert validation['timetable_modified'] is False
          assert validation['budget_modified'] is False
          assert validation['final_proposed_candidates'] == len(candidates)
          assert len(candidates) > 0
          assert candidates['epistemic_status'].eq('PROPOSED_STOP/FIELD_CHECK_PENDING').all()
          assert candidates['physical_status'].eq('FIELD_CHECK_PENDING').all()
          assert candidates['candidate_status'].eq('HYPOTHESIS_NOT_RECOMMENDATION').all()
          assert candidates['population_spatial_model'].eq('DASYMETRIC_BUILDING_SECTION_INTERSECTION_V2').all()
          assert candidates['source_building_population_head'].eq('29203ad64c3e32e6164ef6997933eb5c5ff2d5b1').all()
          assert gaps['population_unit_id'].nunique() == 4348
          assert not catchments.empty
          assert catchments['population_unit_id'].isin(gaps['population_unit_id']).all()
          assert existing['source_scope'].isin({
              'GATE_B_CORE_GTFS_RECORD',
              'ANALYSIS_ENVELOPE_GATE_D_GTFS_CLUSTER_CENTROID',
          }).all()
          context = existing[existing['source_scope'].eq('ANALYSIS_ENVELOPE_GATE_D_GTFS_CLUSTER_CENTROID')]
          assert not context.empty
          assert ~context['PRO_COM_T'].astype(str).str.zfill(6).isin({'097010','097012','097058','097074','097092'}).any()
          for value in validation['baseline_coverage_pct_total_posas'].values():
              assert 0 <= float(value) <= 100
          PY
          cd outputs/phase2/stop_universe_v2
          sha256sum -c stop_universe_v2_checksums.sha256

      - name: Ensure V1 benchmark outputs are untouched
        shell: bash
        run: |
          set -euo pipefail
          if git status --short -- outputs/phase2 | grep -v '^?? outputs/phase2/stop_universe_v2/' | grep -q .; then
            echo 'Unexpected mutation outside V2 output directory:'
            git status --short -- outputs/phase2
            exit 1
          fi

      - name: Whitespace check
        run: git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check origin/phase2-optimizer-core...HEAD

      - name: Persist audited V2 optimizer-facing outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "phase2-stop-universe-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/stop_universe_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist audited Stop Universe V2"
            git push origin HEAD:phase2-stop-universe-v2
          else
            echo 'V2 stop-universe outputs already match branch.'
          fi

      - name: Upload Stop Universe V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-stop-universe-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/stop_universe_v2