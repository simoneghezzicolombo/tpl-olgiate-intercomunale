name: Phase 2 Hub Access Cascade Dynamic V2

on:
  push:
    branches:
      - phase2-passenger-gjt-v2
    paths:
      - 'scripts/phase2_build_base_exact_timetables_dynamic_v2.py'
      - 'scripts/phase2_run_hub_access_cascade_dynamic_v2.py'
      - '.github/workflows/phase2-hub-access-cascade-dynamic-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-hub-access-cascade-dynamic-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile corrected dynamic cascade
        run: |
          python -m py_compile scripts/phase2_build_hub_access_bridge_v2.py
          python -m py_compile scripts/phase2_run_access_equity_hub_corrected_v2.py
          python -m py_compile scripts/phase2_build_base_exact_timetables_dynamic_v2.py
          python -m py_compile scripts/phase2_run_hub_access_cascade_dynamic_v2.py
          python -m pytest -q tests/test_phase2_access_equity_v2.py tests/test_phase2_service_plan_tournament_v2.py tests/test_phase2_exact_timetable_v2.py

      - name: Rebuild corrected tournament lineage
        run: python scripts/phase2_run_hub_access_cascade_dynamic_v2.py

      - name: Validate corrected tournament lineage
        run: python scripts/phase2_run_hub_access_cascade_dynamic_v2.py --validate-only

      - name: Guard evidence semantics
        run: |
          FILES="scripts/phase2_build_hub_access_bridge_v2.py scripts/phase2_run_access_equity_hub_corrected_v2.py scripts/phase2_build_base_exact_timetables_dynamic_v2.py scripts/phase2_run_hub_access_cascade_dynamic_v2.py"
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -n -E 'primary_selected *[:=] *True|runner_up_selected *[:=] *True|final_service_policy_selected *[:=] *True|final_topology_selected *[:=] *True' $FILES
          git diff --check

      - name: Persist corrected tournament lineage
        run: |
          git config user.name "phase2-hub-access-dynamic-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            outputs/phase2/access_equity_v2 \
            outputs/phase2/current_access_baseline_v2 \
            outputs/phase2/frequency_frontiers_v2 \
            outputs/phase2/reference_service_plan_shortlist_v2 \
            outputs/phase2/plan_level_frontiers_v2 \
            outputs/phase2/base_exact_timetables_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist hub-corrected tournament cascade V2 [skip ci]"
            git push origin HEAD:phase2-passenger-gjt-v2
          fi

      - name: Upload corrected tournament evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-hub-access-cascade-dynamic-v2-${{ github.sha }}
          retention-days: 90
          path: |
            outputs/phase2/access_equity_v2
            outputs/phase2/current_access_baseline_v2
            outputs/phase2/frequency_frontiers_v2
            outputs/phase2/reference_service_plan_shortlist_v2
            outputs/phase2/plan_level_frontiers_v2
            outputs/phase2/base_exact_timetables_v2
