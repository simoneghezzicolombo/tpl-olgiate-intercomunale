name: RT031 joint frontier fleet screen V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_screen_rt031_joint_frontier_fleet_v3.py
      - tests/test_phase2_rt031_joint_frontier_fleet_v3.py
      - .github/workflows/phase2-rt031-joint-frontier-fleet-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  joint-frontier-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest tests/test_phase2_rt031_joint_frontier_fleet_v3.py -q
      - name: Acquire pinned typed and physical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/typed /tmp/physical
          gh api repos/${{ github.repository }}/actions/artifacts/10649441275/zip > /tmp/typed.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10649340509/zip > /tmp/physical.zip
          echo '004547d3d0c729d39ba979ca9740a025d3f20f076bb3558b3280e97e9e2e06c7  /tmp/typed.zip' | sha256sum -c
          echo '1e582ad0ce637e748f318107f1ddf53c832ec7606cb4ee8a6db4db7cc5ee5472  /tmp/physical.zip' | sha256sum -c
          unzip -q /tmp/typed.zip -d /tmp/typed
          unzip -q /tmp/physical.zip -d /tmp/physical
      - name: Screen all ten Pareto lines twice
        run: |
          for replica in a b; do
            python scripts/phase2_screen_rt031_joint_frontier_fleet_v3.py \
              --typed /tmp/typed/joint-frontier-a.json \
              --search /tmp/physical/physical_walk_search.json \
              --output "/tmp/fleet-$replica.json"
          done
          cmp /tmp/fleet-a.json /tmp/fleet-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-joint-frontier-fleet-v3
          path: /tmp/fleet-a.json
          if-no-files-found: error
