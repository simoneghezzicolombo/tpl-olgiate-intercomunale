name: Phase 2 current service reference

on:
  push:
    branches: [phase2-optimizer-core]
    paths:
      - scripts/phase2_build_current_service_reference.py
      - tests/test_phase2_current_service_reference.py
      - .github/workflows/phase2-current-service-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise-current-service-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile bridge
        run: python -m py_compile scripts/phase2_build_current_service_reference.py

      - name: Materialise pinned Gate C reference
        run: python scripts/phase2_build_current_service_reference.py

      - name: Validate current-service reference
        run: pytest -q tests/test_phase2_current_service_reference.py

      - name: Guard legacy baseline exclusion
        run: |
          if grep -E '^from .*05_current_service|^import .*05_current_service' scripts/phase2_build_current_service_reference.py; then
            echo "Legacy current-service implementation must not be imported."
            exit 1
          fi
          git diff --check

      - name: Commit materialised reference
        run: |
          if git diff --quiet -- outputs/phase2/current_service_reference_2026-09-03.csv outputs/phase2/current_service_reference_validation.json && \
             git ls-files --error-unmatch outputs/phase2/current_service_reference_2026-09-03.csv >/dev/null 2>&1 && \
             git ls-files --error-unmatch outputs/phase2/current_service_reference_validation.json >/dev/null 2>&1; then
            echo "Materialised reference already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/phase2/current_service_reference_2026-09-03.csv outputs/phase2/current_service_reference_validation.json
          git commit -m "data(phase2): materialise Gate C current-service reference [skip ci]"
          git push
