name: GPT Gate B POSAS fix

on:
  push:
    branches: [antigravity-real-data]
    paths:
      - tools/gpt_gate_b_posas_doublecount_fix.py
      - .github/workflows/gpt-gate-b-posas-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity-real-data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply audited POSAS fix
        run: |
          python tools/gpt_gate_b_posas_doublecount_fix.py
          python -m py_compile scripts/audit_02_real_spatial.py
          python -m py_compile tests/test_gate_b_spatial.py
          git diff --check

      - name: Commit fix and remove one-shot tooling
        run: |
          rm tools/gpt_gate_b_posas_doublecount_fix.py
          rm .github/workflows/gpt-gate-b-posas-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(gate-b): use POSAS aggregate row without double counting"
          git push origin antigravity-real-data
