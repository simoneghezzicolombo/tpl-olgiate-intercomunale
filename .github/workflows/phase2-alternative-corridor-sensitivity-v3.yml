name: Phase 2 Alternative Corridor Sensitivity V3

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-efficient-alternative-corridors-v3
    paths:
      - scripts/phase2_audit_alternative_corridor_sensitivity_v3.py
      - src/phase2_alternative_corridor_generator_v3.py
      - .github/workflows/phase2-alternative-corridor-sensitivity-v3.yml
      - outputs/phase2/network_design_method_audit_v3/alternative_corridor_generator_v3/**

permissions:
  contents: write

concurrency:
  group: phase2-alternative-corridor-sensitivity-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase2-efficient-alternative-corridors-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned routing dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 \
            geopandas==1.1.2 \
            networkx==3.6.1 \
            pyproj==3.7.2 \
            scipy==1.17.0 \
            shapely==2.1.2 \
            pyogrio==0.12.1

      - name: Compile sensitivity runner
        run: python -m py_compile scripts/phase2_audit_alternative_corridor_sensitivity_v3.py

      - name: Require audited base generator evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('outputs/phase2/network_design_method_audit_v3/alternative_corridor_generator_v3/alternative_corridor_generator_v3_validation.json')
          validation = json.loads(path.read_text(encoding='utf-8'))
          assert validation['status'] == 'PASS_ALTERNATIVE_CORRIDOR_GENERATOR_V3', validation
          assert validation['scope'] == 'ALGORITHM_AND_ROUTING_AUDIT_NOT_NETWORK_RECOMMENDATION'
          PY

      - name: Run deterministic real-graph parameter grid
        run: python scripts/phase2_audit_alternative_corridor_sensitivity_v3.py

      - name: Validate sensitivity contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path('outputs/phase2/network_design_method_audit_v3/alternative_corridor_sensitivity_v3')
          validation = json.loads((out/'alternative_corridor_sensitivity_v3_validation.json').read_text(encoding='utf-8'))
          configs = pd.read_csv(out/'parameter_grid_summary_v3.csv')
          union = pd.read_csv(out/'parameter_grid_path_union_v3.csv')
          fixtures = pd.read_csv(out/'fixture_sensitivity_summary_v3.csv')

          assert validation['status'] == 'PASS_ALTERNATIVE_CORRIDOR_SENSITIVITY_V3', validation
          assert validation['scope'] == 'TECHNICAL_PARAMETER_SENSITIVITY_NOT_NETWORK_SELECTION'
          assert validation['parameter_configurations'] == 12
          assert validation['fixture_count'] == 5
          assert validation['all_configurations_pass'] is True
          assert validation['baseline_exact_across_grid'] is True
          assert validation['parameter_selection_authorized'] is False
          assert validation['recommended_corridor_authorized'] is False
          assert validation['complete_k_shortest_claim_authorized'] is False
          assert validation['union_contract'] == 'UNION_ACROSS_TECHNICAL_EXPLORATION_SETTINGS_NOT_FREQUENCY_WEIGHTED_NOT_RANKED'
          assert validation['appearance_frequency_contract'] == 'DESCRIPTIVE_SEARCH_STABILITY_ONLY_NOT_QUALITY_SCORE_NOT_PROBABILITY'
          assert len(configs) == 12
          assert configs['config_status'].eq('PASS').all()
          assert len(fixtures) == 5
          assert not union.empty
          assert union['physical_node_loop'].astype(str).str.lower().eq('false').all()
          assert union['admissible_for_corridor_pool'].astype(str).str.lower().eq('true').all()
          assert union['appearance_semantics'].eq('DESCRIPTIVE_SEARCH_STABILITY_ONLY_NOT_QUALITY_SCORE_NOT_PROBABILITY').all()
          assert union['union_semantics'].eq('UNION_ACROSS_TECHNICAL_EXPLORATION_SETTINGS_NOT_FREQUENCY_WEIGHTED_NOT_RANKED').all()
          print(json.dumps(validation, indent=2, sort_keys=True))
          PY

      - name: Anti-random and stop-workstream isolation guard
        run: |
          ! grep -nE 'np\.random|numpy\.random|random\.' scripts/phase2_audit_alternative_corridor_sensitivity_v3.py
          ! grep -niE 'requests|overpass-api|urllib|httpx|google maps|gemini' scripts/phase2_audit_alternative_corridor_sensitivity_v3.py
          ! grep -niE 'proposed_stop_candidates|passenger_stop_foundation|gpt-stop-source-completeness|C146|ASF' scripts/phase2_audit_alternative_corridor_sensitivity_v3.py

      - name: Whitespace check
        run: git diff --check

      - name: Upload sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-alternative-corridor-sensitivity-v3
          path: outputs/phase2/network_design_method_audit_v3/alternative_corridor_sensitivity_v3/
          if-no-files-found: error
          retention-days: 90

      - name: Persist audited sensitivity evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/phase2/network_design_method_audit_v3/alternative_corridor_sensitivity_v3/
          if git diff --cached --quiet; then
            echo 'No sensitivity evidence changes to persist.'
          else
            git commit -m 'audit: persist alternative corridor sensitivity V3 evidence [skip ci]'
            git push origin HEAD:phase2-efficient-alternative-corridors-v3
          fi
