name: Phase 2 inspect ISTAT 2011 OD source

on:
  push:
    branches: [phase2-od-2011-audit]
    paths:
      - .github/workflows/phase2-od-2011-inspect.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-od-2011-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install legacy DOC reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq antiword

      - name: Download, inventory and extract official ISTAT 2011 documentation
        run: |
          python - <<'PY'
          import hashlib, io, json, pathlib, re, urllib.request, zipfile

          url='https://www.istat.it/storage/cartografia/matrici_pendolarismo/matrici_pendolarismo_2011.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'tpl-olgiate-phase2-od-audit/1.0'})
          with urllib.request.urlopen(req,timeout=300) as r:
              data=r.read()
              print('HTTP',r.status,'bytes',len(data),'content-type',r.headers.get('Content-Type'))
          if data[:2] != b'PK':
              raise SystemExit('not a ZIP')
          out=pathlib.Path('outputs/phase2/istat2011_source_inspection')
          out.mkdir(parents=True,exist_ok=True)
          (out/'source_sha256.txt').write_text(hashlib.sha256(data).hexdigest()+'\n',encoding='utf-8')
          z=zipfile.ZipFile(io.BytesIO(data))
          names=z.namelist()
          (out/'zip_inventory.txt').write_text('\n'.join(names)+'\n',encoding='utf-8')
          doc='MATRICE PENDOLARISMO 2011/leggimi file matrix_pendo2011_10112014.doc'
          matrix='MATRICE PENDOLARISMO 2011/matrix_pendo2011_10112014.txt'
          pathlib.Path('/tmp/leggimi.doc').write_bytes(z.read(doc))
          raw=z.read(matrix).decode('latin-1')
          samples={'S':[],'L':[]}
          for line in raw.splitlines():
              t=line[:1]
              if t in samples and len(samples[t])<40:
                  samples[t].append(line)
              if all(len(v)>=40 for v in samples.values()): break
          for t,lines in samples.items():
              (out/f'record_samples_{t}.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          ruler1=''.join(str((i//10)%10) for i in range(1,121))
          ruler2=''.join(str(i%10) for i in range(1,121))
          (out/'fixed_width_ruler.txt').write_text(ruler1+'\n'+ruler2+'\n',encoding='utf-8')
          manifest=[{'zip_member':n} for n in names]
          (out/'inspection_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          antiword /tmp/leggimi.doc > outputs/phase2/istat2011_source_inspection/leggimi_official_extracted.txt
          echo '=== OFFICIAL LEGGIMI ==='
          cat outputs/phase2/istat2011_source_inspection/leggimi_official_extracted.txt
          echo '=== S RECORDS ==='
          head -15 outputs/phase2/istat2011_source_inspection/record_samples_S.txt
          echo '=== L RECORDS ==='
          head -15 outputs/phase2/istat2011_source_inspection/record_samples_L.txt

      - name: Commit source inspection evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/phase2/istat2011_source_inspection
          git diff --cached --quiet && exit 0
          git commit -m "audit(phase2): extract official ISTAT 2011 record layout"
          git push origin HEAD:phase2-od-2011-audit
