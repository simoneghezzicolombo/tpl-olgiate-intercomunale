name: RT031 Arlate physical witness access V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_audit_rt031_arlate_access_v3.py
      - outputs/phase2/rt031_arlate_extension_distance_v3/arlate_individual_distance_audit_v3.json
      - .github/workflows/phase2-rt031-arlate-access-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  arlate-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas pytest
      - name: Acquire pinned walking substrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/walk
          gh api repos/${{ github.repository }}/actions/artifacts/9991182904/zip > /tmp/walk.zip
          echo 'e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28  /tmp/walk.zip' | sha256sum -c
          unzip -q /tmp/walk.zip -d /tmp/walk
      - name: Compute exact physical-stop potential access twice
        run: |
          walk=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv | head -1)
          for replica in a b; do
            python scripts/phase2_audit_rt031_arlate_access_v3.py \
              --arlate-audit outputs/phase2/rt031_arlate_extension_distance_v3/arlate_individual_distance_audit_v3.json \
              --walk-matrix "$walk" --output "/tmp/arlate-access-$replica.json"
          done
          cmp /tmp/arlate-access-a.json /tmp/arlate-access-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-arlate-physical-access-v3
          path: /tmp/arlate-access-a.json
          if-no-files-found: error
