name: GPT Gate B finalize status

on:
  push:
    branches: [antigravity-real-data]
    paths:
      - .github/workflows/gpt-gate-b-finalize-status.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current status
        run: python -c "from pathlib import Path; import base64; p=Path('AGENT_STATUS.md'); t=p.read_text(encoding='utf-8'); s=t.index('## Stato corrente'); e=t.index('\\n---', s); b=base64.b64decode('').decode('utf-8'); p.write_text(t[:s]+b+t[e:], encoding='utf-8')"
      - name: Commit status and remove one-shot workflow
        run: |
          rm .github/workflows/gpt-gate-b-finalize-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENT_STATUS.md .github/workflows/gpt-gate-b-finalize-status.yml
          git commit -m "docs(gate-b): record PASS in agent status"
          git push origin HEAD:antigravity-real-data
