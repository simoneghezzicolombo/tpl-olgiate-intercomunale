name: Phase 2 Pre-GJT Screening V2

on:
  push:
    branches:
      - phase2-pre-gjt-screening-v2
    paths:
      - 'src/phase2_pre_gjt_screening_v2.py'
      - 'scripts/phase2_build_pre_gjt_screening_v2.py'
      - 'tests/test_phase2_pre_gjt_screening_v2.py'
      - 'docs/PHASE2_PRE_GJT_SCREENING_V2.md'
      - '.github/workflows/phase2-pre-gjt-screening-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-pre-gjt-screening-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile Pre-GJT Screening V2
        run: |
          python -m py_compile src/phase2_pre_gjt_screening_v2.py
          python -m py_compile scripts/phase2_build_pre_gjt_screening_v2.py

      - name: Run Pre-GJT Screening V2 tests
        run: python -m pytest -q tests/test_phase2_pre_gjt_screening_v2.py

      - name: Materialise Pre-GJT Screening V2
        run: >-
          python scripts/phase2_build_pre_gjt_screening_v2.py
          --operational outputs/phase2/operational_screening_v2/operational_screening_v2.csv
          --operational-validation outputs/phase2/operational_screening_v2/operational_screening_v2_validation.json
          --access outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz
          --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json
          --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv
          --policy-feasibility outputs/phase2/service_policy_search_v2/service_policy_feasibility_v2.csv.gz
          --policy-validation outputs/phase2/service_policy_search_v2/service_policy_search_v2_validation.json
          --s8-scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz
          --s8-scenario-support outputs/phase2/passenger_gjt_v2/s8_scenario_passenger_support_v2.csv.gz
          --s8-support-validation outputs/phase2/passenger_gjt_v2/s8_passenger_support_mask_v2_validation.json
          --s8-gap-envelope outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2.csv.gz
          --s8-gap-validation outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2_validation.json
          --output outputs/phase2/pre_gjt_screening_v2/pre_gjt_scenario_timing_screening_v2.csv.gz
          --validation outputs/phase2/pre_gjt_screening_v2/pre_gjt_screening_v2_validation.json

      - name: Validate Pre-GJT Screening V2 contract
        run: |
          python - <<'PY'
          import gzip, csv, json
          from pathlib import Path
          root=Path('outputs/phase2/pre_gjt_screening_v2')
          v=json.loads((root/'pre_gjt_screening_v2_validation.json').read_text())
          assert v['status']=='PASS_PRE_GJT_MULTI_LAYER_SCREENING_V2_BUILD'
          assert v['contract']=='PHASE2_PRE_GJT_MULTI_LAYER_SCREENING_V2'
          assert v['scenario_count']==100000
          assert v['timing_archetype_count']==8
          assert v['scenario_timing_row_count']==800000
          assert v['reference_budget_annual_bus_km']==111419.0
          assert v['reference_budget_feasible_scenario_count']==69186
          assert v['reference_budget_infeasible_scenario_count']==30814
          assert sum(v['family_counts'].values())==100000
          assert v['s8_worker_reference']==1882.0
          assert v['s8_worker_reference_semantics']=='DIRECTION_WEIGHT_ONLY_NOT_ROUTE_DEMAND_NOT_MODAL_SHARE'
          for field in ('optional_extensions_selected','passenger_demand_assigned_to_routes','full_gjt_calculated','pareto_frontier_computed','phase_selected','topology_ranked','service_policy_selected','primary_selected','runner_up_selected'):
              assert v[field] is False
          with gzip.open(root/'pre_gjt_scenario_timing_screening_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              r=csv.DictReader(f)
              n=0
              feasible=0
              for row in r:
                  n+=1
                  feasible += row['reference_budget_timing_feasible']=='true'
                  assert row['passenger_demand_assigned_to_routes']=='false'
                  assert row['s8_direction_weights_are_route_demand']=='false'
                  assert row['full_gjt_calculated']=='false'
                  assert row['phase_selected']=='false'
                  assert row['topology_ranked']=='false'
                  assert row['service_policy_selected']=='false'
                  assert row['primary_selected']=='false'
                  assert row['runner_up_selected']=='false'
              assert n==800000
              assert feasible==v['reference_budget_feasible_scenario_timing_count']
          print(json.dumps({
              'rows':v['scenario_timing_row_count'],
              'reference_feasible_scenarios':v['reference_budget_feasible_scenario_count'],
              'reference_feasible_scenario_timings':v['reference_budget_feasible_scenario_timing_count'],
              'by_timing':v['reference_budget_feasible_scenario_counts_by_timing'],
          },indent=2))
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          rm -rf /tmp/pre-gjt-v2
          mkdir -p /tmp/pre-gjt-v2
          python scripts/phase2_build_pre_gjt_screening_v2.py \
            --operational outputs/phase2/operational_screening_v2/operational_screening_v2.csv \
            --operational-validation outputs/phase2/operational_screening_v2/operational_screening_v2_validation.json \
            --access outputs/phase2/access_equity_v2/scenario_access_equity_v2.csv.gz \
            --access-validation outputs/phase2/access_equity_v2/access_equity_v2_validation.json \
            --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv \
            --policy-feasibility outputs/phase2/service_policy_search_v2/service_policy_feasibility_v2.csv.gz \
            --policy-validation outputs/phase2/service_policy_search_v2/service_policy_search_v2_validation.json \
            --s8-scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz \
            --s8-scenario-support outputs/phase2/passenger_gjt_v2/s8_scenario_passenger_support_v2.csv.gz \
            --s8-support-validation outputs/phase2/passenger_gjt_v2/s8_passenger_support_mask_v2_validation.json \
            --s8-gap-envelope outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2.csv.gz \
            --s8-gap-validation outputs/phase2/passenger_gjt_v2/s8_transfer_gap_envelope_v2_validation.json \
            --output /tmp/pre-gjt-v2/surface.csv.gz \
            --validation /tmp/pre-gjt-v2/validation.json
          cmp outputs/phase2/pre_gjt_screening_v2/pre_gjt_scenario_timing_screening_v2.csv.gz /tmp/pre-gjt-v2/surface.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/phase2/pre_gjt_screening_v2/pre_gjt_screening_v2_validation.json').read_text())
          b=json.loads(Path('/tmp/pre-gjt-v2/validation.json').read_text())
          for p in (a,b):
              p['lineage']['output']=None
          assert a==b
          PY

      - name: Guard epistemic separation
        run: |
          FILES="src/phase2_pre_gjt_screening_v2.py scripts/phase2_build_pre_gjt_screening_v2.py"
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -n -E 'passenger_demand_assigned_to_routes[^f]*true|full_gjt_calculated[^f]*true|pareto_frontier_computed[^f]*true|phase_selected[^f]*true|topology_ranked[^f]*true|service_policy_selected[^f]*true|primary_selected[^f]*true|runner_up_selected[^f]*true' $FILES
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check origin/phase2-passenger-gjt-v2...HEAD

      - name: Persist audited Pre-GJT Screening V2
        run: |
          git config user.name "phase2-pre-gjt-screening-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/pre_gjt_screening_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist audited Pre-GJT Screening V2 [skip ci]"
            git push origin HEAD:phase2-pre-gjt-screening-v2
          fi

      - name: Upload Pre-GJT Screening V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-pre-gjt-screening-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/pre_gjt_screening_v2
