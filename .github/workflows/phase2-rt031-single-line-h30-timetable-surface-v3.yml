name: RT031 single line H30 timetable surface V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_single_line_timetable_surface_v3.py
      - scripts/phase2_build_rt031_single_line_timetable_surface_v3.py
      - tests/test_phase2_rt031_single_line_timetable_surface_v3.py
      - .github/workflows/phase2-rt031-single-line-h30-timetable-surface-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  single-line-timetable-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Test one-line timetable semantics
        run: >-
          python -m pytest
          tests/test_phase2_rt031_single_line_timetable_surface_v3.py
          tests/test_phase2_exact_timetable_optimizer_v2.py -q
      - name: Acquire pinned typed one-line evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/typed
          gh api repos/${{ github.repository }}/actions/artifacts/10414630100/zip > /tmp/typed.zip
          echo '9dbc356dedb7e2fdf774f5d7e8d1fb6e3538f557fdd6dab5218b0930ebe8c673  /tmp/typed.zip' | sha256sum -c
          unzip -q /tmp/typed.zip -d /tmp/typed
          echo '735c8f650dbcfc6c429e21cbad374be78cb7436af390bef84b54161baf6337cd  /tmp/typed/single_line_h30_typed_context_audit.json' | sha256sum -c
      - name: Build complete surface twice and compare every byte
        run: |
          for out in /tmp/surface-a /tmp/surface-b; do
            python scripts/phase2_build_rt031_single_line_timetable_surface_v3.py \
              --typed-audit /tmp/typed/single_line_h30_typed_context_audit.json \
              --s8-events outputs/phase2/s8_events.csv \
              --sensitivity config/phase2_s8_phasing_sensitivity_v2.json \
              --output-dir "$out"
          done
          diff -r /tmp/surface-a /tmp/surface-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-single-line-h30-timetable-surface-v3
          path: /tmp/surface-a/
          if-no-files-found: error
