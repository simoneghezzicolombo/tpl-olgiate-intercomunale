name: RT031 frequent access typed shortlist V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - src/phase2_rt031_frequent_access_shortlist_v3.py
      - scripts/phase2_bind_rt031_frequent_access_shortlist_v3.py
      - scripts/phase2_bind_rt031_target_cover_service_v3.py
      - tests/test_phase2_rt031_frequent_access_shortlist_v3.py
      - .github/workflows/phase2-rt031-frequent-access-typed-shortlist-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  frequent-access-typed-shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Controlled exact-selection and typed-service tests
        run: >-
          python -m pytest
          tests/test_phase2_rt031_frequent_access_shortlist_v3.py
          tests/test_phase2_rt031_network_connected_portfolios_v3.py
          tests/test_phase2_rt031_service_network_v3.py
          tests/test_phase2_rt031_occurrence_binding_v3.py -q
      - name: Acquire pinned physical, frontier and territorial evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rt031-inputs/{rt017,rt022,rt030} /tmp/via /tmp/hub /tmp/frontier
          gh api repos/${{ github.repository }}/actions/artifacts/9972204236/zip > /tmp/rt017.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9988386073/zip > /tmp/rt022.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9992507233/zip > /tmp/rt030.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10023387513/zip > /tmp/via.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10368324023/zip > /tmp/hub.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10370024100/zip > /tmp/frontier.zip
          echo 'e0b71f6fd673345c3bc0bf8e32ecf66b7f620e27802f1eb5b24690a8295c8225  /tmp/rt017.zip' | sha256sum -c
          echo '1cab2e18eec4920cbdb348d0d9cd224c7516f8d62bc63b0eacf2a91f6fb134d7  /tmp/rt022.zip' | sha256sum -c
          echo '350c5011565883228ccb52e186bc908a95fdc29f8dd4ebab21fd4c4cb16d6564  /tmp/rt030.zip' | sha256sum -c
          echo '1603606d02a170567c1d423b7689b7044933fff6490caeaf848ae0ca0f2d77d0  /tmp/via.zip' | sha256sum -c
          echo 'dedf6d067af0188dde13c3041c482dd5551e23b9d4551cf757c7a137590dcf6b  /tmp/hub.zip' | sha256sum -c
          echo 'b279b89e72c16f272c1439f4da96e6d6fbc53e417deeac0844e32405639bce45  /tmp/frontier.zip' | sha256sum -c
          unzip -q /tmp/rt017.zip -d /tmp/rt031-inputs/rt017
          unzip -q /tmp/rt022.zip -d /tmp/rt031-inputs/rt022
          unzip -q /tmp/rt030.zip -d /tmp/rt031-inputs/rt030
          unzip -q /tmp/via.zip -d /tmp/via
          unzip -q /tmp/hub.zip -d /tmp/hub
          unzip -q /tmp/frontier.zip -d /tmp/frontier
      - name: Bind all five profiles twice and compare every byte
        run: |
          evidence=$(find /tmp/via -name '*.json' | head -1)
          hub=$(find /tmp/hub -name physical_walk_search.json | head -1)
          frontier=$(find /tmp/frontier -name rt031_network_connected_frontier_v3.json | head -1)
          audit=$(find /tmp/frontier -name rt031_network_connected_frontier_v3_audit.json | head -1)
          for out in /tmp/typed-a /tmp/typed-b; do
            python scripts/phase2_bind_rt031_frequent_access_shortlist_v3.py \
              --inputs /tmp/rt031-inputs --via-way-evidence "$evidence" \
              --frontier "$frontier" --frontier-audit "$audit" \
              --hub-pool "$hub" --output-dir "$out"
          done
          diff -r /tmp/typed-a /tmp/typed-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-frequent-access-typed-development-shortlist-v3
          path: /tmp/typed-a/
          if-no-files-found: error
