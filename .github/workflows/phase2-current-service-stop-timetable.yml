name: Phase 2 current-service stop timetable

on:
  push:
    branches: [phase2-current-service-stop-timetable]
    paths:
      - 'src/phase2_current_service_stop_timetable.py'
      - 'scripts/phase2_build_current_service_stop_timetable.py'
      - 'tests/test_phase2_current_service_stop_timetable.py'
      - 'docs/PHASE2_CURRENT_SERVICE_STOP_TIMETABLE.md'
      - '.github/workflows/phase2-current-service-stop-timetable.yml'
      - 'outputs/phase2/current_service_*2026-09-03*'
  pull_request:
    paths:
      - 'src/phase2_current_service_stop_timetable.py'
      - 'scripts/phase2_build_current_service_stop_timetable.py'
      - 'tests/test_phase2_current_service_stop_timetable.py'
      - 'docs/PHASE2_CURRENT_SERVICE_STOP_TIMETABLE.md'
      - '.github/workflows/phase2-current-service-stop-timetable.yml'

permissions:
  contents: read

jobs:
  current-service-stop-timetable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser test dependencies
        run: python -m pip install pdfplumber pytest

      - name: Diff whitespace audit
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/phase2-optimizer-core)
          git diff --check "$base"...HEAD

      - name: Compile
        run: >-
          python -m py_compile
          src/phase2_current_service_stop_timetable.py
          scripts/phase2_build_current_service_stop_timetable.py
          tests/test_phase2_current_service_stop_timetable.py

      - name: Unit and adversarial parser tests
        run: pytest -q tests/test_phase2_current_service_stop_timetable.py

      - name: Build from pinned Gate C primary sources
        run: >-
          python scripts/phase2_build_current_service_stop_timetable.py
          --output-dir /tmp/current_service
          --gtfs-dir data/raw/gtfs/agency_arriva

      - name: Validate production contract
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('/tmp/current_service')
          trips=list(csv.DictReader((root/'current_service_trips_2026-09-03.csv').open(encoding='utf-8')))
          stop_times=list(csv.DictReader((root/'current_service_stop_times_2026-09-03.csv').open(encoding='utf-8')))
          stops=list(csv.DictReader((root/'current_service_pdf_stop_rows_2026-09-03.csv').open(encoding='utf-8')))
          conditions=list(csv.DictReader((root/'current_service_temporary_conditions_2026-09-03.csv').open(encoding='utf-8')))
          validation=json.load((root/'current_service_stop_timetable_validation.json').open(encoding='utf-8'))
          assert validation['status']=='PASS'
          assert len(trips)==119
          assert sum(r['active_on_reference_date']=='True' for r in trips)==104
          assert {r['route_id'] for r in trips}=={'D184','D185','D150','D170'}
          assert len(stop_times)==1145
          assert sum(r['active_on_reference_date']=='True' for r in stop_times)==990
          assert stops
          assert all(r['runtime_semantics']=='SCHEDULED_PUBLISHED_TIME_NOT_OBSERVED_RUNTIME' for r in trips)
          assert all(r['epistemic_status']=='RECONSTRUCTED_FROM_OFFICIAL_PRIMARY_TIMETABLE' for r in stop_times)
          assert len(conditions)==1 and conditions[0]['route_id']=='D185'
          assert conditions[0]['valid_to']=='UNKNOWN_FROM_TIMETABLE_SOURCE'
          assert conditions[0]['ordinary_network_baseline_replaced']=='False'
          assert validation['legacy_current_service_files_used'] is False
          assert validation['runtime_semantics']['observed_runtime_substitution'] is False
          assert validation['calendar_semantics']['annual_service_days']=='NOT_INFERRED'
          assert validation['historical_gtfs_crosscheck']['D185']['active_stop_patterns_on_2026_05_06']==9
          PY

      - name: Static anti-shortcut guard
        shell: bash
        run: |
          ! grep -R "np.random" \
            src/phase2_current_service_stop_timetable.py \
            scripts/phase2_build_current_service_stop_timetable.py
          ! grep -E "outputs/current_service_baseline.csv|scripts/05_current_service.py" \
            src/phase2_current_service_stop_timetable.py

      - name: Upload reproducible current-service evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-current-service-stop-timetable-${{ github.sha }}
          path: /tmp/current_service/
          if-no-files-found: error
          retention-days: 30
