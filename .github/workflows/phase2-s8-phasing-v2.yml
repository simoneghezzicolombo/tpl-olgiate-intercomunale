name: Phase 2 S8 Phasing V2

on:
  push:
    branches:
      - phase2-s8-phasing-v2
    paths:
      - 'config/phase2_s8_phasing_v2.json'
      - 'src/phase2_s8_phasing_v2.py'
      - 'scripts/phase2_build_s8_phasing_v2.py'
      - 'tests/test_phase2_s8_phasing_v2.py'
      - '.github/workflows/phase2-s8-phasing-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-s8-phasing-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile S8 phase-opportunity engine
        run: |
          python -m py_compile src/phase2_s8_phasing_v2.py
          python -m py_compile scripts/phase2_build_s8_phasing_v2.py

      - name: Run S8 phase-opportunity tests
        run: python -m pytest -q tests/test_phase2_s8_phasing_v2.py tests/test_phase2_s8_interchange.py

      - name: Materialise complete S8 phase opportunity surface
        run: |
          rm -rf outputs/phase2/s8_phasing_v2
          mkdir -p outputs/phase2/s8_phasing_v2
          python scripts/phase2_build_s8_phasing_v2.py \
            --catalog outputs/phase2/structural_catalog_v2/structural_scenario_catalog_balanced_v2.csv \
            --catalog-validation outputs/phase2/structural_catalog_v2/structural_scenario_catalog_balanced_v2_validation.json \
            --path-matrix outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix.csv \
            --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json \
            --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv \
            --policy-validation outputs/phase2/service_policy_search_v2/service_policy_search_v2_validation.json \
            --s8-events outputs/phase2/s8_events.csv \
            --s8-contract outputs/phase2/s8_interchange_contract.json \
            --phasing-config config/phase2_s8_phasing_v2.json \
            --route-universe-output outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv \
            --scenario-route-mapping-output outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz \
            --phase-envelope-output outputs/phase2/s8_phasing_v2/s8_phase_opportunity_envelope_v2.csv \
            --validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json

      - name: Validate S8 Phasing V2 contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('outputs/phase2/s8_phasing_v2')
          val=json.loads((root/'s8_phasing_v2_validation.json').read_text(encoding='utf-8'))
          assert val['status']=='PASS_S8_PHASE_OPPORTUNITY_V2_BUILD'
          assert val['contract']=='PHASE2_S8_PHASE_OPPORTUNITY_SURFACE_V2'
          assert val['scenario_count']==100000
          assert val['s8_event_count']==74
          assert val['s8_direction_counts']=={'MILANO':37,'LECCO':37}
          assert val['phase_resolution_min']==1
          assert val['all_integer_phases_evaluated'] is True
          assert val['all_phases_retained_downstream'] is True
          assert val['phase_selected'] is False
          assert val['phase_pruned'] is False
          assert val['passenger_demand_weights_applied'] is False
          assert val['passenger_utility_calculated'] is False
          assert val['topology_ranked'] is False
          assert val['service_policy_selected'] is False
          assert val['vehicle_cycle_return_is_passenger_event_for_open_routes'] is False
          assert val['passenger_bus_to_rail_event_requires_public_return_to_hub'] is True
          assert val['vehicle_closure_route_count'] > 0
          assert val['public_service_return_hub_route_count'] > 0
          assert val['rail_to_bus_passenger_supported_route_count']==val['unique_route_count']
          assert val['bus_to_rail_passenger_supported_route_count']==val['public_service_return_hub_route_count']

          with (root/'unique_route_cycles_v2.csv').open(encoding='utf-8',newline='') as f:
              routes=list(csv.DictReader(f))
          assert len(routes)==val['unique_route_count']
          open_routes=0
          closed_routes=0
          for row in routes:
              assert row['public_service_starts_at_hub']=='true'
              assert row['rail_to_bus_passenger_event_supported']=='true'
              if row['public_service_returns_to_hub']=='true':
                  closed_routes += 1
                  assert row['vehicle_closure_added']=='false'
                  assert row['bus_to_rail_passenger_event_supported']=='true'
              else:
                  open_routes += 1
                  assert row['vehicle_closure_added']=='true'
                  assert row['bus_to_rail_passenger_event_supported']=='false'
          assert open_routes==val['vehicle_closure_route_count']
          assert closed_routes==val['public_service_return_hub_route_count']

          with (root/'s8_phase_opportunity_envelope_v2.csv').open(encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f)
              fields=reader.fieldnames or []
              assert any(name.startswith('vehicle_cycle_to_rail_') for name in fields)
              assert not any(name.startswith('bus_to_rail_') for name in fields)
              rows=list(reader)
          assert len(rows)==val['phase_envelope_rows']
          assert rows and all(row['all_phases_retained_downstream']=='true' for row in rows)
          assert all(int(row['evaluated_phase_count'])==int(row['uniform_headway_min']) for row in rows)
          assert val['integer_phase_evaluations'] > val['phase_envelope_rows']
          print(json.dumps({k:val[k] for k in ('unique_route_count','vehicle_closure_route_count','public_service_return_hub_route_count','phase_envelope_rows','integer_phase_evaluations')}, indent=2))
          PY

      - name: Deterministic byte-for-byte S8 phasing rebuild
        run: |
          rm -rf /tmp/phase2-s8-phasing-v2
          mkdir -p /tmp/phase2-s8-phasing-v2
          python scripts/phase2_build_s8_phasing_v2.py \
            --catalog outputs/phase2/structural_catalog_v2/structural_scenario_catalog_balanced_v2.csv \
            --catalog-validation outputs/phase2/structural_catalog_v2/structural_scenario_catalog_balanced_v2_validation.json \
            --path-matrix outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix.csv \
            --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json \
            --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv \
            --policy-validation outputs/phase2/service_policy_search_v2/service_policy_search_v2_validation.json \
            --s8-events outputs/phase2/s8_events.csv \
            --s8-contract outputs/phase2/s8_interchange_contract.json \
            --phasing-config config/phase2_s8_phasing_v2.json \
            --route-universe-output /tmp/phase2-s8-phasing-v2/routes.csv \
            --scenario-route-mapping-output /tmp/phase2-s8-phasing-v2/scenario-routes.csv.gz \
            --phase-envelope-output /tmp/phase2-s8-phasing-v2/envelope.csv \
            --validation /tmp/phase2-s8-phasing-v2/validation.json
          cmp outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv /tmp/phase2-s8-phasing-v2/routes.csv
          cmp outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz /tmp/phase2-s8-phasing-v2/scenario-routes.csv.gz
          cmp outputs/phase2/s8_phasing_v2/s8_phase_opportunity_envelope_v2.csv /tmp/phase2-s8-phasing-v2/envelope.csv
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json').read_text())
          b=json.loads(Path('/tmp/phase2-s8-phasing-v2/validation.json').read_text())
          for p in (a,b):
              for key in ('route_universe','scenario_route_mapping','phase_envelope'):
                  p['lineage'].pop(key)
          assert a==b
          PY

      - name: Guard S8 epistemic separation
        run: |
          FILES="config/phase2_s8_phasing_v2.json src/phase2_s8_phasing_v2.py scripts/phase2_build_s8_phasing_v2.py tests/test_phase2_s8_phasing_v2.py"
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -n -E 'recommended topology|primary recommendation|modal share *=' $FILES
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check origin/phase2-service-policy-search-v2...HEAD

      - name: Persist validated S8 Phasing V2
        run: |
          git config user.name "phase2-s8-phasing-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A outputs/phase2/s8_phasing_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist audited S8 Phasing V2 [skip ci]"
            git push origin HEAD:phase2-s8-phasing-v2
          fi

      - name: Upload S8 Phasing V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-s8-phasing-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/s8_phasing_v2
