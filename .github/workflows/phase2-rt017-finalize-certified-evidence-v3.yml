name: RT-017 finalize certified evidence V3

on:
  push:
    branches: [rt017-adaptive-border-neutral-road-envelope-v3]
    paths:
      - scripts/phase2_rt017_offline_replay_validation_v3.py
      - .github/workflows/phase2-rt017-finalize-certified-evidence-v3.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: rt017-finalize-certified-evidence-v3
  cancel-in-progress: true

jobs:
  finalize-rt017:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deterministic replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyproj requests networkx

      - name: Verify territorial model code is unchanged from acquired evidence head
        run: |
          git diff --exit-code dc3866fe19f40d6370a7f2b935e4c3addf916550..HEAD -- \
            scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3.py \
            scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3_consistent.py \
            src/phase2_adaptive_routing_envelope_v3.py \
            src/phase2_overpass_consistent_acquisition_v3.py \
            src/phase2_complete_directed_pairs_v3.py \
            src/phase2_frozen_graph.py

      - name: Verify immutable 36-stop pair-query-anchor dependency
        run: |
          STOP=outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv
          test "$(git hash-object "$STOP")" = "8d3a4368a6f62bbdf8fe18ee99482aff18e38fe5"
          test "$(($(wc -l < "$STOP") - 1))" -eq 36

      - name: Download pinned successful territorial acquisition evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rt017_source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9972107416" \
            -o /tmp/rt017_artifact_metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path('/tmp/rt017_artifact_metadata.json').read_text())
          assert meta['id']==9972107416, meta
          assert meta['digest']=='sha256:29a0ffe77bbe16126ff10c85e16278db1f16eaa40c06b8c796cef143f44d5493', meta['digest']
          assert meta['workflow_run']['id']==33974438701, meta['workflow_run']
          assert meta['workflow_run']['head_sha']=='dc3866fe19f40d6370a7f2b935e4c3addf916550', meta['workflow_run']
          print(json.dumps({'source_artifact_id':meta['id'],'digest':meta['digest'],'source_run':meta['workflow_run']['id'],'source_head':meta['workflow_run']['head_sha']}, indent=2))
          PY
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9972107416/zip" \
            -o /tmp/rt017_source.zip
          unzip -q /tmp/rt017_source.zip -d /tmp/rt017_source
          test -f /tmp/rt017_source/rt017/rt017_validation.json
          test -f /tmp/rt017_source/rt017/frozen_graph_edges.csv.gz

      - name: Run zero-network offline deterministic replay
        env:
          PYTHONPATH: .
        run: |
          mkdir -p outputs/phase2/rt017_frozen_evidence
          python scripts/phase2_rt017_offline_replay_validation_v3.py \
            --input-dir /tmp/rt017_source/rt017 \
            --output outputs/phase2/rt017_frozen_evidence/offline_replay_validation_v3.json

      - name: Assert certified territorial facts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('/tmp/rt017_source/rt017/frozen_routing_envelope_metadata_v3.json').read_text())
          replay=json.loads(Path('outputs/phase2/rt017_frozen_evidence/offline_replay_validation_v3.json').read_text())
          assert source['status']=='PASS_RT017_ADAPTIVE_BORDER_NEUTRAL_ROAD_ENVELOPE_V3'
          assert source['frozen_level']==0
          assert source['frozen_margin_m']==500.0
          assert source['complete_directed_probe_pairs']==1260
          assert source['all_pairs_routable_at_frozen_level'] is True
          assert source['boundary_sensitive_pairs_at_frozen_level']==0
          assert source['convergence_reason']=='STABLE_WITH_2_SUCCESSIVE_CONFIRMATIONS'
          assert replay['status']=='PASS_RT017_OFFLINE_DETERMINISTIC_REPLAY_V3'
          assert replay['replayed_pair_results_identical'] is True
          assert replay['complete_directed_probe_pairs_replayed']==1260
          assert replay['network_requests_performed']==0
          print(json.dumps({'territorial':source,'offline_replay':replay}, indent=2))
          PY

      - name: Materialize compact certified evidence
        run: |
          for f in \
            rt017_validation.json \
            frozen_routing_envelope_metadata_v3.json \
            envelope_expansion_audit_v3.csv \
            pair_stabilization_transitions_v3.csv \
            osm_acquisition_audit_v3.csv \
            complete_directed_probe_pair_manifest_v3.csv \
            frozen_pair_results_v3.csv; do
            cp "/tmp/rt017_source/rt017/$f" "outputs/phase2/rt017_frozen_evidence/$f"
          done

      - name: Build full certified handoff bundle
        run: |
          rm -rf outputs/phase2/rt017_certified_bundle
          mkdir -p outputs/phase2/rt017_certified_bundle
          cp -a /tmp/rt017_source/rt017/. outputs/phase2/rt017_certified_bundle/
          cp outputs/phase2/rt017_frozen_evidence/offline_replay_validation_v3.json \
            outputs/phase2/rt017_certified_bundle/offline_replay_validation_v3.json

      - name: Upload final RT-017 certified artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt017-final-certified-evidence-v3
          path: outputs/phase2/rt017_certified_bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Persist compact certified RT-017 evidence on branch
        if: success() && github.ref == 'refs/heads/rt017-adaptive-border-neutral-road-envelope-v3'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/phase2/rt017_frozen_evidence
          if ! git diff --cached --quiet; then
            git commit -m 'data(rt017): persist certified border-neutral envelope evidence'
            git push
          fi
