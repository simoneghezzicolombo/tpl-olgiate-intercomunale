name: Phase 2 Passenger Utility Frontier RT001 V3

on:
  push:
    branches: [phase2-rt001-budget-lossless-v2]
    paths:
      - 'scripts/phase2_build_passenger_utility_frontier_rt001_v3.py'
      - '.github/workflows/phase2-passenger-utility-frontier-rt001-v3.yml'
  workflow_dispatch:

concurrency:
  group: phase2-passenger-utility-frontier-rt001-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      OUTDIR: outputs/phase2/passenger_utility_frontier_rt001_v3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile \
            scripts/phase2_build_passenger_utility_frontier_v2.py \
            scripts/phase2_build_passenger_utility_frontier_v2_all_thresholds.py \
            scripts/phase2_build_passenger_utility_frontier_rt001_v3.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Regression tests
        run: >-
          python -m pytest -q
          tests/test_phase2_passenger_utility_frontier_v2.py
          tests/test_phase2_passenger_utility_all_thresholds_v2.py
          tests/test_phase2_budget_lossless_policy_surface_v2.py
      - name: Build repaired Passenger Utility frontier
        run: |
          mkdir -p "$OUTDIR"
          python scripts/phase2_build_passenger_utility_frontier_rt001_v3.py \
            --budget-policy-frontier outputs/phase2/budget_lossless_policy_surface_v2/budget_lossless_policy_surface_v2.csv.gz \
            --budget-policy-validation outputs/phase2/budget_lossless_policy_surface_v2/budget_lossless_policy_surface_v2_validation.json \
            --feeder-timing outputs/phase2/feeder_generalized_access_v2/scenario_timing_feeder_generalized_access_v2.csv.gz \
            --feeder-validation outputs/phase2/feeder_generalized_access_v2/feeder_generalized_access_v2_validation.json \
            --frontier-output "$OUTDIR/passenger_utility_frontier_rt001_v3.csv.gz" \
            --context-audit-output "$OUTDIR/passenger_utility_context_audit_rt001_v3.csv" \
            --validation-output "$OUTDIR/passenger_utility_frontier_rt001_v3_validation.json"
      - name: Validate repaired Stage-C contract
        run: |
          python - <<'PY'
          import csv,gzip,json
          from pathlib import Path
          root=Path('outputs/phase2/passenger_utility_frontier_rt001_v3')
          v=json.loads((root/'passenger_utility_frontier_rt001_v3_validation.json').read_text())
          assert v['status']=='PASS_PHASE2_PASSENGER_UTILITY_FRONTIER_RT001_V3'
          assert v['contract']=='PHASE2_NO_WEIGHT_PASSENGER_UTILITY_EXACT_EXISTENTIAL_BUDGET_V3'
          assert v['rt001_repair'] is True
          assert v['rt001_input_context_count']==493212
          assert v['rt001_recovered_from_continuous_hard_filter_total']==2250
          assert v['rt001_recovered_unique_scenario_count']==634
          axes=set(v['passenger_maximise_axes_within_service_context'])
          for threshold in (5,8,10):
              assert f'public_population_coverage_share_{threshold}min' in axes
              assert f'public_worst_municipality_coverage_share_{threshold}min' in axes
          assert v['annual_bus_km_is_selected_timetable_production'] is False
          assert v['annual_bus_km_is_exact_phase_domain_minimum'] is True
          assert v['annual_bus_km_used_for_passenger_dominance'] is False
          assert v['exact_budget_eligibility_repaired_before_stage_c'] is True
          for key in ('recovery_selected','calendar_selected','service_policy_selected','decision_budget_selected','exact_s8_phase_used','exact_timetable_constructed','full_gjt_calculated','weighted_composite_score','municipal_work_od_downscaled','resident_population_is_passenger_demand','ridership_forecast','primary_selected','runner_up_selected'):
              assert v[key] is False, key
          assert v['passenger_utility_frontier_row_count_all_budgets'] > 0
          with gzip.open(root/'passenger_utility_frontier_rt001_v3.csv.gz','rt',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==v['passenger_utility_frontier_row_count_all_budgets']
          assert len({(r['budget_suffix'],r['plan_id']) for r in rows})==len(rows)
          assert all(r['rt001_budget_lossless_upstream']=='true' for r in rows)
          assert all(r['annual_bus_km_selected']=='false' for r in rows)
          assert all(r['annual_bus_km_semantics']=='EXACT_MINIMUM_OVER_COMPLETE_INTEGER_PHASE_DOMAIN_NOT_SELECTED_TIMETABLE' for r in rows)
          recovered=sum(r['recovered_from_continuous_hard_filter']=='true' for r in rows)
          print(json.dumps({'frontier_rows':len(rows),'recovered_rows_surviving_stage_c':recovered,'budget_summary':v['budget_summary']},indent=2,sort_keys=True))
          PY
      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/pu-rt001-v3 && mkdir -p /tmp/pu-rt001-v3
          python scripts/phase2_build_passenger_utility_frontier_rt001_v3.py \
            --budget-policy-frontier outputs/phase2/budget_lossless_policy_surface_v2/budget_lossless_policy_surface_v2.csv.gz \
            --budget-policy-validation outputs/phase2/budget_lossless_policy_surface_v2/budget_lossless_policy_surface_v2_validation.json \
            --feeder-timing outputs/phase2/feeder_generalized_access_v2/scenario_timing_feeder_generalized_access_v2.csv.gz \
            --feeder-validation outputs/phase2/feeder_generalized_access_v2/feeder_generalized_access_v2_validation.json \
            --frontier-output /tmp/pu-rt001-v3/frontier.csv.gz \
            --context-audit-output /tmp/pu-rt001-v3/audit.csv \
            --validation-output /tmp/pu-rt001-v3/validation.json >/dev/null
          cmp "$OUTDIR/passenger_utility_frontier_rt001_v3.csv.gz" /tmp/pu-rt001-v3/frontier.csv.gz
          cmp "$OUTDIR/passenger_utility_context_audit_rt001_v3.csv" /tmp/pu-rt001-v3/audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/phase2/passenger_utility_frontier_rt001_v3/passenger_utility_frontier_rt001_v3_validation.json').read_text())
          b=json.loads(Path('/tmp/pu-rt001-v3/validation.json').read_text())
          for x in (a,b):
              x['lineage'].pop('frontier_output',None)
              x['lineage'].pop('context_audit_output',None)
          assert a==b
          PY
      - name: Guard epistemic boundary
        run: |
          for FILE in scripts/phase2_build_passenger_utility_frontier_v2.py scripts/phase2_build_passenger_utility_frontier_v2_all_thresholds.py scripts/phase2_build_passenger_utility_frontier_rt001_v3.py; do
            ! grep -En 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' "$FILE"
          done
      - name: Persist evidence
        run: |
          git config user.name 'phase2-pu-rt001-v3-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUTDIR"
          if ! git diff --cached --quiet; then
            git commit -m 'data(phase2): persist repaired Passenger Utility RT001 V3 [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-passenger-utility-frontier-rt001-v3-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/passenger_utility_frontier_rt001_v3
          if-no-files-found: error
