name: Phase 2 RT-029 Candidate Accessibility Pareto V3

on:
  workflow_dispatch:
  push:
    branches:
      - rt029-candidate-accessibility-pareto-v3
    paths:
      - "src/phase2_candidate_accessibility_pareto_v3.py"
      - "scripts/phase2_run_rt029_candidate_accessibility_pareto_v3.py"
      - "tests/test_phase2_candidate_accessibility_pareto_v3.py"
      - ".github/workflows/phase2-rt029-candidate-accessibility-pareto-v3.yml"
      - "docs/PHASE2_RT029_CANDIDATE_ACCESSIBILITY_PARETO_V3.md"

permissions:
  contents: read
  actions: read

jobs:
  rt029:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: "src"
      RT023_RUN_ID: "34034770563"
      RT023_ARTIFACT_ID: "9989805162"
      RT023_ARTIFACT_DIGEST: "sha256:d206af90c247f87940f51db17e5497183199cceb9070e84124c0ef3b5ddba981"
      RT028_RUN_ID: "34037985015"
      RT028_ARTIFACT_ID: "9990832031"
      RT028_ARTIFACT_DIGEST: "sha256:f09bfa9fb8d7aeacc9c7b80f4bc17dff5c4ce391e6a16c25bc0afd973e509415"
      RT022_STRUCTURES: "outputs/phase2/rt022_minimum_backbones_v3/minimum_topology_neutral_backbone_universe.csv"
      OUT_DIR: "outputs/phase2/rt029_candidate_accessibility_pareto_v3"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal runtime
        run: python -m pip install --upgrade pip pandas pytest

      - name: Run RT-029 red-team tests
        run: python -m pytest -q tests/test_phase2_candidate_accessibility_pareto_v3.py

      - name: Verify pinned upstream artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RT023_ARTIFACT_ID}" --jq '.digest')" = "${RT023_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RT028_ARTIFACT_ID}" --jq '.digest')" = "${RT028_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT023_RUN_ID}" --jq '.head_sha')" = "0d9a82caa1d1d624e0f6945e709f3548785fb8dc"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RT028_RUN_ID}" --jq '.head_sha')" = "8a926234b8635aa48db4b80a61fb293be35f74f2"

      - name: Download certified RT-023 artifact
        uses: actions/download-artifact@v4
        with:
          name: rt023-service-pattern-realization-v3
          path: _upstream/rt023
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34034770563

      - name: Download certified RT-028 artifact
        uses: actions/download-artifact@v4
        with:
          name: rt028-final-stop-pedestrian-accessibility-substrate-v3
          path: _upstream/rt028
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34037985015

      - name: Resolve certified input files
        run: |
          set -euo pipefail
          test -f "${RT022_STRUCTURES}"
          MANIFEST="$(find _upstream/rt023 -type f -name 'structure_link_manifest.csv' -print -quit)"
          REALIZATIONS="$(find _upstream/rt023 -type f -name 'link_realization_catalog.csv' -print -quit)"
          WALK="$(find _upstream/rt028 -type f -name 'rt028_population_unit_stop_walk_matrix_v3.csv' -print -quit)"
          test -n "${MANIFEST}" && test -f "${MANIFEST}"
          test -n "${REALIZATIONS}" && test -f "${REALIZATIONS}"
          test -n "${WALK}" && test -f "${WALK}"
          {
            echo "MANIFEST=${MANIFEST}"
            echo "REALIZATIONS=${REALIZATIONS}"
            echo "WALK=${WALK}"
          } >> "${GITHUB_ENV}"

      - name: Compile all 88 candidates
        run: |
          set -euo pipefail
          rm -rf "${OUT_DIR}"
          python scripts/phase2_run_rt029_candidate_accessibility_pareto_v3.py \
            --structures "${RT022_STRUCTURES}" \
            --structure-link-manifest "${MANIFEST}" \
            --realizations "${REALIZATIONS}" \
            --walk-matrix "${WALK}" \
            --output-dir "${OUT_DIR}" \
            --expected-structures 88 \
            --expected-core-municipalities 5

      - name: Deterministic rebuild
        run: |
          set -euo pipefail
          rm -rf /tmp/rt029-rebuild
          python scripts/phase2_run_rt029_candidate_accessibility_pareto_v3.py \
            --structures "${RT022_STRUCTURES}" \
            --structure-link-manifest "${MANIFEST}" \
            --realizations "${REALIZATIONS}" \
            --walk-matrix "${WALK}" \
            --output-dir /tmp/rt029-rebuild \
            --expected-structures 88 \
            --expected-core-municipalities 5
          diff -qr "${OUT_DIR}" /tmp/rt029-rebuild

      - name: Validate no premature winner fields
        run: |
          set -euo pipefail
          ! grep -RniE 'PRIMARY|RUNNER.UP|weighted_composite|winner' "${OUT_DIR}"/*.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/phase2/rt029_candidate_accessibility_pareto_v3/rt029_candidate_accessibility_pareto_audit_v3.json")
          audit = json.loads(p.read_text())
          assert audit["status"] == "PASS"
          assert audit["structure_count"] == 88
          assert audit["decision_scenario"] == "GUARANTEED_RT023"
          assert all(v is False for v in audit["negative_assertions"].values())
          assert audit["shortlist_count"] > 0
          PY

      - name: Upload deterministic RT-029 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt029-candidate-accessibility-pareto-v3
          path: outputs/phase2/rt029_candidate_accessibility_pareto_v3
          if-no-files-found: error
          retention-days: 90
