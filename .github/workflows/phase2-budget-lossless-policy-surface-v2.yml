name: Phase 2 Budget-Lossless Policy Surface V2

on:
  push:
    branches: [phase2-rt001-budget-lossless-v2]
    paths:
      - 'scripts/phase2_build_budget_lossless_policy_surface_v2.py'
      - 'tests/test_phase2_budget_lossless_policy_surface_v2.py'
      - '.github/workflows/phase2-budget-lossless-policy-surface-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-budget-lossless-policy-surface-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      OUTDIR: outputs/phase2/budget_lossless_policy_surface_v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/phase2_build_budget_lossless_policy_surface_v2.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Unit tests
        run: python -m pytest -q tests/test_phase2_budget_lossless_policy_surface_v2.py
      - name: Build budget-lossless policy surface
        run: |
          mkdir -p "$OUTDIR"
          python scripts/phase2_build_budget_lossless_policy_surface_v2.py \
            --service-ready outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_v2.csv \
            --service-ready-validation outputs/phase2/service_ready_frontier_v2/service_ready_frontier_v2_validation.json \
            --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv \
            --policy-validation outputs/phase2/service_policy_search_v2/service_policy_search_v2_validation.json \
            --budget-envelopes outputs/phase2/budget_envelopes.csv \
            --budget-validation outputs/phase2/budget_envelopes_validation.json \
            --output "$OUTDIR/budget_lossless_policy_surface_v2.csv.gz" \
            --audit-output "$OUTDIR/budget_lossless_policy_surface_budget_audit_v2.csv" \
            --validation-output "$OUTDIR/budget_lossless_policy_surface_v2_validation.json"
      - name: Validate RT-001 contract
        run: |
          python - <<'PY'
          import csv,gzip,json
          from pathlib import Path
          root=Path('outputs/phase2/budget_lossless_policy_surface_v2')
          v=json.loads((root/'budget_lossless_policy_surface_v2_validation.json').read_text())
          assert v['status']=='PASS_PHASE2_BUDGET_LOSSLESS_POLICY_SURFACE_V2'
          assert v['contract']=='PHASE2_EXACT_EXISTENTIAL_INTEGER_PHASE_BUDGET_SURFACE_V2'
          assert v['service_ready_row_count']==21237
          assert v['no_extension_policy_count']==72
          assert v['policy_contexts_per_timing']==9
          assert v['budget_count']==6
          assert v['candidate_context_count_before_exact_budget']==21237*9*6
          assert 0 < v['retained_exact_phase_feasible_context_count'] <= v['candidate_context_count_before_exact_budget']
          assert sum(v['exact_phase_feasibility_class_counts'].values())==v['candidate_context_count_before_exact_budget']
          assert v['exact_phase_feasibility_class_counts']['SOME_PHASES_BUDGET_FEASIBLE'] > 0
          assert v['recovered_from_continuous_hard_filter_total'] > 0
          assert v['route_specific_integer_phase_domain_preserved'] is True
          for key in ('continuous_clockface_used_as_hard_filter','old_feasibility_bitmask_used_as_hard_filter','pareto_screening_applied_in_this_stage','phase_dependent_annual_bus_km_used_for_dominance','positive_extension_share_in_main_surface','exact_phase_selected','exact_timetable_constructed','decision_budget_selected','calendar_selected','recovery_selected','service_policy_selected','weighted_composite_score','primary_selected','runner_up_selected'):
              assert v[key] is False, key
          with gzip.open(root/'budget_lossless_policy_surface_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f)
              n=0; recovered=0
              for r in reader:
                  n+=1
                  assert r['exact_budget_phase_feasible']=='true'
                  assert r['exact_budget_phase_feasibility_class'] in {'ALL_PHASES_BUDGET_FEASIBLE','SOME_PHASES_BUDGET_FEASIBLE'}
                  assert float(r['exact_min_annual_bus_km']) <= float(r['budget_cap_annual_bus_km']) + 1e-6
                  assert float(r['exact_min_annual_bus_km']) <= float(r['exact_max_annual_bus_km']) + 1e-6
                  assert r['annual_bus_km_semantics']=='EXACT_MINIMUM_OVER_COMPLETE_INTEGER_PHASE_DOMAIN_NOT_SELECTED_TIMETABLE'
                  if r['recovered_from_continuous_hard_filter']=='true':
                      recovered+=1
                      assert r['continuous_hard_filter_would_pass']=='false'
                      assert float(r['continuous_annual_bus_km_audit_only']) > float(r['budget_cap_annual_bus_km'])
              assert n==v['retained_exact_phase_feasible_context_count']
              assert recovered==v['recovered_from_continuous_hard_filter_total']
          print(json.dumps({k:v[k] for k in ('retained_exact_phase_feasible_context_count','exact_phase_feasibility_class_counts','recovered_from_continuous_hard_filter_by_budget','recovered_from_continuous_hard_filter_total','recovered_unique_scenario_count')}, indent=2, sort_keys=True))
          PY
      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/budget-lossless-v2 && mkdir -p /tmp/budget-lossless-v2
          python scripts/phase2_build_budget_lossless_policy_surface_v2.py \
            --service-ready outputs/phase2/service_ready_frontier_v2/scenario_timing_service_ready_frontier_v2.csv \
            --service-ready-validation outputs/phase2/service_ready_frontier_v2/service_ready_frontier_v2_validation.json \
            --policy-grid outputs/phase2/service_policy_search_v2/service_policy_design_space_v2.csv \
            --policy-validation outputs/phase2/service_policy_search_v2/service_policy_search_v2_validation.json \
            --budget-envelopes outputs/phase2/budget_envelopes.csv \
            --budget-validation outputs/phase2/budget_envelopes_validation.json \
            --output /tmp/budget-lossless-v2/surface.csv.gz \
            --audit-output /tmp/budget-lossless-v2/audit.csv \
            --validation-output /tmp/budget-lossless-v2/validation.json >/dev/null
          cmp "$OUTDIR/budget_lossless_policy_surface_v2.csv.gz" /tmp/budget-lossless-v2/surface.csv.gz
          cmp "$OUTDIR/budget_lossless_policy_surface_budget_audit_v2.csv" /tmp/budget-lossless-v2/audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/phase2/budget_lossless_policy_surface_v2/budget_lossless_policy_surface_v2_validation.json').read_text())
          b=json.loads(Path('/tmp/budget-lossless-v2/validation.json').read_text())
          for x in (a,b):
              for k in ('output','audit_output'):
                  x['lineage'].pop(k,None)
          assert a==b
          PY
      - name: Guard epistemic boundary
        run: |
          ! grep -En 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' scripts/phase2_build_budget_lossless_policy_surface_v2.py
          ! grep -En 'weighted_composite_score.*True|primary_selected.*True|runner_up_selected.*True|continuous_clockface_used_as_hard_filter.*True|old_feasibility_bitmask_used_as_hard_filter.*True' scripts/phase2_build_budget_lossless_policy_surface_v2.py
      - name: Persist evidence
        run: |
          git config user.name 'phase2-budget-lossless-v2-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUTDIR"
          if ! git diff --cached --quiet; then
            git commit -m 'data(phase2): persist budget-lossless policy surface v2 [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-budget-lossless-policy-surface-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/budget_lossless_policy_surface_v2
          if-no-files-found: error
