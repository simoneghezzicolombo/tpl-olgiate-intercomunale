name: RT031 Linea 8 order and conditional walking V3
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-decision-convergence]
    paths:
      - scripts/phase2_probe_rt031_line8_order_neighbourhood_v3.py
      - scripts/phase2_probe_rt031_line8_no_reverse_all_orders_v3.py
      - scripts/phase2_measure_rt031_line8_omission_walk_v3.py
      - scripts/phase2_close_rt031_line8_fixed_order_timetable_v3.py
      - scripts/phase2_build_rt031_line8_delivery_readiness_v3.py
      - tests/test_phase2_rt031_line8_no_reverse_orders_v3.py
      - tests/test_phase2_rt031_line8_fixed_order_timetable_v3.py
      - tests/test_phase2_rt031_line8_delivery_readiness_v3.py
      - outputs/phase2/rt031_line8_local_shortcuts_v3/delivery_readiness_fixed_order.json
      - outputs/phase2/rt031_line8_local_shortcuts_v3/hoe_fixed_order_timetable_closure.json.gz
      - outputs/phase2/rt031_line8_local_shortcuts_v3/no_reverse_*
      - outputs/phase2/rt031_line8_local_shortcuts_v3/order_neighbourhood.json.gz
      - .github/workflows/phase2-rt031-line8-order-walk-v3.yml
permissions:
  contents: read
jobs:
  order-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:src:scripts
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Turn-memory and municipal-loss regression checks
        run: python -m unittest tests.test_phase2_rt031_line8_no_reverse_orders_v3 -q
      - name: Retrieve frozen certified road and walking evidence
        run: |
          gh run download 33975545284 -n rt017-final-certified-evidence-v3 -D /tmp/rt031/rt017
          gh run download 34030321683 -n phase2-rt022-minimum-backbones-v3-real -D /tmp/rt031/rt022
          gh run download 34134177590 -n rt031-successor-via-way-relevance-v3 -D /tmp/rt031/successor
          gh run download 34039162932 -n rt028-final-stop-pedestrian-accessibility-substrate-v3 -D /tmp/rt031/rt028
      - name: Reproduce all-order distances and conditional walking coverage
        run: |
          cp outputs/phase2/rt031_line8_local_shortcuts_v3/no_reverse_all_orders.json.gz /tmp/orders.expected.json.gz
          cp outputs/phase2/rt031_line8_local_shortcuts_v3/no_reverse_omission_walking.json /tmp/walk.expected.json
          python -m scripts.phase2_probe_rt031_line8_no_reverse_all_orders_v3 --graph_dir /tmp/rt031
          python -m scripts.phase2_measure_rt031_line8_omission_walk_v3 --graph_dir /tmp/rt031 --walk_dir /tmp/rt031/rt028
          python - <<'PY'
          import gzip,json
          base='outputs/phase2/rt031_line8_local_shortcuts_v3/'
          def road(path):
              r=json.loads(gzip.decompress(open(path,'rb').read()))
              return [(k,l['edge_ids']) for k,l in r['loops'].items()],[(c['omitted_stop_identity'],round(c['distance_m'],6),[(k,l['edge_ids']) for k,l in c['loops'].items()]) for c in r['single_inventory_omission_comparisons_not_adopted']]
          assert road('/tmp/orders.expected.json.gz')==road(base+'no_reverse_all_orders.json.gz')
          a=json.load(open('/tmp/walk.expected.json'));b=json.load(open(base+'no_reverse_omission_walking.json'))
          assert a['all_29_comparison_sites_access_fraction']==b['all_29_comparison_sites_access_fraction']
          assert a['cases']==b['cases']
          assert a['hoe_fixed_event_order_comparison_not_adopted']==b['hoe_fixed_event_order_comparison_not_adopted']
          PY
          python -m unittest tests.test_phase2_rt031_line8_no_reverse_orders_v3 -q
      - name: Reproduce bounded fixed-order timetable closure
        run: |
          python -m scripts.phase2_close_rt031_line8_fixed_order_timetable_v3 --time-limit 90
          python -m unittest tests.test_phase2_rt031_line8_fixed_order_timetable_v3 -q
      - name: Build traceable non-decisional delivery dossier
        run: |
          python -m scripts.phase2_build_rt031_line8_delivery_readiness_v3
          python -m unittest tests.test_phase2_rt031_line8_delivery_readiness_v3 -q
