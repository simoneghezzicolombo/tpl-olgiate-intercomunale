name: Phase 2 Codex Tournament Readiness Red-Team RT001 V3

on:
  push:
    branches:
      - phase2-codex-tournament-readiness-redteam-a
    paths:
      - 'scripts/phase2_redteam_tournament_readiness_rt001_v3.py'
      - 'tests/test_phase2_redteam_tournament_readiness_rt001_v3.py'
      - 'docs/PHASE2_CODEX_TOURNAMENT_READINESS_REDTEAM_RT001_V3.md'
      - 'outputs/phase2/tournament_readiness_redteam_rt001_v3/**'
      - '.github/workflows/phase2-codex-tournament-readiness-redteam-rt001-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-codex-tournament-readiness-redteam-rt001-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redteam:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen Codex audit target ancestry
        run: git merge-base --is-ancestor 58c228ed614b4fb4d43c15a5c8e12e637074c5f2 HEAD

      - name: Compile independent red-team
        run: python -m py_compile scripts/phase2_redteam_tournament_readiness_rt001_v3.py

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'

      - name: Run red-team and upstream contract regressions
        run: |
          python -m pytest -q \
            tests/test_phase2_redteam_tournament_readiness_rt001_v3.py \
            tests/test_phase2_final_tournament_readiness_rt001_v3.py \
            tests/test_phase2_tournament_contract_and_frontier_rt001_v3.py

      - name: Build independent semantic red-team evidence
        run: python scripts/phase2_redteam_tournament_readiness_rt001_v3.py

      - name: Validate fail-closed verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/phase2/tournament_readiness_redteam_rt001_v3/tournament_readiness_redteam_rt001_v3_validation.json')
          v = json.loads(p.read_text())
          assert v['status'] == 'PASS_PHASE2_CODEX_TOURNAMENT_READINESS_REDTEAM_RT001_V3'
          assert v['audit_pass'] is True
          assert v['audited_codex_head'] == '58c228ed614b4fb4d43c15a5c8e12e637074c5f2'
          assert v['input_context_count'] == 16495
          assert v['frontier_context_count'] == 12284
          assert v['dominated_context_count'] == 4211
          assert v['legacy_rows_collapsed_by_v2_identity'] == 6961
          assert v['downstream_frontier_executable_consumer_count'] == 0
          assert v['frontier_is_descriptive_only'] is True
          for key in (
              'final_tournament_execution_ready', 'final_selection_authorized',
              'primary_selection_authorised', 'runner_up_selection_authorised',
              'decision_budget_selected', 'uncertainty_band_selected',
              'weighted_composite_score', 'manufactured_demand_weighted_gjt',
              'manufactured_missed_connection_probability',
              'stage_e_engineering_retention_reinterpreted_as_probability',
              'frontier_is_ranking', 'frontier_is_shortlist',
              'frontier_membership_may_authorize_pruning', 'nonfrontier_pruning_authorized',
              'lower_bound_axes_establish_true_system_dominance',
          ):
              assert v[key] is False, key
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          rm -rf /tmp/tournament-redteam-rebuild
          python scripts/phase2_redteam_tournament_readiness_rt001_v3.py \
            --output-dir /tmp/tournament-redteam-rebuild >/dev/null
          cmp outputs/phase2/tournament_readiness_redteam_rt001_v3/tournament_readiness_redteam_findings_rt001_v3.csv /tmp/tournament-redteam-rebuild/tournament_readiness_redteam_findings_rt001_v3.csv
          cmp outputs/phase2/tournament_readiness_redteam_rt001_v3/tournament_readiness_redteam_rt001_v3_validation.json /tmp/tournament-redteam-rebuild/tournament_readiness_redteam_rt001_v3_validation.json

      - name: Epistemic and source-closed guard
        run: |
          FILE=scripts/phase2_redteam_tournament_readiness_rt001_v3.py
          ! grep -En 'np\.random|numpy\.random|(^|[[:space:]])import random|from random|requests\.|urllib\.|httpx\.' "$FILE"
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          frontier = Path('outputs/phase2/non_decisional_tournament_frontier_rt001_v3/non_decisional_pareto_frontier_rt001_v3.csv.gz')
          with gzip.open(frontier, 'rt', encoding='utf-8', newline='') as handle:
              fields = set(csv.DictReader(handle).fieldnames or [])
          banned = {
              'demand_weighted_gjt_improvement_min', 'median_gjt_improvement_min',
              'lower_quantile_gjt_improvement_min', 'missed_connection_probability',
              'median_missed_connection_probability',
          }
          assert not (fields & banned), sorted(fields & banned)
          v = json.loads(Path('outputs/phase2/non_decisional_tournament_frontier_rt001_v3/non_decisional_pareto_frontier_rt001_v3_validation.json').read_text())
          assert v['candidate_evaluation_rows_materialized'] is False
          assert v['recommendation_materialized'] is False
          PY
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check

      - name: Persist red-team evidence
        run: |
          git config user.name 'phase2-tournament-readiness-redteam-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add outputs/phase2/tournament_readiness_redteam_rt001_v3
          if git diff --cached --quiet; then
            echo 'No red-team evidence changes to persist'
          else
            git commit -m 'data(phase2): persist tournament readiness red-team [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-codex-tournament-readiness-redteam-rt001-v3-${{ github.sha }}
          path: outputs/phase2/tournament_readiness_redteam_rt001_v3
          retention-days: 90
          if-no-files-found: error
