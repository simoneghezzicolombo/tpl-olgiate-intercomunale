name: RT031 one-two movement conditional comparison
on:
  workflow_dispatch:
  push:
    branches: [codex/rt031-multimovement-budget-comparison]
    paths:
      - src/phase2_rt031_movement_portfolios_v3.py
      - scripts/phase2_compare_rt031_movement_portfolios_v3.py
      - tests/test_phase2_rt031_movement_portfolios_v3.py
      - .github/workflows/phase2-rt031-movement-portfolios-v3.yml
permissions:
  contents: read
  actions: read
jobs:
  exact-pool-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest tests/test_phase2_rt031_movement_portfolios_v3.py -q
      - name: Acquire pinned physical pool and walking matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10179715479/zip > /tmp/pool.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9991182904/zip > /tmp/walk.zip
          echo '6787341d383d10f9083d30047e524838007f3b5f2aa31b85635574efcdea6bb2  /tmp/pool.zip' | sha256sum -c
          echo 'e1ca83699593dd9e605d2870667da1b4dfc6068436a0c3116faf8587901b2e28  /tmp/walk.zip' | sha256sum -c
          unzip -q /tmp/pool.zip -d /tmp/pool
          unzip -q /tmp/walk.zip -d /tmp/walk
      - name: Exact pool enumeration and deterministic replay
        run: |
          walk=$(find /tmp/walk -name rt028_population_unit_stop_walk_matrix_v3.csv)
          python scripts/phase2_compare_rt031_movement_portfolios_v3.py --pool /tmp/pool/physical_walk_search.json --walk-matrix "$walk" --out /tmp/portfolio-a
          python scripts/phase2_compare_rt031_movement_portfolios_v3.py --pool /tmp/pool/physical_walk_search.json --walk-matrix "$walk" --out /tmp/portfolio-b
          diff -r /tmp/portfolio-a /tmp/portfolio-b
      - uses: actions/upload-artifact@v4
        with:
          name: rt031-one-two-movement-conditional-comparison-v3
          path: /tmp/portfolio-a/
          if-no-files-found: error
