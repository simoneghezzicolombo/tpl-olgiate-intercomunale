name: Phase 2 building-population source probe

on:
  push:
    branches: [phase2-building-population]
    paths:
      - scripts/phase2_probe_building_population_sources.py
      - .github/workflows/phase2-building-population-probe.yml
  workflow_dispatch:

jobs:
  probe-official-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused geospatial dependencies
        run: python -m pip install --upgrade requests pandas geopandas pyogrio shapely pyproj openpyxl
      - name: Compile read-only source probe
        run: python -m py_compile scripts/phase2_probe_building_population_sources.py
      - name: Probe official ISTAT and Regione Lombardia sources
        run: python scripts/phase2_probe_building_population_sources.py | tee /tmp/building-source-probe.json
      - name: Reject synthetic/random source probe
        run: |
          ! grep -R --line-number -E 'np\.random|random\.' scripts/phase2_probe_building_population_sources.py
      - name: Whitespace check
        run: git diff --check 147ad941579eb7ef17a5a54c19a5f820e5a226d4...HEAD
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-building-population-source-probe-${{ github.sha }}
          path: /tmp/building-source-probe.json
          if-no-files-found: error
          retention-days: 30
