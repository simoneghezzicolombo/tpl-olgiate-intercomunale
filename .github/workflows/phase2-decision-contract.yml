name: Phase 2 decision contract hardening

on:
  push:
    branches: [phase2-decision-contract-hardening]
    paths:
      - src/phase2_candidate_tournament.py
      - scripts/phase2_finalize_tournament.py
      - tests/test_phase2_candidate_tournament.py
      - tests/test_phase2_finalize_tournament.py
      - docs/PHASE2_DECISION_CONTRACT.md
      - .github/workflows/phase2-decision-contract.yml
  pull_request:
    branches: [phase2-optimizer-core]
    paths:
      - src/phase2_candidate_tournament.py
      - scripts/phase2_finalize_tournament.py
      - tests/test_phase2_candidate_tournament.py
      - tests/test_phase2_finalize_tournament.py
      - docs/PHASE2_DECISION_CONTRACT.md
      - .github/workflows/phase2-decision-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile decision modules
        run: |
          python -m py_compile src/phase2_candidate_tournament.py
          python -m py_compile scripts/phase2_finalize_tournament.py

      - name: Run decision contract tests
        run: >-
          pytest -q
          tests/test_phase2_candidate_tournament.py
          tests/test_phase2_finalize_tournament.py

      - name: Guard no implicit decision defaults or legacy evidence
        run: |
          if grep -n "max(budgets) if decision_budget_km is None" scripts/phase2_finalize_tournament.py; then
            echo "Implicit maximum-budget fallback is forbidden."
            exit 1
          fi
          if grep -R "np.random\|numpy.random\|import random\|from random" src/phase2_candidate_tournament.py scripts/phase2_finalize_tournament.py; then
            echo "Random generation is forbidden."
            exit 1
          fi
          if grep -R "current_service_baseline.csv\|route_variants.csv\|08_candidate_routes" src/phase2_candidate_tournament.py scripts/phase2_finalize_tournament.py; then
            echo "Legacy hardcoded evidence is forbidden."
            exit 1
          fi
          git diff --check
