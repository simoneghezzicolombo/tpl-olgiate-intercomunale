name: Phase 2 optimizer core

on:
  push:
    branches: [phase2-optimizer-core]
    paths:
      - src/phase2_optimizer_core.py
      - scripts/phase2_run_structural_search.py
      - tests/test_phase2_optimizer_core.py
      - tests/test_phase2_structural_runner.py
      - docs/PHASE2_OPTIMIZER_CORE.md
      - .github/workflows/phase2-optimizer-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-optimizer-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile Phase 2 search modules
        run: |
          python -m py_compile src/phase2_optimizer_core.py
          python -m py_compile scripts/phase2_run_structural_search.py

      - name: Run optimizer-core tests
        run: pytest -q tests/test_phase2_optimizer_core.py tests/test_phase2_structural_runner.py

      - name: Guard deterministic implementation
        run: |
          if grep -R "np.random\|numpy.random\|import random\|from random" src/phase2_optimizer_core.py scripts/phase2_run_structural_search.py; then
            echo "Random generation is forbidden in the Phase 2 optimizer core."
            exit 1
          fi
          if grep -R "08_candidate_routes\|route_variants.csv" src/phase2_optimizer_core.py scripts/phase2_run_structural_search.py; then
            echo "Legacy hardcoded candidate-route evidence must not enter the Phase 2 optimizer."
            exit 1
          fi
          git diff --check
