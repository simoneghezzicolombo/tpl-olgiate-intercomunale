name: Phase 2 optimizer core

on:
  push:
    branches: [phase2-optimizer-core]
    paths:
      - src/phase2_optimizer_core.py
      - tests/test_phase2_optimizer_core.py
      - docs/PHASE2_OPTIMIZER_CORE.md
      - .github/workflows/phase2-optimizer-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-optimizer-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile optimizer core
        run: python -m py_compile src/phase2_optimizer_core.py

      - name: Run optimizer-core tests
        run: pytest -q tests/test_phase2_optimizer_core.py

      - name: Guard deterministic implementation
        run: |
          if grep -R "np.random\|numpy.random\|import random\|from random" src/phase2_optimizer_core.py; then
            echo "Random generation is forbidden in the Phase 2 optimizer core."
            exit 1
          fi
          git diff --check
