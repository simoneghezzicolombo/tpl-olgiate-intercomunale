name: Phase 2 Territorial Commuting Addressability V2

on:
  push:
    branches:
      - phase2-passenger-gjt-v2
    paths:
      - 'src/phase2_territorial_commuting_addressability_v2.py'
      - 'scripts/phase2_build_territorial_commuting_addressability_v2.py'
      - 'tests/test_phase2_territorial_commuting_addressability_v2.py'
      - 'docs/PHASE2_TERRITORIAL_COMMUTING_ADDRESSABILITY_V2.md'
      - '.github/workflows/phase2-territorial-commuting-addressability-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-territorial-commuting-addressability-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OUTDIR: outputs/phase2/territorial_demand_v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile territorial demand engine
        run: |
          python -m py_compile src/phase2_territorial_commuting_addressability_v2.py
          python -m py_compile scripts/phase2_build_territorial_commuting_addressability_v2.py

      - name: Run territorial demand tests
        run: python -m pytest -q tests/test_phase2_territorial_commuting_addressability_v2.py

      - name: Materialise Territorial Commuting Addressability V2
        run: >-
          python scripts/phase2_build_territorial_commuting_addressability_v2.py
          --od outputs/phase2/s8_work_demand_addressability.csv
          --od-validation outputs/phase2/od_2021_demand_profile_validation.json
          --anchors outputs/phase2/reduced_path_matrix_v2/routing_anchor_universe.csv
          --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json
          --routes outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv
          --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json
          --scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz
          --od-universe-output $OUTDIR/territorial_work_od_universe_v2.csv
          --scenario-output $OUTDIR/scenario_territorial_commuting_addressability_v2.csv.gz
          --validation $OUTDIR/territorial_commuting_addressability_v2_validation.json

      - name: Validate territorial demand contract
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path

          root = Path('outputs/phase2/territorial_demand_v2')
          validation = json.loads(
              (root/'territorial_commuting_addressability_v2_validation.json').read_text(encoding='utf-8')
          )
          assert validation['status'] == 'PASS_TERRITORIAL_COMMUTING_ADDRESSABILITY_V2_BUILD'
          assert validation['contract'] == 'PHASE2_TERRITORIAL_COMMUTING_ADDRESSABILITY_V2'
          assert validation['source_scope'] == 'ISTAT_2021_WORK_COMMUTING_ONLY'
          assert validation['source_resolution'] == 'MUNICIPAL_OD'
          assert validation['scenario_count'] == 100000
          assert validation['resident_worker_od_mass'] == 8754
          assert validation['self_worker_od_mass'] == 1315
          assert validation['intermunicipal_worker_od_mass'] == 7439
          assert validation['footprint_intermunicipal_od_relation_count'] > 0
          assert validation['footprint_intermunicipal_worker_od_mass'] > 0
          assert 'Santa Maria Hoè' in validation['structural_footprint_municipalities']
          assert 'Santa Maria Hoè' in validation['footprint_destination_municipalities']
          assert all('Ã' not in name and 'Â' not in name for name in validation['structural_footprint_municipalities'])
          assert {
              'source_label': 'Santa Maria HoÃ¨',
              'repaired_label': 'Santa Maria Hoè',
          } in validation['anchor_municipality_label_repairs']
          assert validation['max_public_structurally_addressable_worker_od_mass_upper_bound'] <= validation['footprint_intermunicipal_worker_od_mass']
          assert validation['max_public_plus_extensions_structurally_addressable_worker_od_mass_upper_bound'] <= validation['footprint_intermunicipal_worker_od_mass']
          assert validation['max_public_plus_extensions_structurally_addressable_worker_od_mass_upper_bound'] >= validation['max_public_structurally_addressable_worker_od_mass_upper_bound']
          assert validation['self_od_structural_scoring'] == 'EXCLUDED_UNRESOLVED_AT_MUNICIPAL_OD_RESOLUTION'
          for key in (
              'worker_assignment_to_routes',
              'modal_share_inferred',
              'submunicipal_worker_allocation',
              'walking_access_combined',
              'timetable_feasibility_evaluated',
              'territorial_metric_is_observed_bus_ridership',
              's8_feeder_metric_combined_into_territorial_metric',
              'topology_ranked',
              'service_policy_selected',
          ):
              assert validation[key] is False, key

          rows = 0
          with gzip.open(
              root/'scenario_territorial_commuting_addressability_v2.csv.gz',
              'rt', encoding='utf-8', newline=''
          ) as handle:
              reader = csv.DictReader(handle)
              required = {
                  'scenario_id', 'topology_family',
                  'public_structurally_addressable_worker_od_mass_upper_bound',
                  'public_plus_extensions_structurally_addressable_worker_od_mass_upper_bound',
                  'public_other_core_worker_od_mass_upper_bound',
                  'public_s8_direct_worker_od_mass_upper_bound',
                  'public_other_external_worker_od_mass_upper_bound',
                  'worker_assignment_to_routes', 'topology_ranked',
              }
              assert required <= set(reader.fieldnames or [])
              for row in reader:
                  rows += 1
                  public = float(row['public_structurally_addressable_worker_od_mass_upper_bound'])
                  plus = float(row['public_plus_extensions_structurally_addressable_worker_od_mass_upper_bound'])
                  assert plus + 1e-9 >= public
                  assert row['worker_assignment_to_routes'] == 'false'
                  assert row['topology_ranked'] == 'false'
          assert rows == 100000

          with (root/'territorial_work_od_universe_v2.csv').open(
              encoding='utf-8', newline=''
          ) as handle:
              od_rows = list(csv.DictReader(handle))
          assert od_rows
          assert sum(float(row['workers']) for row in od_rows) == 8754
          assert any(row['category'] == 'SELF' for row in od_rows)
          assert all(
              row['worker_semantics'] == 'MUNICIPAL_WORK_OD_WEIGHT_NOT_BUS_RIDERSHIP_NOT_ROUTE_DEMAND'
              for row in od_rows
          )

          print(json.dumps({
              'scenario_count': rows,
              'footprint_intermunicipal_od_relation_count': validation['footprint_intermunicipal_od_relation_count'],
              'footprint_intermunicipal_worker_od_mass': validation['footprint_intermunicipal_worker_od_mass'],
              'max_public_mass': validation['max_public_structurally_addressable_worker_od_mass_upper_bound'],
              'max_public_plus_extensions_mass': validation['max_public_plus_extensions_structurally_addressable_worker_od_mass_upper_bound'],
              'extension_improvement_scenarios': validation['scenarios_where_optional_extensions_increase_addressable_worker_mass'],
              'anchor_municipality_label_repairs': validation['anchor_municipality_label_repairs'],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          rm -rf /tmp/phase2-territorial-demand-v2
          mkdir -p /tmp/phase2-territorial-demand-v2
          python scripts/phase2_build_territorial_commuting_addressability_v2.py \
            --od outputs/phase2/s8_work_demand_addressability.csv \
            --od-validation outputs/phase2/od_2021_demand_profile_validation.json \
            --anchors outputs/phase2/reduced_path_matrix_v2/routing_anchor_universe.csv \
            --matrix-validation outputs/phase2/reduced_path_matrix_v2/reduced_path_matrix_v2_validation.json \
            --routes outputs/phase2/s8_phasing_v2/unique_route_cycles_v2.csv \
            --s8-validation outputs/phase2/s8_phasing_v2/s8_phasing_v2_validation.json \
            --scenario-mapping outputs/phase2/s8_phasing_v2/scenario_to_routes_v2.csv.gz \
            --od-universe-output /tmp/phase2-territorial-demand-v2/od.csv \
            --scenario-output /tmp/phase2-territorial-demand-v2/scenarios.csv.gz \
            --validation /tmp/phase2-territorial-demand-v2/validation.json >/dev/null
          cmp $OUTDIR/territorial_work_od_universe_v2.csv /tmp/phase2-territorial-demand-v2/od.csv
          cmp $OUTDIR/scenario_territorial_commuting_addressability_v2.csv.gz /tmp/phase2-territorial-demand-v2/scenarios.csv.gz
          cmp $OUTDIR/territorial_commuting_addressability_v2_validation.json /tmp/phase2-territorial-demand-v2/validation.json

      - name: Guard epistemic separation
        run: |
          FILES="src/phase2_territorial_commuting_addressability_v2.py scripts/phase2_build_territorial_commuting_addressability_v2.py docs/PHASE2_TERRITORIAL_COMMUTING_ADDRESSABILITY_V2.md"
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' $FILES
          ! grep -n -E 'observed bus riders|observed bus passengers|S8 modal share *= *true|weighted composite score' $FILES
          git diff --check

      - name: Persist validated territorial demand V2
        run: |
          git config user.name "phase2-territorial-demand-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add $OUTDIR
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist territorial commuting addressability V2 [skip ci]"
            git push origin HEAD:phase2-passenger-gjt-v2
          fi

      - name: Upload territorial demand evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-territorial-commuting-addressability-v2-${{ github.sha }}
          retention-days: 90
          path: ${{ env.OUTDIR }}
