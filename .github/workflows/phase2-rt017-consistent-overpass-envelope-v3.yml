name: RT-017 consistent adaptive border-neutral road envelope V3

on:
  push:
    branches: [rt017-adaptive-border-neutral-road-envelope-v3]
    paths:
      - src/phase2_overpass_consistent_acquisition_v3.py
      - scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3_consistent.py
      - tests/test_phase2_rt017_consistent_overpass_acquisition_v3.py
      - .github/workflows/phase2-rt017-consistent-overpass-envelope-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rt017-consistent-adaptive-border-neutral-v3
  cancel-in-progress: true

jobs:
  validate-rt017-consistent:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install routing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas shapely networkx scipy pyproj requests pytest

      - name: Compile RT-017 and inherited routing modules
        run: |
          python -m py_compile src/phase2_adaptive_routing_envelope_v3.py
          python -m py_compile src/phase2_overpass_consistent_acquisition_v3.py
          python -m py_compile scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3.py
          python -m py_compile scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3_consistent.py
          python -m py_compile src/phase2_complete_directed_pairs_v3.py
          python -m py_compile src/phase2_corridor_reciprocity_v3.py
          python -m py_compile src/phase2_alternative_corridor_generator_v3.py

      - name: Verify frozen 36-stop dependency before run
        run: |
          STOP=outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv
          test "$(git hash-object "$STOP")" = "8d3a4368a6f62bbdf8fe18ee99482aff18e38fe5"
          test "$(($(wc -l < "$STOP") - 1))" -eq 36

      - name: Reject forbidden RT-017 operational semantics
        run: |
          if grep -R -n -E 'np\.random|Circolare Meratese|Cassina|allowed_municip|denied_municip|whitelist.*municip|blacklist.*municip' \
            src/phase2_adaptive_routing_envelope_v3.py \
            src/phase2_overpass_consistent_acquisition_v3.py \
            scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3.py \
            scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3_consistent.py; then
            echo 'Forbidden RT-017 operational semantic found'
            exit 1
          fi

      - name: Run RT-017 algorithm, lineage and acquisition tests
        run: |
          python -m pytest -q \
            tests/test_phase2_rt017_adaptive_routing_envelope_v3.py \
            tests/test_phase2_rt017_consistent_overpass_acquisition_v3.py

      - name: Check patch whitespace
        run: git diff --check 8a2cd43405dbac04cea56294407bcc7b453c65b4..HEAD

      - name: Run real-territory adaptive expansion
        env:
          PYTHONPATH: .
        run: |
          rm -rf outputs/phase2/rt017 outputs/phase2/rt017_repeat
          python scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3_consistent.py \
            --output-dir outputs/phase2/rt017 \
            --max-levels 7

      - name: Audit first-run backend consistency
        run: |
          python - <<'PY'
          import pandas as pd
          p='outputs/phase2/rt017/osm_acquisition_audit_v3.csv'
          df=pd.read_csv(p)
          per_row=[set(str(v).split('|')) for v in df['overpass_endpoints_used']]
          assert all(len(s)==1 for s in per_row), per_row
          run_endpoints=set().union(*per_row)
          assert len(run_endpoints)==1, run_endpoints
          print('locked_overpass_endpoint=', next(iter(run_endpoints)))
          PY
          cp outputs/phase2/rt017/frozen_routing_envelope_metadata_v3.json /tmp/rt017_first.json
          cp outputs/phase2/rt017/osm_acquisition_audit_v3.csv /tmp/rt017_first_acquisition.csv

      - name: Repeat real-territory run independently
        env:
          PYTHONPATH: .
        run: |
          python scripts/phase2_rt017_adaptive_border_neutral_routing_envelope_v3_consistent.py \
            --output-dir outputs/phase2/rt017_repeat \
            --max-levels 7

      - name: Assert deterministic frozen result and acquisition provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          a=json.loads(Path('/tmp/rt017_first.json').read_text())
          b=json.loads(Path('outputs/phase2/rt017_repeat/frozen_routing_envelope_metadata_v3.json').read_text())
          keys=[
              'status','frozen_level','frozen_margin_m','frozen_metric_bounds',
              'frozen_wgs84_bounds_south_west_north_east','complete_directed_probe_pairs',
              'all_pairs_routable_at_frozen_level','boundary_sensitive_pairs_at_frozen_level',
              'turn_rules_in_frozen_graph','digests'
          ]
          mismatch={k:(a.get(k),b.get(k)) for k in keys if a.get(k)!=b.get(k)}
          assert not mismatch, f'RT-017 nondeterministic repeated run: {mismatch}'
          assert a['complete_directed_probe_pairs']==36*35
          assert a['all_pairs_routable_at_frozen_level'] is True
          assert a['boundary_sensitive_pairs_at_frozen_level']==0
          first=pd.read_csv('/tmp/rt017_first_acquisition.csv')
          second=pd.read_csv('outputs/phase2/rt017_repeat/osm_acquisition_audit_v3.csv')
          def endpoints(df):
              values=set()
              for value in df['overpass_endpoints_used']:
                  row=set(str(value).split('|'))
                  assert len(row)==1, row
                  values |= row
              assert len(values)==1, values
              return values
          assert endpoints(first)==endpoints(second)
          print(json.dumps({k:a[k] for k in keys}, indent=2))
          PY

      - name: Verify frozen stop dependency after run
        run: |
          STOP=outputs/phase2/network_design_method_audit_v3/master_stop_inventory_gpt_v3/existing_stop_places_operational_gpt_v5.csv
          test "$(git hash-object "$STOP")" = "8d3a4368a6f62bbdf8fe18ee99482aff18e38fe5"
          test "$(($(wc -l < "$STOP") - 1))" -eq 36

      - name: Print convergence evidence
        if: always()
        run: |
          test -f outputs/phase2/rt017/rt017_validation.json && cat outputs/phase2/rt017/rt017_validation.json || true
          test -f outputs/phase2/rt017/envelope_expansion_audit_v3.csv && cat outputs/phase2/rt017/envelope_expansion_audit_v3.csv || true
          test -f outputs/phase2/rt017/pair_stabilization_transitions_v3.csv && cat outputs/phase2/rt017/pair_stabilization_transitions_v3.csv || true
          test -f outputs/phase2/rt017/osm_acquisition_audit_v3.csv && cat outputs/phase2/rt017/osm_acquisition_audit_v3.csv || true

      - name: Upload RT-017 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt017-adaptive-border-neutral-road-envelope-v3-final
          path: |
            outputs/phase2/rt017/
            outputs/phase2/rt017_repeat/rt017_validation.json
            outputs/phase2/rt017_repeat/frozen_routing_envelope_metadata_v3.json
            outputs/phase2/rt017_repeat/osm_acquisition_audit_v3.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Persist compact validated RT-017 evidence on branch
        if: success() && github.ref == 'refs/heads/rt017-adaptive-border-neutral-road-envelope-v3'
        run: |
          mkdir -p outputs/phase2/rt017_frozen_evidence
          cp outputs/phase2/rt017/rt017_validation.json outputs/phase2/rt017_frozen_evidence/
          cp outputs/phase2/rt017/frozen_routing_envelope_metadata_v3.json outputs/phase2/rt017_frozen_evidence/
          cp outputs/phase2/rt017/envelope_expansion_audit_v3.csv outputs/phase2/rt017_frozen_evidence/
          cp outputs/phase2/rt017/pair_stabilization_transitions_v3.csv outputs/phase2/rt017_frozen_evidence/
          cp outputs/phase2/rt017/osm_acquisition_audit_v3.csv outputs/phase2/rt017_frozen_evidence/
          cp outputs/phase2/rt017/complete_directed_probe_pair_manifest_v3.csv outputs/phase2/rt017_frozen_evidence/
          cp outputs/phase2/rt017/frozen_pair_results_v3.csv outputs/phase2/rt017_frozen_evidence/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/phase2/rt017_frozen_evidence
          if ! git diff --cached --quiet; then
            git commit -m 'data(rt017): materialize validated adaptive envelope evidence'
            git push
          fi
