name: GPT Gate B prerequisite patch

on:
  push:
    branches: [antigravity-real-data]
    paths:
      - tools/gpt_gate_b_prereq_patch.py

permissions:
  contents: write

jobs:
  apply-prereq:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity-real-data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply spatial-extent prerequisite patch
        run: |
          python tools/gpt_gate_b_prereq_patch.py
          python -m py_compile scripts/audit_01_fetch_real_inputs.py
          python -m py_compile tests/test_audit_provenance.py
          git diff --check

      - name: Commit patch and remove one-shot tooling
        run: |
          rm tools/gpt_gate_b_prereq_patch.py
          rm .github/workflows/gpt-gate-b-prereq.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spatial-prereq): derive OSM extent from official municipal bounds"
          git push origin HEAD:antigravity-real-data
