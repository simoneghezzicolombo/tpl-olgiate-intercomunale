name: Journey exact route validation

on:
  push:
    branches: [phase2-analysis-journey-a]
    paths:
      - .github/workflows/journey-exact-route-validation.yml
      - dietro-l-analisi/journey-bootstrap.mjs
      - dietro-l-analisi/journey-lineage.js
      - dietro-l-analisi/journey-current-kml-exact.mjs
      - dietro-l-analisi/journey-explore-prelude.js
      - dietro-l-analisi/journey-explore.js
      - dietro-l-analisi/journey-explore-v2.js
      - dietro-l-analisi/journey-exact-browser-smoke.py
      - dietro-l-analisi/exact-route-lineage.json
      - dietro-l-analisi/current-routes-kml-exact.geojson.gz.b64.*
      - dietro-l-analisi/current-routes-kml-exact-provenance.json
      - dietro-l-analisi/current-stops-gtfs.geojson.gz.b64.*
      - dietro-l-analisi/finalist-routes-gated.geojson.gz.b64.*
      - dietro-l-analisi/finalist-route-anchors.geojson.gz.b64.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-exact-route-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium
      - name: Validate exact route asset contract
        shell: bash
        run: |
          set -euo pipefail
          node --check dietro-l-analisi/journey-lineage.js
          node --check dietro-l-analisi/journey-current-kml-exact.mjs
          node --check dietro-l-analisi/journey-explore-prelude.js
          node --check dietro-l-analisi/journey-explore-v2.js
          ! grep -q "current-route-continuity-patches.js" dietro-l-analisi/journey-bootstrap.mjs
          ! grep -q "journey-current-continuity.js" dietro-l-analisi/journey-bootstrap.mjs
          grep -q "journey-current-kml-exact.mjs" dietro-l-analisi/journey-bootstrap.mjs
          grep -q "journey-explore-v2.js" dietro-l-analisi/journey-bootstrap.mjs
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path('dietro-l-analisi')
          manifest = json.loads((root / 'exact-route-lineage.json').read_text())
          provenance = json.loads((root / 'current-routes-kml-exact-provenance.json').read_text())

          assert manifest['contract'] == 'PHASE2_JOURNEY_EXACT_ROUTE_LINEAGE_V2'
          assert manifest['decision_output'] is False
          assert manifest['graph'] == {
              'bus_eligible_ways': 15872,
              'directed_edges': 199217,
              'nodes': 104071,
              'turn_rule_keys_in_graph': 535,
          }
          assert manifest['semantics']['current_route_geometry'] == 'USER_SUPPLIED_AGENCY_KML_LINESTRINGS_EXACT'
          assert manifest['semantics']['current_route_graph_reconstruction'] is False
          assert manifest['semantics']['current_stops_and_service'] == 'CURRENT_SERVICE_BASELINE_V4_OFFICIAL_FROZEN_GTFS'
          assert manifest['semantics']['finalist_routes'] == 'RESTRICTION_AWARE_GATE_D_ROUTES_VALIDATED_AGAINST_REDUCED_PATH_MATRIX_V2'
          assert manifest['semantics']['screen_space_offsets'] is False
          assert manifest['semantics']['winner_selected'] is False

          assert provenance['contract'] == 'CURRENT_SERVICE_KML_GEOMETRY_V1'
          assert provenance['route_mapping'] == {'D84.kml': 'D184', 'E03.kml': 'D185'}
          assert provenance['features'] == {'D184': 7, 'D185': 11}
          assert provenance['coordinate_counts'] == {'D184': 2268, 'D185': 3618}
          assert provenance['source_files']['D184']['sha256'] == '6cf715a83c1e85e7ebfeecd82b666eee623119e7b37e35875ed0be419fa5523a'
          assert provenance['source_files']['D185']['sha256'] == '10239544443134a10992b938a878ff62a906618f8f7f6babe2a339647f41bfa5'

          for name, expected in manifest['files_sha256'].items():
              path = root / name
              assert path.is_file(), name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)

          groups = {
              'current': ['current-routes-kml-exact.geojson.gz.b64.0', 'current-routes-kml-exact.geojson.gz.b64.1'],
              'stops': ['current-stops-gtfs.geojson.gz.b64.0'],
              'final': ['finalist-routes-gated.geojson.gz.b64.0', 'finalist-routes-gated.geojson.gz.b64.1', 'finalist-routes-gated.geojson.gz.b64.2'],
              'anchors': ['finalist-route-anchors.geojson.gz.b64.0'],
          }
          data = {}
          for key, names in groups.items():
              payload = ''.join((root / n).read_text().strip() for n in names)
              data[key] = json.loads(gzip.decompress(base64.b64decode(payload)))

          current = data['current']['features']
          assert len(current) == 18
          assert {f['properties']['route'] for f in current} == {'D184', 'D185'}
          d184 = [f for f in current if f['properties']['route'] == 'D184']
          d185 = [f for f in current if f['properties']['route'] == 'D185']
          assert len(d184) == 7 and len(d185) == 11
          assert sum(len(f['geometry']['coordinates']) for f in d184) == 2268
          assert sum(len(f['geometry']['coordinates']) for f in d185) == 3618
          assert all(f['geometry']['type'] == 'LineString' for f in current)
          assert all(f['properties']['source'] == 'OFFICIAL_AGENCY_KML_USER_SUPPLIED' for f in current)
          assert len(data['stops']['features']) == 44

          expected_ids = {
              'R2_23d58cd05658247380d7',
              'R2_65db885119e69d50c7d4',
              'R2_b2032eeb31cba06561f0',
              'R2_2ffb6743b10bb3f0a97d',
          }
          assert {f['properties']['route_id'] for f in data['final']['features']} == expected_ids
          assert len(data['final']['features']) == 4
          for feature in data['final']['features']:
              route_id = feature['properties']['route_id']
              coords = len(feature['geometry']['coordinates'])
              edges = int(feature['properties']['edge_count'])
              assert coords == edges + 1, (route_id, coords, edges)
              expected = manifest['finalists'][route_id]
              assert coords == expected['coordinates']
              assert edges == expected['edge_count']
              assert abs(float(feature['properties']['distance_km']) - expected['distance_km']) < 1e-6
              assert abs(float(feature['properties']['runtime_min']) - expected['runtime_min']) < 1e-6

          anchor_ids = {f['properties']['anchor_id'] for f in data['anchors']['features']}
          assert len(anchor_ids) == 11
          assert 'rail:S01514' in anchor_ids
          assert sum(1 for f in data['anchors']['features'] if f['properties']['kind'] == 'PROPOSED_STOP') == 4
          print('exact KML current service + finalist route static contract PASS')
          PY
      - name: Browser smoke and visual QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 >/tmp/journey-exact-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/dietro-l-analisi/ >/dev/null; then break; fi
            sleep 1
          done
          python dietro-l-analisi/journey-exact-browser-smoke.py
