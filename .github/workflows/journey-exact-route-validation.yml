name: Journey exact route validation

on:
  push:
    branches: [phase2-analysis-journey-a]
    paths:
      - .github/workflows/journey-exact-route-validation.yml
      - dietro-l-analisi/journey-lineage.js
      - dietro-l-analisi/journey-exact-browser-smoke.py
      - dietro-l-analisi/exact-route-lineage.json
      - dietro-l-analisi/current-routes-gtfs.geojson.gz.b64.*
      - dietro-l-analisi/current-stops-gtfs.geojson.gz.b64.*
      - dietro-l-analisi/finalist-routes-gated.geojson.gz.b64.*
      - dietro-l-analisi/finalist-route-anchors.geojson.gz.b64.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-exact-route-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium
      - name: Validate exact route asset contract
        shell: bash
        run: |
          set -euo pipefail
          node --check dietro-l-analisi/journey-lineage.js
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path('dietro-l-analisi')
          manifest = json.loads((root / 'exact-route-lineage.json').read_text())
          assert manifest['contract'] == 'PHASE2_JOURNEY_EXACT_ROUTE_LINEAGE_V1'
          assert manifest['decision_output'] is False
          assert manifest['graph'] == {
              'bus_eligible_ways': 15872,
              'directed_edges': 199217,
              'nodes': 104071,
              'turn_rule_keys_in_graph': 535,
          }
          assert manifest['semantics']['current_routes'] == 'OFFICIAL_FROZEN_GTFS_SHAPES'
          assert manifest['semantics']['finalist_routes'] == 'RESTRICTION_AWARE_GATE_D_ROUTES_VALIDATED_AGAINST_REDUCED_PATH_MATRIX_V2'
          assert manifest['semantics']['screen_space_offsets'] is False
          assert manifest['semantics']['winner_selected'] is False

          for name, expected in manifest['files_sha256'].items():
              path = root / name
              assert path.is_file(), name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)

          groups = {
              'current': ['current-routes-gtfs.geojson.gz.b64.0', 'current-routes-gtfs.geojson.gz.b64.1'],
              'stops': ['current-stops-gtfs.geojson.gz.b64.0'],
              'final': ['finalist-routes-gated.geojson.gz.b64.0', 'finalist-routes-gated.geojson.gz.b64.1', 'finalist-routes-gated.geojson.gz.b64.2'],
              'anchors': ['finalist-route-anchors.geojson.gz.b64.0'],
          }
          data = {}
          for key, names in groups.items():
              payload = ''.join((root / n).read_text().strip() for n in names)
              data[key] = json.loads(gzip.decompress(base64.b64decode(payload)))

          assert len(data['current']['features']) == 18
          assert {f['properties']['route'] for f in data['current']['features']} == {'D184', 'D185'}
          assert sum(1 for f in data['current']['features'] if f['properties']['route'] == 'D184') == 8
          assert sum(1 for f in data['current']['features'] if f['properties']['route'] == 'D185') == 10
          assert len(data['stops']['features']) == 44

          expected_ids = {
              'R2_23d58cd05658247380d7',
              'R2_65db885119e69d50c7d4',
              'R2_b2032eeb31cba06561f0',
              'R2_2ffb6743b10bb3f0a97d',
          }
          assert {f['properties']['route_id'] for f in data['final']['features']} == expected_ids
          assert len(data['final']['features']) == 4
          for feature in data['final']['features']:
              route_id = feature['properties']['route_id']
              coords = len(feature['geometry']['coordinates'])
              edges = int(feature['properties']['edge_count'])
              assert coords == edges + 1, (route_id, coords, edges)
              expected = manifest['finalists'][route_id]
              assert coords == expected['coordinates']
              assert edges == expected['edge_count']
              assert abs(float(feature['properties']['distance_km']) - expected['distance_km']) < 1e-6
              assert abs(float(feature['properties']['runtime_min']) - expected['runtime_min']) < 1e-6

          anchor_ids = {f['properties']['anchor_id'] for f in data['anchors']['features']}
          assert len(anchor_ids) == 11
          assert 'rail:S01514' in anchor_ids
          print('exact route static contract PASS')
          PY
      - name: Browser smoke and visual QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 >/tmp/journey-exact-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/dietro-l-analisi/ >/dev/null; then break; fi
            sleep 1
          done
          python dietro-l-analisi/journey-exact-browser-smoke.py
