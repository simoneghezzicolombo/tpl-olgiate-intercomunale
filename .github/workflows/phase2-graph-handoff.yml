name: Phase 2 graph handoff status

on:
  push:
    branches: [phase2-graph-freeze]
    paths:
      - .github/workflows/phase2-graph-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append protocol handoff and self-remove
        run: |
          cat >> AGENT_STATUS.md <<'EOF'

