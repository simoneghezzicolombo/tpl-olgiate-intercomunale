name: Phase 2 Zero-Band Tie-Break V2

on:
  push:
    branches:
      - phase2-zero-band-tiebreak-v2
      - phase2-robustness-final-v2
    paths:
      - 'scripts/phase2_build_zero_band_tiebreak_v2.py'
      - 'tests/test_phase2_zero_band_tiebreak_v2.py'
      - '.github/workflows/phase2-zero-band-tiebreak-v2.yml'
  workflow_dispatch:

concurrency:
  group: phase2-zero-band-tiebreak-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and tests
        run: |
          python -m py_compile scripts/phase2_build_zero_band_tiebreak_v2.py
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python -m pytest -q tests/test_phase2_zero_band_tiebreak_v2.py

      - name: Build zero-band shortlist
        run: >-
          python scripts/phase2_build_zero_band_tiebreak_v2.py
          --s8-surface outputs/phase2/s8_robust_opportunity_v2/passenger_plans_s8_opportunity_v2.csv.gz
          --s8-validation outputs/phase2/s8_robust_opportunity_v2/s8_robust_opportunity_v2_validation.json
          --passenger-validation outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2_validation.json
          --output outputs/phase2/zero_band_tiebreak_v2/zero_band_tiebreak_shortlist_v2.csv.gz
          --audit outputs/phase2/zero_band_tiebreak_v2/zero_band_equivalence_audit_v2.csv
          --validation outputs/phase2/zero_band_tiebreak_v2/zero_band_tiebreak_v2_validation.json

      - name: Validate zero-band contract
        run: |
          python - <<'PY'
          import csv,gzip,json
          from pathlib import Path
          root=Path('outputs/phase2/zero_band_tiebreak_v2')
          v=json.loads((root/'zero_band_tiebreak_v2_validation.json').read_text())
          assert v['status']=='PASS_PHASE2_ZERO_BAND_TIEBREAK_V2'
          assert v['contract']=='PHASE2_EXACT_PASSENGER_EQUIVALENCE_PRACTICAL_TIEBREAK_V2'
          assert v['uncertainty_band_used']==0.0
          assert v['input_plan_count']==16883
          assert 0 < v['survivor_plan_count'] <= 16883
          assert v['plans_removed_only_within_exact_passenger_equivalence_groups']==16883-v['survivor_plan_count']
          assert v['non_equivalent_passenger_tradeoff_eliminated'] is False
          assert v['hard_s8_threshold_applied'] is False
          assert v['continuity_with_existing_stops_corridors_tiebreak_applied'] is False
          for key in ('decision_budget_selected','service_policy_selected','recovery_selected','cross_route_phase_selected','exact_timetable_constructed','missed_connection_probability_calculated','final_reliability_proven','primary_selected','runner_up_selected','weighted_composite_score'):
              assert v[key] is False
          with gzip.open(root/'zero_band_tiebreak_shortlist_v2.csv.gz','rt',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==v['survivor_plan_count']
          assert all(r['zero_band_primary_selected']=='false' for r in rows)
          assert all(r['zero_band_runner_up_selected']=='false' for r in rows)
          assert sum(s['input_plan_count'] for s in v['budget_summary'].values())==16883
          assert sum(s['survivor_plan_count'] for s in v['budget_summary'].values())==v['survivor_plan_count']
          print(json.dumps(v['budget_summary'],indent=2,sort_keys=True))
          print(json.dumps({k:v[k] for k in ('passenger_equivalence_group_count','multi_plan_equivalence_group_count','reduced_equivalence_group_count','exact_tie_group_count_after_supported_tiebreak','survivor_plan_count')},indent=2,sort_keys=True))
          PY

      - name: Deterministic rebuild
        run: |
          rm -rf /tmp/zero-band-v2
          mkdir -p /tmp/zero-band-v2
          python scripts/phase2_build_zero_band_tiebreak_v2.py \
            --s8-surface outputs/phase2/s8_robust_opportunity_v2/passenger_plans_s8_opportunity_v2.csv.gz \
            --s8-validation outputs/phase2/s8_robust_opportunity_v2/s8_robust_opportunity_v2_validation.json \
            --passenger-validation outputs/phase2/passenger_utility_frontier_v2/passenger_utility_frontier_v2_validation.json \
            --output /tmp/zero-band-v2/output.csv.gz \
            --audit /tmp/zero-band-v2/audit.csv \
            --validation /tmp/zero-band-v2/validation.json >/dev/null
          cmp outputs/phase2/zero_band_tiebreak_v2/zero_band_tiebreak_shortlist_v2.csv.gz /tmp/zero-band-v2/output.csv.gz
          cmp outputs/phase2/zero_band_tiebreak_v2/zero_band_equivalence_audit_v2.csv /tmp/zero-band-v2/audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('outputs/phase2/zero_band_tiebreak_v2/zero_band_tiebreak_v2_validation.json').read_text()) == json.loads(Path('/tmp/zero-band-v2/validation.json').read_text())
          PY

      - name: Guard no hidden ranking
        run: |
          FILE=scripts/phase2_build_zero_band_tiebreak_v2.py
          ! grep -n -E 'np\.random|numpy\.random|import random|from random|requests\.|urllib\.|httpx\.|overpass-api\.de' "$FILE"
          ! grep -n -E 'primary_selected.*True|runner_up_selected.*True|weighted_composite_score.*True|uncertainty_band_used.*[1-9]' "$FILE"

      - name: Persist evidence
        run: |
          git config user.name "phase2-zero-band-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/zero_band_tiebreak_v2
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist zero-band tie-break v2 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-zero-band-tiebreak-v2-${{ github.sha }}
          retention-days: 90
          path: outputs/phase2/zero_band_tiebreak_v2
