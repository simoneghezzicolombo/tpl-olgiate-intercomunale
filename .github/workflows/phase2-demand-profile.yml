name: Phase 2 audited demand profile

on:
  push:
    branches: [phase2-service-design]
    paths:
      - scripts/phase2_build_demand_profile.py
      - scripts/phase2_normalize_text_encoding.py
      - tests/test_phase2_demand_profile.py
      - .github/workflows/phase2-demand-profile.yml
      - data/raw/od/matrice_pendolarismo_istat_2021_core.csv
      - data/raw/gtfs/rail_trenord/routes.txt
      - data/raw/gtfs/rail_trenord/trips.txt
      - data/raw/gtfs/rail_trenord/stop_times.txt
      - data/raw/gtfs/rail_trenord/stops.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demand-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Phase 2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas pyogrio shapely requests pytest

      - name: Compile builders
        run: |
          python -m py_compile scripts/phase2_build_demand_profile.py
          python -m py_compile scripts/phase2_normalize_text_encoding.py

      - name: Build audited demand outputs
        run: |
          python scripts/phase2_build_demand_profile.py
          python scripts/phase2_normalize_text_encoding.py

      - name: Run Phase 2 demand tests
        run: pytest -q tests/test_phase2_demand_profile.py

      - name: Validate generated files
        run: |
          test -s outputs/phase2/od_2021_destinations_by_origin.csv
          test -s outputs/phase2/od_2021_top_destinations_aggregate.csv
          test -s outputs/phase2/od_2021_corridor_summary.csv
          test -s outputs/phase2/od_2021_inbound_origins_by_destination.csv
          test -s outputs/phase2/s8_station_municipalities.csv
          test -s outputs/phase2/od_2021_demand_profile_validation.json
          test -s docs/PHASE2_DEMAND_PROFILE_2021.md
          ! grep -R -n -E 'Ã|Â' \
            outputs/phase2/od_2021_destinations_by_origin.csv \
            outputs/phase2/od_2021_top_destinations_aggregate.csv \
            outputs/phase2/od_2021_inbound_origins_by_destination.csv \
            outputs/phase2/s8_station_municipalities.csv \
            docs/PHASE2_DEMAND_PROFILE_2021.md
          git diff --check

      - name: Commit deterministic demand outputs
        run: |
          git add \
            outputs/phase2/od_2021_destinations_by_origin.csv \
            outputs/phase2/od_2021_top_destinations_aggregate.csv \
            outputs/phase2/od_2021_corridor_summary.csv \
            outputs/phase2/od_2021_inbound_origins_by_destination.csv \
            outputs/phase2/s8_station_municipalities.csv \
            outputs/phase2/od_2021_demand_profile_validation.json \
            docs/PHASE2_DEMAND_PROFILE_2021.md
          if git diff --cached --quiet; then
            echo 'No demand-profile output changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(phase2): materialise audited 2021 demand profile [skip ci]'
          git push origin HEAD:phase2-service-design
