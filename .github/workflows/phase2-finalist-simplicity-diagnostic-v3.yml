name: Phase 2 Finalist Simplicity Diagnostic V3

on:
  push:
    branches:
      - phase2-final-policy-contract-v3
    paths:
      - 'scripts/phase2_build_finalist_simplicity_diagnostic_v3.py'
      - 'tests/test_phase2_finalist_simplicity_diagnostic_v3.py'
      - '.github/workflows/phase2-finalist-simplicity-diagnostic-v3.yml'
      - 'outputs/phase2/final_policy_dry_run_v3/final_layer_survivors_diagnostic_v3.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-finalist-simplicity-diagnostic-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile and unit tests
        run: |
          python -m py_compile scripts/phase2_build_finalist_simplicity_diagnostic_v3.py
          python -m pytest -q tests/test_phase2_finalist_simplicity_diagnostic_v3.py

      - name: Materialise pinned Stage D and Stage F sources
        run: |
          rm -rf .finalist_sources
          mkdir -p .finalist_sources
          STAGE_D=d41bb678382d018929c1c6b46542f12549f20d4f
          STAGE_F=746a17c796f8e5fc24a636e47d304cd9293f2a43
          git show "$STAGE_D:outputs/phase2/stage_d_exact_rt001_v3/exact_selected_timetables_rt001_v3.csv" > .finalist_sources/exact_selected_timetables_rt001_v3.csv
          git show "$STAGE_D:outputs/phase2/stage_d_exact_rt001_v3/exact_selected_trips_rt001_v3.csv.gz" > .finalist_sources/exact_selected_trips_rt001_v3.csv.gz
          git show "$STAGE_D:outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_public_route_inputs_rt001_v3.csv" > .finalist_sources/stage_d_public_route_inputs_rt001_v3.csv
          git show "$STAGE_D:outputs/phase2/stop_universe_v2/existing_official_stops.csv" > .finalist_sources/existing_official_stops.csv
          git show "$STAGE_D:outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv" > .finalist_sources/proposed_stop_candidates.csv
          git show "$STAGE_D:outputs/phase2/stop_universe_v2/settlement_destination_anchors.csv" > .finalist_sources/settlement_destination_anchors.csv
          git show "$STAGE_F:outputs/phase2/stage_f_engineering_robustness_rt001_v3/stage_f_engineering_timetable_summary_rt001_v3.csv.gz" > .finalist_sources/stage_f_engineering_timetable_summary_rt001_v3.csv.gz

      - name: Build finalist diagnostic
        run: |
          rm -rf outputs/phase2/finalist_simplicity_diagnostic_v3
          python scripts/phase2_build_finalist_simplicity_diagnostic_v3.py

      - name: Validate non-decisional contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('outputs/phase2/finalist_simplicity_diagnostic_v3')
          v = json.loads((root / 'finalist_simplicity_diagnostic_v3_validation.json').read_text())
          assert v['status'] == 'PASS_PHASE2_FINALIST_SIMPLICITY_DIAGNOSTIC_V3'
          assert v['dry_run_finalist_count'] == 4
          assert v['selected_timetable_count'] == 4
          assert v['route_structure_row_count'] == 8
          assert v['stage_f_summary_row_count'] == 4
          assert v['weighted_complexity_score'] is False
          assert v['public_route_count_used_as_complexity_score'] is False
          assert v['topology_family_used_as_automatic_simplicity_rank'] is False
          assert v['primary_selected'] is False
          assert v['runner_up_selected'] is False
          with (root / 'finalist_timetable_structure_v3.csv').open(newline='', encoding='utf-8') as h:
              rows = list(csv.DictReader(h))
          assert len(rows) == 4
          assert {r['topology_family'] for r in rows} == {'two_independent_loops', 'interlined_figure8'}
          assert {r['uniform_headway_min'] for r in rows} == {'60'}
          PY

      - name: Deterministic rebuild
        run: |
          ROOT="$(mktemp -d)"
          python scripts/phase2_build_finalist_simplicity_diagnostic_v3.py --output-dir "$ROOT"
          for file in \
            finalist_simplicity_diagnostic_v3_validation.json \
            finalist_timetable_structure_v3.csv \
            finalist_route_structure_v3.csv \
            finalist_exact_departures_v3.csv \
            finalist_stage_f_summary_v3.csv; do
            cmp "$ROOT/$file" "outputs/phase2/finalist_simplicity_diagnostic_v3/$file"
          done

      - name: Epistemic guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/phase2_build_finalist_simplicity_diagnostic_v3.py').read_text()
          for banned in ('np.random', 'numpy.random', 'import random', 'from random'):
              assert banned not in text
          assert 'weighted_complexity_score' in text
          PY

      - name: Persist diagnostic evidence
        run: |
          git config user.name "phase2-finalist-simplicity-diagnostic-v3-ci"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/phase2/finalist_simplicity_diagnostic_v3
          if ! git diff --cached --quiet; then
            git commit -m "data(phase2): persist finalist simplicity diagnostic V3 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-finalist-simplicity-diagnostic-v3-${{ github.sha }}
          path: outputs/phase2/finalist_simplicity_diagnostic_v3
          if-no-files-found: error
          retention-days: 90
