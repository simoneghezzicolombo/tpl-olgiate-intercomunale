name: Phase 2 Finalist Simplicity Diagnostic V3

on:
  push:
    branches:
      - phase2-final-policy-contract-v3
    paths:
      - 'scripts/phase2_build_finalist_simplicity_diagnostic_v3.py'
      - 'tests/test_phase2_finalist_simplicity_diagnostic_v3.py'
      - '.github/workflows/phase2-finalist-simplicity-diagnostic-v3.yml'
      - 'outputs/phase2/final_policy_dry_run_v3/final_layer_survivors_diagnostic_v3.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-finalist-simplicity-diagnostic-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  OUTDIR: outputs/phase2/finalist_simplicity_diagnostic_v3
  STAGE_D: d41bb678382d018929c1c6b46542f12549f20d4f
  STAGE_F: 746a17c796f8e5fc24a636e47d304cd9293f2a43

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile and unit tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/phase2_build_finalist_simplicity_diagnostic_v3.py
          python -m pytest -q tests/test_phase2_finalist_simplicity_diagnostic_v3.py

      - name: Materialise pinned Stage D and Stage F sources
        run: |
          set -euo pipefail
          rm -rf .finalist_sources
          mkdir -p .finalist_sources
          git show "$STAGE_D:outputs/phase2/stage_d_exact_rt001_v3/exact_selected_timetables_rt001_v3.csv" > .finalist_sources/exact_selected_timetables_rt001_v3.csv
          git show "$STAGE_D:outputs/phase2/stage_d_exact_rt001_v3/exact_selected_trips_rt001_v3.csv.gz" > .finalist_sources/exact_selected_trips_rt001_v3.csv.gz
          git show "$STAGE_D:outputs/phase2/stage_d_input_manifest_rt001_v3/stage_d_public_route_inputs_rt001_v3.csv" > .finalist_sources/stage_d_public_route_inputs_rt001_v3.csv
          git show "$STAGE_D:outputs/phase2/stop_universe_v2/existing_official_stops.csv" > .finalist_sources/existing_official_stops.csv
          git show "$STAGE_D:outputs/phase2/stop_universe_v2/proposed_stop_candidates.csv" > .finalist_sources/proposed_stop_candidates.csv
          git show "$STAGE_D:outputs/phase2/stop_universe_v2/settlement_destination_anchors.csv" > .finalist_sources/settlement_destination_anchors.csv
          git show "$STAGE_F:outputs/phase2/stage_f_engineering_robustness_rt001_v3/stage_f_engineering_timetable_summary_rt001_v3.csv.gz" > .finalist_sources/stage_f_engineering_timetable_summary_rt001_v3.csv.gz

      - name: Build finalist diagnostic
        run: |
          set -euo pipefail
          rm -rf "$OUTDIR"
          python scripts/phase2_build_finalist_simplicity_diagnostic_v3.py \
            --stage-d-evidence-commit "$STAGE_D" \
            --stage-f-evidence-commit "$STAGE_F"

      - name: Validate non-decisional contract and output cardinalities
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('outputs/phase2/finalist_simplicity_diagnostic_v3')
          expected_files = {
              'finalist_simplicity_diagnostic_v3_validation.json',
              'finalist_timetable_structure_v3.csv',
              'finalist_route_structure_v3.csv',
              'finalist_exact_departures_v3.csv',
              'finalist_stage_f_summary_v3.csv',
          }
          assert {p.name for p in root.iterdir() if p.is_file()} == expected_files

          v = json.loads((root / 'finalist_simplicity_diagnostic_v3_validation.json').read_text())
          assert v['status'] == 'PASS_PHASE2_FINALIST_SIMPLICITY_DIAGNOSTIC_V3'
          assert v['contract'] == 'PHASE2_NONDECISIONAL_FINALIST_SIMPLICITY_CLOCKFACE_V3'
          assert v['diagnostic_role'] == 'NON_DECISIONAL_DESCRIPTIVE_STRUCTURE_ONLY'
          assert v['dry_run_finalist_count'] == 4
          assert v['selected_timetable_count'] == 4
          assert v['route_structure_row_count'] == 8
          assert v['stage_f_summary_row_count'] == 12
          assert v['stage_f_profile_count_per_finalist'] == 3
          assert v['topology_families'] == ['interlined_figure8', 'two_independent_loops']
          assert v['service_span_minutes'] == [960, 1110]
          assert v['uniform_headway_min'] == 60
          assert set(v['finalist_aliases']) == {'TT-FIG-16', 'TT-TWO-16', 'TT-FIG-18.5', 'TT-TWO-18.5'}
          assert v['stage_d_deterministic_id_rebuild_pass'] is True
          assert v['dry_run_to_stage_d_structural_join_pass'] is True
          assert all(row['derived_timetable_id_verified'] is True for row in v['lineage_mappings'])
          assert v['technical_closure_kept_distinct_from_passenger_service'] is True
          assert v['actual_routed_geometry_exported'] is False
          assert v['weighted_complexity_score'] is False
          assert v['synthetic_complexity_score'] is False
          assert v['public_route_count_used_as_complexity_score'] is False
          assert v['topology_family_used_as_automatic_simplicity_rank'] is False
          assert v['simplicity_rank_materialized'] is False
          assert v['primary_selected'] is False
          assert v['runner_up_selected'] is False
          assert v['winner_implied'] is False
          assert v['source_commits']['stage_d'] == 'd41bb678382d018929c1c6b46542f12549f20d4f'
          assert v['source_commits']['stage_f'] == '746a17c796f8e5fc24a636e47d304cd9293f2a43'

          with (root / 'finalist_timetable_structure_v3.csv').open(newline='', encoding='utf-8') as h:
              timetables = list(csv.DictReader(h))
          assert len(timetables) == 4
          assert {r['topology_family'] for r in timetables} == {'two_independent_loops', 'interlined_figure8'}
          assert Counter(r['span_minutes'] for r in timetables) == Counter({'960': 2, '1110': 2})
          assert {r['uniform_headway_min'] for r in timetables} == {'60'}
          assert all(r['derived_timetable_id_verified'] == 'true' for r in timetables)

          with (root / 'finalist_route_structure_v3.csv').open(newline='', encoding='utf-8') as h:
              routes = list(csv.DictReader(h))
          assert len(routes) == 8
          assert Counter(r['selected_timetable_id'] for r in routes) == Counter({r['selected_timetable_id']: 2 for r in timetables})
          assert all(r['sequence_semantics'] == 'ORDERED_CERTIFIED_ANCHORS_ONLY_NO_ROUTED_GEOMETRY' for r in routes)
          assert all(r['public_route_slot'] in {'route_1', 'route_2'} for r in routes)

          with (root / 'finalist_exact_departures_v3.csv').open(newline='', encoding='utf-8') as h:
              departures = list(csv.DictReader(h))
          assert departures
          assert {r['selected_timetable_id'] for r in departures} == {r['selected_timetable_id'] for r in timetables}
          assert all(r['technical_closure_distinct_from_passenger_service'] == 'true' for r in departures)
          assert all(r['public_departure_min'] != '' for r in departures)

          with (root / 'finalist_stage_f_summary_v3.csv').open(newline='', encoding='utf-8') as h:
              stage_f = list(csv.DictReader(h))
          assert len(stage_f) == 12
          per_tt = defaultdict(list)
          for row in stage_f:
              per_tt[row['selected_timetable_id']].append(row)
              assert row['primary_selected'] == 'false'
              assert row['runner_up_selected'] == 'false'
              assert row['weighted_composite_score'] == 'false'
          assert set(per_tt) == {r['selected_timetable_id'] for r in timetables}
          profile_sets = {tt: {r['profile_id'] for r in rows} for tt, rows in per_tt.items()}
          assert {len(x) for x in profile_sets.values()} == {3}
          assert len({tuple(sorted(x)) for x in profile_sets.values()}) == 1
          PY

      - name: Deterministic byte-for-byte rebuild
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          python scripts/phase2_build_finalist_simplicity_diagnostic_v3.py \
            --stage-d-evidence-commit "$STAGE_D" \
            --stage-f-evidence-commit "$STAGE_F" \
            --output-dir "$ROOT" >/dev/null
          for file in \
            finalist_simplicity_diagnostic_v3_validation.json \
            finalist_timetable_structure_v3.csv \
            finalist_route_structure_v3.csv \
            finalist_exact_departures_v3.csv \
            finalist_stage_f_summary_v3.csv; do
            cmp "$ROOT/$file" "$OUTDIR/$file"
          done

      - name: Epistemic and anti-hardcode guard
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('scripts/phase2_build_finalist_simplicity_diagnostic_v3.py').read_text(encoding='utf-8')
          for banned in (
              'np.random', 'numpy.random', 'import random', 'from random',
              'rapidfuzz', 'fuzzywuzzy', 'SequenceMatcher',
          ):
              assert banned not in text, banned
          assert re.search(r'D4RT001V3_[0-9a-f]{16}', text) is None, 'specific finalist timetable ID hardcoded in builder'
          for required in (
              'weighted_complexity_score',
              'public_route_count_used_as_complexity_score',
              'topology_family_used_as_automatic_simplicity_rank',
              'primary_selected',
              'runner_up_selected',
              'winner_implied',
          ):
              assert required in text
          PY
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check

      - name: Persist diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name "phase2-finalist-simplicity-diagnostic-v3-ci"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUTDIR"
          if ! git diff --cached --quiet; then
            git commit -m "evidence(phase2): certify finalist simplicity diagnostic V3 [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-finalist-simplicity-diagnostic-v3-${{ github.sha }}
          path: outputs/phase2/finalist_simplicity_diagnostic_v3
          if-no-files-found: error
          retention-days: 90
